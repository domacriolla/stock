  function modoDe(p){
    return ({borrador:"borrador", pendiente:"envio", enviado:"recepcion", cerrado:"resumen", rechazado:"rechazado"})[p.estado] || "envio";
  }

  function renderDetail(main, id){
    var p = pedidos.find(function(x){ return x.id===id; });
    if(!p){ state.detailId = null; toast("Ese pedido ya no existe (lo eliminaron)."); return renderLista(main); }
    var mode = modoDe(p);

    if(!state.editForm || state.editForm._id!==id || state.editForm._mode!==mode || state.editForm._upd!==p.updatedAt){
      state.editForm = {
        _id: id, _mode: mode, _upd: p.updatedAt,
        quienNombre: mode==="envio" ? lsGet("dc_quien_envia","") : (mode==="recepcion" ? lsGet("dc_quien_recibe","") : ""),
        faltan: {},
        items: (p.items||[]).map(function(it){
          return {
            id:it.id, category:it.category, name:it.name, isExtra:!!it.isExtra,
            pedidoCant: it.pedidoCant, envioCant: it.envioCant||"",
            recibidoCant: it.recibidoCant||"",
            noEnviado: it.estadoItem==="no_enviado",
            rechazado: it.estadoItem==="rechazado",
            enviado: it.estadoItem==="enviado",
            motivo: it.motivo||"", fechaEstimada: it.fechaEstimada||""
          };
        })
      };
    }
    var f = state.editForm;
    var byCat = {};
    CATEGORIES.forEach(function(c){ byCat[c.key]=[]; });
    f.items.forEach(function(it){ (byCat[it.category]=byCat[it.category]||[]).push(it); });
    var catKeys = CATEGORIES.map(function(c){ return c.key; });
    Object.keys(byCat).forEach(function(k){ if(catKeys.indexOf(k)===-1) catKeys.push(k); });

    var html = '<div class="panel">';
    html += '<div class="detail-head">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">';
    html += '<button class="back" id="backBtn" type="button" style="padding-bottom:0">‹ Volver a la lista</button>';
    html += '<div class="head-actions">';
    if(mode==="borrador") html += '<button class="btn btn-ghost btn-sm" id="contBtn" type="button">✎ Seguir cargando (local)</button>';
    if(mode==="envio") html += '<button class="btn btn-ghost btn-sm" id="reabrirPedBtn" type="button">↺ Reabrir para agregar (local)</button>';
    if(mode==="recepcion") html += '<button class="btn btn-ghost btn-sm" id="reabrirEnvBtn" type="button">↺ Reabrir envío (fábrica)</button>';
    if(mode==="resumen" && f.items.some(function(it){ return it.enviado; })) html += '<button class="btn btn-ghost btn-sm" id="reabrirRecBtn" type="button">↺ Reabrir recepción</button>';
    if(mode==="envio" || mode==="borrador") html += '<button class="btn btn-ghost btn-sm btn-danger-txt" id="rejectBtn" type="button">✕ Rechazar</button>';
    html += '<button class="btn btn-ghost btn-sm btn-danger-txt" id="deleteBtn" type="button">🗑 Eliminar</button>';
    html += '<button class="btn btn-ghost btn-sm" id="printBtn" type="button">🖶 Imprimir</button>';
    html += '</div></div>';
    html += '<h2 style="margin-top:10px">'+esc(LOCAL_LABEL[p.local]||p.local)+chipTipo(tipoDe(p))+'</h2>';
    html += '<div class="detail-grid" style="margin-top:8px">';
    html += '<span><b>Fecha:</b> '+esc(fmtDate(p.fecha))+'</span>';
    if(p.quienPide) html += '<span><b>Pide:</b> '+esc(p.quienPide)+'</span>';
    if(p.enviadoPor) html += '<span><b>Envió:</b> '+esc(p.enviadoPor)+'</span>';
    if(p.recibidoPor) html += '<span><b>Recibió:</b> '+esc(p.recibidoPor)+'</span>';
    if(p.rechazadoPor) html += '<span><b>Rechazó:</b> '+esc(p.rechazadoPor)+'</span>';
    html += '<span><b>Cargado:</b> '+esc(fmtDateTime(p.createdAt))+'</span>';
    html += '<span><span class="badge '+estadoInfo(p.estado).cls+'">'+esc(estadoInfo(p.estado).label)+'</span>'+tip(estadoInfo(p.estado).tip)+'</span>';
    html += '</div>';
    if(p.notas) html += '<div class="detail-grid" style="margin-top:6px"><span><b>Notas:</b> '+esc(p.notas)+'</span></div>';
    if(esViejo(p)) html += '<div class="banner banner-danger" style="margin:12px 0 0">⚠ Este pedido tiene fecha de hace '+diasDesde(p.fecha)+' días y sigue sin cerrar. Si ya se resolvió, eliminalo.</div>';
    if(mode==="borrador") html += '<div class="banner banner-warn" style="margin:12px 0 0"><b>El local todavía no lo envió a fábrica</b> (lo guardó provisorio o lo reabrió para agregar cosas). Fábrica lo va a poder preparar cuando el local toque «Guardar y enviar final».</div>';
    if(mode==="envio") html += '<div class="banner" style="margin:12px 0 0"><b>Fábrica:</b> cargá lo que mandás de cada ítem, o marcá «Más tarde» o «Rechazar». Podés ir guardando con «Guardado provisorio»; «Guardar y enviar final» pide todos los ítems completos.</div>';
    if(mode==="recepcion") html += '<div class="banner" style="margin:12px 0 0"><b>Local:</b> cargá lo que llegó de cada ítem. <b>Si algo no llegó, poné 0.</b> Para cerrar el pedido tocá «Confirmar recepción final».</div>';
    if(mode==="resumen") html += '<div class="banner banner-ok" style="margin:12px 0 0">Pedido cerrado: está confirmado lo pedido, lo enviado y lo recibido.'+(porMandar(p,true).length?' Quedan <b>'+porMandar(p,true).length+'</b> ítem(s) para mandar más tarde (abajo: «Ya se mandó» o «Ya no se manda»).':'')+'</div>';
    if(mode==="rechazado") html += '<div class="banner banner-danger" style="margin:12px 0 0">Pedido rechazado'+(p.motivoRechazo?' — <b>'+esc(p.motivoRechazo)+'</b>':'')+'. No se le va a enviar nada.</div>';
    html += '</div>';

    if(mode==="envio" || mode==="recepcion") html += '<div class="panel-body" style="padding-bottom:0"><div class="progreso" id="progDet"></div></div>';

    catKeys.forEach(function(ck){
      var list = byCat[ck]||[];
      if(list.length===0) return;
      html += '<div class="cat-block">';
      html += '<div class="cat-title">'+esc(CAT_LABEL[ck]||ck)+'</div>';
      list.forEach(function(it){
        var stCls = f.faltan[it.id] ? "st-falta" : ((it.noEnviado || it.rechazado) ? "st-no_enviado" : (String(it.envioCant).trim()!=="" ? "st-enviado" : ""));
        if(mode==="recepcion" && it.enviado) stCls = f.faltan[it.id] ? "st-falta" : (String(it.recibidoCant).trim()!=="" ? "st-enviado" : "");
        html += '<div class="item-detail-row '+stCls+'" data-row="'+esc(it.id)+'">';
        html += '<div class="idr-top">';
        html += '<div class="idr-name">'+esc(it.name)+(it.isExtra?'<span class="tag-extra">nuevo</span>':'')+'<div class="idr-pedido">Pedido: <span class="mono">'+esc(it.pedidoCant)+'</span></div></div>';
        html += '</div>';

        if(mode==="envio"){
          html += '<div class="idr-controls">';
          html += '<input class="qty-input" type="text" inputmode="decimal" placeholder="cant." data-envio="'+esc(it.id)+'" value="'+esc(it.envioCant)+'" '+((it.noEnviado||it.rechazado)?"disabled":"")+'>';
          html += '<label class="chk"><input type="checkbox" data-noenv="'+esc(it.id)+'" '+(it.noEnviado?"checked":"")+'> Más tarde</label>'+tip("No se manda ahora pero sí después (por ejemplo, sin stock). Queda a la vista para mandarlo con «Ya se mandó».");
          html += '<label class="chk"><input type="checkbox" data-rechazar="'+esc(it.id)+'" '+(it.rechazado?"checked":"")+'> Rechazar</label>'+tip("No se va a mandar (por ejemplo, no corresponde). Es definitivo.");
          html += '</div>';
          if(it.noEnviado){
            html += '<div class="idr-motivo">';
            html += '<input type="text" placeholder="Motivo * (ej: sin stock)" data-motivo="'+esc(it.id)+'" value="'+esc(it.motivo)+'">';
            html += '<input type="date" title="Fecha estimada (opcional)" data-festimada="'+esc(it.id)+'" value="'+esc(it.fechaEstimada)+'">';
            html += '</div>';
          }
          if(it.rechazado){
            html += '<div class="idr-motivo" style="grid-template-columns:1fr">';
            html += '<input type="text" placeholder="Motivo del rechazo * (ej: no corresponde)" data-motivo="'+esc(it.id)+'" value="'+esc(it.motivo)+'">';
            html += '</div>';
          }
        } else if(mode==="recepcion"){
          if(it.rechazado) html += rechazadoHtml(it);
          else if(it.noEnviado) html += noEnviadoHtml(it, true);
          else if(it.enviado){
            html += '<div class="idr-controls">';
            html += '<span class="idr-readonly">Enviado: <b>'+esc(it.envioCant)+'</b></span>';
            html += '<input class="qty-input" type="text" inputmode="decimal" placeholder="cant." data-recibido="'+esc(it.id)+'" value="'+esc(it.recibidoCant)+'">';
            html += '<span class="idr-readonly">recibido</span> <span class="dif" data-dif="'+esc(it.id)+'"></span>';
            html += '</div>';
          } else {
            html += '<div class="idr-readonly">Sin cargar en el envío.</div>';
          }
        } else {
          if(it.rechazado) html += rechazadoHtml(it);
          else if(it.noEnviado) html += noEnviadoHtml(it, mode==="resumen");
          else if(mode==="borrador" || mode==="rechazado") html += it.envioCant ? '<div class="idr-readonly">Fábrica había cargado: <b>'+esc(it.envioCant)+'</b></div>' : '';
          else {
            var dif = it.recibidoCant!=="" && it.envioCant!=="" && Number(String(it.recibidoCant).replace(",","."))!==Number(String(it.envioCant).replace(",","."));
            html += '<div class="idr-readonly">Enviado: <b>'+esc(it.envioCant||"—")+'</b> &nbsp;·&nbsp; Recibido: <b>'+esc(it.recibidoCant||"—")+'</b>'+(dif?' <span class="dif">≠ diferencia</span>':'')+'</div>';
          }
        }
        html += '</div>';
      });
      html += '</div>';
    });

    if(mode==="envio" || mode==="recepcion"){
      html += '<div class="panel-body" style="border-top:1px dashed var(--border-strong)">';
      html += fieldInput(mode==="envio"?"¿Quién envía?":"¿Quién recibe?", "quienNombre", "text", f.quienNombre, true);
      html += '<div class="btn-row">';
      html += '<button class="btn btn-ghost" id="saveProv" type="button">Guardado provisorio</button>';
      html += '<button class="btn btn-primary" id="saveFinal" type="button">'+(mode==="envio"?"Guardar y enviar final":"Confirmar recepción final")+'</button>';
      html += '</div>';
      html += '<div class="progreso" style="margin:10px 0 0">'+(mode==="envio"
        ? "«Guardado provisorio» guarda lo cargado sin mandarlo. «Guardar y enviar final» le avisa al local que el pedido va en camino."
        : "«Guardado provisorio» guarda lo cargado sin cerrar. «Confirmar recepción final» cierra el pedido.")+'</div>';
      html += '</div>';
    }

    if(p.registro){
      html += '<details class="historial"><summary>Historial del pedido</summary>'+
        String(p.registro).split("\n").map(function(l){ return '<div>'+esc(l)+'</div>'; }).join("")+'</details>';
    }
    html += '</div>';

    main.innerHTML = html;

    function progreso(){
      var el = document.getElementById("progDet");
      if(!el) return;
      if(mode==="envio"){
        var falt = f.items.filter(function(it){ return !it.noEnviado && !it.rechazado && String(it.envioCant).trim()===""; }).length;
        el.innerHTML = falt ? 'Faltan completar <b>'+falt+'</b> de '+f.items.length+' ítems.' : '✓ Están todos los ítems completos.';
      } else {
        var env = f.items.filter(function(it){ return it.enviado; });
        var falt2 = env.filter(function(it){ return String(it.recibidoCant).trim()===""; }).length;
        el.innerHTML = falt2 ? 'Faltan completar <b>'+falt2+'</b> de '+env.length+' ítems enviados.' : '✓ Están todos los ítems enviados completos.';
      }
    }
    function marcarDif(it){
      var el = main.querySelector('[data-dif="'+it.id+'"]');
      if(!el) return;
      var r = num(it.recibidoCant), e = num(it.envioCant);
      el.textContent = (r!=="" && !isNaN(r) && e!=="" && r!==e) ? "≠ enviado" : "";
    }
    progreso();
    f.items.forEach(marcarDif);

    main.querySelector("#backBtn").addEventListener("click", function(){ irA("pedidos"); });
    main.querySelector("#printBtn").addEventListener("click", function(){ printPedido(p); });
    main.querySelector("#deleteBtn").addEventListener("click", function(){ eliminarPedido(p); });
    var b;
    if((b = main.querySelector("#contBtn"))) b.addEventListener("click", function(){ continuarPedido(p); });
    if((b = main.querySelector("#reabrirPedBtn"))) b.addEventListener("click", function(){ reabrirPedido(p); });
    if((b = main.querySelector("#reabrirEnvBtn"))) b.addEventListener("click", function(){ reabrirEnvio(p); });
    if((b = main.querySelector("#reabrirRecBtn"))) b.addEventListener("click", function(){ reabrirRecepcion(p); });
    if((b = main.querySelector("#rejectBtn"))) b.addEventListener("click", function(){ rechazarPedido(p); });

    function itemDe(attr, el){ var id = el.getAttribute(attr); return f.items.find(function(x){ return x.id===id; }); }
    main.querySelectorAll("[data-envio]").forEach(function(inp){
      inp.addEventListener("input", function(){ var it = itemDe("data-envio", inp); if(it){ it.envioCant = inp.value; delete f.faltan[it.id]; } progreso(); });
    });
    main.querySelectorAll("[data-recibido]").forEach(function(inp){
      inp.addEventListener("input", function(){ var it = itemDe("data-recibido", inp); if(it){ it.recibidoCant = inp.value; delete f.faltan[it.id]; marcarDif(it); } progreso(); });
    });
    main.querySelectorAll("[data-noenv]").forEach(function(chk){
      chk.addEventListener("change", function(){
        var it = itemDe("data-noenv", chk);
        if(it){ it.noEnviado = chk.checked; if(chk.checked){ it.envioCant=""; it.rechazado=false; } delete f.faltan[it.id]; }
        renderDetail(main, state.detailId);
      });
    });
    main.querySelectorAll("[data-rechazar]").forEach(function(chk){
      chk.addEventListener("change", function(){
        var it = itemDe("data-rechazar", chk);
        if(it){ it.rechazado = chk.checked; if(chk.checked){ it.envioCant=""; it.noEnviado=false; it.fechaEstimada=""; } delete f.faltan[it.id]; }
        renderDetail(main, state.detailId);
      });
    });
    main.querySelectorAll("[data-motivo]").forEach(function(inp){
      inp.addEventListener("input", function(){ var it = itemDe("data-motivo", inp); if(it){ it.motivo = inp.value; } });
    });
    main.querySelectorAll("[data-festimada]").forEach(function(inp){
      inp.addEventListener("change", function(){ var it = itemDe("data-festimada", inp); if(it) it.fechaEstimada = inp.value; });
    });
    var quienInp = main.querySelector("#quienNombre");
    if(quienInp) quienInp.addEventListener("input", function(e){ f.quienNombre = e.target.value; });
    if((b = main.querySelector("#saveProv"))) b.addEventListener("click", function(e){ (mode==="envio"?guardarEnvio:guardarRecepcion)(p, false, e.currentTarget); });
    if((b = main.querySelector("#saveFinal"))) b.addEventListener("click", function(e){ (mode==="envio"?guardarEnvio:guardarRecepcion)(p, true, e.currentTarget); });

    main.querySelectorAll("[data-cancelar]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = (p.items||[]).find(function(x){ return x.id===btn.getAttribute("data-cancelar"); });
        if(it) cancelarItem(p, it);
      });
    });
    main.querySelectorAll("[data-reenviar]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var it = (p.items||[]).find(function(x){ return x.id===btn.getAttribute("data-reenviar"); });
        if(it) reenviarItem(p, it);
      });
    });
  }

  function noEnviadoHtml(it, conBoton){
    var html = '<div class="idr-readonly">Para más tarde'+(it.motivo?' — <b>'+esc(it.motivo)+'</b>':'')+(it.fechaEstimada?' (estimado: '+esc(fmtDate(it.fechaEstimada))+')':'')+'</div>';
    if(conBoton){
      html += '<div class="idr-controls" style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-reenviar="'+esc(it.id)+'" type="button">Ya se mandó</button>'+
        tip("Cuando fábrica lo mande, tocá acá y cargá la cantidad. El pedido vuelve a «Esperando recepción» para que el local confirme ese ítem.")+
        '<button class="btn btn-ghost btn-sm btn-danger-txt" data-cancelar="'+esc(it.id)+'" type="button">Ya no se manda</button>'+
        tip("Si al final no se va a mandar (por ejemplo, se reemplazó por otra cosa), dalo de baja para que deje de figurar como pendiente.")+'</div>';
    }
    return html;
  }
  function rechazadoHtml(it){
    return '<div class="idr-readonly">Rechazado'+(it.motivo?' — <b>'+esc(it.motivo)+'</b>':'')+'</div>';
  }

  /* ---------- guardar envío (fábrica) ---------- */
  function guardarEnvio(p, final, btn){
    var f = state.editForm, main = document.getElementById("main");
    var quien = (f.quienNombre||"").trim();
    if(!quien){ avisar("Falta un dato", "Completá «¿Quién envía?»."); var q = document.getElementById("quienNombre"); if(q) q.focus(); return; }

    var malos = [], faltan = [], sinMotivo = [], ceros = [], demas = [];
    var items = f.items.map(function(it){
      var estado = "pendiente", cant = "";
      if(it.rechazado) estado = "rechazado";
      else if(it.noEnviado) estado = "no_enviado";
      else if(String(it.envioCant).trim()!==""){
        cant = num(it.envioCant);
        if(isNaN(cant)) malos.push(it);
        else { estado = "enviado"; if(cant===0) ceros.push(it); var pc = num(it.pedidoCant); if(pc!=="" && !isNaN(pc) && cant>pc) demas.push(it); }
      }
      if(estado==="pendiente") faltan.push(it);
      if((estado==="no_enviado"||estado==="rechazado") && !String(it.motivo).trim()) sinMotivo.push(it);
      var o = {id:it.id, s:estado};
      if(estado==="enviado") o.e = String(cant);
      if(estado==="no_enviado"||estado==="rechazado"){ if(String(it.motivo).trim()) o.m = it.motivo.trim(); }
      if(estado==="no_enviado" && it.fechaEstimada) o.f = it.fechaEstimada;
      return o;
    });

    f.faltan = {};
    if(malos.length){
      malos.forEach(function(it){ f.faltan[it.id]=true; });
      renderDetail(main, p.id);
      avisar("Hay cantidades que no son números", "Poné solo números (por ejemplo 2 o 1,5). Revisá:"+lista(malos.map(function(it){ return it.name+": «"+it.envioCant+"»"; })));
      return;
    }
    var pasos = Promise.resolve(true);
    if(final){
      if(faltan.length){
        faltan.forEach(function(it){ f.faltan[it.id]=true; });
        renderDetail(main, p.id);
        avisar("No se puede enviar todavía",
          "Faltan completar <b>"+faltan.length+"</b> ítem(s) (marcados en el pedido):"+lista(faltan.map(function(it){ return it.name; }))+
          "Cargá lo que mandás, o marcá «Más tarde» o «Rechazar». Si querés seguir después, tocá «Guardado provisorio».");
        return;
      }
      if(sinMotivo.length){
        sinMotivo.forEach(function(it){ f.faltan[it.id]=true; });
        renderDetail(main, p.id);
        avisar("Falta el motivo", "Completá el motivo de los ítems marcados «Más tarde» o «Rechazar»:"+lista(sinMotivo.map(function(it){ return it.name; })));
        return;
      }
      if(ceros.length) pasos = pasos.then(function(ok){ return ok && confirmar("Ítems con 0", "Pusiste 0 en:"+lista(ceros.map(function(it){ return it.name; }))+"¿No sería «Más tarde» o «Rechazar»?", "Enviar igual", "Volver a revisar"); });
      if(demas.length) pasos = pasos.then(function(ok){ return ok && confirmar("Más de lo pedido", "Mandás más de lo que pidieron en:"+lista(demas.map(function(it){ return it.name+" (pidieron "+it.pedidoCant+", mandás "+it.envioCant+")"; }))+"¿Está bien?", "Sí, está bien", "Volver a revisar"); });
      pasos = pasos.then(function(ok){
        if(!ok) return false;
        var nE = items.filter(function(x){ return x.s==="enviado"; }).length;
        var nT = items.filter(function(x){ return x.s==="no_enviado"; }).length;
        var nR = items.filter(function(x){ return x.s==="rechazado"; }).length;
        var txt = "Mandás <b>"+nE+"</b> ítem(s)"+(nT?", <b>"+nT+"</b> quedan para más tarde":"")+(nR?", <b>"+nR+"</b> rechazados":"")+".<br><br>";
        txt += nE ? "El local va a tener que confirmar lo que recibe." : "Como no se manda nada ahora, el pedido queda cerrado y los ítems «más tarde» siguen a la vista.";
        return confirmar("¿Enviar el pedido?", txt, "Enviar", "Volver");
      });
    }
    pasos.then(function(ok){
      if(!ok) return;
      correr("updatePedidoEnvio", {pedidoId:p.id, items:items, nombre:quien, final:final}, {
        btn: btn,
        verificar: final ? function(ps){ var x = ps.find(function(y){ return y.id===p.id; }); return !!x && (x.estado==="enviado"||x.estado==="cerrado"); } : null
      }).then(function(res){
        if(!res) return;
        lsSet("dc_quien_envia", quien);
        toast(final ? "Envío guardado y enviado ✓" : "Guardado provisorio ✓ — el pedido sigue pendiente.");
        state.editForm = null;
        loadData(true);
      });
    });
  }

  /* ---------- guardar recepción (local) ---------- */
  function guardarRecepcion(p, final, btn){
    var f = state.editForm, main = document.getElementById("main");
    var quien = (f.quienNombre||"").trim();
    if(!quien){ avisar("Falta un dato", "Completá «¿Quién recibe?»."); var q = document.getElementById("quienNombre"); if(q) q.focus(); return; }
    var enviados = f.items.filter(function(it){ return it.enviado; });
    var malos = [], faltan = [], difs = [];
    var items = enviados.map(function(it){
      var r = num(it.recibidoCant);
      if(String(it.recibidoCant).trim()==="") faltan.push(it);
      else if(isNaN(r)) malos.push(it);
      else if(r!==num(it.envioCant)) difs.push(it);
      return {id:it.id, r: (r===""||isNaN(r)) ? "" : String(r)};
    });
    f.faltan = {};
    if(malos.length){
      malos.forEach(function(it){ f.faltan[it.id]=true; });
      renderDetail(main, p.id);
      avisar("Hay cantidades que no son números", "Poné solo números. Revisá:"+lista(malos.map(function(it){ return it.name+": «"+it.recibidoCant+"»"; })));
      return;
    }
    var pasos = Promise.resolve(true);
    if(final){
      if(faltan.length){
        faltan.forEach(function(it){ f.faltan[it.id]=true; });
        renderDetail(main, p.id);
        avisar("No se puede confirmar todavía",
          "Faltan completar <b>"+faltan.length+"</b> ítem(s) (marcados en el pedido):"+lista(faltan.map(function(it){ return it.name; }))+
          "<b>Si algo no llegó, poné 0.</b> Si querés seguir después, tocá «Guardado provisorio».");
        return;
      }
      if(difs.length) pasos = pasos.then(function(ok){ return ok && confirmar("Lo recibido no coincide", "En estos ítems llegó distinto de lo enviado:"+lista(difs.map(function(it){ return it.name+" (enviado "+it.envioCant+", recibido "+it.recibidoCant+")"; }))+"¿Confirmar igual?", "Sí, confirmar", "Volver a revisar"); });
      pasos = pasos.then(function(ok){
        return ok && confirmar("¿Confirmar la recepción?", "Se cierra el pedido con lo que cargaste. Si después hay que corregir algo, se puede reabrir.", "Confirmar", "Volver");
      });
    }
    pasos.then(function(ok){
      if(!ok) return;
      correr("updatePedidoRecepcion", {pedidoId:p.id, items:items, nombre:quien, final:final}, {
        btn: btn,
        verificar: final ? function(ps){ var x = ps.find(function(y){ return y.id===p.id; }); return !!x && x.estado==="cerrado"; } : null
      }).then(function(res){
        if(!res) return;
        lsSet("dc_quien_recibe", quien);
        toast(final ? "Recepción confirmada ✓ — pedido cerrado." : "Guardado provisorio ✓ — falta confirmar la recepción.");
        state.editForm = null;
        loadData(true);
      });
    });
  }

  /* ---------- reabrir / reenviar / rechazar / eliminar ---------- */
  function reabrirEnvio(p){
    var hayRecibido = (p.items||[]).some(function(it){ return String(it.recibidoCant||"").trim()!==""; });
    pedirNombre("Reabrir el envío",
      'El pedido vuelve a «Pendiente» para que fábrica corrija lo que mandó. El local no va a poder confirmar la recepción hasta que fábrica lo vuelva a enviar.'+
      (hayRecibido?'<br><br><b>Ojo:</b> el local ya cargó parte de la recepción; eso se mantiene.':''),
      "dc_quien_envia", "Reabrir envío").then(function(v){
      if(!v) return;
      correr("reabrirEnvio", {pedidoId:p.id, nombre:v.nombre}).then(function(res){
        if(!res) return;
        toast("Envío reabierto."); state.editForm = null; loadData(true);
      });
    });
  }

  function reabrirRecepcion(p){
    pedirNombre("Reabrir la recepción",
      'El pedido vuelve a «Esperando recepción» para corregir lo que se cargó como recibido.',
      "dc_quien_recibe", "Reabrir recepción").then(function(v){
      if(!v) return;
      correr("reabrirRecepcion", {pedidoId:p.id, nombre:v.nombre}).then(function(res){
        if(!res) return;
        toast("Recepción reabierta."); state.editForm = null; loadData(true);
      });
    });
  }

  function reenviarItem(p, it){
    pedirNombre("Mandar ítem pendiente",
      '<b>'+esc(it.name)+'</b> (pedido: '+esc(it.pedidoCant)+'). Había quedado para más tarde'+(it.motivo?' — '+esc(it.motivo):'')+'.<br>El pedido vuelve a «Esperando recepción» para que el local confirme este ítem.',
      "dc_quien_envia", "Ya se mandó",
      [{id:"cant", label:"Cantidad que se manda", value:String(it.pedidoCant||""), required:true, numeric:true, requiredMsg:"Cargá la cantidad que se manda."}]
    ).then(function(v){
      if(!v) return;
      correr("reenviarItem", {pedidoId:p.id, itemId:it.id, envioCant:String(num(v.cant)), nombre:v.nombre}).then(function(res){
        if(!res) return;
        toast("Ítem enviado. El pedido vuelve a esperar recepción."); state.editForm = null; loadData(true);
      });
    });
  }

  function cancelarItem(p, it){
    pedirNombre("Dar de baja el ítem",
      '<b>'+esc(it.name)+'</b> había quedado para más tarde'+(it.motivo?' — '+esc(it.motivo):'')+'. Si ya no se va a mandar, queda como rechazado y deja de figurar como pendiente.',
      "dc_quien_envia", "Dar de baja",
      [{id:"motivo", label:"Motivo", required:true, requiredMsg:"Falta el motivo.", placeholder:"ej: se mandó otra cosa / ya no hace falta"}], true
    ).then(function(v){
      if(!v) return;
      correr("cancelarItemPendiente", {pedidoId:p.id, itemId:it.id, motivo:v.motivo, nombre:v.nombre}).then(function(res){
        if(!res) return;
        toast("Ítem dado de baja."); state.editForm = null; loadData(true);
      });
    });
  }

  var MOTIVOS_RECHAZO = ["Pedido duplicado", "Ya se mandó en otro pedido", "Cargado por error", "Otro"];
  function rechazarPedido(p){
    pedirNombre("Rechazar el pedido",
      'No se le va a enviar nada a <b>'+esc(LOCAL_LABEL[p.local]||p.local)+'</b> por este pedido y sale de Pendientes. El registro queda (con el motivo).',
      "dc_quien_envia", "Rechazar pedido",
      [{id:"motivo", label:"Motivo", type:"select", options:MOTIVOS_RECHAZO, required:true, requiredMsg:"Elegí el motivo del rechazo."},
       {id:"detalle", label:"Detalle (obligatorio si elegís «Otro»)", placeholder:"ej: es igual al del martes"}], true
    ).then(function(v){
      if(!v) return;
      if(v.motivo==="Otro" && !v.detalle){ avisar("Falta el detalle", "Si el motivo es «Otro», escribí cuál."); return; }
      var motivo = v.motivo + (v.detalle ? ": "+v.detalle : "");
      correr("rechazarPedido", {pedidoId:p.id, motivo:motivo, nombre:v.nombre}).then(function(res){
        if(!res) return;
        toast("Pedido rechazado."); irA("pedidos"); loadData(true);
      });
    });
  }

  var MOTIVOS_ELIMINAR = ["Pedido viejo que quedó sin cerrar", "Pedido duplicado", "Cargado por error", "Prueba", "Otro"];
  function eliminarPedido(p){
    var extra = p.estado==="cerrado" ? '<br><br><b>Ojo: este pedido está cerrado</b> (ya se envió y se recibió). Si lo eliminás deja de figurar en el historial.' : '';
    pedirNombre("Eliminar el pedido",
      'Se borra el pedido de <b>'+esc(LOCAL_LABEL[p.local]||p.local)+'</b> del '+esc(fmtCorta(p.fecha))+' ('+(p.items||[]).length+' ítems): deja de aparecer en la lista y en el CSV. '+
      'Queda una copia en la solapa «Eliminados» de la planilla.'+extra,
      "dc_quien_accion", "Eliminar",
      [{id:"motivo", label:"Motivo", type:"select", options:MOTIVOS_ELIMINAR, required:true, requiredMsg:"Elegí el motivo."},
       {id:"detalle", label:"Detalle (obligatorio si elegís «Otro»)", placeholder:""}], true
    ).then(function(v){
      if(!v) return;
      if(v.motivo==="Otro" && !v.detalle){ avisar("Falta el detalle", "Si el motivo es «Otro», escribí cuál."); return; }
      correr("eliminarPedido", {pedidoId:p.id, nombre:v.nombre, motivo:v.motivo+(v.detalle?": "+v.detalle:"")}).then(function(res){
        if(!res) return;
        if(state.newOrderForm && state.newOrderForm.pedidoId===p.id) state.newOrderForm = null;
        toast("Pedido eliminado.");
        if(state.tab==="pedidos") state.detailId = null;
        state.editForm = null;
        loadData(true);
      });
    });
  }

  /* ---------- imprimir ---------- */
  function printPedido(p){
    var byCat = groupByCategory(p.items||[]);
    var html = '<h1>Pedido de '+esc(TIPO_LABEL[tipoDe(p)])+' — '+esc(LOCAL_LABEL[p.local]||p.local)+'</h1>';
    html += '<div class="ps-meta">Fecha: '+esc(fmtDate(p.fecha))+(p.quienPide?' &nbsp;·&nbsp; Pide: '+esc(p.quienPide):'')+'</div>';
    if(p.notas) html += '<div class="ps-meta">Notas: '+esc(p.notas)+'</div>';
    Object.keys(byCat).forEach(function(ck){
      var list = (byCat[ck]||[]).filter(function(it){ return it.pedidoCant && String(it.pedidoCant).trim()!==""; });
      if(list.length===0) return;
      html += '<div class="ps-cat">'+esc(CAT_LABEL[ck]||ck)+'</div>';
      list.forEach(function(it){
        html += '<div class="ps-item"><span class="ps-check"></span><span class="ps-name">'+esc(it.name)+(it.isExtra?' (nuevo)':'')+'</span><span class="ps-qty">'+esc(it.pedidoCant)+'</span></div>';
      });
    });
    html += '<div class="ps-meta" style="margin-top:22px">Preparado por: _______________________ &nbsp;&nbsp; Fecha: ___/___/___</div>';
    document.getElementById("printSheet").innerHTML = html;
    window.print();
  }

  /* =====================================================================
     CATÁLOGO (con clave)
     ===================================================================== */
  function permMsg(err, action){
    if(err && err.message && err.message.indexOf("PERMISO_DENEGADO")!==-1) return "Clave incorrecta: la edición del catálogo está restringida.";
    return "No se pudo "+action+": "+(err && err.message ? err.message : "probá de nuevo.");
  }
  var adminPassword_ = null; // solo en memoria; se pierde al recargar la página

  function renderCatalogo(main){
    var byCat = groupByCategory(catalogItems);
    var unlocked = state.adminUnlocked;
    var html = '';
    if(!unlocked){
      html += '<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-ghost btn-sm" id="unlockCatalog" type="button">🔒 Editar catálogo</button></div>';
    } else {
      html += '<div class="banner" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
        '<span>Modo edición activo. Los cambios aplican a los <b>próximos</b> pedidos; los ya cargados no se modifican.</span>'+
        '<button class="btn btn-ghost btn-sm" id="lockCatalog" type="button">Salir del modo edición</button></div>';
    }
    TIPOS.forEach(function(t){
      html += '<div class="group-title">'+esc(t.label)+'</div>';
      catsDeTipo(t.key).forEach(function(c){
        var list = ordenCatalogo(byCat[c.key]||[]);
        html += '<div class="panel"><div class="cat-block">';
        html += '<div class="cat-title">'+esc(c.label)+' <span class="mono" style="font-weight:500;opacity:.7">('+list.length+')</span></div>';
        list.forEach(function(it, idx){
          html += '<div class="catalog-item"><div class="ci-name">'+esc(it.name)+'</div>';
          if(unlocked){
            html += '<div class="ci-controls">';
            html += '<button class="rm-btn" data-move-up="'+esc(it.id)+'" title="Subir" type="button" '+(idx===0?"disabled":"")+'>↑</button>';
            html += '<button class="rm-btn" data-move-down="'+esc(it.id)+'" title="Bajar" type="button" '+(idx===list.length-1?"disabled":"")+'>↓</button>';
            html += '<select class="ci-cat-select" data-move-cat="'+esc(it.id)+'" title="Cambiar de categoría">';
            CATEGORIES.forEach(function(c2){ html += '<option value="'+c2.key+'"'+(c2.key===c.key?" selected":"")+'>'+esc(c2.label)+'</option>'; });
            html += '</select>';
            html += '<button class="rm-btn" data-del-item="'+esc(it.id)+'" title="Eliminar" type="button">×</button>';
            html += '</div>';
          }
          html += '</div>';
        });
        if(unlocked){
          html += '<div class="catalog-add"><input type="text" placeholder="Nuevo ítem en '+esc(c.label)+'…" data-newcat="'+c.key+'">'+
                  '<button class="btn btn-ghost btn-sm" data-addcat="'+c.key+'" type="button">+ Agregar</button></div>';
        }
        html += '</div></div>';
      });
    });
    main.innerHTML = html;

    var unlockBtn = document.getElementById("unlockCatalog");
    if(unlockBtn){
      unlockBtn.addEventListener("click", function(){
        var pass = window.prompt("Clave para editar el catálogo:");
        if(pass==null) return;
        unlockBtn.disabled = true;
        callServer("checkAdmin", {password:pass}).then(function(res){
          if(res && res.ok){ adminPassword_ = pass; state.adminUnlocked = true; renderCatalogo(main); }
          else { toast("Clave incorrecta."); unlockBtn.disabled = false; }
        }).catch(function(err){ console.error(err); toast("No se pudo verificar la clave."); unlockBtn.disabled=false; });
      });
    }
    var lockBtn = document.getElementById("lockCatalog");
    if(lockBtn){ lockBtn.addEventListener("click", function(){ adminPassword_ = null; state.adminUnlocked = false; renderCatalogo(main); }); }

    function cat(action, payload, okMsg, verbo){
      callServer(action, payload).then(function(){ if(okMsg) toast(okMsg); loadData(true); })
        .catch(function(err){ console.error(err); toast(permMsg(err, verbo)); renderCatalogo(main); });
    }
    main.querySelectorAll("[data-del-item]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-del-item");
        var it = catalogItems.find(function(x){ return x.id===id; });
        confirmar("Eliminar ítem del catálogo", "¿Eliminar <b>"+esc(it?it.name:"")+"</b>? Los pedidos ya cargados no cambian.", "Eliminar", "Volver", true).then(function(ok){
          if(ok) cat("deleteCatalogItem", {id:id, password:adminPassword_}, "Ítem eliminado", "eliminar");
        });
      });
    });
    main.querySelectorAll("[data-move-up]").forEach(function(btn){
      btn.addEventListener("click", function(){ if(!btn.disabled) cat("moveCatalogItem", {id:btn.getAttribute("data-move-up"), direction:"up", password:adminPassword_}, "", "mover"); });
    });
    main.querySelectorAll("[data-move-down]").forEach(function(btn){
      btn.addEventListener("click", function(){ if(!btn.disabled) cat("moveCatalogItem", {id:btn.getAttribute("data-move-down"), direction:"down", password:adminPassword_}, "", "mover"); });
    });
    main.querySelectorAll("[data-move-cat]").forEach(function(sel){
      sel.addEventListener("change", function(){ cat("setCatalogItemCategory", {id:sel.getAttribute("data-move-cat"), categoria:sel.value, password:adminPassword_}, "Ítem movido de categoría", "mover"); });
    });
    main.querySelectorAll("[data-addcat]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var c = btn.getAttribute("data-addcat");
        var input = main.querySelector('[data-newcat="'+c+'"]');
        var name = (input.value||"").trim();
        if(!name){ input.focus(); return; }
        cat("addCatalogItem", {categoria:c, nombre:name, password:adminPassword_}, "Ítem agregado", "agregar");
      });
    });
  }

  /* ---------- navegación ---------- */
  document.getElementById("tabs").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    state.tab = btn.getAttribute("data-tab");
    state.exito = null;
    if(state.tab!=="pedidos"){ state.detailId=null; }
    state.editForm = null;
    render();
  });
  document.getElementById("refreshBtn").addEventListener("click", function(){
    loadData(false).then(function(){ toast("Actualizado"); });
  });

  document.getElementById("main").addEventListener("click", accionesAviso);

  loadData(false);
})();
</script>
</body>
</html>
