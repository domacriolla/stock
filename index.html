<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doma Criolla — Stock y Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Paleta e identidad tomadas del Manual de Marca Doma Criolla:
     Pullman Brown #65341A · Tiger's Eye #D88F31 · Zinnwaldite Brown #311B10.
     Tipografía: Trajan Pro Bold (títulos) -> Cinzel, la alternativa libre más
     cercana; Poppins para texto y para el acento de marca. */
  :root{
    --bg:#F7F1E4;
    --panel:#FFFFFF;
    --ink:#311B10;
    --ink-soft:#7C6753;
    --line:#E3D6C4;
    --crust:#65341A;
    --crust-dark:#46240F;
    --accent:#D88F31;
    --accent-bg:#FAEAD3;
    --herb:#4B6B3F;
    --herb-bg:#E3EAD9;
    --alert:#9A3B2E;
    --alert-bg:#F3DBD4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Cinzel',serif;font-weight:600;margin:0;letter-spacing:.01em;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:8px;}
  header.top h1{font-size:26px;color:var(--crust-dark);text-transform:uppercase;}
  header.top .sub{font-family:'Poppins',sans-serif;color:var(--accent);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;}

  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;}
  @media (max-width:640px){.home-grid{grid-template-columns:1fr;}}
  .home-card{
    background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:26px 22px;cursor:pointer;text-align:left;
  }
  .home-card h2{font-size:20px;margin-bottom:6px;}
  .home-card p{color:var(--ink-soft);font-size:14px;margin:0;line-height:1.5;}
  .home-card .tag{display:inline-block;font-size:12px;color:var(--crust-dark);margin-bottom:10px;letter-spacing:.02em;}

  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--crust);color:#fff;border:none;border-radius:3px;
    padding:11px 18px;font-size:14px;font-weight:600;
  }
  .btn:hover{background:var(--crust-dark);}
  .btn.secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink-soft);}
  .btn:disabled{opacity:.5;cursor:default;}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13px;background:none;border:none;padding:0;margin-bottom:18px;}
  .back:hover{color:var(--ink);}

  select,input[type=text],input[type=number],input[type=date]{
    font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);
    border-radius:3px;background:#fff;color:var(--ink);
  }
  label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;}

  .field-row{margin-bottom:18px;max-width:320px;}

  table.lotes{width:100%;border-collapse:collapse;margin-top:10px;}
  table.lotes th{
    text-align:left;font-size:11px;text-transform:none;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding:6px 8px;font-weight:600;
  }
  table.lotes td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.lotes select{width:100%;}
  table.lotes input{width:100%;}
  table.traza tr.fila-guardada{background:var(--herb-bg);}
  table.traza tr.fila-guardada td{color:var(--ink-soft);}
  .btn-guardar-item:disabled{opacity:.7;}
  .col-cant{width:90px;}
  .col-venc{width:150px;}
  .col-add{width:30px;text-align:center;}
  .col-del{width:34px;text-align:center;}
  .del-btn{background:none;border:none;color:var(--alert);font-size:16px;line-height:1;padding:4px;}

  .add-row{margin-top:10px;background:none;border:1px dashed var(--line);color:var(--ink-soft);
    padding:8px 14px;border-radius:3px;font-size:13px;}
  .add-row:hover{border-color:var(--crust);color:var(--crust-dark);}

  .add-lote-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);
    font-size:13px;line-height:1;padding:3px 8px;border-radius:3px;}
  .add-lote-btn:hover{border-color:var(--crust);color:var(--crust-dark);}
  .item-extra{color:var(--ink-soft);font-size:12px;font-style:italic;}
  h4.cat-heading{font-size:13px;margin:22px 0 4px;color:var(--crust-dark);
    text-transform:uppercase;letter-spacing:.03em;}
  /* nombre de la receta (Relleno/Preparado) en Registrar producción → Cocina:
     más grande que el listado de insumos de abajo, para que se distinga de
     un vistazo cuál es el título y cuál el detalle. */
  h4.receta-heading{font-size:17px;text-transform:none;letter-spacing:0;margin-top:28px;}
  table.lotes.traza td{font-size:13.5px;}
  .cat-nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;}
  .cat-nav a{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);
    padding:4px 9px;border-radius:12px;text-decoration:none;}
  .cat-nav a:hover{border-color:var(--crust);color:var(--crust-dark);}

  .actions{margin-top:22px;display:flex;gap:10px;align-items:center;}
  .msg{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:3px;display:none;}
  .msg.ok{display:block;background:var(--herb-bg);color:var(--herb);}
  .msg.err{display:block;background:var(--alert-bg);color:var(--alert);}

  .fab-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .fab-toolbar .field-row{margin:0;max-width:180px;}

  table.prod{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.prod th{
    text-align:left;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink-soft);
    padding:7px 8px;font-weight:600;
  }
  table.prod td{padding:7px 8px;border-bottom:1px solid var(--line);}
  table.prod tr:hover td{background:rgba(0,0,0,.02);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .badge{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--herb-bg);color:var(--herb);}
  .badge.reposo{background:var(--accent-bg);color:var(--crust-dark);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab-btn{background:none;border:none;padding:9px 16px;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Poppins',sans-serif;}
  .tab-btn.active{color:var(--crust-dark);border-bottom-color:var(--accent);font-weight:600;}
  .tab-btn:hover{color:var(--ink);}

  .alert-box{background:var(--alert-bg);border-radius:4px;padding:14px 16px;margin-bottom:18px;}
  .alert-box h3{color:var(--alert);font-size:15px;margin-bottom:8px;}
  .alert-box ul{margin:0;padding-left:18px;font-size:13.5px;color:#5c2b23;}

  .empty{color:var(--ink-soft);font-size:14px;padding:30px 0;text-align:center;}
  .loading{color:var(--ink-soft);font-size:14px;}
  footer.note{margin-top:40px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;}

  /* Al imprimir "Ver qué producir hoy" solo se ve la tabla del sector activo
     (Producción / Cocina / Discos) — todo lo de navegación queda afuera. */
  @media print{
    .back, .fab-toolbar, .tabs, footer.note{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none;padding:0;}
    table.prod{font-size:12px;}
    table.prod tr{break-inside:avoid;}
    .alert-box{break-inside:avoid;}
    .no-print{display:none !important;}
  }

  /* Orden de envío imprimible — arma una hoja aparte con solo lo cargado en
     pantalla para ese local, y se muestra únicamente al imprimir. */
  #printAreaEnvio{display:none;}
  #printAreaEnvio h1{font-size:20px;margin-bottom:2px;}
  #printAreaEnvio .print-sub{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}
  #printAreaEnvio h3{font-size:14px;margin:18px 0 6px;}
  table.print-tabla{width:100%;border-collapse:collapse;margin-bottom:6px;}
  table.print-tabla th{text-align:left;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink-soft);padding:6px 8px;}
  table.print-tabla td{padding:6px 8px;border-bottom:1px solid var(--line);}
  table.print-tabla .num{text-align:right;}
  @media print{
    body.print-envio .wrap{display:none !important;}
    body.print-envio #printAreaEnvio{display:block;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ======================================================================
   CONFIGURACIÓN — completar después de publicar el Apps Script
   ====================================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0MpQPLqVL_5QpuRAOmz_3uvA6Oz-72bzwABz3bN6ltR3kmH0-nnMwRnoDrfhanm0DWQ/exec';

const LOCALES = ['Centro', 'Patagonia', 'Zelarrayan', 'Fábrica - Producción', 'Fábrica - Cocina', 'Fábrica - Discos'];
const TIPOS_DISCO = ['Horno', 'Frito', 'Recorte'];
let SABORES_CACHE = null;
let RELLENOS_CACHE = null;
let RECETAS_CACHE = null;

async function obtenerRecetas(){
  if(RECETAS_CACHE) return RECETAS_CACHE;
  const r = await fetch(`${APPS_SCRIPT_URL}?action=listarRecetas`);
  const data = await r.json();
  RECETAS_CACHE = { cabecera: data.recetas || [], detalle: data.detalle || [] };
  return RECETAS_CACHE;
}

const app = document.getElementById('app');

/* ---------------------------------------------------------------------
   Router muy simple (sin librerías) — 3 pantallas
   --------------------------------------------------------------------- */
function irA(pantalla){
  if(pantalla === 'home') renderHome();
  if(pantalla === 'local') renderLocal();
  if(pantalla === 'fabrica') renderFabrica();
  if(pantalla === 'planificacion') renderPlanificacion();
  if(pantalla === 'envios') renderEnvios();
  if(pantalla === 'recepcion') renderRecepcion();
  if(pantalla === 'historial') renderHistorialEnvios();
  if(pantalla === 'registro') renderRegistroProduccion();
  if(pantalla === 'fichas') renderFichasTecnicas();
}

function renderHome(){
  app.innerHTML = `
    <header class="top">
      <h1>Doma Criolla</h1>
      <div class="sub">Stock y producción</div>
    </header>
    <div class="home-grid">
      <button class="home-card" onclick="irA('local')">
        <div class="tag">LOCAL / FÁBRICA</div>
        <h2>Cargar stock de hoy</h2>
        <p>Registrar cuánto queda de cada sabor, con su fecha de vencimiento.</p>
      </button>
      <button class="home-card" onclick="irA('fabrica')">
        <div class="tag">FÁBRICA</div>
        <h2>Ver qué producir hoy</h2>
        <p>Calculado a partir del stock cargado y la venta estimada de cada sabor.</p>
      </button>
      <button class="home-card" onclick="irA('registro')">
        <div class="tag">FÁBRICA</div>
        <h2>Registrar producción</h2>
        <p>Trazabilidad del turno: máquina, disco, relleno, horas y total producido por sabor.</p>
      </button>
      <button class="home-card" onclick="irA('envios')">
        <div class="tag">FÁBRICA</div>
        <h2>Despachar envíos</h2>
        <p>Cuánto hay que mandarle hoy a cada local, calculado con lo que vende y lo que ya tiene cargado.</p>
      </button>
      <button class="home-card" onclick="irA('recepcion')">
        <div class="tag">LOCAL</div>
        <h2>Confirmar recepción</h2>
        <p>Registrar cuánto llegó realmente de lo que fábrica despachó hoy.</p>
      </button>
      <button class="home-card" onclick="irA('planificacion')">
        <div class="tag">PLANIFICACIÓN</div>
        <h2>Editar venta proyectada</h2>
        <p>Actualizar, por local, cuánto se espera vender de cada sabor cada día de la semana.</p>
      </button>
      <button class="home-card" onclick="irA('historial')">
        <div class="tag">FÁBRICA / LOCAL</div>
        <h2>Historial de envíos</h2>
        <p>Comparar lo enviado contra lo recibido, por local y sabor.</p>
      </button>
      <button class="home-card" onclick="irA('fichas')">
        <div class="tag">FÁBRICA</div>
        <h2>Fichas técnicas</h2>
        <p>Importar y actualizar las recetas (Rellenos, Preparados, Postres, Dips, Edición Limitada).</p>
      </button>
    </div>
    <footer class="note">Doma Criolla — herramienta interna de planificación de producción.</footer>
  `;
}

/* ---------------------------------------------------------------------
   Pantalla LOCAL: cargar lotes de stock
   --------------------------------------------------------------------- */
let CATEGORIA_POR_SABOR_CACHE = null;
async function obtenerCategorias(){
  if(SABORES_CACHE) return SABORES_CACHE;
  const r = await fetch(`${APPS_SCRIPT_URL}?action=listarSabores`);
  const data = await r.json();
  SABORES_CACHE = data.categorias || {};
  CATEGORIA_POR_SABOR_CACHE = data.categoriaPorSabor || {};
  return SABORES_CACHE;
}
// Categoria (Canasta, Frito, Horno, etc.) de cada sabor — para saber, por
// ejemplo, cuáles son Canasta (armado manual del molde) sin adivinarlo por
// el nombre.
async function obtenerCategoriaPorSabor(){
  if(!CATEGORIA_POR_SABOR_CACHE) await obtenerCategorias();
  return CATEGORIA_POR_SABOR_CACHE || {};
}

async function obtenerRellenos(){
  if(RELLENOS_CACHE) return RELLENOS_CACHE;
  const r = await fetch(`${APPS_SCRIPT_URL}?action=listarRellenos`);
  const data = await r.json();
  RELLENOS_CACHE = data.rellenos || [];
  return RELLENOS_CACHE;
}

// Lista de empleados (hoja "Empleados" del Sheet) para los desplegables de
// "quién hizo esto" — Responsable, Repartidor, Acompañante, puestos de máquina.
let EMPLEADOS_CACHE = null;
async function obtenerEmpleados(){
  if(EMPLEADOS_CACHE) return EMPLEADOS_CACHE;
  const r = await fetch(`${APPS_SCRIPT_URL}?action=listarEmpleados`);
  const data = await r.json();
  EMPLEADOS_CACHE = data.empleados || [];
  return EMPLEADOS_CACHE;
}
function opcionesEmpleados(empleados){
  if(!empleados || empleados.length === 0){
    return '<option value="">(cargá empleados en la hoja "Empleados")</option>';
  }
  return '<option value="">— Seleccionar —</option>' + empleados.map(n => `<option value="${n}">${n}</option>`).join('');
}

async function renderLocal(){
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <header class="top"><h1>Cargar stock</h1></header>

    <div class="field-row">
      <label>¿Dónde estás cargando este stock?</label>
      <select id="selLocal">
        ${LOCALES.map(l => `<option value="${l}">${l}</option>`).join('')}
      </select>
    </div>
    <div class="field-row">
      <label>¿Quién está cargando este stock?</label>
      <div id="responsableWrap"><input type="text" id="inpResponsable" placeholder="Nombre y apellido"></div>
    </div>
    <div class="field-row">
      <label>Fecha (por si cargás con atraso)</label>
      <input type="date" id="fechaCarga" value="${hoyISO()}">
    </div>

    <p style="color:var(--ink-soft);font-size:12.5px;max-width:560px;">
      Están listados todos los productos — completá cantidad y vencimiento solo en los que tengas hoy,
      el resto se deja en blanco. Si un mismo producto tiene más de un lote con vencimientos distintos,
      usá el botón <strong>+</strong> de esa fila para agregar otra línea.
    </p>

    <div id="catNav" class="cat-nav"></div>
    <div id="tablaLotesContainer"></div>

    <div class="actions">
      <button class="btn" id="btnGuardar">Guardar stock cargado</button>
    </div>
    <div class="msg" id="msg"></div>
  `;

  const categorias = await obtenerCategorias();
  const rellenos = await obtenerRellenos();
  let empleados = [];
  const nombresCategorias = Object.keys(categorias);

  // según el sector elegido, se carga por Sabor (locales y Fábrica -
  // Producción), por Relleno en kilos (Fábrica - Cocina), o por tipo de
  // disco en docenas (Fábrica - Discos).
  function modoDeLocal(local){
    if(local === 'Fábrica - Cocina') return 'relleno';
    if(local === 'Fábrica - Discos') return 'disco';
    return 'sabor';
  }

  // el listado de empleados es solo para Fábrica (Producción/Cocina/Discos);
  // en los locales el responsable se escribe a mano.
  function esFabrica(local){ return local.startsWith('Fábrica'); }

  async function pintarResponsable(){
    const local = document.getElementById('selLocal').value;
    const wrap = document.getElementById('responsableWrap');
    if(esFabrica(local)){
      if(empleados.length === 0) empleados = await obtenerEmpleados();
      wrap.innerHTML = `<select id="inpResponsable">${opcionesEmpleados(empleados)}</select>`;
    } else {
      wrap.innerHTML = `<input type="text" id="inpResponsable" placeholder="Nombre y apellido">`;
    }
  }

  // una fila por producto, siempre visible (aunque quede vacía); el botón "+"
  // agrega otra fila del MISMO producto para cargar un segundo vencimiento.
  function filaProducto(nombre, esExtra){
    const tr = document.createElement('tr');
    tr.dataset.item = nombre;
    tr.innerHTML = `
      <td>${esExtra ? `<span class="item-extra">↳ otro lote</span>` : nombre}</td>
      <td><input type="number" min="0" step="1" class="inp-cant" placeholder="0"></td>
      <td><input type="date" class="inp-venc"></td>
      <td class="col-add">${esExtra ? '' : '<button type="button" class="add-lote-btn" title="Agregar otro vencimiento para este producto">+</button>'}</td>
      <td class="col-del">${esExtra ? '<button type="button" class="del-btn" title="Quitar">✕</button>' : ''}</td>
    `;
    if(esExtra){
      tr.querySelector('.del-btn').onclick = () => tr.remove();
    } else {
      tr.querySelector('.add-lote-btn').onclick = () => {
        tr.insertAdjacentElement('afterend', filaProducto(nombre, true));
      };
    }
    return tr;
  }

  function tablaDe(labelCantidad, colHeader, items){
    const table = document.createElement('table');
    table.className = 'lotes';
    table.innerHTML = `
      <thead><tr>
        <th>${colHeader}</th>
        <th class="col-cant">${labelCantidad}</th>
        <th class="col-venc">Vencimiento</th>
        <th class="col-add"></th>
        <th class="col-del"></th>
      </tr></thead>
      <tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    items.forEach(nombre => tbody.appendChild(filaProducto(nombre, false)));
    return table;
  }

  function pintarTabla(){
    const modo = modoDeLocal(document.getElementById('selLocal').value);
    const labelCantidad = modo === 'relleno' ? 'Kilos' : modo === 'disco' ? 'Docenas' : 'Cantidad';
    const cont = document.getElementById('tablaLotesContainer');
    const nav = document.getElementById('catNav');
    cont.innerHTML = '';
    nav.innerHTML = '';

    if(modo === 'sabor'){
      nombresCategorias.forEach((cat, i) => {
        const id = `cat-${i}`;
        const h = document.createElement('h4');
        h.className = 'cat-heading';
        h.id = id;
        h.textContent = cat;
        cont.appendChild(h);
        cont.appendChild(tablaDe(labelCantidad, 'Sabor / ítem', categorias[cat]));

        const a = document.createElement('a');
        a.href = `#${id}`;
        a.textContent = cat;
        nav.appendChild(a);
      });
    } else if(modo === 'relleno'){
      cont.appendChild(tablaDe(labelCantidad, 'Relleno', rellenos));
    } else {
      cont.appendChild(tablaDe(labelCantidad, 'Tipo de disco', TIPOS_DISCO));
    }
  }

  document.getElementById('selLocal').onchange = () => { pintarTabla(); pintarResponsable(); };
  pintarTabla(); // arranca mostrando el listado completo del primer local
  pintarResponsable();

  document.getElementById('btnGuardar').onclick = async () => {
    const local = document.getElementById('selLocal').value;
    const responsable = document.getElementById('inpResponsable').value.trim();
    const fecha = document.getElementById('fechaCarga').value;
    const filas = [...document.querySelectorAll('#tablaLotesContainer tr[data-item]')];
    const items = filas.map(tr => ({
      sabor: tr.dataset.item,
      cantidad: tr.querySelector('.inp-cant').value,
      vencimiento: tr.querySelector('.inp-venc').value
    })).filter(it => it.cantidad && it.vencimiento);

    const msg = document.getElementById('msg');
    if(!responsable){
      msg.className = 'msg err'; msg.textContent = 'Indicá quién está cargando este stock.'; return;
    }
    if(items.length === 0){
      msg.className = 'msg err'; msg.textContent = 'Cargá al menos un lote con cantidad y vencimiento.'; return;
    }
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      const r = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'registrarStock', local, fecha, responsable, items })
      });
      const data = await r.json();
      if(data.error) throw new Error(data.error);
      msg.className = 'msg ok';
      msg.textContent = `Guardado: ${data.registros_guardados} lote(s) para ${local}.`;
      pintarTabla();
    }catch(err){
      msg.className = 'msg err'; msg.textContent = 'No se pudo guardar: ' + err.message;
    }finally{
      btn.disabled = false; btn.textContent = 'Guardar stock cargado';
    }
  };
}

/* ---------------------------------------------------------------------
   Pantalla FÁBRICA: qué producir hoy
   --------------------------------------------------------------------- */
async function renderFabrica(){
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <div class="fab-toolbar">
      <header class="top" style="margin:0;"><h1>Producción de hoy</h1></header>
      <div class="field-row">
        <label>Ver para el día</label>
        <input type="date" id="fechaCalculo" value="${hoyISO()}">
      </div>
    </div>
    <div class="tabs" id="tabsFabrica" style="display:none;">
      <button class="tab-btn active" data-tab="produccion">Producción</button>
      <button class="tab-btn" data-tab="cocina">Cocina</button>
      <button class="tab-btn" data-tab="discos">Discos</button>
      <button class="btn secondary" id="btnImprimir" style="margin-left:auto;" onclick="window.print()">🖶 Imprimir</button>
    </div>
    <div id="contenidoFabrica" class="loading">Calculando…</div>
  `;
  document.getElementById('fechaCalculo').onchange = cargarCalculo;
  cargarCalculo();
}

let ULTIMO_CALCULO = null;
let PREP_ACTUAL = null;
let TAB_ACTIVA = 'produccion';

async function cargarCalculo(){
  const fecha = document.getElementById('fechaCalculo').value;
  const cont = document.getElementById('contenidoFabrica');
  cont.className = 'loading'; cont.textContent = 'Calculando…';
  document.getElementById('tabsFabrica').style.display = 'none';
  try{
    const [r, rPrep] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularTodo&fecha=${fecha}`),
      fetch(`${APPS_SCRIPT_URL}?action=calcularPrepDiaAnterior&fecha=${fecha}`)
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    const prep = await rPrep.json();
    ULTIMO_CALCULO = data;
    PREP_ACTUAL = prep.error ? null : prep;
    document.getElementById('tabsFabrica').style.display = 'flex';
    [...document.querySelectorAll('.tab-btn')].forEach(b => {
      b.onclick = () => { TAB_ACTIVA = b.dataset.tab; marcarTabActiva(); pintarTabActiva(); };
    });
    TAB_ACTIVA = 'produccion';
    marcarTabActiva();
    pintarTabActiva();
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo calcular: ${err.message}</div>`;
  }
}

function marcarTabActiva(){
  [...document.querySelectorAll('.tab-btn')].forEach(b => b.classList.toggle('active', b.dataset.tab === TAB_ACTIVA));
}

function pintarTabActiva(){
  if(TAB_ACTIVA === 'produccion') pintarProduccion(ULTIMO_CALCULO);
  if(TAB_ACTIVA === 'cocina') pintarCocina(ULTIMO_CALCULO);
  if(TAB_ACTIVA === 'discos') pintarDiscos(ULTIMO_CALCULO);
}

// convierte 'yyyy-MM-dd' (lo que devuelve el Apps Script) a 'dd-mm-aaaa' para
// mostrar — la fecha se guarda y se calcula siempre en ISO, esto es solo visual.
function fmtFecha(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return iso;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function bloqueAlertas(data){
  if(!data.alertasVencimiento || !data.alertasVencimiento.length) return '';
  return `
    <div class="alert-box">
      <h3>Vender ya — no llega vivo a la próxima reposición</h3>
      <ul>
        ${data.alertasVencimiento.map(a => `<li>${a.sabor} — ${a.local}: ${a.cantidad} u. (vence ${fmtFecha(a.vencimiento)})</li>`).join('')}
      </ul>
    </div>`;
}

// redondeo a entero para mostrar en pantalla (el cálculo interno sigue con decimales)
function ent(n){ return Math.round(Number(n) || 0).toLocaleString('es-AR'); }

// bloque "para mañana": Rollos de Jamón y Queso + Canastas que hay que
// dejar armados HOY (se ve en la pestaña Producción, arriba de lo del día).
function bloquePrepDiaAnterior(){
  const prep = PREP_ACTUAL;
  if(!prep) return '';
  const rollos = Number(prep.rollosJyQ) || 0;
  const canastas = (prep.canastas || []).filter(c => c.aHacerUnidades > 0);
  if(rollos <= 0 && canastas.length === 0) return '';
  const filaRollos = rollos > 0 ? `<tr><td>Rollos de Jamón y Queso</td><td class="num"><strong>${ent(rollos)}</strong></td></tr>` : '';
  const filasCanastas = canastas.map(c => `<tr><td>Canasta — ${c.sabor}</td><td class="num"><strong>${ent(c.aHacerUnidades)}</strong></td></tr>`).join('');
  return `
    <h3 style="font-size:15px;margin:20px 0 8px;">Para mañana (${prep.diaManana}, ${fmtFecha(prep.fechaManana)}) — armar/moldear HOY</h3>
    <table class="prod">
      <thead><tr><th>Ítem</th><th class="num">Cantidad</th></tr></thead>
      <tbody>${filaRollos}${filasCanastas}</tbody>
    </table>`;
}

/* ---- Pestaña PRODUCCIÓN: qué armar hoy, por sabor (todos los rubros) ---- */
function pintarProduccion(data){
  const cont = document.getElementById('contenidoFabrica');
  // Dips y Postres los elabora Cocina (no Producción) — se muestran en la
  // pestaña Cocina, junto con Preparados y Rellenos.
  const filas = data.produccion.filter(f => f.aHacerUnidades > 0 && f.rubro !== 'Dips' && f.rubro !== 'Postres');
  const alertaHtml = bloqueAlertas(data);
  const prepHtml = bloquePrepDiaAnterior();

  const tituloSector = `<h2 style="font-size:18px;margin:0 0 6px;">Producción del día — Sector Producción</h2>`;

  if(filas.length === 0){
    cont.className = '';
    cont.innerHTML = tituloSector + alertaHtml + prepHtml + `<div class="empty">Nada para armar/reponer el ${data.dia.toLowerCase()} — el stock cargado alcanza.</div>`;
    return;
  }

  const rubros = [...new Set(filas.map(f => f.rubro))];
  rubros.sort((a,b) => (a.startsWith('Empanadas') ? -1 : b.startsWith('Empanadas') ? 1 : a.localeCompare(b)));

  const bloques = rubros.map(rubro => {
    const items = filas.filter(f => f.rubro === rubro);
    const esEmpanada = rubro.startsWith('Empanadas');
    return `
      <h3 style="font-size:15px;margin:20px 0 8px;">${rubro}</h3>
      <table class="prod">
        <thead>
          <tr>
            <th>Sabor / ítem</th>
            ${esEmpanada ? '<th>Se cocinó</th>' : ''}
            <th class="num">Objetivo</th>
            ${esEmpanada ? '<th>Días que cubre</th>' : ''}
            <th class="num">Stock disponible</th>
            <th class="num">${esEmpanada ? 'Stock necesario' : 'A reponer'} (u.)</th>
            ${esEmpanada ? '<th class="num">Docenas</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${items.map(f => `
            <tr>
              <td>${f.sabor}</td>
              ${esEmpanada ? `<td>${f.diaCocina}${f.diaCocina !== f.diaArmado ? ` <span class="badge reposo">reposo</span>` : ''}</td>` : ''}
              <td class="num">${ent(f.objetivoUnidades)}</td>
              ${esEmpanada ? `<td style="color:var(--ink-soft);font-size:12.5px;">${f.diasQueCubre}</td>` : ''}
              <td class="num">${ent(f.stockValidoUnidades)}</td>
              <td class="num"><strong>${ent(f.aHacerUnidades)}</strong></td>
              ${esEmpanada ? `<td class="num">${ent(f.aHacerDocenas)}</td>` : ''}
            </tr>`).join('')}
        </tbody>
      </table>`;
  }).join('');

  cont.className = '';
  cont.innerHTML = tituloSector + alertaHtml + prepHtml + `
    <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(data.fecha)} — ${filas.length} ítem(s) con faltante</p>
    ${bloques}
  `;
}

/* ---- Pestaña COCINA: todo lo que elabora Cocina hoy — Preparados, Rellenos,
   Dips y Postres (Dips/Postres los arma Cocina, no Producción) ---- */
let cocinaPctDebounce = null;
function pintarCocina(data){
  const cont = document.getElementById('contenidoFabrica');
  const filasRelleno = data.cocina.filter(f => f.kilosDeRelleno > 0);
  const tituloSector = `<h2 style="font-size:18px;margin:0 0 6px;">Producción del día — Sector Cocina</h2>`;

  const tablaSimple = (rubro, titulo) => {
    const items = (data.produccion || []).filter(f => f.rubro === rubro && f.aHacerUnidades > 0);
    if(items.length === 0) return '';
    return `
      <h3 style="font-size:15px;margin:20px 0 8px;">${titulo}</h3>
      <table class="prod">
        <thead><tr><th>Sabor / ítem</th><th class="num">Objetivo</th><th class="num">Stock disponible</th><th class="num">A reponer (u.)</th></tr></thead>
        <tbody>
          ${items.map(f => `
            <tr>
              <td>${f.sabor}</td>
              <td class="num">${ent(f.objetivoUnidades)}</td>
              <td class="num">${ent(f.stockValidoUnidades)}</td>
              <td class="num"><strong>${ent(f.aHacerUnidades)}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  };
  const bloqueDips = tablaSimple('Dips', 'Dips');
  const bloquePostres = tablaSimple('Postres', 'Postres');

  if(filasRelleno.length === 0 && !bloqueDips && !bloquePostres){
    cont.className = '';
    cont.innerHTML = tituloSector + `<div class="empty">Cocina no elabora nada el ${data.dia.toLowerCase()}.</div>`;
    return;
  }

  const tablaRellenos = filasRelleno.length === 0 ? '' : `
    <h3 style="font-size:15px;margin:20px 0 8px;">Rellenos</h3>
    <div class="field-row no-print" style="max-width:320px;">
      <label>% de venta a cubrir <span style="color:var(--ink-soft);font-weight:400;">(los locales siempre tienen algo de stock — bajalo si no hace falta cubrir el 100%)</span></label>
      <input type="number" id="inpPctRelleno" min="0" max="200" step="5" value="100" style="width:90px;">
    </div>
    <p style="color:var(--ink-soft);font-size:13px;"><span id="totalKilosCocina"></span> kg de relleno en total</p>
    <table class="prod">
      <thead><tr><th>Relleno</th><th>Sabores que arma</th><th>Días que cubre</th><th class="num">Kg de relleno</th><th class="num">Ollas</th></tr></thead>
      <tbody>
        ${filasRelleno.map(f => `
          <tr data-kilos-base="${f.kilosDeRelleno}" data-relleno="${f.relleno}">
            <td><strong>${f.relleno}</strong></td>
            <td style="color:var(--ink-soft);font-size:12.5px;">${f.sabores.map(s => s.sabor).join(', ')}</td>
            <td style="color:var(--ink-soft);font-size:12.5px;">${f.diasQueCubre}</td>
            <td class="num kg-relleno"><strong></strong></td>
            <td class="num ollas-relleno">—</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div id="gramajeOllasRellenos"></div>`;

  cont.className = '';
  cont.innerHTML = tituloSector + `
    <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(data.fecha)}</p>
    <div id="preparadosCocina"></div>
    ${tablaRellenos}
    ${bloqueDips}
    ${bloquePostres}
  `;

  if(filasRelleno.length > 0){
    const inpPct = document.getElementById('inpPctRelleno');
    inpPct.oninput = () => {
      recalcularCocinaPct();
      // Preparados y Ollas se recalculan en el servidor con el mismo %
      // (Dips y Postres no se tocan, siempre van al 100%) — con un pequeño
      // debounce para no disparar un pedido por cada tecla.
      clearTimeout(cocinaPctDebounce);
      cocinaPctDebounce = setTimeout(() => cargarPreparadosCocina(data.fecha, inpPct.value), 400);
    };
    recalcularCocinaPct();
  }
  cargarPreparadosCocina(data.fecha, 100);
}

// pequeño detalle plegable con el gramaje de ingredientes escalado a una
// olla (8 kg) — se usa tanto para Preparados como para Rellenos directos.
function bloqueGramajeOllas(items){
  if(!items || items.length === 0) return '';
  return items.map(o => `
    <details style="margin-top:8px;font-size:12.5px;">
      <summary style="cursor:pointer;color:var(--ink-soft);">Gramaje por olla (8 kg) — ${o.nombre}</summary>
      <ul style="margin:8px 0 0 18px;">
        ${(o.gramajePorOlla || []).map(g => `<li>${g.ingrediente}: ${ent(g.cantidad)} ${g.medida || ''}</li>`).join('')}
      </ul>
    </details>`).join('');
}

// "explota" las fichas técnicas contra lo que ya se calculó, para saber
// cuántos kilos de cada Preparado (ej. Puré, Sofrito, Relleno Carne, Pollo
// Grille) hace falta cocinar hoy, y de paso trae las Ollas (calcularOllas):
// cuántos lotes de 8 kg de carne cruda arma Cocina, tanto de los Preparados
// que se comparten entre varios rellenos como de los rellenos que usan un
// ingrediente crudo directo (ver el comentario de calcularOllas en Code.gs).
async function cargarPreparadosCocina(fecha, pct){
  const cont = document.getElementById('preparadosCocina');
  if(!cont) return;
  const pctValido = Number(pct) || 100;
  cont.innerHTML = `<h3 style="font-size:15px;margin:0 0 8px;">Preparados</h3><p class="loading">Buscando preparados…</p>`;
  try{
    const [rDem, rOllas] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularDemandaPreparados&fecha=${encodeURIComponent(fecha)}&pct=${pctValido}`),
      fetch(`${APPS_SCRIPT_URL}?action=calcularOllas&fecha=${encodeURIComponent(fecha)}&pct=${pctValido}`)
    ]);
    const data = await rDem.json();
    if(data.error) throw new Error(data.error);
    const ollasData = await rOllas.json();
    const ollasPrep = ollasData.error ? [] : (ollasData.preparados || []);
    const ollasRelleno = ollasData.error ? [] : (ollasData.rellenos || []);

    // completa la columna "Ollas" de la tabla de Rellenos, ya renderizada
    const gramajeRellenosCont = document.getElementById('gramajeOllasRellenos');
    ollasRelleno.forEach(o => {
      const fila = [...document.querySelectorAll('tr[data-relleno]')].find(tr => tr.dataset.relleno === o.nombre);
      const celda = fila ? fila.querySelector('.ollas-relleno') : null;
      if(celda) celda.innerHTML = `<strong>${o.ollas}</strong> <span style="color:var(--ink-soft);font-size:11px;">(${ent(o.kilosNecesarios)} kg de ${o.ingredienteClave})</span>`;
    });
    if(gramajeRellenosCont) gramajeRellenosCont.innerHTML = bloqueGramajeOllas(ollasRelleno);

    const demanda = data.demandaPreparados || [];
    if(demanda.length === 0){
      cont.innerHTML = `<h3 style="font-size:15px;margin:0 0 8px;">Preparados</h3><div class="empty">Nada para preparar hoy.</div>`;
      return;
    }
    const ollasPorNombre = {};
    ollasPrep.forEach(o => { ollasPorNombre[normalizarFicha(o.nombre)] = o; });

    cont.innerHTML = `
      <h3 style="font-size:15px;margin:0 0 8px;">Preparados</h3>
      <table class="prod">
        <thead><tr><th>Preparado</th><th class="num">Cantidad</th><th class="num">Ollas</th></tr></thead>
        <tbody>
          ${demanda.map(d => {
            const o = ollasPorNombre[normalizarFicha(d.preparado)];
            return `<tr><td><strong>${d.preparado}</strong></td><td class="num">${ent(d.cantidad)} ${d.unidad}</td><td class="num">${o ? `<strong>${o.ollas}</strong>` : '—'}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
      ${bloqueGramajeOllas(ollasPrep)}
      ${(data.avisos || []).length ? `<p style="color:var(--alert);font-size:12px;margin-top:8px;">${data.avisos.join(' ')}</p>` : ''}
    `;
  }catch(err){
    cont.innerHTML = `<p style="color:var(--ink-soft);font-size:12px;">No se pudieron calcular los preparados: ${err.message}</p>`;
  }
}

// el % de venta a cubrir es un ajuste manual de Cocina sobre lo mostrado acá
// (no toca la fórmula de Producción/Envíos, que sigue siendo venta − stock).
function recalcularCocinaPct(){
  const pct = Number(document.getElementById('inpPctRelleno').value);
  const pctValido = isNaN(pct) ? 100 : pct;
  let total = 0;
  document.querySelectorAll('#contenidoFabrica table.prod tbody tr[data-kilos-base]').forEach(tr => {
    const base = Number(tr.dataset.kilosBase) || 0;
    const ajustado = base * pctValido / 100;
    total += ajustado;
    tr.querySelector('.kg-relleno strong').textContent = ent(ajustado);
  });
  document.getElementById('totalKilosCocina').textContent = ent(total);
}

/* ---------------------------------------------------------------------
   Pantalla REGISTRAR PRODUCCIÓN (trazabilidad de turno) — por sector.
   Por ahora solo está armado el sector Producción (con la planilla en
   papel "Registro de Producción y Trazabilidad"); Cocina y Discos quedan
   con un aviso hasta tener esas planillas.
   --------------------------------------------------------------------- */
let CALCULO_REGISTRO = null;
let CATEGORIAS_REGISTRO = null;
let CATEGORIA_POR_SABOR_REGISTRO = null;
let EMPLEADOS_REGISTRO = null;
let PREP_REGISTRO = null;
let SECTOR_REGISTRO_ACTIVO = 'produccion';
const NOMBRE_ROLLOS_JYQ = 'Rollos de Jamón y Queso';

async function renderRegistroProduccion(){
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <div class="fab-toolbar">
      <header class="top" style="margin:0;"><h1>Registrar producción</h1></header>
      <div class="field-row">
        <label>Fecha del turno</label>
        <input type="date" id="fechaRegistro" value="${hoyISO()}">
      </div>
    </div>
    <div class="tabs" id="tabsRegistro">
      <button class="tab-btn active" data-sector="produccion">Producción</button>
      <button class="tab-btn" data-sector="cocina">Cocina</button>
      <button class="tab-btn" data-sector="discos">Discos</button>
    </div>
    <div id="contenidoRegistro" class="loading">Cargando…</div>
    <div class="msg" id="msgRegistro"></div>
  `;
  [...document.querySelectorAll('#tabsRegistro .tab-btn')].forEach(b => {
    b.onclick = () => {
      [...document.querySelectorAll('#tabsRegistro .tab-btn')].forEach(x => x.classList.toggle('active', x === b));
      pintarSectorRegistro(b.dataset.sector);
    };
  });
  document.getElementById('fechaRegistro').onchange = cargarRegistroProduccion;
  cargarRegistroProduccion();
}

async function cargarRegistroProduccion(){
  const fecha = document.getElementById('fechaRegistro').value;
  const cont = document.getElementById('contenidoRegistro');
  cont.className = 'loading'; cont.textContent = 'Cargando…';
  const msg = document.getElementById('msgRegistro');
  msg.className = 'msg'; msg.textContent = '';
  try{
    const [r, rPrep, categorias, categoriaPorSabor, empleados] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularTodo&fecha=${fecha}`),
      fetch(`${APPS_SCRIPT_URL}?action=calcularPrepDiaAnterior&fecha=${fecha}`),
      obtenerCategorias(),
      obtenerCategoriaPorSabor(),
      obtenerEmpleados()
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    const prep = await rPrep.json();
    CALCULO_REGISTRO = data;
    PREP_REGISTRO = prep.error ? { rollosJyQ: 0, canastas: [] } : prep;
    CATEGORIAS_REGISTRO = categorias;
    CATEGORIA_POR_SABOR_REGISTRO = categoriaPorSabor;
    EMPLEADOS_REGISTRO = empleados;
    pintarSectorRegistro(SECTOR_REGISTRO_ACTIVO);
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
  }
}

function pintarSectorRegistro(sector){
  SECTOR_REGISTRO_ACTIVO = sector;
  const cont = document.getElementById('contenidoRegistro');
  cont.className = '';
  if(sector === 'produccion'){
    pintarRegistroProduccionSector();
    return;
  }
  if(sector === 'cocina'){
    pintarRegistroCocinaSector();
    return;
  }
  cont.innerHTML = `<div class="empty">Todavía no tengo la planilla de este sector — pasámela y lo armamos.</div>`;
}

// Registrar producción — sector COCINA: por cada relleno que se cocina hoy,
// se muestran TODOS los ingredientes de su ficha técnica, y de TODOS se
// registra el bruto real usado (con su propio botón Guardar/Editar). A los
// que además tienen un rinde de referencia cargado se les puede cargar
// también el rinde REAL para comparar contra la ficha; los demás (sin rinde
// de referencia, ej. condimentos) solo llevan el bruto real, sin esa
// comparación — no hay contra qué compararlos. Si no se guarda nada para un
// ingrediente, se entiende que se usó el valor de la ficha (Cantidad/Rinde
// de Ref_RecetaDetalle). Arriba de todo se muestran las Ollas (lotes de 8 kg
// de carne cruda): los Preparados compartidos (Relleno Carne, Pollo Grille)
// en un bloque propio, y para cada relleno que arma sus ollas directo (sin
// pasar por un Preparado) el detalle aparece encima de su tabla de insumos.
async function pintarRegistroCocinaSector(){
  const cont = document.getElementById('contenidoRegistro');
  cont.innerHTML = `<p class="loading">Buscando fichas técnicas…</p>`;

  const fecha = document.getElementById('fechaRegistro').value;
  const cocina = (CALCULO_REGISTRO.cocina || []).filter(f => f.kilosDeRelleno > 0);
  if(cocina.length === 0){
    cont.innerHTML = `<div class="empty">Cocina no elabora ningún relleno el ${CALCULO_REGISTRO.dia.toLowerCase()}.</div>`;
    return;
  }

  const [recetas, ollasResp] = await Promise.all([
    obtenerRecetas(),
    fetch(`${APPS_SCRIPT_URL}?action=calcularOllas&fecha=${encodeURIComponent(fecha)}`).then(r => r.json()).catch(() => ({}))
  ]);
  const ollasData = (ollasResp && !ollasResp.error) ? ollasResp : { preparados: [], rellenos: [] };
  if(recetas.detalle.length === 0){
    cont.innerHTML = `
      <div class="empty">Todavía no importaste ninguna ficha técnica de Rellenos — sin eso no sé qué insumos controlar acá.</div>
      <div class="actions"><button class="btn secondary" onclick="irA('fichas')">Ir a Fichas técnicas</button></div>
    `;
    return;
  }

  cont.innerHTML = '';
  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = `${CALCULO_REGISTRO.dia}, ${fmtFecha(fecha)} — cargá el bruto real de cada insumo (y el rinde real cuando aplique) sobre el TOTAL de hoy; si no cargás nada, se toma el valor de la ficha.`;
  cont.appendChild(intro);

  if((ollasData.preparados || []).length){
    const hPrep = document.createElement('h4');
    hPrep.className = 'cat-heading';
    hPrep.textContent = 'Preparados en olla (8 kg) — resumen';
    cont.appendChild(hPrep);
    const tablaPrep = document.createElement('table');
    tablaPrep.className = 'prod';
    tablaPrep.innerHTML = `
      <thead><tr><th>Preparado</th><th class="num">Total</th><th class="num">Ollas</th></tr></thead>
      <tbody>${ollasData.preparados.map(o => `<tr><td><strong>${o.nombre}</strong></td><td class="num">${ent(o.kilos)} KG</td><td class="num"><strong>${o.ollas}</strong></td></tr>`).join('')}</tbody>`;
    cont.appendChild(tablaPrep);
  }

  // encuentra el rinde de una receta (Relleno o Preparado) EN KG, para poder
  // escalar su ficha del "un batch" al total que hace falta cocinar hoy.
  function rindeEnKG(nombreReceta){
    const cab = recetas.cabecera.find(r => normalizarFicha(r.Receta) === normalizarFicha(nombreReceta));
    if(!cab) return 0;
    if(normalizarFicha(cab.RindeUnidad) === 'KG') return Number(cab.RindeCantidad) || 0;
    if(normalizarFicha(cab.RindeUnidad2) === 'KG') return Number(cab.RindeCantidad2) || 0;
    return 0;
  }

  // Bloque de registro de UNA receta (Relleno o Preparado en olla): título
  // grande, referencia de ollas (colapsable, solo informativa) y la tabla de
  // insumos — TODOS escalados al total de HOY, no a los valores "de un
  // batch" que trae la ficha. El registro (Bruto real / Rinde real) es
  // siempre sobre ese total, nunca por olla.
  function bloqueRegistroReceta(nombreReceta, cantidadHoy, subtitulo, infoOllasHtml){
    const ingredientesReceta = recetas.detalle.filter(d => normalizarFicha(d.Receta) === normalizarFicha(nombreReceta));
    if(ingredientesReceta.length === 0) return false;

    const rinde = rindeEnKG(nombreReceta);
    const factor = rinde > 0 ? (cantidadHoy / rinde) : 1;

    const h = document.createElement('h4');
    h.className = 'cat-heading receta-heading';
    h.textContent = `${nombreReceta} — ${ent(cantidadHoy)} kg calculados hoy${subtitulo || ''}`;
    cont.appendChild(h);

    if(infoOllasHtml){
      const divOllas = document.createElement('div');
      divOllas.style.cssText = 'font-size:12.5px;color:var(--ink-soft);margin:2px 0 10px;';
      divOllas.innerHTML = infoOllasHtml;
      cont.appendChild(divOllas);
    }

    const wrap = document.createElement('div');
    wrap.style.overflowX = 'auto';
    const table = document.createElement('table');
    table.className = 'lotes traza';
    table.innerHTML = `
      <thead><tr>
        <th>Insumo</th>
        <th class="num">Bruto ficha (hoy)</th>
        <th class="num">Bruto real</th>
        <th class="num">Rinde ficha (hoy)</th>
        <th class="num">Rinde real</th>
        <th></th>
      </tr></thead>
      <tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    ingredientesReceta.forEach(ing => {
      const tieneRinde = ing.Rinde !== '' && ing.Rinde != null;
      const cantidadHoyIng = (Number(ing.Cantidad) || 0) * factor;
      const rindeHoyIng = tieneRinde ? (Number(ing.Rinde) || 0) * factor : null;
      const tr = document.createElement('tr');
      tr.dataset.relleno = nombreReceta;
      tr.dataset.ingrediente = ing.Ingrediente;
      tr.innerHTML = `
        <td>${ing.Ingrediente}</td>
        <td class="num" style="color:var(--ink-soft);">${ent(cantidadHoyIng)} ${ing.Medida || ''}</td>
        <td><input type="number" min="0" step="0.01" class="inp-bruto-real" style="width:90px;" placeholder="${ent(cantidadHoyIng)}"></td>
        <td class="num" style="color:var(--ink-soft);">${tieneRinde ? `${ent(rindeHoyIng)} ${ing.Medida || ''}` : `<span style="font-size:11px;">sin control de rinde</span>`}</td>
        <td>${tieneRinde ? `<input type="number" min="0" step="0.01" class="inp-rinde-real" style="width:90px;" placeholder="${ent(rindeHoyIng)}">` : ''}</td>
        <td style="white-space:nowrap;">
          <button type="button" class="btn secondary btn-guardar-item" style="font-size:12px;padding:5px 9px;">Guardar</button>
          <button type="button" class="btn secondary btn-editar-item" style="font-size:12px;padding:5px 9px;display:none;">Editar</button>
        </td>
      `;
      tr.querySelector('.btn-guardar-item').onclick = () => guardarItemCocina(tr, fecha);
      tr.querySelector('.btn-editar-item').onclick = () => habilitarEdicionFila(tr);
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    cont.appendChild(wrap);
    return true;
  }

  let algunBloque = false;

  // Preparados que se cocinan en olla (Relleno Carne, Pollo Grille): el
  // registro de insumos va sobre el TOTAL de ESE preparado — las ollas quedan
  // solo como referencia colapsable arriba de la tabla, no como el campo a
  // completar (eso ya lo pidió Carolina expresamente: "el registro tiene que
  // ser sobre el total, con una solapita para ver por olla si hace falta").
  (ollasData.preparados || []).forEach(o => {
    const infoOllasHtml = `<strong>Referencia:</strong> hoy arma ${o.ollas} olla(s) de este preparado (una olla completa son 8 kg) — el registro de insumos de abajo es sobre el TOTAL de hoy, no por olla.` + bloqueGramajeOllas([o]);
    if(bloqueRegistroReceta(o.nombre, o.kilos, ` — Preparado (lo usan: ${(o.usan || []).join(', ')})`, infoOllasHtml)) algunBloque = true;
  });

  // Rellenos que se cocinan hoy
  cocina.forEach(f => {
    const infoOllas = (ollasData.rellenos || []).find(o => o.nombre === f.relleno);
    const infoOllasHtml = infoOllas
      ? `<strong>Referencia:</strong> hoy arma ${infoOllas.ollas} olla(s) (usa ${ent(infoOllas.kilosNecesarios)} kg de ${infoOllas.ingredienteClave} — una olla completa son 8 kg) — el registro de insumos de abajo es sobre el TOTAL de hoy, no por olla.` + bloqueGramajeOllas([infoOllas])
      : '';
    if(bloqueRegistroReceta(f.relleno, f.kilosDeRelleno, '', infoOllasHtml)) algunBloque = true;
  });

  if(!algunBloque){
    cont.innerHTML += `<div class="empty" style="margin-top:14px;">No encontré la ficha técnica de ninguno de los rellenos de hoy.</div>`;
  }
}

async function guardarItemCocina(tr, fecha){
  const btn = tr.querySelector('.btn-guardar-item');
  const inputBruto = tr.querySelector('.inp-bruto-real');
  const inputRinde = tr.querySelector('.inp-rinde-real');
  const cantidadBrutoReal = inputBruto ? inputBruto.value : '';
  const rindeReal = inputRinde ? inputRinde.value : '';
  if(!cantidadBrutoReal && !rindeReal){
    alert('Cargá el bruto real antes de guardar.');
    return;
  }
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'registrarTrazabilidadCocinaItem',
        fecha, relleno: tr.dataset.relleno, ingrediente: tr.dataset.ingrediente,
        cantidadBrutoReal, rindeReal
      })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    tr.classList.add('fila-guardada');
    [...tr.querySelectorAll('input')].forEach(el => el.disabled = true);
    btn.textContent = '✓ Guardado'; btn.style.display = 'none';
    const btnEditar = tr.querySelector('.btn-editar-item');
    if(btnEditar) btnEditar.style.display = '';
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar: ' + err.message);
  }
}

// arma el objeto "item" de un sabor a partir de su fila en la tabla. La
// celda de "máquina" puede ser el desplegable de Máquina Nº (sabores
// normales) o el de Responsable (Canastas) — nunca los dos a la vez.
function leerFilaSabor(tr){
  const maq = tr.querySelector('.inp-maq-num');
  const resp = tr.querySelector('.inp-responsable-canasta');
  return {
    sabor: tr.dataset.sabor,
    maquinaNumero: maq ? maq.value : '',
    responsable: resp ? resp.value : '',
    maquinaVelocidad: tr.querySelector('.inp-maq-vel').value,
    discosLote: tr.querySelector('.inp-disco-lote').value,
    pesoPromTandaDiscos: tr.querySelector('.inp-peso-prom').value,
    rellenoFecha: tr.querySelector('.inp-relleno-fecha').value,
    pesoInicialRelleno: tr.querySelector('.inp-peso-inicial').value,
    pesoFinalRelleno: tr.querySelector('.inp-peso-final').value,
    horaInicio: tr.querySelector('.inp-hora-inicio').value,
    horaFin: tr.querySelector('.inp-hora-fin').value,
    totalProduccion: tr.querySelector('.inp-total-prod').value,
    discosDanados: tr.querySelector('.inp-discos-danados').value
  };
}

// re-habilita una fila ya guardada (Producción o Cocina) para corregirla —
// al volver a tocar "Guardar" se pisa la misma fila en la planilla, no se
// duplica (ver upsertFila en Code.gs).
function habilitarEdicionFila(tr){
  tr.classList.remove('fila-guardada');
  [...tr.querySelectorAll('input,select')].forEach(el => el.disabled = false);
  const btnGuardar = tr.querySelector('.btn-guardar-item');
  if(btnGuardar){ btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar'; btnGuardar.style.display = ''; }
  const btnEditar = tr.querySelector('.btn-editar-item');
  if(btnEditar) btnEditar.style.display = 'none';
}

// "preguardar" un sabor apenas se termina, sin esperar al cierre del turno.
async function guardarItemTrazabilidad(tr){
  const fecha = document.getElementById('fechaRegistro').value;
  const item = leerFilaSabor(tr);
  if(!item.totalProduccion || Number(item.totalProduccion) <= 0){
    alert('Cargá el total producido de este sabor antes de guardarlo.');
    return;
  }
  const btn = tr.querySelector('.btn-guardar-item');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registrarTrazabilidadItem', fecha, item })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    tr.classList.add('fila-guardada');
    [...tr.querySelectorAll('input,select')].forEach(el => el.disabled = true);
    btn.textContent = '✓ Guardado'; btn.style.display = 'none';
    const btnEditar = tr.querySelector('.btn-editar-item');
    if(btnEditar) btnEditar.style.display = '';
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar este sabor: ' + err.message);
  }
}

// cierre del turno: guarda los puestos + observaciones (una vez), y de paso
// cualquier sabor que haya quedado sin guardar con su botón individual.
async function guardarRegistroProduccion(){
  const fecha = document.getElementById('fechaRegistro').value;
  const msg = document.getElementById('msgRegistro');

  const leerMaquina = (idBase) => {
    const table = document.querySelector(`table.lotes[data-maquina="${idBase}"]`);
    const get = (p) => table.querySelector(`.inp-puesto[data-puesto="${p}"]`).value.trim();
    return { entrada: get('entrada'), relleno: get('relleno'), salida: get('salida') };
  };
  const maquina1 = leerMaquina('m1');
  const maquina2 = leerMaquina('m2');
  const observaciones = document.getElementById('inpObservacionesRegistro').value.trim();

  // solo los sabores que NO se guardaron ya individualmente durante el turno
  const filas = [...document.querySelectorAll('table.traza tbody tr[data-sabor]:not(.fila-guardada)')];
  const items = filas.map(leerFilaSabor)
    .filter(it => it.totalProduccion && Number(it.totalProduccion) > 0);

  const btn = document.getElementById('btnGuardarRegistro');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registrarTrazabilidadProduccion', fecha, maquina1, maquina2, observaciones, items })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    filas.forEach(tr => {
      if(Number(tr.querySelector('.inp-total-prod').value) > 0){
        tr.classList.add('fila-guardada');
        [...tr.querySelectorAll('input,select')].forEach(el => el.disabled = true);
        const btnG = tr.querySelector('.btn-guardar-item');
        btnG.textContent = '✓ Guardado'; btnG.style.display = 'none';
        const btnE = tr.querySelector('.btn-editar-item');
        if(btnE) btnE.style.display = '';
      }
    });
    msg.className = 'msg ok';
    msg.textContent = `Turno cerrado. ${data.filas_detalle} sabor(es) más quedaron guardados.`;
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'No se pudo guardar: ' + err.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Guardar registro final del turno';
  }
}

      Están listados todos los productos, igual que en "Cargar stock" — completá "Enviado (real)" y
      vencimiento solo en lo que mandás hoy. La columna "Orden calculada" es de referencia (venta
      proyectada de ese local menos lo que ya tiene cargado). Si un mismo producto sale con más de un
      vencimiento, usá el botón <strong>+</strong> de esa fila para agregar otra línea.
    </p>

    <div class="msg" id="msgEnvios"></div>

async function cargarEnvios(){
  const fecha = document.getElementById('fechaEnvios').value;
  const cont = document.getElementById('contenidoEnvios');
  cont.className = 'loading'; cont.textContent = 'Calculando…';
  document.getElementById('tabsEnvios').style.display = 'none';
  const msg = document.getElementById('msgEnvios');
  msg.className = 'msg'; msg.textContent = '';

  try{
    const [r, categorias, empleados] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularEnvios&fecha=${fecha}`),
      obtenerCategorias(),
      obtenerEmpleados()
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);

    document.getElementById('inpResponsableEnvio').innerHTML = opcionesEmpleados(empleados);
    document.getElementById('inpRepartidorEnvio').innerHTML = opcionesEmpleados(empleados);
    document.getElementById('inpAcompananteEnvio').innerHTML = opcionesEmpleados(empleados);

    const tabs = document.getElementById('tabsEnvios');
    tabs.style.display = 'flex';
    tabs.innerHTML = LOCALES_VENTA.map(l => `<button class="tab-btn ${l===TAB_ENVIO_ACTIVO?'active':''}" data-local="${l}">${l}</button>`).join('');
    [...tabs.querySelectorAll('.tab-btn')].forEach(b => {
      b.onclick = () => {
        TAB_ENVIO_ACTIVO = b.dataset.local;
        [...tabs.querySelectorAll('.tab-btn')].forEach(x => x.classList.toggle('active', x.dataset.local === TAB_ENVIO_ACTIVO));
        [...document.querySelectorAll('.panel-envio-local')].forEach(p => p.style.display = (p.dataset.local === TAB_ENVIO_ACTIVO ? '' : 'none'));
      };
    });

    cont.className = '';
    cont.innerHTML = '';
    LOCALES_VENTA.forEach(local => {
      cont.appendChild(pintarEnvioLocal(local, data.envios[local] || [], data, categorias));
    });
    [...document.querySelectorAll('.panel-envio-local')].forEach(p => p.style.display = (p.dataset.local === TAB_ENVIO_ACTIVO ? '' : 'none'));

    LOCALES_VENTA.forEach(local => {
      const btn = document.getElementById(`btnGuardarEnvio-${cssId(local)}`);
      if(btn) btn.onclick = () => guardarEnvio(local, fecha);
      const btnImprimir = document.getElementById(`btnImprimirEnvio-${cssId(local)}`);
      if(btnImprimir) btnImprimir.onclick = () => imprimirOrdenEnvio(local, fecha);
    });
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo calcular: ${err.message}</div>`;
  }
}

// una fila por producto (todos, siempre visibles); el botón "+" agrega otra
// fila del MISMO producto para cargar un segundo lote con otro vencimiento —
// mismo patrón que "Cargar stock". Cada fila tiene su propio Guardar/Editar,
// igual que en Registrar producción.
function filaEnvio(nombre, ordenCalculada, esExtra, local, fecha){
  const tr = document.createElement('tr');
  tr.dataset.item = nombre;
  // la orden calculada se guarda en la fila base (no en los "otro lote") para
  // poder imprimir con este valor cuando todavía no se cargó nada a mano.
  tr.dataset.orden = esExtra ? 0 : (ordenCalculada || 0);
  tr.innerHTML = `
    <td>${esExtra ? `<span class="item-extra">↳ otro lote</span>` : nombre}</td>
    <td class="num" style="color:var(--ink-soft);">${esExtra ? '' : ent(ordenCalculada)}</td>
    <td><input type="number" min="0" step="1" class="inp-cant" placeholder="0"></td>
    <td><input type="date" class="inp-venc"></td>
    <td class="col-add">${esExtra ? '' : '<button type="button" class="add-lote-btn" title="Agregar otro vencimiento para este producto">+</button>'}</td>
    <td class="col-del">${esExtra ? '<button type="button" class="del-btn" title="Quitar">✕</button>' : ''}</td>
    <td style="white-space:nowrap;">
      <button type="button" class="btn secondary btn-guardar-item" style="font-size:12px;padding:5px 9px;">Guardar</button>
      <button type="button" class="btn secondary btn-editar-item" style="font-size:12px;padding:5px 9px;display:none;">Editar</button>
    </td>
  `;
  if(esExtra){
    tr.querySelector('.del-btn').onclick = () => tr.remove();
  } else {
    tr.querySelector('.add-lote-btn').onclick = () => {
      tr.insertAdjacentElement('afterend', filaEnvio(nombre, ordenCalculada, true, local, fecha));
    };
  }
  tr.querySelector('.btn-guardar-item').onclick = () => guardarItemEnvio(tr, local, fecha);
  tr.querySelector('.btn-editar-item').onclick = () => habilitarEdicionFila(tr);
  return tr;
}

function tablaEnvioDe(items, porSabor, local, fecha){
  const table = document.createElement('table');
  table.className = 'lotes';
  table.innerHTML = `
    <thead><tr>
      <th>Sabor / ítem</th>
      <th class="col-cant">Orden calculada</th>
      <th class="col-cant">Enviado (real)</th>
      <th class="col-venc">Vencimiento</th>
      <th class="col-add"></th>
      <th class="col-del"></th>
      <th></th>
    </tr></thead>
    <tbody></tbody>`;
  const tbody = table.querySelector('tbody');
  items.forEach(nombre => {
    const orden = (porSabor[nombre] && porSabor[nombre].aHacerUnidades) || 0;
    tbody.appendChild(filaEnvio(nombre, orden, false, local, fecha));
  });
  return table;
}

function pintarEnvioLocal(local, itemsCalculados, data, categorias){
  const id = cssId(local);

// lee los 3 campos compartidos del despacho (responsable, repartidor,
// acompañante) — los pide tanto el guardado por fila como el final.
function datosComunesEnvio(){
  return {
    responsable: document.getElementById('inpResponsableEnvio').value.trim(),
    repartidor: document.getElementById('inpRepartidorEnvio').value.trim(),
    acompanante: document.getElementById('inpAcompananteEnvio').value.trim()
  };
}

// "preguardar" un producto/lote apenas se carga, sin esperar a terminar
// todo el despacho de ese local.
async function guardarItemEnvio(tr, local, fecha){
  const { responsable, repartidor, acompanante } = datosComunesEnvio();
  if(!responsable){
    alert('Indicá quién está despachando este envío antes de guardar (arriba de la lista de productos).');
    return;
  }
  const cantidad = tr.querySelector('.inp-cant').value;
  const vencimiento = tr.querySelector('.inp-venc').value;
  if(!cantidad || Number(cantidad) <= 0 || !vencimiento){
    alert('Cargá cantidad y vencimiento de este producto antes de guardarlo.');
    return;
  }
  const item = { sabor: tr.dataset.item, cantidad, vencimiento };
  const btn = tr.querySelector('.btn-guardar-item');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registrarEnvio', local, fecha, responsable, repartidor, acompanante, items: [item] })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    tr.classList.add('fila-guardada');
    [...tr.querySelectorAll('input')].forEach(el => el.disabled = true);
    btn.textContent = '✓ Guardado'; btn.style.display = 'none';
    const btnEditar = tr.querySelector('.btn-editar-item');
    if(btnEditar) btnEditar.style.display = '';
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar este producto: ' + err.message);
  }
}

// "Guardar despacho a [local]": guarda de una sola vez todo lo que haya
// quedado sin guardar individualmente con su propio botón.
async function guardarEnvio(local, fecha){
  const { responsable, repartidor, acompanante } = datosComunesEnvio();
  const msg = document.getElementById('msgEnvios');
  if(!responsable){
    msg.className = 'msg err'; msg.textContent = 'Indicá quién está despachando este envío.'; return;
  }
  const panel = document.querySelector(`.panel-envio-local[data-local="${local}"]`);
  const filas = [...panel.querySelectorAll('tr[data-item]:not(.fila-guardada)')];
  const items = filas.map(tr => ({
    sabor: tr.dataset.item,
    cantidad: tr.querySelector('.inp-cant').value,
    vencimiento: tr.querySelector('.inp-venc').value
  })).filter(it => it.cantidad && Number(it.cantidad) > 0 && it.vencimiento);

  if(items.length === 0){
    msg.className = 'msg err'; msg.textContent = 'Cargá cantidad y vencimiento de al menos un producto (los que ya guardaste con su propio botón no hace falta repetirlos).'; return;
  }
  const btn = document.getElementById(`btnGuardarEnvio-${cssId(local)}`);
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registrarEnvio', local, fecha, responsable, repartidor, acompanante, items })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    filas.forEach(tr => {
      if(Number(tr.querySelector('.inp-cant').value) > 0 && tr.querySelector('.inp-venc').value){
        tr.classList.add('fila-guardada');
        [...tr.querySelectorAll('input')].forEach(el => el.disabled = true);
        const btnG = tr.querySelector('.btn-guardar-item');
        btnG.textContent = '✓ Guardado'; btnG.style.display = 'none';
        const btnE = tr.querySelector('.btn-editar-item');
        if(btnE) btnE.style.display = '';
      }
    });
    msg.className = 'msg ok';
    msg.textContent = `Despacho guardado: ${data.envios_guardados} producto(s) más enviados a ${local}.`;
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'No se pudo guardar: ' + err.message;
  }finally{
    btn.disabled = false; btn.textContent = `Guardar despacho a ${local}`;
  }
}

// Arma una hoja de "Orden de envío" imprimible para UN local. Si ya cargaron
// cantidad a mano, imprime eso; si no (todavía no tiene tablet a mano quien
// prepara el pedido), imprime la orden CALCULADA, así sirve de planilla en
// papel para armar el envío y cargarlo después. Se salta cualquier producto
// sin nada (ni cargado ni calculado) y la categoría entera si ninguno de sus
// productos tiene algo para enviar.
function imprimirOrdenEnvio(local, fecha){
  const panel = document.querySelector(`.panel-envio-local[data-local="${local}"]`);
  const filas = [...panel.querySelectorAll('tr[data-item]')];
  const porSabor = {};
  filas.forEach(tr => {
    const nombre = tr.dataset.item;
    const cantidadReal = Number(tr.querySelector('.inp-cant').value) || 0;
    const venc = tr.querySelector('.inp-venc').value;
    if(!porSabor[nombre]){
      porSabor[nombre] = { ordenCalculada: Number(tr.dataset.orden) || 0, cantidadReal: 0, vencimiento: '' };
    }
    porSabor[nombre].cantidadReal += cantidadReal;
    if(!porSabor[nombre].vencimiento && venc) porSabor[nombre].vencimiento = venc;
  });
  Object.keys(porSabor).forEach(n => {
    const it = porSabor[n];
    it.cantidadImprimir = it.cantidadReal > 0 ? it.cantidadReal : it.ordenCalculada;
  });

  const hayAlgo = Object.keys(porSabor).some(n => porSabor[n].cantidadImprimir > 0);
  if(!hayAlgo){
    alert(`No hay nada para enviar a ${local} hoy (ni cargado ni calculado).`);
    return;
  }

  const categorias = SABORES_CACHE || {};
  let filasHtml = '';
  Object.keys(categorias).forEach(cat => {
    const nombres = categorias[cat].filter(n => porSabor[n] && porSabor[n].cantidadImprimir > 0);
    if(nombres.length === 0) return; // sin nada que enviar en esta categoría: no se imprime
    filasHtml += `
      <h3>${cat}</h3>
      <table class="print-tabla">
        <thead><tr><th>Sabor / ítem</th><th class="num">Cantidad</th><th>Vencimiento</th></tr></thead>
        <tbody>
          ${nombres.map(n => `
            <tr>
              <td>${n}</td>
              <td class="num">${ent(porSabor[n].cantidadImprimir)}</td>
              <td>${porSabor[n].vencimiento ? fmtFecha(porSabor[n].vencimiento) : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  });

  let area = document.getElementById('printAreaEnvio');
  if(!area){
    area = document.createElement('div');
    area.id = 'printAreaEnvio';
    document.body.appendChild(area);
  }
  area.innerHTML = `
    <h1>Orden de envío</h1>
    <p class="print-sub">${local} — ${fmtFecha(fecha)}</p>
    ${filasHtml}
  `;

  document.body.classList.add('print-envio');
  window.print();
  document.body.classList.remove('print-envio');
}
