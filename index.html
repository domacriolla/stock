<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de Locales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F4EDE1;
    --surface:#FFFDF9;
    --surface-alt:#F1E5D2;
    --border:#E1D0B4;
    --border-strong:#C9AF88;
    --ink:#311B10;
    --ink-soft:#6E5645;
    --ink-faint:#A6907A;
    --accent:#65341A;
    --accent-ink:#FFFFFF;
    --accent-soft:#EFDCBE;
    --accent-soft-ink:#65341A;
    --danger:#A83A2C;
    --danger-soft:#F2DAD3;
    --danger-ink:#7A2A1F;
    --success:#4C7A43;
    --success-soft:#DDEAD4;
    --success-ink:#345C2C;
    --pending:#B06B1C;
    --pending-soft:#F3DFB8;
    --pending-ink:#7A4B12;
    --shadow: 0 1px 2px rgba(43,38,33,0.06), 0 4px 14px rgba(43,38,33,0.06);
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1E120A; --surface:#2A1B10; --surface-alt:#332318; --border:#4A3624; --border-strong:#5E4630;
      --ink:#F3E6D3; --ink-soft:#C7AE93; --ink-faint:#93795F;
      --accent:#E2954E; --accent-ink:#241604; --accent-soft:#4A3419; --accent-soft-ink:#F3D9AF;
      --danger:#E08573; --danger-soft:#432421; --danger-ink:#F2C6BC;
      --success:#8FC183; --success-soft:#25331F; --success-ink:#C7E4BC;
      --pending:#E0AA5A; --pending-soft:#40300F; --pending-ink:#F2D89F;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; background:var(--bg); }
  body{
    color:var(--ink);
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 16px 80px; }
  h1,h2,h3{ font-family:'Cinzel','Poppins',serif; margin:0; letter-spacing:.01em; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:16px 16px 0;
    border-bottom:1px solid var(--border);
  }
  header.top .head-row{
    max-width:760px; margin:0 auto;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding-bottom:12px;
  }
  header.top h1{ font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  header.top .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  header.top .refresh{
    background:none; border:1px solid var(--border-strong); border-radius:99px;
    color:var(--ink-soft); font-size:12px; font-weight:600; padding:6px 12px; cursor:pointer;
    font-family:'Poppins',sans-serif; display:flex; align-items:center; gap:5px;
  }
  nav.tabs{ max-width:760px; margin:0 auto; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    appearance:none; border:none; background:none;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px;
    color:var(--ink-soft); padding:10px 12px 12px; cursor:pointer;
    border-bottom:2.5px solid transparent; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  nav.tabs button.active{ color:var(--ink); border-bottom-color:var(--accent); }
  nav.tabs button .count{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    background:var(--pending-soft); color:var(--pending-ink);
    border-radius:99px; padding:1px 6px; min-width:16px; text-align:center;
  }

  main{ padding-top:18px; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; }
  .panel-head{ padding:14px 16px; border-bottom:1px dashed var(--border-strong); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .panel-head h3{ font-size:14.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--ink-soft); }
  .panel-body{ padding:14px 16px; }

  label.field{ display:block; margin-bottom:12px; }
  label.field .lbl{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=password], input[type=date], select, textarea{
    width:100%; font-family:'Poppins',sans-serif; font-size:15px;
    padding:10px 11px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface-alt); color:var(--ink); min-height:42px;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=date]:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .user-box{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:480px){ .row2{ grid-template-columns:1fr; } }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:14px;
    padding:11px 18px; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:44px;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--border-strong); }
  .btn-sm{ padding:7px 11px; min-height:34px; font-size:12.5px; }
  .btn-block{ width:100%; }

  .cat-block{ border-top:1px dashed var(--border-strong); }
  .cat-block:first-child{ border-top:none; }
  .cat-title{ padding:12px 16px 4px; font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-soft-ink); background:var(--accent-soft); }
  .item-row{ display:flex; align-items:center; gap:10px; padding:8px 16px; border-top:1px solid var(--border); }
  .item-row:first-of-type{ border-top:none; }
  .item-name{ flex:1; font-size:14px; line-height:1.3; }
  .item-name .tag-extra{ font-size:10px; font-weight:700; color:var(--success-ink); background:var(--success-soft); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  input[type=text].qty-input{ width:54px; flex:none; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; padding:8px 4px; min-height:38px; }
  .rm-btn{ flex:none; width:30px; height:30px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--danger); cursor:pointer; font-size:15px; line-height:1; }

  .extra-add{ display:flex; gap:8px; padding:10px 16px 14px; }
  .extra-add input[type=text]{ flex:1; }
  .extra-add input[type=text].qty-input{ width:54px; }

  .badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .badge-pending{ background:var(--pending-soft); color:var(--pending-ink); }
  .badge-sent{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .badge-closed{ background:var(--success-soft); color:var(--success-ink); }
  .badge-rejected{ background:var(--danger-soft); color:var(--danger-ink); }
  .idr-readonly{ font-size:13px; color:var(--ink-soft); padding:2px 0; }
  .idr-readonly b{ color:var(--ink); font-weight:600; }

  .filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); }
  .filters select{ width:auto; min-height:36px; padding:6px 10px; font-size:13px; }
  .filters .btn{ margin-left:auto; }

  .order-card{ padding:13px 16px; border-top:1px solid var(--border); display:flex; align-items:center; gap:12px; cursor:pointer; }
  .order-card:first-child{ border-top:none; }
  .order-card:hover{ background:var(--surface-alt); }
  .order-card .oc-main{ flex:1; min-width:0; }
  .order-card .oc-local{ font-family:'Cinzel',serif; font-weight:700; font-size:14.5px; }
  .order-card .oc-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .order-card .oc-arrow{ color:var(--ink-faint); font-size:16px; }

  .empty{ padding:34px 16px; text-align:center; color:var(--ink-soft); font-size:14px; }
  .empty .big{ font-size:26px; margin-bottom:6px; }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:600;
    padding:11px 18px; border-radius:99px; box-shadow:var(--shadow);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .detail-head{ padding:14px 16px; border-bottom:1px dashed var(--border-strong); }
  .detail-head .back{ background:none; border:none; color:var(--ink-soft); font-family:'Poppins',sans-serif; font-size:13px; cursor:pointer; padding:0 0 10px; display:flex; align-items:center; gap:4px; }
  .detail-grid{ display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; color:var(--ink-soft); }
  .detail-grid b{ color:var(--ink); font-weight:600; }

  .item-detail-row{ padding:11px 16px; border-top:1px solid var(--border); }
  .item-detail-row:first-of-type{ border-top:none; }
  .item-detail-row .idr-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .item-detail-row .idr-name{ flex:1; font-size:14px; }
  .item-detail-row .idr-pedido{ font-size:12px; color:var(--ink-soft); }
  .item-detail-row.st-enviado{ background:var(--success-soft); }
  .item-detail-row.st-no_enviado{ background:var(--danger-soft); }
  .idr-controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .idr-controls .qty-input{ min-height:38px; }
  .chk{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .chk input{ width:16px; height:16px; }
  .idr-motivo{ margin-top:8px; display:grid; grid-template-columns:1fr auto; gap:8px; }
  .idr-motivo input[type=text]{ font-size:13px; }
  .idr-motivo input[type=date]{ font-size:13px; width:150px; }
  @media (max-width:480px){ .idr-motivo{ grid-template-columns:1fr; } .idr-motivo input[type=date]{ width:100%; } }

  .save-bar{ position:sticky; bottom:0; background:var(--bg); padding:12px 0 4px; border-top:1px solid var(--border); display:flex; gap:10px; }

  .catalog-item{ display:flex; align-items:center; gap:10px; padding:7px 16px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .catalog-item:first-of-type{ border-top:none; }
  .catalog-item .ci-name{ flex:1; font-size:14px; min-width:120px; }
  .catalog-item .ci-controls{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  select.ci-cat-select{ width:auto; min-height:30px; padding:4px 6px; font-size:12px; }
  .catalog-add{ display:flex; gap:8px; padding:10px 16px 14px; }
  .catalog-add input{ flex:1; }

  .banner{ background:var(--accent-soft); color:var(--accent-soft-ink); border-radius:var(--radius); padding:11px 14px; font-size:13px; margin-bottom:14px; border:1px solid var(--border-strong); }
  .success-screen{ padding:40px 20px; text-align:center; }
  .success-screen .big{ font-size:34px; margin-bottom:10px; }
  .success-screen h2{ font-size:18px; margin-bottom:6px; }
  .success-screen p{ color:var(--ink-soft); font-size:14px; margin:0 0 20px; }

  ::selection{ background:var(--accent-soft); }

  .print-sheet{ display:none; }
  @media print{
    body > *:not(.print-sheet){ display:none !important; }
    .print-sheet{ display:block !important; padding:10px; color:#111; font-family:'Poppins',sans-serif; }
    .print-sheet h1{ font-size:18px; margin:0 0 6px; font-family:'Cinzel',serif; }
    .print-sheet .ps-meta{ font-size:12.5px; color:#333; margin-bottom:4px; }
    .print-sheet .ps-cat{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:16px 0 4px; border-bottom:1px solid #999; padding-bottom:3px; }
    .print-sheet .ps-item{ display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px; border-bottom:1px dotted #ccc; }
    .print-sheet .ps-check{ width:13px; height:13px; border:1.4px solid #333; flex:none; }
    .print-sheet .ps-name{ flex:1; }
    .print-sheet .ps-qty{ font-weight:700; font-family:'IBM Plex Mono',monospace; min-width:30px; text-align:right; }
  }

  /* ---------- 05/11: avisos, ayudas, diálogos ---------- */
  .req{ color:var(--danger); font-weight:700; }
  .banner-warn{ background:var(--pending-soft); color:var(--pending-ink); border-color:var(--pending); }
  .banner-danger{ background:var(--danger-soft); color:var(--danger-ink); border-color:var(--danger); }
  .banner-ok{ background:var(--success-soft); color:var(--success-ink); border-color:var(--success); }
  .banner .b-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .banner .b-actions .btn{ background:var(--surface); }
  .badge-draft{ background:var(--surface-alt); color:var(--ink-soft); border:1px dashed var(--border-strong); }
  .chip-tipo{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--surface-alt); color:var(--ink-soft); border:1px solid var(--border); margin-left:6px; vertical-align:middle; font-family:'Poppins',sans-serif; }
  .chip-tipo.ing{ background:var(--success-soft); color:var(--success-ink); border-color:var(--success); }
  .oc-warn{ color:var(--danger); font-weight:600; }
  .tip{ appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-soft); width:19px; height:19px; border-radius:50%; font-size:11px; font-weight:700; font-family:'IBM Plex Mono',monospace; line-height:1; padding:0; cursor:pointer; vertical-align:middle; margin-left:5px; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  #tipBox{ position:fixed; z-index:60; max-width:280px; background:var(--ink); color:var(--bg); font-size:12.5px; line-height:1.45; padding:9px 12px; border-radius:8px; box-shadow:var(--shadow); display:none; }
  .seg{ display:flex; gap:0; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; }
  .seg button{ flex:1; appearance:none; border:none; background:var(--surface-alt); color:var(--ink-soft); font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; padding:10px; cursor:pointer; min-height:42px; }
  .seg button.on{ background:var(--accent); color:var(--accent-ink); }
  .group-title{ font-family:'Cinzel',serif; font-size:15px; font-weight:700; margin:20px 2px 10px; color:var(--ink); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn-row .btn{ flex:1; }
  .head-actions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .btn-danger-txt{ color:var(--danger) !important; }
  .item-detail-row.st-falta{ background:var(--pending-soft); box-shadow:inset 4px 0 0 var(--danger); }
  .item-row.st-falta{ background:var(--pending-soft); box-shadow:inset 4px 0 0 var(--danger); }
  .progreso{ font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; }
  .progreso b{ color:var(--ink); }
  .dif{ font-size:11.5px; font-weight:700; color:var(--danger); }
  details.historial{ padding:12px 16px; border-top:1px dashed var(--border-strong); font-size:12.5px; color:var(--ink-soft); }
  details.historial summary{ cursor:pointer; font-weight:600; }
  details.historial div{ padding:3px 0; border-bottom:1px dotted var(--border); }
  .dlg-ov{ position:fixed; inset:0; background:rgba(20,12,6,.45); z-index:70; display:flex; align-items:center; justify-content:center; padding:16px; }
  .dlg{ background:var(--surface); color:var(--ink); border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.25); width:100%; max-width:440px; max-height:90vh; overflow:auto; padding:18px 18px 14px; }
  .dlg h3{ font-size:16px; margin-bottom:10px; }
  .dlg .dlg-txt{ font-size:13.5px; line-height:1.5; margin-bottom:12px; }
  .dlg .dlg-txt ul{ margin:6px 0 0; padding-left:18px; }
  .dlg .dlg-err{ color:var(--danger); font-size:12.5px; font-weight:600; min-height:0; margin:-4px 0 8px; }
  .dlg .dlg-btns{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .dlg .dlg-btns .btn{ flex:1; min-width:120px; }
  .btn-danger{ background:var(--danger); color:#fff; }
</style>
</head>
<body>

<header class="top">
  <div class="head-row">
    <div>
      <h1>Pedidos de Locales</h1>
    </div>
    <div class="user-box">
      <button class="refresh" id="refreshBtn" type="button">⟳ Actualizar</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="nuevo">Nuevo pedido</button>
    <button data-tab="pedidos">Pedidos y envíos <span class="count" id="pendingCount" style="display:none">0</span></button>
    <button data-tab="catalogo">Catálogo</button>
  </nav>
</header>

<div class="wrap">
  <main id="main">
    <div class="empty"><div class="big">🧾</div>Cargando…</div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="print-sheet" id="printSheet"></div>
<div id="tipBox"></div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     PEDIDOS DE INSUMOS E INGREDIENTES — versión 05/11/2026
     Flujo: el local arma el pedido (guardado provisorio o enviar final) →
     fábrica prepara el envío (provisorio o enviar final) → el local confirma
     lo que recibió (provisorio o confirmar final). Cada etapa se puede
     reabrir. Quién hace cada acción es obligatorio.
     ===================================================================== */

  var TIPOS = [
    {key:"INSUMOS", label:"Insumos"},
    {key:"INGREDIENTES", label:"Ingredientes"}
  ];
  var TIPO_LABEL = {};
  TIPOS.forEach(function(t){ TIPO_LABEL[t.key]=t.label; });

  var CATEGORIES = [
    {key:"LIMPIEZA", label:"Limpieza", tipo:"INSUMOS"},
    {key:"LIBRERIA", label:"Librería", tipo:"INSUMOS"},
    {key:"FARMACIA", label:"Farmacia", tipo:"INSUMOS"},
    {key:"IMPRESIONES", label:"Impresiones", tipo:"INSUMOS"},
    {key:"PACKAGING", label:"Packaging", tipo:"INSUMOS"},
    {key:"INGREDIENTES", label:"Ingredientes", tipo:"INGREDIENTES"}
  ];
  var CAT_LABEL = {}, CAT_TIPO = {};
  CATEGORIES.forEach(function(c){ CAT_LABEL[c.key]=c.label; CAT_TIPO[c.key]=c.tipo; });
  function catsDeTipo(t){ return CATEGORIES.filter(function(c){ return c.tipo===t; }); }

  var LOCALES = [
    {key:"CENTRO", label:"Local Centro"},
    {key:"PATAGONIA", label:"Local Patagonia"},
    {key:"ZELARRAYAN", label:"Local Zelarrayán"}
  ];
  var LOCAL_LABEL = {};
  LOCALES.forEach(function(l){ LOCAL_LABEL[l.key]=l.label; });

  // Pedidos sin cerrar con fecha de hace más de estos días se marcan como viejos.
  var DIAS_VIEJO = 7;
  // Los ítems "para más tarde" se avisan y se cuentan solo de pedidos de los últimos días
  // (en el detalle del pedido se ven siempre, con «Ya se mandó» / «Ya no se manda»).
  var DIAS_POR_MANDAR = 30;

  // URL de la implementación de Apps Script (termina en /exec).
  var API_URL = "https://script.google.com/macros/s/AKfycbw9tFfl_MMsORMq5-4iORIYeCZVagJuhkG0ODPs-upTVvOD60GPldXMr85p3ChT51D_/exec";

  var catalogItems = [];
  var pedidos = [];
  var loaded = false;
  var POLL_MS = 20000;

  var state = {
    tab: "nuevo",
    detailId: null,
    newOrderForm: null,
    editForm: null,
    filterEstado: "pendiente",
    filterLocal: "TODOS",
    filterTipo: "TODOS",
    adminUnlocked: false,
    busy: false
  };

  var ESTADO_INFO = {
    borrador:  {cls:"badge-draft",    label:"Guardado sin enviar",  tip:"El local lo guardó (o lo reabrió para agregar cosas) y todavía no lo envió a fábrica. Fábrica no lo puede preparar hasta que el local toque «Guardar y enviar final»."},
    pendiente: {cls:"badge-pending",  label:"Pendiente",            tip:"El local lo envió. Fábrica tiene que cargar qué manda de cada ítem y tocar «Guardar y enviar final»."},
    enviado:   {cls:"badge-sent",     label:"Esperando recepción",  tip:"Fábrica lo envió. El local tiene que cargar qué le llegó de cada ítem y tocar «Confirmar recepción final»."},
    cerrado:   {cls:"badge-closed",   label:"Cerrado",              tip:"El local confirmó lo que recibió. Si algo quedó «para más tarde», sigue a la vista hasta que fábrica lo mande."},
    rechazado: {cls:"badge-rejected", label:"Rechazado",            tip:"Se descartó (por ejemplo, un pedido duplicado). No se envía nada."}
  };
  function estadoInfo(e){ return ESTADO_INFO[e] || ESTADO_INFO.pendiente; }

  /* ---------- servidor ---------- */
  function apiConfigured(){ return API_URL && API_URL.indexOf("PEGAR_ACA") === -1; }

  // Todo viaja por GET (incluso guardar): Apps Script redirige sus respuestas
  // y ese redirect descarta el "body" de un POST hecho desde GitHub Pages.
  function callServer(action, payload){
    if(!apiConfigured()) return Promise.reject(new Error("Falta configurar API_URL en index.html."));
    var url = API_URL + "?action=" + encodeURIComponent(action);
    if(action !== "getData") url += "&payload=" + encodeURIComponent(JSON.stringify(payload||{}));
    return fetch(url, {method:"GET"})
      .catch(function(){ var e = new Error("No hay conexión o Google no respondió."); e.network = true; throw e; })
      .then(function(r){
        return r.json().catch(function(){ var e = new Error("Google respondió algo que no se pudo leer."); e.network = true; throw e; });
      })
      .then(function(data){
        if(data && data.error){ throw new Error(data.error); }
        return data;
      });
  }

  /**
   * Corre una acción de guardado: bloquea el botón, evita doble toque y,
   * si se corta la conexión, revisa si igual se guardó antes de avisar error.
   */
  function correr(action, payload, opts){
    opts = opts || {};
    if(state.busy){ toast("Esperá, se está guardando…"); return Promise.resolve(null); }
    state.busy = true;
    var btn = opts.btn, txt = btn ? btn.textContent : "";
    if(btn){ btn.disabled = true; btn.textContent = "Guardando…"; }
    function fin(){ state.busy = false; if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = txt; } }
    return callServer(action, payload).then(function(res){
      fin(); return res || {};
    }).catch(function(err){
      if(err && err.network && opts.verificar){
        return loadData(true).then(function(){
          if(opts.verificar(pedidos)){ fin(); return {verificado:true}; }
          throw err;
        });
      }
      throw err;
    }).catch(function(err){
      fin();
      var msg = err && err.message ? err.message : "Probá de nuevo.";
      if(err && err.network) msg += (opts.verificar ? " Revisé y no se guardó." : " Puede que se haya guardado igual: tocá «Actualizar» y fijate antes de repetir.");
      avisar(opts.tituloError || "No se pudo guardar", esc(msg));
      if(!err.network) loadData(true);
      return null;
    });
  }

  /* ---------- helpers ---------- */
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(s){
    if(!s) return "";
    var p = String(s).split("-");
    if(p.length===3 && p[0].length===4) return p[2].slice(0,2)+"/"+p[1]+"/"+p[0];
    try{
      var d = new Date(s);
      if(isNaN(d.getTime())) return String(s);
      return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
    }catch(e){ return String(s); }
  }
  function fmtCorta(s){ var f = fmtDate(s); return f.length>=5 ? f.slice(0,5) : f; }
  function fmtDateTime(iso){
    try{
      var d = new Date(iso);
      if(isNaN(d.getTime())) return "";
      return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    }catch(e){ return ""; }
  }
  function horaDe(iso){
    try{ var d = new Date(iso); return isNaN(d.getTime()) ? "" : d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; }
  }
  function esHoy(iso){
    try{ var d = new Date(iso); return !isNaN(d.getTime()) && d.toDateString()===new Date().toDateString(); }catch(e){ return false; }
  }
  function diasDesde(fecha){
    if(!fecha || !/^\d{4}-\d{2}-\d{2}/.test(fecha)) return 0;
    var d = new Date(fecha.slice(0,10)+"T00:00:00");
    var h = new Date(todayStr()+"T00:00:00");
    return Math.round((h - d)/86400000);
  }
  function esc(s){
    return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
  function nuevoId(){
    try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return uid()+"-"+uid();
  }
  // "3", "1,5", "2.5" → número; "" → ""; texto → NaN
  function num(v){
    var s = String(v==null?"":v).trim().replace(",",".");
    if(s==="") return "";
    if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
    return Number(s);
  }
  function lista(arr, max){
    max = max || 12;
    var h = '<ul>' + arr.slice(0,max).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("") + '</ul>';
    if(arr.length>max) h += '<div>… y '+(arr.length-max)+' más.</div>';
    return h;
  }
  function tipoDe(p){ return p.tipo==="INGREDIENTES" ? "INGREDIENTES" : "INSUMOS"; }
  function chipTipo(t){ return '<span class="chip-tipo'+(t==="INGREDIENTES"?" ing":"")+'">'+esc(TIPO_LABEL[t]||t)+'</span>'; }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }
  function safeLS(){ try{ return window.localStorage; }catch(e){ return null; } }
  function lsGet(k, d){ var ls=safeLS(); if(!ls) return d; try{ var v=ls.getItem(k); return v==null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ var ls=safeLS(); if(!ls) return; try{ ls.setItem(k,v); }catch(e){} }

  function groupByCategory(items){
    var byCat = {};
    CATEGORIES.forEach(function(c){ byCat[c.key]=[]; });
    items.forEach(function(it){
      if(!byCat[it.category]) byCat[it.category]=[];
      byCat[it.category].push(it);
    });
    return byCat;
  }
  function ordenCatalogo(list){
    return list.slice().sort(function(a,b){ return (Number(a.order)||0)-(Number(b.order)||0) || String(a.name).localeCompare(String(b.name)); });
  }

  function porMandar(p, todos){
    if(p.estado!=="enviado" && p.estado!=="cerrado") return [];
    if(!todos && diasDesde(p.fecha) > DIAS_POR_MANDAR) return [];
    return (p.items||[]).filter(function(it){ return it.estadoItem==="no_enviado"; });
  }
  function esViejo(p){
    return (p.estado==="pendiente" || p.estado==="enviado" || p.estado==="borrador") && diasDesde(p.fecha) > DIAS_VIEJO;
  }

  /* ---------- ayudas (i) ---------- */
  function tip(t){ return '<button type="button" class="tip" data-tip="'+esc(t)+'" aria-label="Ayuda">i</button>'; }
  document.addEventListener("click", function(e){
    var box = document.getElementById("tipBox");
    var b = e.target.closest ? e.target.closest(".tip") : null;
    if(b){
      e.preventDefault(); e.stopPropagation();
      if(box.style.display==="block" && box._from===b){ box.style.display="none"; return; }
      box.textContent = b.getAttribute("data-tip");
      box.style.display = "block";
      box._from = b;
      var r = b.getBoundingClientRect();
      var w = Math.min(280, window.innerWidth-20);
      box.style.maxWidth = w+"px";
      var left = Math.max(10, Math.min(r.left - 20, window.innerWidth - box.offsetWidth - 10));
      var top = r.bottom + 6;
      if(top + box.offsetHeight > window.innerHeight - 10) top = Math.max(10, r.top - box.offsetHeight - 6);
      box.style.left = left+"px"; box.style.top = top+"px";
      return;
    }
    if(box && box.style.display==="block") box.style.display="none";
  }, true);
  window.addEventListener("scroll", function(){ var box=document.getElementById("tipBox"); if(box) box.style.display="none"; }, true);

  /* ---------- diálogos ---------- */
  /**
   * dialog({title, html, fields:[{id,label,type,value,options,placeholder,required,requiredMsg}],
   *         buttons:[{id,label,cls,validate}]}) → Promise({btn, values}) o null si cancela.
   */
  function dialog(o){
    return new Promise(function(resolve){
      var ov = document.createElement("div");
      ov.className = "dlg-ov";
      var h = '<div class="dlg" role="dialog" aria-modal="true">';
      if(o.title) h += '<h3>'+esc(o.title)+'</h3>';
      if(o.html) h += '<div class="dlg-txt">'+o.html+'</div>';
      (o.fields||[]).forEach(function(f){
        h += '<label class="field"><span class="lbl">'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</span>';
        if(f.type==="select"){
          h += '<select data-f="'+f.id+'"><option value="">Elegir…</option>';
          (f.options||[]).forEach(function(op){ h += '<option value="'+esc(op)+'"'+(op===f.value?" selected":"")+'>'+esc(op)+'</option>'; });
          h += '</select>';
        } else {
          h += '<input type="text" data-f="'+f.id+'" value="'+esc(f.value||"")+'" placeholder="'+esc(f.placeholder||"")+'"'+(f.numeric?' inputmode="decimal"':'')+'>';
        }
        h += '</label>';
      });
      h += '<div class="dlg-err"></div><div class="dlg-btns">';
      (o.buttons||[{id:"ok",label:"Entendido",cls:"btn-primary"}]).forEach(function(b){
        h += '<button type="button" class="btn '+(b.cls||"btn-ghost")+'" data-b="'+b.id+'">'+esc(b.label)+'</button>';
      });
      h += '</div></div>';
      ov.innerHTML = h;
      document.body.appendChild(ov);
      var first = ov.querySelector("[data-f]");
      if(first) setTimeout(function(){ try{ first.focus(); }catch(e){} }, 50);

      function cerrar(v){ if(ov.parentNode) ov.parentNode.removeChild(ov); resolve(v); }
      function valores(){
        var v = {};
        ov.querySelectorAll("[data-f]").forEach(function(el){ v[el.getAttribute("data-f")] = (el.value||"").trim(); });
        return v;
      }
      ov.addEventListener("click", function(e){
        if(e.target===ov && o.cancelable!==false){ cerrar(null); return; }
        var b = e.target.closest("[data-b]");
        if(!b) return;
        var id = b.getAttribute("data-b");
        var def = (o.buttons||[]).find(function(x){ return x.id===id; }) || {};
        var v = valores();
        if(def.validate){
          var err = "";
          (o.fields||[]).some(function(f){
            if(f.required && !v[f.id]){ err = f.requiredMsg || ("Falta completar: "+f.label); return true; }
            if(f.numeric && v[f.id] && (isNaN(num(v[f.id])) || num(v[f.id])<=0)){ err = "«"+f.label+"» tiene que ser un número mayor a 0."; return true; }
            return false;
          });
          if(!err && typeof def.validate==="function") err = def.validate(v) || "";
          if(err){ ov.querySelector(".dlg-err").textContent = err; return; }
        }
        cerrar(id==="cancel" ? null : {btn:id, values:v});
      });
    });
  }
  function avisar(title, html){
    return dialog({title:title, html:html, buttons:[{id:"ok", label:"Entendido", cls:"btn-primary"}]});
  }
  function confirmar(title, html, okLabel, cancelLabel, peligro){
    return dialog({title:title, html:html, buttons:[
      {id:"cancel", label:cancelLabel||"Volver", cls:"btn-ghost"},
      {id:"ok", label:okLabel||"Sí, seguir", cls:peligro?"btn-danger":"btn-primary"}
    ]}).then(function(r){ return !!(r && r.btn==="ok"); });
  }
  /** Pide el nombre de quien hace la acción (y opcionalmente más campos). */
  function pedirNombre(title, html, lsKey, okLabel, extraFields, peligro){
    var fields = [{id:"nombre", label:"¿Quién lo hace?", value:lsGet(lsKey||"dc_quien_accion",""), required:true, requiredMsg:"Falta completar quién lo hace."}].concat(extraFields||[]);
    return dialog({title:title, html:html, fields:fields, buttons:[
      {id:"cancel", label:"Volver", cls:"btn-ghost"},
      {id:"ok", label:okLabel||"Confirmar", cls:peligro?"btn-danger":"btn-primary", validate:true}
    ]}).then(function(r){
      if(!r) return null;
      lsSet(lsKey||"dc_quien_accion", r.values.nombre);
      return r.values;
    });
  }

  /* ---------- carga de datos ---------- */
  function loadData(silent){
    if(!apiConfigured()){
      loaded = true;
      document.getElementById("main").innerHTML = '<div class="panel"><div class="panel-body"><div class="banner banner-danger" style="margin:0">Falta configurar API_URL en index.html con el link de Apps Script (termina en <code>/exec</code>).</div></div></div>';
      return Promise.resolve();
    }
    return callServer("getData").then(function(data){
      catalogItems = data.catalog || [];
      pedidos = data.pedidos || [];
      loaded = true;
      render();
    }).catch(function(err){
      console.error(err);
      if(!silent) toast("No se pudo cargar: "+(err&&err.message?err.message:"revisá la conexión."));
      if(!loaded){ loaded = true; render(); }
    });
  }

  setInterval(function(){
    if(state.busy || document.querySelector(".dlg-ov")) return;
    if(state.tab==="pedidos" && !state.detailId){ loadData(true); }
    else if(state.tab==="catalogo" && !state.adminUnlocked){ loadData(true); }
  }, POLL_MS);

  /* ---------- render principal ---------- */
  function render(){
    var main = document.getElementById("main");
    document.querySelectorAll("#tabs button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===state.tab);
    });
    var pendCount = pedidos.filter(function(p){ return p.estado==="pendiente" || p.estado==="enviado"; }).length;
    var pc = document.getElementById("pendingCount");
    if(pendCount>0){ pc.style.display="inline-block"; pc.textContent=pendCount; } else { pc.style.display="none"; }

    if(!loaded){ main.innerHTML = '<div class="empty"><div class="big">🧾</div>Cargando…</div>'; return; }
    if(state.tab==="nuevo") return state.exito ? pintarExito(main) : renderNuevo(main);
    if(state.tab==="pedidos"){
      if(state.detailId) return renderDetail(main, state.detailId);
      return renderLista(main);
    }
    if(state.tab==="catalogo") return renderCatalogo(main);
  }

  function irA(tab, detailId){
    state.tab = tab;
    state.exito = null;
    state.detailId = detailId || null;
    state.editForm = null;
    render();
    window.scrollTo(0,0);
  }

  /* =====================================================================
     NUEVO PEDIDO (local)
     ===================================================================== */
  function buildForm(p){
    var f = {
      pedidoId: p ? p.id : nuevoId(),
      existe: !!p,                       // ya está guardado en la planilla (borrador)
      tipo: p ? tipoDe(p) : lsGet("dc_last_tipo","INSUMOS"),
      local: p ? p.local : lsGet("dc_last_local",""),
      quienPide: p ? (p.quienPide || lsGet("dc_quien_pide","")) : lsGet("dc_quien_pide",""),
      fecha: p ? (p.fecha || todayStr()) : todayStr(),
      notas: p ? (p.notas||"") : "",
      items: {},
      extra: [],
      faltan: {}
    };
    if(TIPO_LABEL[f.tipo]==null) f.tipo = "INSUMOS";
    catalogItems.forEach(function(it){ f.items[it.id] = {id:it.id, category:it.category, name:it.name, qty:""}; });
    if(p){
      (p.items||[]).forEach(function(it){
        if(!it.isExtra && f.items[it.id]) f.items[it.id].qty = it.pedidoCant;
        else f.extra.push({tempId:it.id, category:it.category, name:it.name, qty:it.pedidoCant});
      });
    }
    return f;
  }

  function avisosLocal(f){
    if(!f.local) return "";
    var mios = pedidos.filter(function(p){ return p.local===f.local && tipoDe(p)===f.tipo && p.id!==f.pedidoId; });
    var tl = TIPO_LABEL[f.tipo].toLowerCase();
    var h = "";
    mios.filter(function(p){ return p.estado==="enviado"; }).forEach(function(p){
      h += '<div class="banner banner-warn">📦 <b>Tenés un pedido de '+tl+' del '+esc(fmtCorta(p.fecha))+' esperando que confirmes la recepción.</b> Fábrica ya lo envió: cargá lo que llegó antes de pedir de nuevo.'+
           '<div class="b-actions"><button class="btn btn-ghost btn-sm" type="button" data-abrir="'+esc(p.id)+'">Confirmar recepción</button></div></div>';
    });
    mios.filter(function(p){ return p.estado==="borrador"; }).forEach(function(p){
      h += '<div class="banner banner-warn">📝 <b>Tenés un pedido de '+tl+' del '+esc(fmtCorta(p.fecha))+' guardado sin enviar.</b> A fábrica todavía no le llegó.'+
           '<div class="b-actions"><button class="btn btn-ghost btn-sm" type="button" data-continuar="'+esc(p.id)+'">Seguir cargando ese pedido</button>'+
           '<button class="btn btn-ghost btn-sm btn-danger-txt" type="button" data-eliminar="'+esc(p.id)+'">Eliminarlo</button></div></div>';
    });
    mios.filter(function(p){ return p.estado==="pendiente"; }).forEach(function(p){
      h += '<div class="banner banner-warn">⏳ <b>Ya hiciste un pedido de '+tl+' el '+esc(fmtCorta(p.fecha))+' que fábrica todavía no envió.</b> Si te olvidaste algo, reabrilo y agregalo ahí en vez de hacer otro pedido.'+
           '<div class="b-actions"><button class="btn btn-ghost btn-sm" type="button" data-reabrir="'+esc(p.id)+'">Reabrir y agregar</button>'+
           '<button class="btn btn-ghost btn-sm" type="button" data-abrir="'+esc(p.id)+'">Ver pedido</button></div></div>';
    });
    mios.forEach(function(p){
      var pm = porMandar(p);
      if(!pm.length) return;
      h += '<div class="banner">🕓 Del pedido del '+esc(fmtCorta(p.fecha))+', fábrica tiene <b>'+pm.length+' ítem(s) para mandar más tarde</b>: '+
           esc(pm.map(function(it){ return it.name; }).join(", "))+'. No hace falta volver a pedirlos.</div>';
    });
    return h;
  }

  function renderNuevo(main){
    if(!state.newOrderForm){ state.newOrderForm = buildForm(null); }
    var f = state.newOrderForm;
    catalogItems.forEach(function(it){ if(!f.items[it.id]) f.items[it.id] = {id:it.id, category:it.category, name:it.name, qty:""}; });
    var byCat = groupByCategory(catalogItems);

    var html = '';
    if(f.existe){
      html += '<div class="banner banner-warn"><b>Estás cargando un pedido guardado sin enviar.</b> Cuando termines, tocá «Guardar y enviar final» para que le llegue a fábrica.'+
              '<div class="b-actions"><button class="btn btn-ghost btn-sm" type="button" id="nuevoLimpio">Empezar un pedido nuevo</button></div></div>';

    html += '<div class="panel"><div class="panel-body">';
    html += '<label class="field"><span class="lbl">¿Qué pedís? '+tip("Insumos: limpieza, librería, farmacia, impresiones y packaging. Ingredientes: ingredientes sueltos para el local. Son pedidos separados.")+'</span><div class="seg" id="segTipo">';

    html += '</div></label>';
    html += '<div class="row2">';
    html += fieldSelect("Local", "f_local", LOCALES.map(function(l){return {v:l.key,l:l.label};}), f.local, true, true);
    html += fieldInput("Fecha del pedido", "f_fecha", "date", f.fecha, true);
    html += '</div>';
    html += fieldInput("¿Quién pide?", "f_quien", "text", f.quienPide, true);
    html += fieldInput("Notas (opcional)", "f_notas", "text", f.notas, false);
    html += '</div></div>';

    html += '<div id="avisosNuevo">'+avisosLocal(f)+'</div>';

        html += '<div class="item-name">'+esc(it.name)+'</div>';

        html += '</div>';
      });

        html += '<div class="item-row'+(f.faltan[e.tempId]?" st-falta":"")+'">';
        html += '<div class="item-name">'+esc(e.name)+'<span class="tag-extra">nuevo</span></div>';
        html += '<input class="qty-input" type="text" inputmode="decimal" placeholder="cant." data-extra-id="'+esc(e.tempId)+'" value="'+esc(e.qty)+'">';
        html += '<button class="rm-btn" data-rm-extra="'+esc(e.tempId)+'" title="Quitar" type="button">×</button>';
        html += '</div>';
      });
      html += '<div class="extra-add">';
      html += '<input type="text" placeholder="Agregar ítem que no está en la lista…" data-extra-name-cat="'+c.key+'">';
      html += '<button class="btn btn-ghost btn-sm" type="button" data-extra-add-cat="'+c.key+'">+ Agregar</button>';

            tip("Mientras fábrica no lo envíe, el pedido se puede reabrir para agregar algo que te olvidaste.")+'</div>';

    main.innerHTML = html;

    function actualizarProg(){
      var n = itemsDelForm(f).filter(function(x){ return x.q!==""; }).length;
      var el = document.getElementById("progNuevo");
      if(el) el.innerHTML = n ? 'Cargaste <b>'+n+'</b> ítem(s) de '+esc(TIPO_LABEL[f.tipo].toLowerCase())+'.' : 'Todavía no cargaste ninguna cantidad.';
    }

    main.querySelectorAll("#segTipo [data-tipo]").forEach(function(b){
      b.addEventListener("click", function(){ f.tipo = b.getAttribute("data-tipo"); f.faltan = {}; renderNuevo(main); });
    });
    main.querySelector("#f_local").addEventListener("change", function(e){ f.local = e.target.value; document.getElementById("avisosNuevo").innerHTML = avisosLocal(f); });
    main.querySelector("#f_fecha").addEventListener("change", function(e){ f.fecha = e.target.value; });
    main.querySelector("#f_quien").addEventListener("input", function(e){ f.quienPide = e.target.value; });
    main.querySelector("#f_notas").addEventListener("input", function(e){ f.notas = e.target.value; });
    var limpio = main.querySelector("#nuevoLimpio");
    if(limpio) limpio.addEventListener("click", function(){ state.newOrderForm = buildForm(null); renderNuevo(main); });

    main.querySelectorAll("[data-item-id]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var id = inp.getAttribute("data-item-id");
        if(f.items[id]) f.items[id].qty = inp.value;
        actualizarProg();
      });
    });
    main.querySelectorAll("[data-extra-id]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var id = inp.getAttribute("data-extra-id");
        var e = f.extra.find(function(x){return x.tempId===id;});
        if(e) e.qty = inp.value;
        actualizarProg();
      });
    });
    main.querySelectorAll("[data-rm-extra]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-rm-extra");
        f.extra = f.extra.filter(function(x){ return x.tempId!==id; });
        renderNuevo(main);
      });
    });
    main.querySelectorAll("[data-extra-add-cat]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var cat = btn.getAttribute("data-extra-add-cat");
        var input = main.querySelector('[data-extra-name-cat="'+cat+'"]');
        var name = (input.value||"").trim();
        if(!name){ input.focus(); toast("Escribí el nombre del ítem"); return; }
        f.extra.push({tempId:uid(), category:cat, name:name, qty:""});
        renderNuevo(main);
      });
    });

    main.querySelector("#saveDraft").addEventListener("click", function(e){ enviarNuevo(f, false, e.currentTarget); });
    main.querySelector("#submitOrder").addEventListener("click", function(e){ enviarNuevo(f, true, e.currentTarget); });
  }

  // Botones de los carteles de aviso (en Nuevo pedido y en la lista).
  function accionesAviso(e){
    var b = e.target.closest("[data-abrir],[data-continuar],[data-reabrir],[data-eliminar]");
    if(!b || !this.contains(b)) return;
    if(b.hasAttribute("data-abrir")) return irA("pedidos", b.getAttribute("data-abrir"));
    var p = pedidos.find(function(x){ return x.id===(b.getAttribute("data-continuar")||b.getAttribute("data-reabrir")||b.getAttribute("data-eliminar")); });
    if(!p){ toast("Ese pedido ya no está. Tocá Actualizar."); return; }
    if(b.hasAttribute("data-continuar")) return continuarPedido(p);
    if(b.hasAttribute("data-reabrir")) return reabrirPedido(p);
    if(b.hasAttribute("data-eliminar")) return eliminarPedido(p);
  }

  function continuarPedido(p){
    var actual = state.newOrderForm;
    var aMedias = actual && actual.pedidoId!==p.id && !actual.existe && itemsDelForm(actual).some(function(x){ return x.q!==""; });
    var paso = aMedias ? confirmar("Tenés un pedido a medio cargar",
      "En «Nuevo pedido» hay cantidades cargadas que no guardaste. Si seguís, se pierden.", "Seguir igual", "Volver") : Promise.resolve(true);
    paso.then(function(ok){
      if(!ok) return;
      state.newOrderForm = buildForm(p);
      irA("nuevo");
    });
  }

  function reabrirPedido(p){
    pedirNombre("Reabrir el pedido",
      'El pedido del '+esc(fmtCorta(p.fecha))+' vuelve a «Guardado sin enviar» para que agregues o cambies lo que falte. '+
      '<b>Fábrica no lo va a poder preparar hasta que lo vuelvas a enviar</b> con «Guardar y enviar final».',
      "dc_quien_pide", "Reabrir").then(function(v){
      if(!v) return;
      correr("reabrirPedido", {pedidoId:p.id, nombre:v.nombre}).then(function(res){
        if(!res) return;
        loadData(true).then(function(){
          var p2 = pedidos.find(function(x){ return x.id===p.id; });
          if(p2){ continuarPedido(p2); toast("Pedido reabierto: agregá lo que falta y envialo de nuevo."); }
        });
      });
    });
  }

  function itemsDelForm(f){
    var cats = {};
    catsDeTipo(f.tipo).forEach(function(c){ cats[c.key]=true; });
    var out = [];
    Object.keys(f.items).forEach(function(id){
      var it = f.items[id];
      if(!cats[it.category]) return;
      out.push({id:it.id, name:it.name, category:it.category, extra:false, raw:it.qty, q:num(it.qty)});
    });
    f.extra.forEach(function(e){
      if(!cats[e.category]) return;
      out.push({id:e.tempId, name:e.name, category:e.category, extra:true, raw:e.qty, q:num(e.qty)});
    });
    return out;
  }

  function fieldInput(label, id, type, val, required){
    return '<label class="field"><span class="lbl">'+esc(label)+(required?' <span class="req">*</span>':'')+'</span>'+
      '<input type="'+type+'" id="'+id+'" value="'+esc(val)+'"></label>';
  }
  function fieldSelect(label, id, opts, val, withPlaceholder, required){
    var html = '<label class="field"><span class="lbl">'+esc(label)+(required?' <span class="req">*</span>':'')+'</span><select id="'+id+'">';
    if(withPlaceholder) html += '<option value=""'+(!val?" selected":"")+' disabled>Elegir…</option>';
    opts.forEach(function(o){ html += '<option value="'+esc(o.v)+'"'+(o.v===val?" selected":"")+'>'+esc(o.l)+'</option>'; });
    html += '</select></label>';
    return html;
  }

  function enviarNuevo(f, final, btn){
    var main = document.getElementById("main");
    var faltaCampo = [];
    if(!f.local) faltaCampo.push("Local");
    if(!f.fecha) faltaCampo.push("Fecha del pedido");
    if(!(f.quienPide||"").trim()) faltaCampo.push("¿Quién pide?");
    if(faltaCampo.length){
      avisar("Faltan datos", "Completá: "+lista(faltaCampo));
      return;
    }
    var items = itemsDelForm(f);
    var malos = items.filter(function(x){ return x.raw && String(x.raw).trim()!=="" && isNaN(x.q); });
    f.faltan = {};
    if(malos.length){
      malos.forEach(function(x){ f.faltan[x.id]=true; });
      renderNuevo(main);
      avisar("Hay cantidades que no son números", "Poné solo números (por ejemplo 2 o 1,5). Revisá:"+lista(malos.map(function(x){ return x.name+": «"+x.raw+"»"; })));
      return;
    }
    var ceros = items.filter(function(x){ return x.q===0; });
    var validos = items.filter(function(x){ return x.q!=="" && x.q>0; });
    if(!validos.length){ avisar("El pedido está vacío", "Cargá al menos una cantidad."); return; }

    var pasos = Promise.resolve(true);
    if(ceros.length){
      pasos = pasos.then(function(ok){ return ok && confirmar("Ítems en 0", "Estos ítems tienen 0 y no se van a pedir:"+lista(ceros.map(function(x){ return x.name; }))+"¿Seguir?", "Sí, seguir"); });
    }
    if(final){
      var otros = pedidos.filter(function(p){ return p.local===f.local && tipoDe(p)===f.tipo && p.id!==f.pedidoId; });
      var hoy = otros.filter(function(p){ return p.estado!=="rechazado" && p.estado!=="borrador" && esHoy(p.createdAt); });
      var pend = otros.filter(function(p){ return p.estado==="pendiente"; });
      var espera = otros.filter(function(p){ return p.estado==="enviado"; });
      pasos = pasos.then(function(ok){
        if(!ok) return false;
        if(hoy.length){
          return confirmar("Ya enviaste un pedido hoy",
            '<b>'+esc(LOCAL_LABEL[f.local])+'</b> ya envió un pedido de '+esc(TIPO_LABEL[f.tipo].toLowerCase())+' hoy a las '+esc(horaDe(hoy[0].createdAt))+
            (hoy[0].quienPide?' ('+esc(hoy[0].quienPide)+')':'')+'.<br><br>¿Es otro pedido distinto? Si te olvidaste algo del anterior, conviene reabrir ese.',
            "Sí, es otro pedido", "No, volver");
        }
        if(pend.length){
          return confirmar("Hay un pedido sin enviar por fábrica",
            'El pedido del '+esc(fmtCorta(pend[0].fecha))+' todavía no lo preparó fábrica. Si es para agregar algo, conviene reabrir ese pedido (cartel de arriba).<br><br>¿Mandar este como pedido aparte?',
            "Sí, mandar aparte", "No, volver");
        }
        return true;
      }).then(function(ok){
        if(!ok) return false;
        if(espera.length){
          return confirmar("Tenés una recepción sin confirmar",
            'El pedido del '+esc(fmtCorta(espera[0].fecha))+' ya lo envió fábrica y falta que confirmes lo que llegó. Podés mandar este pedido igual, pero acordate de confirmar esa recepción.',
            "Mandar igual", "Volver");
        }
        return true;
      }).then(function(ok){
        if(!ok) return false;
        return confirmar("¿Enviar el pedido a fábrica?",
          '<b>'+esc(LOCAL_LABEL[f.local])+'</b> · '+esc(TIPO_LABEL[f.tipo])+' · '+validos.length+' ítem(s).<br><br>'+
          'Mientras fábrica no lo envíe, lo vas a poder reabrir si te olvidaste algo.', "Enviar a fábrica", "Volver");
      });
    }

    pasos.then(function(ok){
      if(!ok) return;
      var payload = {
        pedidoId: f.pedidoId, tipo: f.tipo, local: f.local, fecha: f.fecha,
        quienPide: f.quienPide.trim(), notas: (f.notas||"").trim(), final: final,
        items: validos.map(function(x){
          return x.extra ? {id:x.id, c:x.category, n:x.name, x:1, q:String(x.q)} : {id:x.id, q:String(x.q)};
        })
      };
      correr("guardarPedidoLocal", payload, {
        btn: btn,
        verificar: function(ps){
          return ps.some(function(p){ return p.id===f.pedidoId && p.estado===(final?"pendiente":"borrador") && (p.items||[]).length===validos.length; });
        }
      }).then(function(res){
        if(!res) return;
        lsSet("dc_last_local", f.local);
        lsSet("dc_last_tipo", f.tipo);
        lsSet("dc_quien_pide", payload.quienPide);
        if(final){
          state.newOrderForm = null;
          showOrderSuccess(payload, validos.length);
        } else {
          f.existe = true;
          toast("Guardado provisorio ✓ — todavía no le llegó a fábrica.");
        }
        loadData(true);
      });
    });
  }

      '<p>Si te olvidaste algo, lo podés reabrir desde «Pedidos y envíos» mientras fábrica no lo envíe.</p>'+

  /* =====================================================================
     LISTA DE PEDIDOS
     ===================================================================== */
  var FILTROS_ESTADO = [
    ["pendiente","Pendientes (para preparar)"],
    ["enviado","Esperando recepción"],
    ["borrador","Guardados sin enviar (local)"],
    ["pormandar","Con ítems para más tarde"],
    ["viejos","Sin cerrar hace más de "+DIAS_VIEJO+" días"],
    ["cerrado","Cerrados"],
    ["rechazado","Rechazados"],
    ["todos","Todos"]
  ];

  function pasaFiltro(p){
    if(state.filterLocal!=="TODOS" && p.local!==state.filterLocal) return false;
    if(state.filterTipo!=="TODOS" && tipoDe(p)!==state.filterTipo) return false;
    switch(state.filterEstado){
      case "todos": return true;
      case "pormandar": return porMandar(p).length>0;
      case "viejos": return esViejo(p);
      default: return p.estado===state.filterEstado;
    }
  }

  function renderLista(main){
    var html = '';
    var base = pedidos.filter(function(p){
      return (state.filterLocal==="TODOS" || p.local===state.filterLocal) && (state.filterTipo==="TODOS" || tipoDe(p)===state.filterTipo);
    });
    var nPend = base.filter(function(p){ return p.estado==="pendiente"; }).length;
    var nEnv = base.filter(function(p){ return p.estado==="enviado"; }).length;
    var nBor = base.filter(function(p){ return p.estado==="borrador"; }).length;
    var nTarde = base.reduce(function(a,p){ return a + porMandar(p).length; }, 0);
    var viejos = base.filter(esViejo);

    var partes = [];
    if(nPend) partes.push('<b>'+nPend+'</b> para preparar');
    if(nEnv) partes.push('<b>'+nEnv+'</b> esperando recepción');
    if(nBor) partes.push('<b>'+nBor+'</b> guardados sin enviar');
    if(nTarde) partes.push('<b>'+nTarde+'</b> ítem(s) para mandar más tarde');
    if(partes.length) html += '<div class="banner">'+partes.join(' · ')+'</div>';
    if(viejos.length){
      html += '<div class="banner banner-danger">⚠ <b>Hay '+viejos.length+' pedido(s) sin cerrar con fecha de hace más de '+DIAS_VIEJO+' días.</b> Si ya se resolvieron, abrilos y eliminalos o confirmá la recepción.'+
              '<div class="b-actions"><button class="btn btn-ghost btn-sm" type="button" id="verViejos">Ver cuáles son</button></div></div>';
    }

    html += '<div class="panel">';
    html += '<div class="filters">';
    html += '<select id="filtEstado">';
    FILTROS_ESTADO.forEach(function(o){ html += '<option value="'+o[0]+'"'+(state.filterEstado===o[0]?" selected":"")+'>'+esc(o[1])+'</option>'; });
    html += '</select>';
    html += '<select id="filtLocal"><option value="TODOS"'+(state.filterLocal==="TODOS"?" selected":"")+'>Todos los locales</option>';
    LOCALES.forEach(function(l){ html += '<option value="'+l.key+'"'+(state.filterLocal===l.key?" selected":"")+'>'+esc(l.label)+'</option>'; });
    html += '</select>';
    html += '<select id="filtTipo"><option value="TODOS"'+(state.filterTipo==="TODOS"?" selected":"")+'>Insumos e ingredientes</option>';
    TIPOS.forEach(function(t){ html += '<option value="'+t.key+'"'+(state.filterTipo===t.key?" selected":"")+'>'+esc(t.label)+'</option>'; });
    html += '</select>';
    html += '<button class="btn btn-ghost btn-sm" id="exportCsv" type="button">⭳ Exportar CSV</button>';
    html += '</div>';

    var list = pedidos.filter(pasaFiltro);
    if(list.length===0){
      html += '<div class="empty"><div class="big">📭</div>No hay pedidos con este filtro.</div>';
    } else {
      list.forEach(function(p){
        var its = p.items||[];
        var sinResolver = p.estado==="pendiente" ? its.filter(function(it){ return it.estadoItem==="pendiente" || !it.estadoItem; }).length : 0;
        var tarde = porMandar(p).length;
        var sub = [its.length + " ítems"];
        if(p.quienPide) sub.push("pidió "+p.quienPide);
        if(sinResolver && sinResolver<its.length) sub.push(sinResolver+" sin resolver");
        if(tarde) sub.push(tarde+" para más tarde");
        html += '<div class="order-card" data-open="'+esc(p.id)+'">';
        html += '<div class="oc-main">';
        html += '<div class="oc-local">'+esc(LOCAL_LABEL[p.local]||p.local)+' · '+esc(fmtDate(p.fecha))+chipTipo(tipoDe(p))+'</div>';
        html += '<div class="oc-sub">'+esc(sub.join(" · "))+(esViejo(p)?' · <span class="oc-warn">⚠ hace '+diasDesde(p.fecha)+' días</span>':'')+'</div>';
        html += '</div>';
        html += '<span class="badge '+estadoInfo(p.estado).cls+'">'+esc(estadoInfo(p.estado).label)+'</span>';
        html += '<span class="oc-arrow">›</span>';
        html += '</div>';
      });
    }
    html += '</div>';
    html += '<div class="progreso">Qué significa cada estado: '+
      Object.keys(ESTADO_INFO).map(function(k){ return esc(ESTADO_INFO[k].label)+tip(ESTADO_INFO[k].tip); }).join(" &nbsp; ")+'</div>';
    main.innerHTML = html;

    main.querySelector("#filtEstado").addEventListener("change", function(e){ state.filterEstado=e.target.value; render(); });
    main.querySelector("#filtLocal").addEventListener("change", function(e){ state.filterLocal=e.target.value; render(); });
    main.querySelector("#filtTipo").addEventListener("change", function(e){ state.filterTipo=e.target.value; render(); });
    main.querySelector("#exportCsv").addEventListener("click", function(){ exportCsv(list); });
    var vv = main.querySelector("#verViejos");
    if(vv) vv.addEventListener("click", function(){ state.filterEstado="viejos"; render(); });
    main.querySelectorAll("[data-open]").forEach(function(card){
      card.addEventListener("click", function(){ irA("pedidos", card.getAttribute("data-open")); });
    });
  }

  /* ---------- CSV ---------- */
  function csvField(v){
    var s = (v==null? "": String(v));
    if(/[",;\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function exportCsv(list){
    // Los rechazados y los guardados sin enviar no se exportan.
    var exportable = (list||[]).filter(function(p){ return p.estado!=="rechazado" && p.estado!=="borrador"; });
    if(exportable.length===0){ toast("No hay pedidos para exportar"); return; }
    var rows = [["Local","Fecha","Ítem","Cant. solicitada","Cant. enviada","Cant. recibida","Tipo"]];
    exportable.forEach(function(p){
      (p.items||[]).forEach(function(it){
        rows.push([LOCAL_LABEL[p.local]||p.local, fmtDate(p.fecha), it.name, it.pedidoCant||"", it.envioCant||"", it.recibidoCant||"", TIPO_LABEL[tipoDe(p)]]);
      });
    });
    var csv = "﻿" + rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n");
    var localTag = state.filterLocal==="TODOS" ? "todos" : state.filterLocal.toLowerCase();
    var filename = "pedidos_insumos_"+localTag+"_"+todayStr()+".csv";
    try{
      var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("Historial exportado");
    }catch(err){
      console.error(err);
      toast("No se pudo exportar en este navegador");
    }
  }

  /* =====================================================================
     DETALLE DEL PEDIDO
