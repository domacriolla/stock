  }
}

/* ---------------------------------------------------------------------
   Pantalla INFORMES: por ahora, el total REAL de insumos consumidos en un
   día — suma SOLO las recetas (Rellenos/Preparados/Dips/Postres) que ya se
   enviaron como final desde "Registrar producción → Cocina" ese día; lo que
   todavía no se envió como final no cuenta acá. Confirmado con Carolina
   (26/09/2026).
   --------------------------------------------------------------------- */
let SECTOR_INFORME_ACTIVO = 'consumo';
let LOCAL_INFORME_ACTIVO = null;

async function renderInformes(sector){
  // Cada bloque del inicio abre su propio informe: 'stock' (Locales) o
  // 'consumo' (Fábrica). SECTOR_INFORME_ACTIVO se sigue usando en los
  // chequeos de "respuesta tardía" de cada informe.
  SECTOR_INFORME_ACTIVO = (sector === 'stock' || sector === 'stockFabrica') ? sector : 'consumo';
  const opciones = lugaresInformeStock();
  if(opciones.length && opciones.indexOf(LOCAL_INFORME_ACTIVO) === -1) LOCAL_INFORME_ACTIVO = opciones[0];
  const titulo = SECTOR_INFORME_ACTIVO === 'stock' ? 'Stock por local'
    : SECTOR_INFORME_ACTIVO === 'stockFabrica' ? 'Stock de fábrica' : 'Consumo de insumos';
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <div class="fab-toolbar">
      <header class="top" style="margin:0;"><h1>${titulo}</h1></header>
      <div class="field-row">
        <label>Fecha de consulta</label>
        <input type="date" id="fechaInforme" value="${hoyISO()}">
      </div>
      <button class="btn secondary no-print" id="btnImprimirInforme" style="margin-left:auto;" onclick="window.print()">🖶 Imprimir</button>
    </div>
    <div id="contenidoInforme" class="loading">Cargando…</div>
  `;
  document.getElementById('fechaInforme').onchange = pintarSectorInforme;
  pintarSectorInforme();
}

// locales (informe de Locales) o sectores de fábrica (informe de Fábrica)
function lugaresInformeStock(){
  if(SECTOR_INFORME_ACTIVO === 'stockFabrica') return LOCALES.filter(l => l.startsWith('Fábrica'));
  if(SECTOR_INFORME_ACTIVO === 'stock') return LOCALES_VENTA;
  return [];
}
function esInformeStock(){ return SECTOR_INFORME_ACTIVO === 'stock' || SECTOR_INFORME_ACTIVO === 'stockFabrica'; }

function pintarSectorInforme(){
  if(SECTOR_INFORME_ACTIVO === 'consumo'){
    cargarInformeInsumos();
    return;
  }
  const cont = document.getElementById('contenidoInforme');
  cont.className = '';
  cont.innerHTML = `
    <div class="field-row no-print" style="max-width:280px;">
      <label>${SECTOR_INFORME_ACTIVO === 'stockFabrica' ? 'Sector' : 'Local'}</label>
      <select id="selLocalInforme">
        ${lugaresInformeStock().map(l => `<option value="${l}" ${l === LOCAL_INFORME_ACTIVO ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
    <div id="contenidoStockLocal" class="loading">Cargando…</div>
  `;
  document.getElementById('selLocalInforme').onchange = (e) => {
    LOCAL_INFORME_ACTIVO = e.target.value;
    cargarInformeStockLocal();
  };
  cargarInformeStockLocal();
}

async function cargarInformeInsumos(){
  const fecha = document.getElementById('fechaInforme').value;
  const cont = document.getElementById('contenidoInforme');
  cont.className = 'loading'; cont.textContent = 'Cargando…';
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=calcularInsumosRealesDia&fecha=${encodeURIComponent(fecha)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    // Guard: si mientras esperaba la respuesta el usuario ya cambió a la
    // otra solapa (o cambió la fecha), esta respuesta llegó tarde y no debe
    // pisar lo que se esté mostrando ahora.
    if(SECTOR_INFORME_ACTIVO !== 'consumo' || document.getElementById('fechaInforme').value !== fecha) return;
    cont.className = '';
    const recetasFinal = data.recetasFinalizadas || [];
    const totales = data.totalesPorIngrediente || [];
    if(recetasFinal.length === 0){
      cont.innerHTML = `
        <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(fecha)}</p>
        <div class="empty">Todavía no se envió ninguna receta como final este día en "Registrar producción → Cocina" — este informe solo suma insumos de recetas ya finalizadas.</div>
      `;
      return;
    }
    cont.innerHTML = `
      <h2 style="font-size:18px;margin:0 0 6px;">Total real de insumos usados — Cocina</h2>
      <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(fecha)} — recetas ya finalizadas (${recetasFinal.length}): ${recetasFinal.join(', ')}</p>
      <table class="prod">
        <thead><tr><th>Insumo</th><th class="num">Total usado</th></tr></thead>
        <tbody>
          ${totales.map(t => `<tr><td>${t.ingrediente}</td><td class="num"><strong>${ent(t.cantidad)}</strong> ${t.unidad}</td></tr>`).join('')}
        </tbody>
      </table>
    `;
  }catch(err){
    if(SECTOR_INFORME_ACTIVO !== 'consumo') return;
    cont.className = '';
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
  }
}

// Informe "Stock por local": todos los productos por categoría, con la
// última carga de stock de ESE local (cantidad + vencimiento por lote),
// resaltando según la fecha de consulta — rojo ya venció, rosa vence justo
// ese día, verde vence al día siguiente. Confirmado con Carolina (27/09/2026).
async function cargarInformeStockLocal(){
  const fecha = document.getElementById('fechaInforme').value;
  const local = LOCAL_INFORME_ACTIVO;
  const cont = document.getElementById('contenidoStockLocal');
  if(!cont) return; // la solapa ya cambió antes de arrancar el pedido
  cont.className = 'loading'; cont.textContent = 'Cargando…';
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerStockAnalisisLocal&local=${encodeURIComponent(local)}&fecha=${encodeURIComponent(fecha)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    // Guard: si mientras esperaba la respuesta el usuario cambió de solapa,
    // de local o de fecha, esta respuesta llegó tarde y no debe pisar lo
    // que se esté mostrando ahora.
    const contActual = document.getElementById('contenidoStockLocal');
    if(!contActual || !esInformeStock() || LOCAL_INFORME_ACTIVO !== local || document.getElementById('fechaInforme').value !== fecha) return;
    cont.className = '';
    const categorias = data.categorias || {};
    const nombresCategorias = Object.keys(categorias);
    const claseFila = { vencido: 'fila-vencido', vence_hoy: 'fila-vence-hoy', vence_manana: 'fila-vence-manana' };

    const leyenda = `
      <div class="leyenda-vencimiento">
        <span><i style="background:var(--alert-bg);"></i> Ya venció</span>
        <span><i style="background:var(--pink-bg);"></i> Vence hoy (${fmtFecha(fecha)})</span>
        <span><i style="background:var(--herb-bg);"></i> Vence mañana (${fmtFecha(sumarDiasISO(fecha, 1))})</span>
      </div>`;

    const uc = data.ultimaCarga;
    // Cuenta SOLO la carga del día consultado o la de la noche anterior; lo
    // que no figura en ella es 0 (mismo criterio que la orden de envío y
    // "Ver qué producir hoy").
    let enCero = 0;
    const bloques = nombresCategorias.map(cat => {
      const items = categorias[cat];
      const filas = items.map(it => {
        if(it.lotes.length === 0){
          enCero++;
          return `<tr><td>${it.sabor}</td><td class="num" style="color:var(--ink-soft);">0</td><td style="color:var(--ink-soft);font-style:italic;">${uc ? 'no figura en la carga' : '—'}</td></tr>`;
        }
        return it.lotes.map((l, i) => `
          <tr class="${claseFila[l.estado] || ''}">
            <td>${i === 0 ? it.sabor : `<span class="item-extra">↳ otro lote</span>`}</td>
            <td class="num">${ent(l.cantidad)}</td>
            <td>${fmtFecha(l.vencimiento)}</td>
          </tr>`).join('');
      }).join('');
      return `
        <h4 class="cat-heading">${cat}</h4>
        <table class="prod">
          <thead><tr><th>Producto</th><th class="num">Cantidad (${data.unidad || 'unidades'})</th><th>Vencimiento</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>`;
    }).join('');

    const resumenCarga = uc
      ? `<div class="resumen-carga">
          <strong>Carga que cuenta: ${fmtFecha(uc.fecha)}</strong>${uc.responsable ? ` · por ${uc.responsable}` : ''} · ${uc.productos} producto(s) cargado(s)
          · ${uc.enviada ? `✓ enviada${uc.hora ? ' a las ' + uc.hora : ''}` : 'sin "Guardar y enviar final"'}
          ${enCero ? `<div style="margin-top:6px;color:var(--ink-soft);">${enCero} producto(s) no figuran en esa carga → cuentan como 0.</div>` : ''}
        </div>`
      : `<div class="resumen-carga dato-viejo" style="padding:10px 12px;">⚠ ${LOCAL_INFORME_ACTIVO} no cargó stock el ${fmtFecha(fecha)} ni el día anterior — todo cuenta como 0.${data.cargaVieja ? ` Su última carga fue el ${fmtFecha(data.cargaVieja)} (ya no se usa).` : ''}</div>`;

    cont.innerHTML = `
      <h2 style="font-size:18px;margin:0 0 6px;">Análisis de stock — ${LOCAL_INFORME_ACTIVO}</h2>
      <p style="color:var(--ink-soft);font-size:13px;">${data.dia || ''} ${fmtFecha(fecha)}</p>
      ${resumenCarga}
      ${leyenda}
      ${bloques}
    `;
  }catch(err){
    const contActual = document.getElementById('contenidoStockLocal');
    if(!contActual || !esInformeStock() || LOCAL_INFORME_ACTIVO !== local) return;
    cont.className = '';
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
  }
}

// arma una fila de la tabla de Producción, reutilizada por las 3 secciones
// (Producción por sabor / Canastas completas / Extras de producción).
// - etiqueta: texto visible en la celda "Sabor".
// - saborKey: la clave que se guarda como Sabor en TrazabilidadProduccion —
//   para las filas de "Molde de canasta" es distinta del nombre real del
//   sabor (para no pisar la fila de la Canasta completa de ese mismo sabor,
//   ver registrarTrazabilidadItem en Code.gs, que upsertea por Fecha+Sabor).
// - usaResponsable: true = desplegable de Responsable (Canastas, Rollos de
//   Jamón y Queso); false = desplegable de Máquina Nº (sabores normales).
// - guardado: item ya guardado para este saborKey (o undefined).
// - bloqueadoGlobal: turno ya cerrado -> toda la fila queda de solo lectura,
//   sin botones de Guardar/Editar.
function filaRegistroProduccion(etiqueta, saborKey, aHacerMostrar, etiquetaExtra, usaResponsable, empleados, guardado, bloqueadoGlobal){
  const g = guardado || {};
  const yaGuardado = !!guardado;
  const bloqueado = bloqueadoGlobal; // sin Guardar/Editar por fila: siempre editable hasta el envío final
  const dis = bloqueado ? 'disabled' : '';
  const celdaMaquina = usaResponsable
    ? `<select class="inp-responsable-canasta" style="min-width:130px;" ${dis}>${opcionesEmpleadosSeleccion(empleados, g.responsable)}</select>`
    : `<select class="inp-maq-num" style="width:56px;" ${dis}>
        <option value=""></option>
        <option value="1" ${g.maquinaNumero === '1' ? 'selected' : ''}>1</option>
        <option value="2" ${g.maquinaNumero === '2' ? 'selected' : ''}>2</option>
      </select>`;

  const tr = document.createElement('tr');
  tr.dataset.sabor = saborKey;
  if(yaGuardado) tr.classList.add('fila-guardada');
  tr.innerHTML = `
    <td>${etiqueta}${etiquetaExtra || ''}</td>
    <td class="num" style="color:var(--ink-soft);">${aHacerMostrar != null ? ent(aHacerMostrar) : '—'}</td>
    <td>${celdaMaquina}</td>
    <td><input type="text" class="inp-maq-vel" style="width:64px;" value="${g.maquinaVelocidad || ''}" ${dis}></td>
    <td><input type="text" class="inp-disco-lote" style="width:90px;" value="${g.discosLote || ''}" ${dis}></td>
    <td><input type="number" min="0" step="0.01" class="inp-peso-prom" style="width:80px;" value="${g.pesoPromTandaDiscos || ''}" ${dis}></td>
    <td><input type="date" class="inp-relleno-fecha" value="${g.rellenoFecha || ''}" ${dis}></td>
    <td><input type="number" min="0" step="0.01" class="inp-peso-inicial" style="width:80px;" value="${g.pesoInicialRelleno || ''}" ${dis}></td>
    <td><input type="number" min="0" step="0.01" class="inp-peso-final" style="width:80px;" value="${g.pesoFinalRelleno || ''}" ${dis}></td>
    <td><input type="time" class="inp-hora-inicio" value="${g.horaInicio || ''}" ${dis}></td>
    <td><input type="time" class="inp-hora-fin" value="${g.horaFin || ''}" ${dis}></td>
    <td><input type="number" min="0" step="1" class="inp-total-prod" style="width:80px;" value="${g.totalProduccion || ''}" ${dis}></td>
    <td><input type="number" min="0" step="1" class="inp-discos-danados" style="width:64px;" value="${g.discosDanados || ''}" ${dis}></td>
    <td class="no-print celda-estado" style="white-space:nowrap;"></td>
  `;
  if(yaGuardado){
    tr.dataset.guardado = '1';
    ponerSello(tr, null);
  }
  return tr;
}

async function pintarRegistroProduccionSector(){
  const cont = document.getElementById('contenidoRegistro');
  const fecha = document.getElementById('fechaRegistro').value;
  cont.innerHTML = '<div class="loading">Cargando…</div>';

  const data = CALCULO_REGISTRO;
  const prep = PREP_REGISTRO || {};
  const categorias = CATEGORIAS_REGISTRO || {};
  const categoriaPorSabor = CATEGORIA_POR_SABOR_REGISTRO || {};

  let estado;
  try{
    if(PREPEDIDO_REGISTRO && PREPEDIDO_REGISTRO.fecha === fecha){
      const pre = PREPEDIDO_REGISTRO; PREPEDIDO_REGISTRO = null;
      estado = await pre.promesa;
    } else {
      const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerRegistroProduccionDia&fecha=${fecha}`);
      estado = await r.json();
    }
    if(estado.error) throw new Error(estado.error);
  }catch(err){
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar el registro guardado: ${err.message}</div>`;
    return;
  }
  if(SECTOR_REGISTRO_ACTIVO !== 'produccion') return; // cambió de pestaña mientras cargaba

  const guardadoPorSabor = {};
  (estado.items || []).forEach(it => { guardadoPorSabor[it.sabor] = it; });
  const bloqueadoGlobal = !!estado.finalizado;

  // sabores normales (Empanadas Horno + Frito) sin las Canastas, que van
  // aparte en su propia sección más abajo.
  const todasEmpanadas = [...(categorias['Empanadas Horno'] || []), ...(categorias['Empanadas Frito'] || [])];
  const sabores = todasEmpanadas.filter(n => categoriaPorSabor[n] !== 'Canasta');
  const saboresCanasta = todasEmpanadas.filter(n => categoriaPorSabor[n] === 'Canasta');

  const porSabor = {};
  (data.produccion || []).forEach(f => { if(f.tipoCalculo === 'Calendario') porSabor[f.sabor] = f; });
  const canastaPorSabor = {};
  (prep.canastas || []).forEach(c => { canastaPorSabor[c.sabor] = c; });

  cont.innerHTML = '';

  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = `${data.dia}, ${fmtFecha(data.fecha)} — completá solo los sabores que se armaron este turno. "A producir (calc.)" es de referencia (en Extras de producción es lo que hace falta dejar armado HOY para mañana). Guardá con "Guardado provisorio" las veces que quieras durante el turno (todo queda editable) y al terminar tocá "Guardar y enviar final". Si se elaboró algo que no está en la lista, agregalo en "Producción adicional".`;
  cont.appendChild(intro);

  if(bloqueadoGlobal){
    const aviso = document.createElement('div');
    aviso.className = 'msg ok no-print';
    aviso.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;';
    const horaCierre = estado.cierre && estado.cierre.hora ? ` a las ${estado.cierre.hora}` : '';
    const itemsCierre = estado.cierre && estado.cierre.items ? ` — ${estado.cierre.items} ítem(s) guardado(s)` : '';
    const puedeReabrir = !(estado.cierre && estado.cierre.puedeReabrir === false);
    aviso.innerHTML = `<span>✓ Turno enviado${horaCierre}${itemsCierre} — todo el registro de Producción de este día quedó bloqueado.${puedeReabrir ? '' : ' (Solo se puede reabrir el último turno enviado.)'}</span>${puedeReabrir ? '<button type="button" class="btn secondary" id="btnReabrirTurno" style="font-size:12px;padding:5px 9px;">Reabrir</button>' : ''}`;
    cont.appendChild(aviso);
    const bRe = cont.querySelector('#btnReabrirTurno');
    if(bRe) bRe.onclick = () => reabrirTurnoProduccion(fecha);
  }

  cont.appendChild(bloquePuestosMaquina('Máquina 1', 'm1', EMPLEADOS_REGISTRO, estado.maquina1, bloqueadoGlobal));
  cont.appendChild(bloquePuestosMaquina('Máquina 2', 'm2', EMPLEADOS_REGISTRO, estado.maquina2, bloqueadoGlobal));

  // UNA sola tabla con encabezado y columna "Sabor" inmovilizados (se ven
  // siempre al desplazarse, también en notebook), agrupada por categoría y
  // con los productos de la A a la Z. Pedido por Carolina (29/09/2026).
  const { wrap, tbody } = crearTablaRegistroProduccion();
  const filaGrupo = (titulo, nota) => {
    const tr = document.createElement('tr');
    tr.className = 'fila-grupo';
    tr.innerHTML = `<td>${titulo}</td><td colspan="13">${nota || ''}</td>`;
    tbody.appendChild(tr);
  };
  const saboresHorno = (categorias['Empanadas Horno'] || []).filter(n => categoriaPorSabor[n] !== 'Canasta');
  const saboresFrito = (categorias['Empanadas Frito'] || []).filter(n => categoriaPorSabor[n] !== 'Canasta');
  [['Empanadas Horno', saboresHorno], ['Empanadas Frito', saboresFrito]].forEach(([titulo, lista]) => {
    if(!lista.length) return;
    filaGrupo(titulo);
    lista.slice().sort(compararTexto).forEach(nombre => {
      const ref = porSabor[nombre];
      tbody.appendChild(filaRegistroProduccion(nombre, nombre, ref ? ref.aHacerUnidades : null, '', false, EMPLEADOS_REGISTRO, guardadoPorSabor[nombre], bloqueadoGlobal));
    });
  });

  // Canastas completas: hoy arman la canasta entera (disco + relleno + el
  // molde que dejaron listo el día anterior). Responsable en vez de Máquina.
  if(saboresCanasta.length){
    filaGrupo('Canastas completas');
    saboresCanasta.slice().sort(compararTexto).forEach(nombre => {
      const ref = porSabor[nombre];
      tbody.appendChild(filaRegistroProduccion(nombre, nombre, ref ? ref.aHacerUnidades : null, '', true, EMPLEADOS_REGISTRO, guardadoPorSabor[nombre], bloqueadoGlobal));
    });
  }

  // Extras para mañana: Rollos de Jamón y Queso y UN solo "Molde de canasta"
  // (es el mismo molde para todas las canastas — se suma lo de todas).
  const notaPct = (prep.porcentajeCocina != null && Number(prep.porcentajeCocina) !== 100)
    ? `<span style="color:var(--ink-soft);font-size:11.5px;font-weight:400;">Ya aplicado el ${ent(prep.porcentajeCocina)}% de venta a cubrir de Cocina.</span>` : '';
  filaGrupo('Extras de producción (para mañana)', notaPct);
  const etiquetaManana = ' <span style="color:var(--ink-soft);font-size:11px;">(armar hoy para mañana)</span>';
  tbody.appendChild(filaRegistroProduccion(NOMBRE_ROLLOS_JYQ, NOMBRE_ROLLOS_JYQ, prep.rollosJyQ, etiquetaManana, true, EMPLEADOS_REGISTRO, guardadoPorSabor[NOMBRE_ROLLOS_JYQ], bloqueadoGlobal));
  if(saboresCanasta.length){
    const totalMoldes = saboresCanasta.reduce((acc, n) => acc + ((canastaPorSabor[n] && Number(canastaPorSabor[n].aHacerUnidades)) || 0), 0);
    tbody.appendChild(filaRegistroProduccion(NOMBRE_MOLDE_CANASTA, NOMBRE_MOLDE_CANASTA, totalMoldes, etiquetaManana, true, EMPLEADOS_REGISTRO, guardadoPorSabor[NOMBRE_MOLDE_CANASTA], bloqueadoGlobal));
  }

  // Producción adicional: cualquier producto que se elaboró aunque el
  // cálculo del día no lo pidiera (o que no está en las listas de arriba).
  const yaListados = new Set([...tbody.querySelectorAll('tr[data-sabor]')].map(tr => tr.dataset.sabor));
  filaGrupo('Producción adicional (fuera del cálculo)');
  const adicionalesGuardados = Object.keys(guardadoPorSabor).filter(k => !yaListados.has(k)).sort(compararTexto);
  adicionalesGuardados.forEach(k => {
    tbody.appendChild(filaRegistroProduccion(k, k, null, '', true, EMPLEADOS_REGISTRO, guardadoPorSabor[k], bloqueadoGlobal));
  });
  cont.appendChild(wrap);
  if(!bloqueadoGlobal){
    const todos = Object.values(categorias).flat().sort(compararTexto);
    const selWrap = document.createElement('div');
    selWrap.className = 'fila-agregar no-print';
    selWrap.innerHTML = `
      <select id="selAgregarProduccion"><option value="">— Agregar producción adicional: elegí un producto —</option>
        ${todos.map(n => `<option value="${n}">${n}</option>`).join('')}</select>
      <button type="button" class="btn secondary" id="btnAgregarProduccion">+ Agregar</button>`;
    cont.appendChild(selWrap);
    selWrap.querySelector('#btnAgregarProduccion').onclick = () => {
      const n = selWrap.querySelector('#selAgregarProduccion').value;
      if(!n) return;
      const existentes = new Set([...tbody.querySelectorAll('tr[data-sabor]')].map(tr => tr.dataset.sabor));
      const clave = existentes.has(n) ? n + ' (adicional)' : n;
      if(existentes.has(clave)){ avisar('Ese producto ya está agregado en "Producción adicional".', 'err'); return; }
      const tr = filaRegistroProduccion(clave, clave, null, '', true, EMPLEADOS_REGISTRO, null, false);
      tbody.appendChild(tr);
      tr.scrollIntoView({ block: 'nearest' });
    };
  }

  seguirCambios(cont);
  const obsWrap = document.createElement('div');
  obsWrap.className = 'field-row';
  obsWrap.style.cssText = 'max-width:640px;margin-top:18px;';
  obsWrap.innerHTML = `
    <label>Observaciones generales del turno</label>
    <textarea id="inpObservacionesRegistro" rows="3" style="width:100%;font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;" ${bloqueadoGlobal ? 'disabled' : ''}>${estado.observaciones || ''}</textarea>
  `;
  cont.appendChild(obsWrap);

  if(!bloqueadoGlobal){
    const actions = document.createElement('div');
    actions.innerHTML = htmlBarraFinal('btnProvisorioRegistro', 'btnGuardarRegistro', 'Guardar y enviar final',
      '<strong>Guardado provisorio</strong>: guarda puestos, observaciones y todos los sabores cargados, y se puede seguir cargando durante el turno. <strong>Guardar y enviar final</strong>: guarda todo y cierra el turno (queda bloqueado; se puede reabrir solo el último turno enviado).');
    cont.appendChild(actions);
    document.getElementById('btnProvisorioRegistro').onclick = () => guardarRegistroProduccion(false);
    document.getElementById('btnGuardarRegistro').onclick = () => guardarRegistroProduccion(true);
  }
}

// arma el objeto "item" de un sabor a partir de su fila en la tabla. La
// celda de "máquina" puede ser el desplegable de Máquina Nº (sabores
// normales) o el de Responsable (Canastas) — nunca los dos a la vez.
function leerFilaSabor(tr){
  const maq = tr.querySelector('.inp-maq-num');
  const resp = tr.querySelector('.inp-responsable-canasta');
  return {
    sabor: tr.dataset.sabor,
    maquinaNumero: maq ? maq.value : '',
    responsable: resp ? resp.value : '',
    maquinaVelocidad: tr.querySelector('.inp-maq-vel').value,
    discosLote: tr.querySelector('.inp-disco-lote').value,
    pesoPromTandaDiscos: tr.querySelector('.inp-peso-prom').value,
    rellenoFecha: tr.querySelector('.inp-relleno-fecha').value,
    pesoInicialRelleno: tr.querySelector('.inp-peso-inicial').value,
    pesoFinalRelleno: tr.querySelector('.inp-peso-final').value,
    horaInicio: tr.querySelector('.inp-hora-inicio').value,
    horaFin: tr.querySelector('.inp-hora-fin').value,
    totalProduccion: tr.querySelector('.inp-total-prod').value,
    discosDanados: tr.querySelector('.inp-discos-danados').value
  };
}

async function guardarRegistroProduccion(enviar){
  const fecha = document.getElementById('fechaRegistro').value;
  const msg = document.getElementById('msgRegistro');
  msg.className = 'msg'; msg.textContent = '';

  const leerMaquina = (idBase) => {
    const table = document.querySelector(`table.lotes[data-maquina="${idBase}"]`);
    const get = (p) => table.querySelector(`.inp-puesto[data-puesto="${p}"]`).value.trim();
    return { entrada: get('entrada'), relleno: get('relleno'), salida: get('salida') };
  };
  const maquina1 = leerMaquina('m1');
  const maquina2 = leerMaquina('m2');
  const observaciones = document.getElementById('inpObservacionesRegistro').value.trim();

  // TODAS las filas: con total -> se guardan; con datos pero sin total -> se
  // avisa; guardadas y ahora vacías -> se borran de la planilla.
  const filas = [...document.querySelectorAll('table.traza tbody tr[data-sabor]')];
  const conTotal = [], sinTotal = [], vaciadas = [];
  filas.forEach(tr => {
    const it = leerFilaSabor(tr);
    if(it.totalProduccion && Number(it.totalProduccion) > 0){ conTotal.push(tr); return; }
    if(filaTieneDatos(tr)) sinTotal.push(tr.cells[0].textContent.trim());
    else if(tr.dataset.guardado) vaciadas.push(tr);
  });
  if(enviar && sinTotal.length){
    msg.className = 'msg err';
    msg.textContent = 'No se envió: hay sabores con datos pero sin "Total producción" — ' + sinTotal.join(', ') + '. Completalos o borrales los datos.';
    avisar('✗ No se envió: hay sabores sin total producido (ver abajo).', 'err');
    return;
  }
  if(enviar && !confirm('¿Guardar y enviar final el registro del turno? Se va a bloquear todo el registro de Producción de este día.')) return;
  const items = conTotal.map(leerFilaSabor);

  const btn = document.getElementById(enviar ? 'btnGuardarRegistro' : 'btnProvisorioRegistro');
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const borrar = vaciadas.map(tr => tr.dataset.sabor);
    const data = await postJSON({ action: 'registrarTrazabilidadProduccion', fecha, maquina1, maquina2, observaciones, items, borrar, provisorio: !enviar });
    vaciadas.forEach(marcarFilaBorrada);
    const hora = horaCorta();
    if(enviar){
      avisar(`✓ Turno enviado · ${hora} — ${data.total_dia} ítem(s) de producción guardados.`);
      msg.className = 'msg ok';
      msg.textContent = `✓ Turno enviado a las ${hora}: quedaron guardados puestos, observaciones y ${data.total_dia} ítem(s) de producción.`;
      pintarRegistroProduccionSector(); // vuelve a leer de la planilla y muestra el turno cerrado
    } else {
      conTotal.forEach(marcarFilaGuardada);
      avisar(`✓ Guardado provisorio · ${hora} — puestos, observaciones y ${data.total_dia} ítem(s) guardados.`);
      msg.className = sinTotal.length ? 'msg err' : 'msg ok';
      msg.textContent = `✓ Guardado provisorio a las ${hora}: puestos, observaciones y ${items.length} sabor(es) nuevos. En total hay ${data.total_dia} ítem(s) de producción guardados hoy. Podés seguir cargando.`
        + (sinTotal.length ? ' OJO — no se guardaron porque les falta el total producido: ' + sinTotal.join(', ') + '.' : '');
    }
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

async function reabrirTurnoProduccion(fecha){
  if(!confirm('¿Reabrir el registro de Producción de este día? Se va a destrabar toda la tabla.')) return;
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'reabrirTurnoProduccion', fecha })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    avisar('Turno reabierto — ya se puede editar.');
    pintarRegistroProduccionSector();
  }catch(err){
    alert('No se pudo reabrir: ' + err.message);
  }
}

/* ---------------------------------------------------------------------
   Registrar producción — sector DISCOS: registro simple por tipo de disco
   (Horno / Frito / Recorte), con Responsable y cantidad. Sin puestos de
   máquina ni finalización de turno — es independiente de Producción.
   --------------------------------------------------------------------- */
async function pintarRegistroDiscosSector(){
  const cont = document.getElementById('contenidoRegistro');
  const fecha = document.getElementById('fechaRegistro').value;
  cont.innerHTML = '<div class="loading">Cargando…</div>';

  let estado;
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerRegistroDiscosDia&fecha=${fecha}`);
    estado = await r.json();
    if(estado.error) throw new Error(estado.error);
  }catch(err){
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
    return;
  }
  if(SECTOR_REGISTRO_ACTIVO !== 'discos') return; // cambió de pestaña mientras cargaba

  const guardadoPorTipo = {};
  (estado.items || []).forEach(it => { guardadoPorTipo[it.tipo] = it; });

  cont.innerHTML = '';
  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = 'Registro simple de discos por tipo — responsable y cantidad usada hoy. Guardá con "Guardado provisorio" las veces que quieras y al terminar "Guardar y enviar final".';
  cont.appendChild(intro);

  const wrap = document.createElement('div');
  wrap.style.overflowX = 'auto';
  const table = document.createElement('table');
  table.className = 'lotes traza';
  table.innerHTML = `
    <thead><tr><th>Tipo</th><th>Responsable</th><th class="num">Cantidad</th><th class="no-print"></th></tr></thead>
    <tbody></tbody>`;
  const tbody = table.querySelector('tbody');
  TIPOS_DISCO.forEach(tipo => {
    const g = guardadoPorTipo[tipo];
    const yaGuardado = !!g;
    const tr = document.createElement('tr');
    tr.dataset.tipo = tipo;
    tr.innerHTML = `
      <td>${tipo}</td>
      <td><select class="inp-responsable-disco">${opcionesEmpleadosSeleccion(EMPLEADOS_REGISTRO, g ? g.responsable : '')}</select></td>
      <td><input type="number" min="0" step="1" class="inp-cantidad-disco" style="width:90px;" value="${g ? g.cantidad : ''}"></td>
      <td class="no-print celda-estado" style="white-space:nowrap;"></td>
    `;
    if(yaGuardado){ tr.dataset.guardado = '1'; tr.classList.add('fila-guardada'); ponerSello(tr, null); }
    tbody.appendChild(tr);
  });
  wrap.appendChild(table);
  cont.appendChild(wrap);
  seguirCambios(table);

  // ya enviado: todo bloqueado + Reabrir; si no, los 2 botones finales
  if(estado.cierre){
    bloquearFilasEnviadas(table);
    cont.insertBefore(cartelEnviado(estado.cierre, 'Registro de discos', estado.cierre.puedeReabrir === false ? null : async () => {
      if(!confirm('¿Reabrir el registro de discos de este día? Se va a destrabar para corregir.')) return;
      try{
        await postJSON({ action: 'reabrirCarga', pantalla: 'Discos', fecha, clave: 'Discos' });
        avisar('Registro de discos reabierto — ya se puede editar.');
        pintarRegistroDiscosSector();
      }catch(err){ avisar('✗ No se pudo reabrir: ' + err.message, 'err'); }
    }), wrap);
  } else {
    const barra = document.createElement('div');
    barra.innerHTML = htmlBarraFinal('btnProvisorioDiscos', 'btnEnviarDiscos', 'Guardar y enviar final');
    cont.appendChild(barra);
    document.getElementById('btnProvisorioDiscos').onclick = () => guardarTodoDiscos(fecha, false);
    document.getElementById('btnEnviarDiscos').onclick = () => guardarTodoDiscos(fecha, true);
  }
}

async function guardarTodoDiscos(fecha, enviar){
  const msg = document.getElementById('msgRegistro');
  msg.className = 'msg'; msg.textContent = '';
  const filas = [...document.querySelectorAll('#contenidoRegistro tr[data-tipo]')];
  const conCantidad = filas.filter(tr => Number(tr.querySelector('.inp-cantidad-disco').value) > 0);
  const vaciadas = filas.filter(tr => tr.dataset.guardado && !(Number(tr.querySelector('.inp-cantidad-disco').value) > 0));
  if(enviar && !confirm('¿Guardar y enviar final el registro de discos de este día? Queda bloqueado.')) return;
  const items = conCantidad.map(tr => ({
    tipo: tr.dataset.tipo,
    responsable: tr.querySelector('.inp-responsable-disco').value,
    cantidad: tr.querySelector('.inp-cantidad-disco').value
  }));
  const btn = document.getElementById(enviar ? 'btnEnviarDiscos' : 'btnProvisorioDiscos');
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const data = await postJSON({ action: 'registrarTrazabilidadDiscosLote', fecha, items, borrar: vaciadas.map(tr => tr.dataset.tipo), enviar: !!enviar });
    conCantidad.forEach(marcarFilaGuardada);
    vaciadas.forEach(marcarFilaBorrada);
    const hora = horaCorta();
    if(enviar){
      avisar(`✓ Discos enviados · ${hora} — ${data.total_dia} tipo(s) guardados.`);
      msg.className = 'msg ok';
      msg.textContent = `✓ Enviado a las ${hora}: quedaron guardados ${data.total_dia} tipo(s) de disco para el ${fmtFecha(fecha)}.`;
      pintarRegistroDiscosSector();
    } else {
      const aviso = items.length ? `${items.length} tipo(s) nuevos guardados` : 'no había nada nuevo para guardar';
      avisar(`✓ Guardado provisorio · ${hora} — ${aviso}.`);
      msg.className = 'msg ok';
      msg.textContent = `✓ Guardado provisorio a las ${hora}: ${aviso}. En total hay ${data.total_dia} tipo(s) de disco guardados hoy. Podés seguir cargando.`;
    }
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

/* ---------------------------------------------------------------------
   Pantalla ENVÍOS (Fábrica): cuánto mandarle hoy a cada local
   --------------------------------------------------------------------- */
const LOCALES_VENTA = LOCALES.slice(0, 3); // Centro, Patagonia, Zelarrayan — sin sectores de Fábrica
let TAB_ENVIO_ACTIVO = LOCALES_VENTA[0];
let TRASPASO_ORIGEN = LOCALES_VENTA[0];
let TRASPASO_DESTINO = LOCALES_VENTA[1];
let DATOS_ENVIOS = null; // lo último que se leyó para la fecha (para repintar el traspaso)

function cssId(local){ return local.replace(/[^a-zA-Z0-9]/g, ''); }
// clave de un despacho: el local (fábrica → local) o "Origen>Destino" (traspaso)
function claveDespacho(origen, destino){ return origen ? `${origen}>${destino}` : destino; }

      </div>
      <div class="field-row">
        <label>Repartidor</label>
        <select id="inpRepartidorEnvio"><option value="">Cargando…</option></select>
      </div>
      <div class="field-row">

      (venta proyectada de ese local menos su stock cargado). Si un producto sale con más de un vencimiento,
      usá el botón <strong>+</strong>. En <strong>Traspaso entre locales</strong> se carga la mercadería que

async function cargarEnvios(){
  const fecha = document.getElementById('fechaEnvios').value;
  const cont = document.getElementById('contenidoEnvios');
  cont.className = 'loading'; cont.textContent = 'Calculando…';
  document.getElementById('tabsEnvios').style.display = 'none';
  const msg = document.getElementById('msgEnvios');
  msg.className = 'msg'; msg.textContent = '';

  try{
    const [r, categorias, empleados, rGuardado] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularEnvios&fecha=${fecha}`),
      obtenerCategorias(),
      obtenerEmpleados(),
      fetch(`${APPS_SCRIPT_URL}?action=obtenerEnviosDia&fecha=${fecha}`).then(x => x.json())
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    if(rGuardado.error) throw new Error(rGuardado.error);
    if(document.getElementById('fechaEnvios').value !== fecha) return; // cambió la fecha mientras cargaba
    const guardadoPorLocal = rGuardado.porLocal || {};
    const traspasos = rGuardado.traspasos || {};
    DATOS_ENVIOS = { fecha, data, categorias, traspasos };
    const conDatos = LOCALES_VENTA.map(l => guardadoPorLocal[l]).concat(Object.values(traspasos)).find(g => g && g.responsable) || {};

    document.getElementById('inpResponsableEnvio').innerHTML = opcionesEmpleadosSeleccion(empleados, conDatos.responsable);
    document.getElementById('inpRepartidorEnvio').innerHTML = opcionesEmpleadosSeleccion(empleados, conDatos.repartidor);
    document.getElementById('inpAcompananteEnvio').innerHTML = opcionesEmpleadosSeleccion(empleados, conDatos.acompanante);

    const tabs = document.getElementById('tabsEnvios');
    tabs.style.display = 'flex';
    const pestañas = LOCALES_VENTA.map(l => ({ id: l, texto: l + (guardadoPorLocal[l] && guardadoPorLocal[l].cierre ? ' ✓' : '') }))
      .concat([{ id: 'traspaso', texto: 'Traspaso entre locales' }]);
    tabs.innerHTML = pestañas.map(p => `<button class="tab-btn ${p.id===TAB_ENVIO_ACTIVO?'active':''}" data-tab="${p.id}">${p.texto}</button>`).join('');
    const mostrar = () => {
      [...tabs.querySelectorAll('.tab-btn')].forEach(x => x.classList.toggle('active', x.dataset.tab === TAB_ENVIO_ACTIVO));
      [...cont.querySelectorAll(':scope > .panel-tab')].forEach(p => p.style.display = (p.dataset.tab === TAB_ENVIO_ACTIVO ? '' : 'none'));
    };
    [...tabs.querySelectorAll('.tab-btn')].forEach(b => { b.onclick = () => { TAB_ENVIO_ACTIVO = b.dataset.tab; mostrar(); }; });

    cont.className = '';
    cont.innerHTML = '';
    LOCALES_VENTA.forEach(local => {
      const wrap = document.createElement('div');
      wrap.className = 'panel-tab'; wrap.dataset.tab = local;
      wrap.appendChild(pintarPanelEnvio({ origen: '', destino: local, itemsCalculados: data.envios[local] || [], data, categorias, guardado: guardadoPorLocal[local] || {} }));
      cont.appendChild(wrap);
    });
    const wrapT = document.createElement('div');
    wrapT.className = 'panel-tab'; wrapT.dataset.tab = 'traspaso';
    cont.appendChild(wrapT);
    pintarTraspaso(wrapT);
    mostrar();
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo calcular: ${err.message} <button class="btn secondary" style="font-size:12px;padding:5px 9px;margin-left:8px;" onclick="cargarEnvios()">Reintentar</button></div>`;
  }
}

// solapa "Traspaso entre locales": elegir de dónde sale y a dónde va
function pintarTraspaso(wrap){
  const { fecha, data, categorias, traspasos } = DATOS_ENVIOS;
  if(TRASPASO_ORIGEN === TRASPASO_DESTINO) TRASPASO_DESTINO = LOCALES_VENTA.find(l => l !== TRASPASO_ORIGEN);
  wrap.innerHTML = `
    <div class="fab-toolbar" style="justify-content:flex-start;">
      <div class="field-row"><label>Sale de (local)</label>
        <select id="selTraspasoOrigen">${LOCALES_VENTA.map(l => `<option ${l === TRASPASO_ORIGEN ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field-row"><label>Va a (local)</label>
        <select id="selTraspasoDestino">${LOCALES_VENTA.filter(l => l !== TRASPASO_ORIGEN).map(l => `<option ${l === TRASPASO_DESTINO ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="panel-traspaso"></div>`;
  wrap.querySelector('#selTraspasoOrigen').onchange = (e) => { TRASPASO_ORIGEN = e.target.value; pintarTraspaso(wrap); };
  wrap.querySelector('#selTraspasoDestino').onchange = (e) => { TRASPASO_DESTINO = e.target.value; pintarTraspaso(wrap); };
  const clave = claveDespacho(TRASPASO_ORIGEN, TRASPASO_DESTINO);
  wrap.querySelector('.panel-traspaso').appendChild(pintarPanelEnvio({
    origen: TRASPASO_ORIGEN, destino: TRASPASO_DESTINO, itemsCalculados: null, data, categorias, guardado: traspasos[clave] || {}
  }));
}

// una fila por producto (todos, siempre visibles y editables); "+" agrega
// otra fila del MISMO producto para otro vencimiento.
function filaEnvio(nombre, ordenCalculada, esExtra, guardado, conOrden, panelEstado){
  const g = guardado || {};
  const tr = document.createElement('tr');
  tr.dataset.item = nombre;
  tr.dataset.orden = esExtra ? 0 : (ordenCalculada || 0);
  tr.innerHTML = `
    <td>${esExtra ? `<span class="item-extra">↳ otro lote</span>` : nombre}</td>
    ${conOrden ? `<td class="num" style="color:var(--ink-soft);">${esExtra ? '' : ent(ordenCalculada)}</td>` : ''}
    <td><input type="number" min="0" step="1" class="inp-cant" placeholder="0" value="${g.cantidad || ''}"></td>
    <td><input type="date" class="inp-venc" value="${g.vencimiento || ''}"></td>
    <td class="col-add">${esExtra ? '' : '<button type="button" class="add-lote-btn" title="Agregar otro vencimiento para este producto">+</button>'}</td>
    <td class="col-del">${esExtra ? '<button type="button" class="del-btn" title="Quitar">✕</button>' : ''}</td>
    <td class="no-print celda-estado" style="white-space:nowrap;"></td>
  `;
  if(esExtra){
    tr.querySelector('.del-btn').onclick = () => {
      if(tr.dataset.guardado) panelEstado.borrados.push({ sabor: nombre, vencimiento: tr.dataset.vencGuardado });
      tr.remove();
    };
  } else {
    tr.querySelector('.add-lote-btn').onclick = () => {
      tr.insertAdjacentElement('afterend', filaEnvio(nombre, ordenCalculada, true, null, conOrden, panelEstado));
    };
  }
  if(guardado){
    tr.dataset.guardado = '1';
    tr.dataset.vencGuardado = g.vencimiento || '';
    tr.classList.add('fila-guardada');
    ponerSello(tr, g.recibido ? null : null);
    if(g.recibido){ const s = tr.querySelector('.sello-guardado'); if(s) s.textContent = '✓ Recibido'; }
  }
  return tr;
}

function pintarPanelEnvio({ origen, destino, itemsCalculados, data, categorias, guardado }){
  const clave = claveDespacho(origen, destino);
  const id = cssId(clave);
  const conOrden = !origen; // la orden calculada es solo para lo que manda fábrica
  const porSabor = {};
  (itemsCalculados || []).forEach(it => { porSabor[it.sabor] = it; });
  const guardadosPorItem = {};
  ((guardado && guardado.items) || []).forEach(it => {
    guardadosPorItem[it.sabor] = guardadosPorItem[it.sabor] || [];
    guardadosPorItem[it.sabor].push(it);
  });
  const cierre = guardado && guardado.cierre;
  const panelEstado = { borrados: [] };

  const div = document.createElement('div');
  div.className = 'panel-envio-local';
  div.dataset.clave = clave;
  div._estado = panelEstado;

  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = origen
    ? `${data.dia}, ${fmtFecha(data.fecha)} — mercadería que sale de ${origen} y va a ${destino}`
    : `${data.dia}, ${fmtFecha(data.fecha)} — orden calculada para ${destino}`;
  div.appendChild(intro);

  const nav = document.createElement('div');
  nav.className = 'cat-nav';
  div.appendChild(nav);

  const tablas = document.createElement('div');
  seguirCambios(tablas);
  Object.keys(categorias).forEach((cat, i) => {
    const catId = `cat-envio-${id}-${i}`;
    const h = document.createElement('h4');
    h.className = 'cat-heading'; h.id = catId; h.textContent = cat;
    tablas.appendChild(h);
    const table = document.createElement('table');
    table.className = 'lotes';
    table.innerHTML = `
      <thead><tr>
        <th>Sabor / ítem</th>
        ${conOrden ? '<th class="col-cant">Orden calculada</th>' : ''}
        <th class="col-cant">${origen ? 'Cantidad' : 'Enviado (real)'}</th>
        <th class="col-venc">Vencimiento</th>
        <th class="col-add"></th><th class="col-del"></th><th></th>
      </tr></thead><tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    categorias[cat].forEach(nombre => {
      const orden = (porSabor[nombre] && porSabor[nombre].aHacerUnidades) || 0;
      const gs = guardadosPorItem[nombre] || [];
      if(gs.length === 0) tbody.appendChild(filaEnvio(nombre, orden, false, null, conOrden, panelEstado));
      else gs.forEach((g, k) => tbody.appendChild(filaEnvio(nombre, orden, k > 0, g, conOrden, panelEstado)));
    });
    tablas.appendChild(table);
    const a = document.createElement('a');
    a.href = `#${catId}`; a.textContent = cat;
    nav.appendChild(a);
  });
  div.appendChild(tablas);

  const titulo = origen ? `traspaso de ${origen} a ${destino}` : `despacho a ${destino}`;
  const actions = document.createElement('div');
  if(cierre){
    bloquearFilasEnviadas(div);
    div.insertBefore(cartelEnviado(cierre, origen ? `Traspaso ${origen} → ${destino}` : `Despacho a ${destino}`, cierre.puedeReabrir === false ? null : async () => {
      if(!confirm(`¿Reabrir el ${titulo}? Lo que ${destino} todavía no confirmó deja de aparecerle hasta que se vuelva a enviar.`)) return;
      try{
        await postJSON({ action: 'reabrirCarga', pantalla: 'Envios', fecha: data.fecha, clave });
        avisar(`${origen ? 'Traspaso' : 'Despacho'} reabierto — ya se puede editar.`);
        cargarEnvios();
      }catch(err){ avisar('✗ No se pudo reabrir: ' + err.message, 'err'); }
    }), nav);
    if(!origen){
      actions.className = 'actions no-print';
      actions.innerHTML = `<button class="btn secondary" id="btnImprimirEnvio-${id}">🖶 Imprimir orden de envío</button>`;
    }
  } else {
    actions.innerHTML = htmlBarraFinal(`btnProvisorioEnvio-${id}`, `btnGuardarEnvio-${id}`, 'Guardar y enviar final',
      origen
        ? `<strong>Guardado provisorio</strong>: guarda lo cargado y se puede seguir armando. <strong>Guardar y enviar final</strong>: cierra el traspaso; recién ahí ${origen} lo ve para confirmar que lo entregó y ${destino} para confirmar que lo recibió.`
        : `<strong>Guardado provisorio</strong>: guarda lo cargado y se puede seguir armando el despacho — ${destino} todavía NO lo ve. <strong>Guardar y enviar final</strong>: guarda todo, cierra el despacho y recién ahí le aparece a ${destino} en "Confirmar recepción".`)
      + (origen ? '' : `<div class="actions no-print" style="margin-top:10px;"><button class="btn secondary" id="btnImprimirEnvio-${id}">🖶 Imprimir orden de envío</button></div>`);
  }
  div.appendChild(actions);

  // conectar botones (el panel todavía no está en la página: se buscan dentro de él)
  setTimeout(() => {
    const bProv = document.getElementById(`btnProvisorioEnvio-${id}`);
    const bEnv = document.getElementById(`btnGuardarEnvio-${id}`);
    const bImp = document.getElementById(`btnImprimirEnvio-${id}`);
    if(bProv) bProv.onclick = () => guardarEnvio(div, origen, destino, data.fecha, false);
    if(bEnv) bEnv.onclick = () => guardarEnvio(div, origen, destino, data.fecha, true);
    if(bImp) bImp.onclick = () => imprimirOrdenEnvio(div, destino, data.fecha);
  }, 0);
  return div;
}

// lee los 3 campos compartidos del despacho (responsable, repartidor, acompañante)
function datosComunesEnvio(){
  return {
    responsable: document.getElementById('inpResponsableEnvio').value.trim(),
    repartidor: document.getElementById('inpRepartidorEnvio').value.trim(),
    acompanante: document.getElementById('inpAcompananteEnvio').value.trim()
  };
}

// "Guardado provisorio" / "Guardar y enviar final" de un despacho (fábrica →
// local) o de un traspaso (local → local). Guarda todas las filas completas
// y borra de la planilla lo que estaba guardado y se dejó en blanco.
async function guardarEnvio(panel, origen, destino, fecha, enviar){
  const { responsable, repartidor, acompanante } = datosComunesEnvio();
  const msg = document.getElementById('msgEnvios');
  msg.className = 'msg'; msg.textContent = '';
  const titulo = origen ? `traspaso de ${origen} a ${destino}` : `despacho a ${destino}`;
  if(!responsable){
    msg.className = 'msg err'; msg.textContent = 'Indicá quién está despachando (arriba de todo).';
    avisar('✗ Falta indicar quién despacha.', 'err');
    return;
  }
  const filas = [...panel.querySelectorAll('tr[data-item]')];
  const completas = [], incompletas = [], vaciadas = [];
  filas.forEach(tr => {
    const cantidad = tr.querySelector('.inp-cant').value;
    const vencimiento = tr.querySelector('.inp-venc').value;
    const tieneCant = cantidad && Number(cantidad) > 0;
    if(tieneCant && vencimiento) completas.push(tr);
    else if(tieneCant || vencimiento) incompletas.push(tr.dataset.item + (tieneCant ? ' (falta vencimiento)' : ' (falta cantidad)'));
    else if(tr.dataset.guardado) vaciadas.push(tr);
  });
  if(enviar && incompletas.length){
    msg.className = 'msg err';
    msg.textContent = 'No se envió: hay productos a medio completar — ' + incompletas.join(', ') + '. Completalos o borrales el dato.';
    avisar('✗ No se envió: hay productos a medio completar (ver abajo).', 'err');
    return;
  }
  if(enviar && completas.length === 0){
    msg.className = 'msg err'; msg.textContent = `No hay nada cargado en el ${titulo}.`;
    avisar(`✗ No hay nada cargado en el ${titulo}.`, 'err');
    return;
  }
  const items = completas.map(tr => {
    const it = { sabor: tr.dataset.item, cantidad: tr.querySelector('.inp-cant').value, vencimiento: tr.querySelector('.inp-venc').value };
    if(tr.dataset.vencGuardado && tr.dataset.vencGuardado !== it.vencimiento) it.vencimientoAnterior = tr.dataset.vencGuardado;
    return it;
  });
  const tocados = completas.filter(tr => !tr.dataset.guardado || tr.classList.contains('fila-pendiente'))
    .map(tr => ({ sabor: tr.dataset.item, vencimiento: tr.querySelector('.inp-venc').value }));
  if(!confirmarVencimientos(tocados, fecha)) return;
  if(enviar && !confirm(`¿Guardar y enviar final el ${titulo}? ${origen ? `Recién ahí ${origen} y ${destino} lo ven para confirmar.` : `Recién ahí le aparece a ${destino} para confirmar la recepción.`}`)) return;
  const borrar = vaciadas.map(tr => ({ sabor: tr.dataset.item, vencimiento: tr.dataset.vencGuardado })).concat(panel._estado.borrados);

  const id = cssId(claveDespacho(origen, destino));
  const btn = document.getElementById(enviar ? `btnGuardarEnvio-${id}` : `btnProvisorioEnvio-${id}`);
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const resp = await postJSON({ action: 'registrarEnvio', origen, local: destino, fecha, responsable, repartidor, acompanante, items, borrar, enviar: !!enviar });
    completas.forEach(marcarFilaGuardada);
    vaciadas.forEach(marcarFilaBorrada);
    panel._estado.borrados = [];
    const hora = horaCorta();
    const extra = (resp.borrados ? ` Se borraron ${resp.borrados} producto(s) que dejaste en blanco.` : '')
      + (resp.no_borrados ? ` ${resp.no_borrados} no se borraron porque el local ya los recibió.` : '');
    if(enviar){
      avisar(`✓ ${origen ? 'Traspaso' : 'Despacho'} enviado · ${hora} — ${resp.total_dia} producto(s).`);
      await cargarEnvios(); // vuelve a leer de la planilla y muestra el despacho cerrado (limpia el mensaje)
      msg.className = 'msg ok';
      msg.textContent = `✓ ${titulo[0].toUpperCase() + titulo.slice(1)} enviado a las ${hora}: ${resp.total_dia} producto(s) guardados.${extra}`;
    } else {
      avisar(`✓ Guardado provisorio · ${hora} — ${resp.total_dia} producto(s) en el ${titulo}.`);
      msg.className = incompletas.length ? 'msg err' : 'msg ok';
      msg.textContent = `✓ Guardado provisorio a las ${hora}: hay ${resp.total_dia} producto(s) guardados en el ${titulo}.${extra} Todavía NO se envió.`
        + (incompletas.length ? ' OJO — no se guardaron porque están a medio completar: ' + incompletas.join(', ') + '.' : '');
    }
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

// Hoja de "Orden de envío" imprimible para UN local. Si ya cargaron cantidad
// a mano, imprime eso; si no, imprime la orden CALCULADA (sirve de planilla
// en papel para armar el envío y cargarlo después).
function imprimirOrdenEnvio(panel, local, fecha){
  const filas = [...panel.querySelectorAll('tr[data-item]')];
  const porSabor = {};
  filas.forEach(tr => {
    const nombre = tr.dataset.item;
    const cantidadReal = Number(tr.querySelector('.inp-cant').value) || 0;
    const venc = tr.querySelector('.inp-venc').value;
    if(!porSabor[nombre]){
      porSabor[nombre] = { ordenCalculada: Number(tr.dataset.orden) || 0, cantidadReal: 0, vencimiento: '' };
    }
    porSabor[nombre].cantidadReal += cantidadReal;
    if(!porSabor[nombre].vencimiento && venc) porSabor[nombre].vencimiento = venc;
  });
  Object.keys(porSabor).forEach(n => {
    const it = porSabor[n];
    it.cantidadImprimir = it.cantidadReal > 0 ? it.cantidadReal : it.ordenCalculada;
  });

  const hayAlgo = Object.keys(porSabor).some(n => porSabor[n].cantidadImprimir > 0);
  if(!hayAlgo){
    alert(`No hay nada para enviar a ${local} hoy (ni cargado ni calculado).`);
    return;
  }

  const categorias = SABORES_CACHE || {};
  let filasHtml = '';
  Object.keys(categorias).forEach(cat => {
    const nombres = categorias[cat].filter(n => porSabor[n] && porSabor[n].cantidadImprimir > 0);
    if(nombres.length === 0) return;
    filasHtml += `

async function cargarPendientesRecepcion(){
  const local = document.getElementById('selLocalRecepcion').value;
  const cont = document.getElementById('contenidoRecepcion');
  cont.className = 'loading'; cont.textContent = 'Buscando envíos pendientes…';
  const msg = document.getElementById('msgRecepcion');
  msg.className = 'msg'; msg.textContent = '';

  try{
    const [r, categorias] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=listarEnviosPendientes&local=${encodeURIComponent(local)}`).then(x => x.json()),
      obtenerCategorias()
    ]);
    const data = r;
    if(data.error) throw new Error(data.error);
    if(document.getElementById('selLocalRecepcion').value !== local) return;
    const pendientes = data.pendientes || [];
    const salidas = data.salidas || [];
    cont.className = '';

    // agrupar por categoría (en el orden de siempre) y de la A a la Z
    const catDe = {};
    Object.keys(categorias).forEach(c => categorias[c].forEach(n => { catDe[n] = c; }));
    const ordenCats = Object.keys(categorias);
    const agrupar = (lista) => {
      const grupos = {};
      lista.forEach(p => { const c = catDe[p.Sabor] || 'Otros'; (grupos[c] = grupos[c] || []).push(p); });
      return ordenCats.concat(['Otros']).filter(c => grupos[c]).map(c => ({ cat: c, items: grupos[c].sort((a, b) => compararTexto(a.Sabor, b.Sabor)) }));
    };

    let html = '';
    if(pendientes.length === 0){
      html += `<div class="empty">No hay envíos pendientes de recibir en ${local}.</div>`;
    } else {
      html += `<h3 style="font-size:16px;margin:8px 0 0;">Mercadería que llega a ${local}</h3>`;
      agrupar(pendientes).forEach(g => {
        html += `<h4 class="cat-heading">${g.cat}</h4>
          <table class="lotes">
            <thead><tr><th>Sabor / ítem</th><th>Viene de</th><th>Enviado el</th><th class="col-cant">Cant. enviada</th><th>Vencimiento</th><th class="col-cant">Cant. recibida</th><th></th></tr></thead>
            <tbody>
              ${g.items.map(p => `
                <tr data-id="${p.ID}">
                  <td>${p.Sabor}</td>
                  <td>${p.Origen ? `<strong class="origen-traspaso">Ingresa desde ${p.Origen}</strong>` : '<span style="color:var(--ink-soft);">Fábrica</span>'}</td>
                  <td style="color:var(--ink-soft);font-size:12.5px;">${fmtFecha(p.Fecha_envio)}</td>
                  <td class="num" style="color:var(--ink-soft);">${ent(p.Cantidad_Enviada)}</td>
                  <td style="color:var(--ink-soft);font-size:12.5px;">${fmtFecha(p.Vencimiento)}</td>
                  <td><input type="number" min="0" step="1" class="inp-recibido" style="max-width:90px;" value="${p.Cantidad_Recibida !== '' && p.Cantidad_Recibida != null ? p.Cantidad_Recibida : p.Cantidad_Enviada}"></td>
                  <td class="celda-estado" style="white-space:nowrap;">${p.Cantidad_Recibida !== '' && p.Cantidad_Recibida != null ? '<span class="sello-guardado">✓ Guardado</span>' : ''}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      });
      html += htmlBarraFinal('btnProvisorioRecepcion', 'btnConfirmarRecepcion', 'Guardar y confirmar recepción',
        '<strong>Guardado provisorio</strong>: guarda las cantidades recibidas cargadas hasta ahora (se pueden seguir corrigiendo). <strong>Guardar y confirmar recepción</strong>: guarda todo y da por recibido el envío.');
    }

    // TRASPASOS: lo que sale de este local hacia otro — el local confirma que lo entregó
    if(salidas.length){
      html += `<div class="bloque-salidas">
        <h3 style="font-size:16px;margin:0 0 4px;">Mercadería que sale de ${local} hacia otro local</h3>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 6px;">Fábrica la retira para llevarla a otro local. Confirmá que la entregaste.</p>`;
      agrupar(salidas).forEach(g => {
        html += `<h4 class="cat-heading">${g.cat}</h4>
          <table class="lotes">
            <thead><tr><th>Sabor / ítem</th><th>Va a</th><th>Fecha</th><th class="col-cant">Cantidad</th><th>Vencimiento</th></tr></thead>
            <tbody>
              ${g.items.map(p => `
                <tr data-salida="${p.ID}">
                  <td>${p.Sabor}</td>
                  <td><strong class="origen-traspaso">Sale hacia ${p.Local}</strong></td>
                  <td style="color:var(--ink-soft);font-size:12.5px;">${fmtFecha(p.Fecha_envio)}</td>
                  <td class="num">${ent(p.Cantidad_Enviada)}</td>
                  <td style="color:var(--ink-soft);font-size:12.5px;">${fmtFecha(p.Vencimiento)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      });
      html += `<div class="actions"><button class="btn" id="btnConfirmarEntrega">Confirmar que entregué esta mercadería</button></div></div>`;
    }
    cont.innerHTML = html;
    seguirCambios(cont);
    const bP = document.getElementById('btnProvisorioRecepcion');
    if(bP) bP.onclick = () => guardarRecepcion(false);
    const bC = document.getElementById('btnConfirmarRecepcion');
    if(bC) bC.onclick = () => guardarRecepcion(true);
    const bE = document.getElementById('btnConfirmarEntrega');
    if(bE) bE.onclick = confirmarEntregaSalidas;
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo buscar: ${err.message}</div>`;
  }
}

async function confirmarEntregaSalidas(){
  const local = document.getElementById('selLocalRecepcion').value;
  const responsable = document.getElementById('inpResponsableRecepcion').value.trim();
  const msg = document.getElementById('msgRecepcion');
  if(!responsable){
    msg.className = 'msg err'; msg.textContent = 'Indicá quién entrega (arriba de todo).';
    avisar('✗ Falta indicar quién entrega.', 'err');
    return;
  }
  const ids = [...document.querySelectorAll('#contenidoRecepcion tr[data-salida]')].map(tr => tr.dataset.salida);
  if(!confirm(`¿Confirmar que ${local} entregó ${ids.length} producto(s) para llevar a otro local?`)) return;
  const btn = document.getElementById('btnConfirmarEntrega');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const data = await postJSON({ action: 'confirmarEntregaTraspaso', local, responsable, fecha: hoyISO(), ids });
    await cargarPendientesRecepcion();
    const hora = horaCorta();
    msg.className = 'msg ok';
    msg.textContent = `✓ Entrega confirmada a las ${hora}: ${data.confirmados} producto(s).`;
    avisar(`✓ Entrega confirmada · ${hora} — ${data.confirmados} producto(s).`);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Confirmar que entregué esta mercadería';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }
}

async function guardarRecepcion(confirmar){
  const local = document.getElementById('selLocalRecepcion').value;
  const responsable = document.getElementById('inpResponsableRecepcion').value.trim();
  const msg = document.getElementById('msgRecepcion');
  msg.className = 'msg'; msg.textContent = '';
  if(!responsable){
    msg.className = 'msg err'; msg.textContent = 'Indicá quién está recibiendo (arriba de todo).';
    avisar('✗ Falta indicar quién recibe.', 'err');
    return;
  }
  const filas = [...document.querySelectorAll('#contenidoRecepcion tr[data-id]')];
  const confirmaciones = filas.map(tr => ({
    id: tr.dataset.id,
    cantidadRecibida: tr.querySelector('.inp-recibido').value
  })).filter(c => c.cantidadRecibida !== '');

  if(confirmaciones.length === 0){
    msg.className = 'msg err'; msg.textContent = 'Cargá la cantidad recibida de al menos un producto.'; return;
  }
  if(confirmar && !confirm(`¿Confirmar la recepción de ${confirmaciones.length} producto(s) en ${local}? Quedan como recibidos.`)) return;
  const btn = document.getElementById(confirmar ? 'btnConfirmarRecepcion' : 'btnProvisorioRecepcion');
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const data = await postJSON({ action: 'confirmarRecepcion', local, responsable, confirmaciones, provisorio: !confirmar });
    const hora = horaCorta();
    if(confirmar){
      await cargarPendientesRecepcion(); // (esto limpia el mensaje, por eso va antes)
      msg.className = 'msg ok';
      msg.textContent = `✓ Recepción confirmada a las ${hora}: ${data.confirmados} producto(s) guardados como recibidos.`;
      avisar(`✓ Recepción confirmada · ${hora} — ${data.confirmados} producto(s).`);
    } else {
      filas.forEach(tr => { if(tr.querySelector('.inp-recibido').value !== '') ponerSello(tr, hora); });
      msg.className = 'msg ok';
      msg.textContent = `✓ Guardado provisorio a las ${hora}: ${data.confirmados} cantidad(es) recibida(s) guardadas. Todavía falta "Guardar y confirmar recepción".`;
      avisar(`✓ Guardado provisorio · ${hora} — ${data.confirmados} producto(s). Falta confirmar.`);
    }
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó la recepción — ' + err.message, 'err');
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

// nombres de sabor en la planilla que no calzan tal cual con el sistema
// (por ambigüedad con otro ítem de igual nombre en otro rubro)
const ALIAS_IMPORT = {
  'DIPS|ED. LIMITADA': 'ED. LIMITADA (dip)',
  'CAJITA CRIOLLA|JAMON Y QUESO': 'CAJITA JAMON Y QUESO',
  'CAJITA CRIOLLA|HAMBURGUESA': 'CAJITA HAMBURGUESA',
  'CAJITA CRIOLLA|CHOCLO': 'CAJITA CHOCLO',
  'CAJITA CRIOLLA|POLLO Y CHEDDAR': 'CAJITA POLLO Y CHEDDAR',
  'CAJITA CRIOLLA|COOKIES *2': 'BOLSA COOKIES X2',
};
const CATEGORIAS_EXCEL = ['EMPANADAS','TOPPINGS','DIPS','POSTRES','CAJITA CRIOLLA'];
const HOJA_A_LOCAL = { CENTRO: 'Centro', PATAGONIA: 'Patagonia', ZELARRAYAN: 'Zelarrayan' };

function normalizarNombre(s){
  return String(s).trim().toUpperCase().replace(/\s+/g, ' ');
}

async function importarExcelPlanificacion(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const msg = document.getElementById('msgImportPlan');
  msg.className = 'msg'; msg.style.display = 'block'; msg.textContent = 'Leyendo archivo…';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });

    // mapa Sabor (real, del sistema) -> normalizado, para matchear
    const sabores = await obtenerSaboresPlanos();
    const porNombreNormalizado = {};
    sabores.forEach(s => { porNombreNormalizado[normalizarNombre(s)] = s; });

    const sinMatch = [];
    let totalActualizados = 0;
    let totalCreados = 0;

    for(const hoja of Object.keys(HOJA_A_LOCAL)){
      if(!wb.SheetNames.includes(hoja)){ continue; }
      const local = HOJA_A_LOCAL[hoja];
      const filasHoja = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: 0 });

      let categoriaActual = null;
      const filasParaGuardar = [];
      filasHoja.forEach(fila => {
        const primera = fila[0];
        if(primera === undefined || primera === null || primera === '') return;
        const texto = String(primera).trim();
        if(CATEGORIAS_EXCEL.includes(texto.toUpperCase())){ categoriaActual = texto.toUpperCase(); return; }
        if(texto.toUpperCase() === 'LUNES') return; // fila de encabezado de días

        const alias = ALIAS_IMPORT[`${categoriaActual}|${normalizarNombre(texto)}`];
        const saborReal = alias || porNombreNormalizado[normalizarNombre(texto)];
        if(!saborReal){ sinMatch.push(texto); return; }

        // columnas 1..7 = Lunes..Domingo
        filasParaGuardar.push({
          sabor: saborReal,
          Lunes: fila[1]||0, Martes: fila[2]||0, Miércoles: fila[3]||0, Jueves: fila[4]||0,
          Viernes: fila[5]||0, Sábado: fila[6]||0, Domingo: fila[7]||0
        });
      });

      if(filasParaGuardar.length > 0){
        const r = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'actualizarPlanificacion', local, filas: filasParaGuardar })
        });
        const resp = await r.json();
        if(resp.error) throw new Error(`${local}: ${resp.error}`);
        totalActualizados += resp.filas_actualizadas;
        totalCreados += resp.filas_creadas || 0;
      }
    }

    const unicosSinMatch = [...new Set(sinMatch)];
    msg.className = unicosSinMatch.length ? 'msg err' : 'msg ok';
    msg.textContent = `Importado: ${totalActualizados} ítem(s) actualizados en los 3 locales.` +
      (totalCreados > 0 ? ` (${totalCreados} fila(s) nueva(s) creadas porque no existían todavía).` : '') +
      (unicosSinMatch.length ? ` Sin encontrar en el sistema (se ignoraron): ${unicosSinMatch.join(', ')}` : '');
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'No se pudo importar: ' + err.message;
  }
  ev.target.value = ''; // permite volver a subir el mismo archivo si hace falta
}

async function obtenerSaboresPlanos(){
  const categorias = await obtenerCategorias();
  return Object.values(categorias).flat();
}

/* ---------------------------------------------------------------------
   Pantalla FICHAS TÉCNICAS: importar/actualizar recetas (Rellenos,
   Preparados, Postres, Dips, Edición Limitada) desde el .xlsx de cada una.
   Se parsea directo acá en el navegador (con la misma librería XLSX que ya
   usa la importación de Planificación) — el backend solo guarda lo ya
   armado en Ref_Recetas / Ref_RecetaDetalle.
   --------------------------------------------------------------------- */
const TIPOS_FICHA = [
  { value: 'Relleno', label: 'Relleno' },
  { value: 'Preparado', label: 'Preparado' },
  { value: 'Postre', label: 'Postre' },
  { value: 'Dip', label: 'Dip' },
  { value: 'EdicionLimitada', label: 'Edición Limitada' }
];
const SECCIONES_FIN_FICHA = ['PROCEDIMIENTO', 'DATOS TECNIC', 'PUNTOS DE CONTROL'];

function normalizarFicha(s){
  return String(s == null ? '' : s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}

// única lógica de parseo — corre acá en el navegador (Code.gs solo recibe
// el JSON ya armado, ver importarFichaTecnica en Code.gs).
function parseFichaTecnica(filas){
  let filaHeader = -1;
  let colClasif = -1, colIngred = -1, colCant = -1, colMedida = -1, colRinde = -1;
  for(let r = 0; r < Math.min(filas.length, 10); r++){
    const fila = filas[r];
    let cIdxClasif = -1, cIdxIngred = -1;
    for(let c = 0; c < fila.length; c++){
      const v = normalizarFicha(fila[c]);
      if(v === 'CLASIFICACION') cIdxClasif = c;
      if(v === 'INGREDIENTE') cIdxIngred = c;
    }
    if(cIdxClasif !== -1 && cIdxIngred !== -1){
      filaHeader = r; colClasif = cIdxClasif; colIngred = cIdxIngred;
      for(let c = 0; c < fila.length; c++){
        const v = normalizarFicha(fila[c]);
        if(v === 'CANTIDAD') colCant = c;
        if(v === 'MEDIDA') colMedida = c;
        if(v === 'RINDE') colRinde = c;
      }
      break;
    }
  }
  if(filaHeader === -1) return null;

  // el "Rinde:" puede traer DOS pares cantidad+unidad, uno debajo del otro
  // (ej. Dips: "3 KG" y, en la fila de abajo, "75 UN") — se guardan los dos
  // para poder convertir entre kilos y unidades más adelante.
  let rindeCantidad = '', rindeUnidad = '', rindeCantidad2 = '', rindeUnidad2 = '';
  let filaRindeEncontrada = -1, colRindeLabel = -1;
  for(let r = 0; r < filaHeader; r++){
    const fila = filas[r];
    for(let c = 0; c < fila.length; c++){
      if(normalizarFicha(fila[c]).indexOf('RINDE') === 0){
        const resto = fila.slice(c + 1).filter(x => x !== '' && x != null);
        if(resto.length >= 1) rindeCantidad = resto[0];
        if(resto.length >= 2) rindeUnidad = resto[1];
        filaRindeEncontrada = r;
        colRindeLabel = c;
      }
    }
  }
  if(filaRindeEncontrada !== -1 && filaRindeEncontrada + 1 < filaHeader){
    const filaSig = filas[filaRindeEncontrada + 1];
    const restoSig = filaSig.slice(colRindeLabel + 1).filter(x => x !== '' && x != null);
    if(restoSig.length >= 2 && !isNaN(Number(restoSig[0]))){
      rindeCantidad2 = restoSig[0];
      rindeUnidad2 = restoSig[1];
    }
  }

  const ingredientes = [];
  for(let r = filaHeader + 1; r < filas.length; r++){
    const fila = filas[r];
    const clasif = fila[colClasif];
    const ingred = fila[colIngred];
    const clasifNorm = normalizarFicha(clasif);
    if(SECCIONES_FIN_FICHA.some(k => clasifNorm.indexOf(k) === 0)) break;
    if((clasif === '' || clasif == null) && (ingred === '' || ingred == null)) break;
    if(ingred === '' || ingred == null) continue;
    ingredientes.push({
      clasificacion: clasif || '',
      ingrediente: String(ingred).trim(),
      cantidad: colCant !== -1 && fila[colCant] !== '' && fila[colCant] != null ? Number(fila[colCant]) : '',
      medida: colMedida !== -1 ? (fila[colMedida] || '') : '',
      rinde: colRinde !== -1 && fila[colRinde] !== '' && fila[colRinde] != null ? Number(fila[colRinde]) : ''
    });
  }
  return { rindeCantidad, rindeUnidad, rindeCantidad2, rindeUnidad2, ingredientes };
}

async function renderFichasTecnicas(){
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <header class="top"><h1>Fichas técnicas</h1></header>
    <p style="color:var(--ink-soft);font-size:13px;">
      Importá acá el .xlsx de cada ficha (Rellenos, Preparados, Postres, Dips, Edición Limitada) — cada solapa del
      Excel es una receta. Volver a importar una ficha reemplaza sus recetas por la versión nueva. El nombre de
      cada solapa tiene que ser igual al Relleno/Sabor que ya usás en el resto del sistema, para que puedan cruzarse.
    </p>

    <div style="border:1px dashed var(--line);border-radius:4px;padding:14px 16px;margin:16px 0;max-width:480px;">

// tipo de ficha -> a qué lista de nombres ya existentes se compara cada
// solapa, para poder avisar ANTES de guardar si el nombre no coincide con
// nada (Relleno/Sabor con typo, o directamente inventado). Los Preparados
// no se validan porque no aparecen sueltos en ningún lado — solo se usan
// como ingrediente adentro de otras fichas.
async function referenciaParaTipo(tipoFicha){
  if(tipoFicha === 'Relleno' || tipoFicha === 'EdicionLimitada') return await obtenerRellenos();
  if(tipoFicha === 'Postre' || tipoFicha === 'Dip') return Object.values(await obtenerCategorias()).flat();
  return null;
}

async function manejarArchivoFicha(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const tipoFicha = document.getElementById('selTipoFicha').value;
  const msg = document.getElementById('msgImportFicha');
  document.getElementById('revisionFichaContainer').innerHTML = '';
  msg.className = 'msg'; msg.style.display = 'block'; msg.textContent = 'Leyendo archivo…';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });

    const recetas = [];
    const salteadas = [];
    wb.SheetNames.forEach(nombreHoja => {
      const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, raw: true, defval: '' });
      const parsed = parseFichaTecnica(filas);
      if(!parsed){ salteadas.push(nombreHoja); return; }
      recetas.push({
        nombreReceta: nombreHoja.trim(),
        rindeCantidad: parsed.rindeCantidad, rindeUnidad: parsed.rindeUnidad,
        rindeCantidad2: parsed.rindeCantidad2, rindeUnidad2: parsed.rindeUnidad2,
        ingredientes: parsed.ingredientes
      });
    });

    if(recetas.length === 0){
      msg.className = 'msg err'; msg.textContent = 'No encontré ninguna receta en ese archivo.';
      ev.target.value = ''; return;
    }

    msg.style.display = 'none';
    const referencia = await referenciaParaTipo(tipoFicha);
    mostrarRevisionFicha(tipoFicha, recetas, salteadas, referencia);
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'No se pudo leer el archivo: ' + err.message;
  }
  ev.target.value = '';
}

// pantalla de revisión ANTES de guardar: por cada solapa, dice si el nombre
// coincide con un Relleno/Sabor que ya existe en el sistema; si no coincide
// deja un campo para escribir a mano a qué corresponde en vez de cancelar
// todo e ir a corregir el Excel.
function mostrarRevisionFicha(tipoFicha, recetas, salteadas, referencia){
  const rev = document.getElementById('revisionFichaContainer');
  const referenciaNorm = referencia ? referencia.map(n => normalizarFicha(n)) : null;
  const etiquetaReferencia = (tipoFicha === 'Postre' || tipoFicha === 'Dip') ? 'Sabores' : 'Rellenos';

  const filasHtml = recetas.map((r, i) => {
    const coincide = referenciaNorm === null ? null : referenciaNorm.indexOf(normalizarFicha(r.nombreReceta)) !== -1;
    const estado = coincide === null
      ? `<span style="color:var(--ink-soft);">— no se valida (Preparado)</span>`
      : coincide
        ? `<span style="color:#3f7a4a;">✓ coincide</span>`
        : `<span style="color:#b23b2e;">⚠ no encontré ese nombre entre los ${etiquetaReferencia}</span>`;
    const rinde2 = r.rindeCantidad2 !== '' ? ` / ${r.rindeCantidad2} ${r.rindeUnidad2}` : '';
    return `
      <tr>
        <td>${r.nombreReceta}<br>${estado}</td>
        <td>${r.rindeCantidad} ${r.rindeUnidad}${rinde2}</td>
        <td>${r.ingredientes.length}</td>
        <td><input type="text" class="inp-nombre-correcto" data-idx="${i}" placeholder="dejar igual"></td>
      </tr>`;
  }).join('');

  const salteadasHtml = salteadas.length
    ? `<p style="color:var(--ink-soft);font-size:12.5px;margin-top:10px;">Se salteó (no parece una hoja de receta): ${salteadas.join(', ')}.</p>`
    : '';

  rev.innerHTML = `
    <div style="border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:16px 0;">
      <p style="font-size:13px;margin-bottom:10px;">
        Revisá antes de guardar. Si alguna receta dice "⚠ no encontré ese nombre", escribí en la última columna
        a qué ${etiquetaReferencia.slice(0, -1)} corresponde tal cual está en el sistema (o cancelá y corregí el
        nombre de la solapa en el Excel).
      </p>
      <table class="lotes" style="width:100%;">
        <thead><tr><th>Receta (solapa del Excel)</th><th>Rinde</th><th>Ingredientes</th><th>Corregir nombre a…</th></tr></thead>
        <tbody>${filasHtml}</tbody>
      </table>
      ${salteadasHtml}
      <div class="actions" style="margin-top:12px;">
        <button class="btn" id="btnConfirmarFicha">Confirmar y guardar</button>
        <button class="btn secondary" id="btnCancelarFicha">Cancelar</button>
      </div>
      <div class="msg" id="msgConfirmarFicha"></div>
    </div>`;

  document.getElementById('btnCancelarFicha').onclick = () => { rev.innerHTML = ''; };
  document.getElementById('btnConfirmarFicha').onclick = async () => {
    rev.querySelectorAll('.inp-nombre-correcto').forEach(inp => {
      const val = inp.value.trim();
      if(val) recetas[Number(inp.dataset.idx)].nombreReceta = val;
    });
    const msgC = document.getElementById('msgConfirmarFicha');
    msgC.className = 'msg'; msgC.style.display = 'block'; msgC.textContent = 'Guardando ' + recetas.length + ' receta(s)…';
    try{
      const r = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'importarFichaTecnica', tipoFicha, recetas })
      });
      const resp = await r.json();
      if(resp.error) throw new Error(resp.error);
      msgC.className = 'msg ok';
      msgC.textContent = `Importadas ${resp.recetasImportadas.length} receta(s): ${resp.recetasImportadas.join(', ')}.`;
      RECETAS_CACHE = null; borrarMemoria(); // que Cocina/Informes usen las recetas recién importadas
      cargarRecetasCargadas();
    }catch(err){
      msgC.className = 'msg err'; msgC.textContent = 'No se pudo importar: ' + err.message;
    }
  };
}

async function cargarRecetasCargadas(){
  const cont = document.getElementById('contenidoRecetasCargadas');
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=listarRecetas`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    const recetas = data.recetas || [];
    cont.className = '';
    if(recetas.length === 0){
      cont.innerHTML = `<div class="empty">Todavía no importaste ninguna ficha.</div>`;
      return;
    }
    const porTipo = {};
    recetas.forEach(r => { (porTipo[r.TipoFicha] = porTipo[r.TipoFicha] || []).push(r); });
    cont.innerHTML = TIPOS_FICHA.filter(t => porTipo[t.value]).map(t => `
      <h4 class="cat-heading">${t.label} (${porTipo[t.value].length})</h4>
      <p style="color:var(--ink-soft);font-size:12.5px;">${porTipo[t.value].map(r => `${r.Receta} (${r.RindeCantidad} ${r.RindeUnidad})`).join(' · ')}</p>
    `).join('');
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo buscar: ${err.message}</div>`;
  }
}

// OJO: NO usar toISOString() acá — siempre da la fecha en UTC, así que entre
// las 21:00 y las 23:59 (hora Argentina) ya devuelve el día SIGUIENTE. Se
// calcula la fecha de hoy explícitamente en el huso horario de Argentina.
function hoyISO(){
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Argentina/Buenos_Aires', year: 'numeric', month: '2-digit', day: '2-digit'
  });
  return fmt.format(new Date()); // en-CA da directamente formato yyyy-MM-dd
}

// suma "n" días a una fecha 'yyyy-MM-dd' — solo para textos de referencia en
// pantalla (ej. la leyenda de "Stock por local"), no para cálculos del backend.
function sumarDiasISO(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mes}-${dia}`;
}
