/* ---------------------------------------------------------------------
   Pantalla REGISTRAR PRODUCCIÓN (trazabilidad de turno) — por sector.
   Por ahora solo está armado el sector Producción (con la planilla en
   papel "Registro de Producción y Trazabilidad"); Cocina y Discos quedan
   con un aviso hasta tener esas planillas.
   --------------------------------------------------------------------- */
let CALCULO_REGISTRO = null;
let CATEGORIAS_REGISTRO = null;
let CATEGORIA_POR_SABOR_REGISTRO = null;
let EMPLEADOS_REGISTRO = null;
let PREP_REGISTRO = null;
let SECTOR_REGISTRO_ACTIVO = 'produccion';
let PREPEDIDO_REGISTRO = null;
const NOMBRE_ROLLOS_JYQ = 'Rollos de Jamón y Queso';

async function renderRegistroProduccion(){
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <div class="fab-toolbar">
      <header class="top" style="margin:0;"><h1>Registrar producción</h1></header>
      <div class="field-row">
        <label>Fecha del turno</label>
        <input type="date" id="fechaRegistro" value="${hoyISO()}">
      </div>
    </div>
    <div class="tabs" id="tabsRegistro">
      <button class="tab-btn active" data-sector="produccion">Producción</button>
      <button class="tab-btn" data-sector="cocina">Cocina</button>
      <button class="tab-btn" data-sector="discos">Discos</button>
      <button class="btn secondary" id="btnImprimirRegistro" style="margin-left:auto;" onclick="window.print()">🖶 Imprimir</button>
    </div>
    <div id="contenidoRegistro" class="loading">Cargando…</div>
    <div class="msg" id="msgRegistro"></div>
  `;
  [...document.querySelectorAll('#tabsRegistro .tab-btn')].forEach(b => {
    b.onclick = () => {
      [...document.querySelectorAll('#tabsRegistro .tab-btn')].forEach(x => x.classList.toggle('active', x === b));
      pintarSectorRegistro(b.dataset.sector);
    };
  });
  document.getElementById('fechaRegistro').onchange = cargarRegistroProduccion;
  cargarRegistroProduccion();
}

async function cargarRegistroProduccion(){
  const fecha = document.getElementById('fechaRegistro').value;
  const cont = document.getElementById('contenidoRegistro');
  cont.className = 'loading'; cont.textContent = 'Cargando…';
  const msg = document.getElementById('msgRegistro');
  msg.className = 'msg'; msg.textContent = '';
  // lo guardado del turno se pide A LA VEZ que el cálculo (antes se pedía
  // recién después, un viaje más al servidor)
  if(SECTOR_REGISTRO_ACTIVO === 'produccion'){
    PREPEDIDO_REGISTRO = { fecha, promesa: fetch(`${APPS_SCRIPT_URL}?action=obtenerRegistroProduccionDia&fecha=${fecha}`).then(x => x.json()) };
    PREPEDIDO_REGISTRO.promesa.catch(() => {});
  }
  try{
    const [r, rPrep, categorias, categoriaPorSabor, empleados] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularTodo&fecha=${fecha}`),
      fetch(`${APPS_SCRIPT_URL}?action=calcularPrepDiaAnterior&fecha=${fecha}`),
      obtenerCategorias(),
      obtenerCategoriaPorSabor(),
      obtenerEmpleados()
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    const prep = await rPrep.json();
    CALCULO_REGISTRO = data;
    PREP_REGISTRO = prep.error ? { rollosJyQ: 0, canastas: [] } : prep;
    CATEGORIAS_REGISTRO = categorias;
    CATEGORIA_POR_SABOR_REGISTRO = categoriaPorSabor;
    EMPLEADOS_REGISTRO = empleados;
    pintarSectorRegistro(SECTOR_REGISTRO_ACTIVO);
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
  }
}

function pintarSectorRegistro(sector){
  SECTOR_REGISTRO_ACTIVO = sector;
  const cont = document.getElementById('contenidoRegistro');
  cont.className = '';
  if(sector === 'produccion'){
    pintarRegistroProduccionSector();
    return;
  }
  if(sector === 'cocina'){
    pintarRegistroCocinaSector();
    return;
  }
  if(sector === 'discos'){
    pintarRegistroDiscosSector();
    return;
  }
}

// Registrar producción — sector COCINA: por cada relleno que se cocina hoy,
// se muestran TODOS los ingredientes de su ficha técnica, y de TODOS se
// registra el bruto real usado (con su propio botón Guardar/Editar). A los
// que además tienen un rinde de referencia cargado se les puede cargar
// también el rinde REAL para comparar contra la ficha; los demás (sin rinde
// de referencia, ej. condimentos) solo llevan el bruto real, sin esa
// comparación — no hay contra qué compararlos. Si no se guarda nada para un
// ingrediente, se entiende que se usó el valor de la ficha (Cantidad/Rinde
// de Ref_RecetaDetalle). Arriba de todo se muestran las Ollas (lotes de 8 kg
// de carne cruda): los Preparados compartidos (Relleno Carne, Pollo Grille)
// en un bloque propio, y para cada relleno que arma sus ollas directo (sin
// pasar por un Preparado) el detalle aparece encima de su tabla de insumos.
async function pintarRegistroCocinaSector(){
  const cont = document.getElementById('contenidoRegistro');
  cont.innerHTML = `<p class="loading">Buscando fichas técnicas…</p>`;

  const fecha = document.getElementById('fechaRegistro').value;
  const cocina = (CALCULO_REGISTRO.cocina || []).filter(f => f.kilosDeRelleno > 0);
  const dipsPostres = (CALCULO_REGISTRO.produccion || []).filter(f => f.aHacerUnidades > 0 && (f.rubro === 'Dips' || f.rubro === 'Postres'));
  if(cocina.length === 0 && dipsPostres.length === 0){
    cont.innerHTML = `<div class="empty">Cocina no elabora nada el ${CALCULO_REGISTRO.dia.toLowerCase()}.</div>`;
    return;
  }

  const [recetas, ollasResp, trazaResp, finalResp] = await Promise.all([
    obtenerRecetas(),
    fetch(`${APPS_SCRIPT_URL}?action=calcularOllas&fecha=${encodeURIComponent(fecha)}`).then(r => r.json()).catch(() => ({})),
    fetch(`${APPS_SCRIPT_URL}?action=listarTrazabilidadCocinaDia&fecha=${encodeURIComponent(fecha)}`).then(r => r.json()).catch(() => ({})),
    fetch(`${APPS_SCRIPT_URL}?action=listarRecetasFinalizadas&fecha=${encodeURIComponent(fecha)}`).then(r => r.json()).catch(() => ({}))
  ]);
  const ollasData = (ollasResp && !ollasResp.error) ? ollasResp : { preparados: [], rellenos: [] };

  // lo ya guardado hoy por ingrediente (para repintar los inputs con el
  // valor real cargado, en vez de arrancar en blanco cada vez que se entra o
  // recarga la pantalla) y las recetas ya "enviadas final" hoy (que quedan
  // con la tabla entera bloqueada — ver bloqueRegistroReceta).
  const trazaGuardada = {};
  ((trazaResp && !trazaResp.error && trazaResp.items) || []).forEach(it => {
    trazaGuardada[normalizarFicha(it.relleno) + '|' + normalizarFicha(it.ingrediente)] = it;
  });
  const recetasFinalizadasSet = new Set(
    ((finalResp && !finalResp.error && finalResp.recetas) || []).map(r => normalizarFicha(r))
  );

  if(recetas.detalle.length === 0){
    cont.innerHTML = `
      <div class="empty">Todavía no importaste ninguna ficha técnica — sin eso no sé qué insumos controlar acá.</div>
      <div class="actions"><button class="btn secondary" onclick="irA('fichas')">Ir a Fichas técnicas</button></div>
    `;
    return;
  }

  cont.innerHTML = '';
  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = `${CALCULO_REGISTRO.dia}, ${fmtFecha(fecha)} — cargá el bruto real de cada insumo (y el rinde real cuando aplique) sobre el TOTAL de hoy; si no cargás nada, se toma el valor de la ficha.`;
  cont.appendChild(intro);

  if((ollasData.preparados || []).length){
    const hPrep = document.createElement('h4');
    hPrep.className = 'cat-heading';
    hPrep.textContent = 'Preparados en olla (8 kg) — resumen';
    cont.appendChild(hPrep);
    const tablaPrep = document.createElement('table');
    tablaPrep.className = 'prod';
    tablaPrep.innerHTML = `
      <thead><tr><th>Preparado</th><th class="num">Total</th><th class="num">Ollas</th></tr></thead>
      <tbody>${ollasData.preparados.map(o => `<tr><td><strong>${o.nombre}</strong></td><td class="num">${ent(o.kilos)} KG</td><td class="num"><strong>${o.ollas}</strong></td></tr>`).join('')}</tbody>`;
    cont.appendChild(tablaPrep);
  }

  // encuentra el rinde de una receta (Relleno, Preparado, Dip o Postre) EN LA
  // UNIDAD pedida (KG para Rellenos/Preparados, UN para Dips/Postres), para
  // poder escalar su ficha del "un batch" al total que hace falta cocinar
  // hoy. El rinde de una ficha puede venir cargado en dos unidades a la vez
  // (ej. Dips: "3 KG" y, debajo, "75 UN") — por eso mira los dos pares.
  function rindeEnUnidad(nombreReceta, unidadObjetivo){
    const cab = recetas.cabecera.find(r => normalizarFicha(r.Receta) === normalizarFicha(nombreReceta));
    if(!cab) return 0;
    if(normalizarFicha(cab.RindeUnidad) === unidadObjetivo) return Number(cab.RindeCantidad) || 0;
    if(normalizarFicha(cab.RindeUnidad2) === unidadObjetivo) return Number(cab.RindeCantidad2) || 0;
    return 0;
  }

  // Bloque de registro de UNA receta (Relleno, Preparado en olla, Dip o
  // Postre): título grande, referencia de ollas (colapsable, solo
  // informativa, cuando aplica) y la tabla de insumos — TODOS escalados al
  // total de HOY, no a los valores "de un batch" que trae la ficha. El
  // registro (Bruto real / Rinde real) es siempre sobre ese total, nunca por
  // olla. unidadHoy es 'KG' para Rellenos/Preparados y 'UN' para Dips/Postres
  // (que se miden en unidades, no en kilos).
  function bloqueRegistroReceta(nombreReceta, cantidadHoy, unidadHoy, subtitulo, infoOllasHtml){
    const ingredientesReceta = recetas.detalle.filter(d => normalizarFicha(d.Receta) === normalizarFicha(nombreReceta));
    if(ingredientesReceta.length === 0) return false;

    const rinde = rindeEnUnidad(nombreReceta, unidadHoy);
    const factor = rinde > 0 ? (cantidadHoy / rinde) : 1;

    const finalizada = recetasFinalizadasSet.has(normalizarFicha(nombreReceta));

    const h = document.createElement('h4');
    h.className = 'cat-heading receta-heading';
    h.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;';
    h.innerHTML = `
      <span>${nombreReceta} — ${ent(cantidadHoy)} ${unidadHoy === 'UN' ? 'un.' : 'kg'} calculados hoy${subtitulo || ''}</span>
      <span class="no-print">${finalizada
        ? `<span style="color:#2a7a4a;font-size:12.5px;font-weight:600;margin-right:6px;">✓ Enviada</span><button type="button" class="btn secondary btn-reabrir-receta" style="font-size:12px;padding:5px 9px;">Reabrir</button>`
        : `<button type="button" class="btn btn-finalizar-receta" style="font-size:12px;padding:5px 9px;">Guardar y enviar</button>`}</span>
    `;
    cont.appendChild(h);
    const btnFinalizar = h.querySelector('.btn-finalizar-receta');
    if(btnFinalizar) btnFinalizar.onclick = () => finalizarReceta(nombreReceta, fecha);
    const btnReabrir = h.querySelector('.btn-reabrir-receta');
    if(btnReabrir) btnReabrir.onclick = () => reabrirReceta(nombreReceta, fecha);

    if(finalizada){
      const avisoFinal = document.createElement('p');
      avisoFinal.style.cssText = 'font-size:12px;color:#2a7a4a;margin:0 0 8px;';
      avisoFinal.textContent = 'Esta receta ya está enviada — sus insumos entraron al informe de "Totales del día" y la tabla queda bloqueada. Tocá "Reabrir" para volver a editarla.';
      cont.appendChild(avisoFinal);
    }

    if(infoOllasHtml){
      const divOllas = document.createElement('div');
      divOllas.style.cssText = 'font-size:12.5px;color:var(--ink-soft);margin:2px 0 10px;';
      divOllas.innerHTML = infoOllasHtml;
      cont.appendChild(divOllas);
    }

    const wrap = document.createElement('div');
    wrap.style.overflowX = 'auto';
    const table = document.createElement('table');
    table.className = 'lotes traza';
    table.innerHTML = `
      <thead><tr>
        <th>Insumo</th>
        <th class="num">Bruto ficha (hoy)</th>
        <th class="num">Bruto real</th>
        <th class="num">Rinde ficha (hoy)</th>
        <th class="num">Rinde real</th>
        <th class="no-print"></th>
      </tr></thead>
      <tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    ingredientesReceta.forEach(ing => {
      const tieneRinde = ing.Rinde !== '' && ing.Rinde != null;
      const cantidadHoyIng = (Number(ing.Cantidad) || 0) * factor;
      const rindeHoyIng = tieneRinde ? (Number(ing.Rinde) || 0) * factor : null;
      const guardado = trazaGuardada[normalizarFicha(nombreReceta) + '|' + normalizarFicha(ing.Ingrediente)];
      const yaGuardado = !!guardado;
      const bloqueado = finalizada || yaGuardado;
      const valorBruto = (guardado && guardado.cantidadBrutoReal !== '' && guardado.cantidadBrutoReal != null) ? guardado.cantidadBrutoReal : '';
      const valorRinde = (guardado && guardado.rindeReal !== '' && guardado.rindeReal != null) ? guardado.rindeReal : '';
      const tr = document.createElement('tr');
      tr.dataset.relleno = nombreReceta;
      tr.dataset.ingrediente = ing.Ingrediente;
      if(bloqueado) tr.classList.add('fila-guardada');
      tr.innerHTML = `
        <td>${ing.Ingrediente}</td>
        <td class="num" style="color:var(--ink-soft);">${ent(cantidadHoyIng)} ${ing.Medida || ''}</td>
        <td><input type="number" min="0" step="0.01" class="inp-bruto-real" style="width:90px;" placeholder="${ent(cantidadHoyIng)}" value="${valorBruto}" ${bloqueado ? 'disabled' : ''}></td>
        <td class="num" style="color:var(--ink-soft);">${tieneRinde ? `${ent(rindeHoyIng)} ${ing.Medida || ''}` : `<span style="font-size:11px;">sin control de rinde</span>`}</td>
        <td>${tieneRinde ? `<input type="number" min="0" step="0.01" class="inp-rinde-real" style="width:90px;" placeholder="${ent(rindeHoyIng)}" value="${valorRinde}" ${bloqueado ? 'disabled' : ''}>` : ''}</td>
        <td style="white-space:nowrap;" class="no-print">${finalizada ? '' : `
          <button type="button" class="btn secondary btn-guardar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? 'display:none;' : ''}">Guardar</button>
          <button type="button" class="btn secondary btn-editar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? '' : 'display:none;'}">Editar</button>
        `}</td>
      `;
      if(!finalizada){
        tr.querySelector('.btn-guardar-item').onclick = () => guardarItemCocina(tr, fecha);
        tr.querySelector('.btn-editar-item').onclick = () => habilitarEdicionFila(tr);
        if(yaGuardado) ponerSello(tr, null);
      }
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    cont.appendChild(wrap);
    return true;
  }

  let algunBloque = false;

  // Preparados que se cocinan en olla (Relleno Carne, Pollo Grille): el
  // registro de insumos va sobre el TOTAL de ESE preparado — las ollas quedan
  // solo como referencia (no como el campo a completar; eso ya lo pidió
  // Carolina expresamente: "el registro tiene que ser sobre el total, con
  // una solapita para ver por olla si hace falta"). Ojo: acá NO va el
  // gramaje por olla — los 8 kg de la olla son de la materia prima cruda
  // (recortes), no del Preparado ya terminado (ver el comentario en
  // cargarPreparadosCocina). Confirmado con Carolina (26/09/2026).
  (ollasData.preparados || []).forEach(o => {
    const infoOllasHtml = `<strong>Referencia:</strong> hoy arma ${o.ollas} olla(s) de este preparado (una olla completa son 8 kg) — el registro de insumos de abajo es sobre el TOTAL de hoy, no por olla.`;
    if(bloqueRegistroReceta(o.nombre, o.kilos, 'KG', ` — Preparado (lo usan: ${(o.usan || []).join(', ')})`, infoOllasHtml)) algunBloque = true;
  });

  // Rellenos que se cocinan hoy
  cocina.forEach(f => {
    const infoOllas = (ollasData.rellenos || []).find(o => o.nombre === f.relleno);
    const infoOllasHtml = infoOllas
      ? `<strong>Referencia:</strong> hoy arma ${infoOllas.ollas} olla(s) (usa ${ent(infoOllas.kilosNecesarios)} kg de ${infoOllas.ingredienteClave} — una olla completa son 8 kg) — el registro de insumos de abajo es sobre el TOTAL de hoy, no por olla.` + bloqueGramajeOllas([infoOllas])
      : '';
    if(bloqueRegistroReceta(f.relleno, f.kilosDeRelleno, 'KG', '', infoOllasHtml)) algunBloque = true;
  });

  // Dips y Postres: los arma Cocina igual que los Rellenos, pero se miden en
  // UNIDADES — la ficha escala contra el rinde en UN (no en KG). No tienen
  // ollas. Confirmado con Carolina (26/09/2026).
  ['Dips', 'Postres'].forEach(rubro => {
    const items = dipsPostres.filter(f => f.rubro === rubro);
    if(items.length === 0) return;
    const hRubro = document.createElement('h4');
    hRubro.className = 'cat-heading';
    hRubro.textContent = rubro;
    cont.appendChild(hRubro);
    items.forEach(f => {
      if(bloqueRegistroReceta(f.sabor, f.aHacerUnidades, 'UN', '', '')) algunBloque = true;
    });
  });

  if(!algunBloque){
    cont.innerHTML += `<div class="empty" style="margin-top:14px;">No encontré la ficha técnica de ninguno de los rellenos, dips o postres de hoy.</div>`;
    return;
  }

  // Guardado provisorio de TODO Cocina (cada receta se envía con su propio
  // "Guardar y enviar", arriba de su tabla).
  const barra = document.createElement('div');
  barra.innerHTML = htmlBarraFinal('btnProvisorioCocina', null, '',
    '<strong>Guardado provisorio</strong> (barra de abajo): guarda todos los insumos cargados de todas las recetas y se puede seguir cargando durante toda la jornada. Cada receta se cierra con su botón <strong>Guardar y enviar</strong> (arriba de su tabla): guarda lo que falte de esa receta y la bloquea.');
  cont.appendChild(barra);
  document.getElementById('btnProvisorioCocina').onclick = () => guardarProvisorioCocina(fecha);
}

// lee los insumos de Cocina cargados pero todavía sin guardar (de una
// receta, o de todas si receta = null).
function insumosCocinaPendientes(receta){
  const filas = [...document.querySelectorAll('#contenidoRegistro tr[data-relleno]:not(.fila-guardada)')]
    .filter(tr => receta == null || tr.dataset.relleno === receta);
  const pendientes = [];
  filas.forEach(tr => {
    const inputBruto = tr.querySelector('.inp-bruto-real');
    const inputRinde = tr.querySelector('.inp-rinde-real');
    if(!inputBruto || inputBruto.disabled) return;
    const cantidadBrutoReal = inputBruto.value;
    const rindeReal = inputRinde ? inputRinde.value : '';
    if(!cantidadBrutoReal && !rindeReal) return;
    pendientes.push({ tr, item: { relleno: tr.dataset.relleno, ingrediente: tr.dataset.ingrediente, cantidadBrutoReal, rindeReal } });
  });
  return pendientes;
}

async function guardarProvisorioCocina(fecha){
  const msg = document.getElementById('msgRegistro');
  const pendientes = insumosCocinaPendientes(null);
  const btn = document.getElementById('btnProvisorioCocina');
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await postJSON({ action: 'registrarTrazabilidadCocinaLote', fecha, items: pendientes.map(p => p.item) });
    pendientes.forEach(p => marcarFilaGuardada(p.tr));
    const hora = horaCorta();
    const guardados = document.querySelectorAll('#contenidoRegistro tr[data-relleno].fila-guardada').length;
    const aviso = pendientes.length ? `${pendientes.length} insumo(s) nuevos guardados` : 'no había nada nuevo para guardar';
    avisar(`✓ Guardado provisorio · ${hora} — ${aviso}.`);
    msg.className = 'msg ok';
    msg.textContent = `✓ Guardado provisorio a las ${hora}: ${aviso}. En pantalla hay ${guardados} insumo(s) guardados. Podés seguir cargando.`;
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }finally{
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}

async function guardarItemCocina(tr, fecha){
  const btn = tr.querySelector('.btn-guardar-item');
  const inputBruto = tr.querySelector('.inp-bruto-real');
  const inputRinde = tr.querySelector('.inp-rinde-real');
  const cantidadBrutoReal = inputBruto ? inputBruto.value : '';
  const rindeReal = inputRinde ? inputRinde.value : '';
  if(!cantidadBrutoReal && !rindeReal){
    alert('Cargá el bruto real antes de guardar.');
    return;
  }
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'registrarTrazabilidadCocinaItem',
        fecha, relleno: tr.dataset.relleno, ingrediente: tr.dataset.ingrediente,
        cantidadBrutoReal, rindeReal
      })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    marcarFilaGuardada(tr);
    avisar(`✓ Guardado: ${tr.dataset.ingrediente} (${tr.dataset.relleno}) · ${horaCorta()}`);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar: ' + err.message);
  }
}

// "Enviar final" de una receta completa (Relleno/Preparado/Dip/Postre): a
// partir de ahí sus insumos entran al informe de "Totales del día" y su
// tabla queda bloqueada entera. "Reabrir" la vuelve a abrir. Ambas
// simplemente vuelven a pintar todo el sector para que quede consistente
// con lo que ya haya guardado por ingrediente.
async function finalizarReceta(receta, fecha){
  if(!confirm(`¿Guardar y enviar "${receta}"? Se guardan los insumos que falten, se bloquea toda su tabla y entra al informe de Totales del día.`)) return;
  const pendientes = insumosCocinaPendientes(receta);
  try{
    const data = await postJSON({ action: 'finalizarRecetaCocina', fecha, receta, items: pendientes.map(p => ({ ingrediente: p.item.ingrediente, cantidadBrutoReal: p.item.cantidadBrutoReal, rindeReal: p.item.rindeReal })) });
    const extra = pendientes.length ? ` (se guardaron ${pendientes.length} insumo(s) que faltaban)` : '';
    avisar(`✓ "${receta}" enviada · ${horaCorta()}${extra}.`);
    pintarRegistroCocinaSector();
  }catch(err){
    avisar('✗ NO se envió "' + receta + '" — ' + err.message, 'err');
  }
}

async function reabrirReceta(receta, fecha){

    });

/* ---------------------------------------------------------------------
   Pantalla INFORMES: por ahora, el total REAL de insumos consumidos en un
   día — suma SOLO las recetas (Rellenos/Preparados/Dips/Postres) que ya se
   enviaron como final desde "Registrar producción → Cocina" ese día; lo que
   todavía no se envió como final no cuenta acá. Confirmado con Carolina
   (26/09/2026).
   --------------------------------------------------------------------- */
let SECTOR_INFORME_ACTIVO = 'consumo';
let LOCAL_INFORME_ACTIVO = null;

async function renderInformes(sector){
  // Cada bloque del inicio abre su propio informe: 'stock' (Locales) o
  // 'consumo' (Fábrica). SECTOR_INFORME_ACTIVO se sigue usando en los
  // chequeos de "respuesta tardía" de cada informe.
  SECTOR_INFORME_ACTIVO = (sector === 'stock' || sector === 'stockFabrica') ? sector : 'consumo';
  const opciones = lugaresInformeStock();
  if(opciones.length && opciones.indexOf(LOCAL_INFORME_ACTIVO) === -1) LOCAL_INFORME_ACTIVO = opciones[0];
  const titulo = SECTOR_INFORME_ACTIVO === 'stock' ? 'Stock por local'
    : SECTOR_INFORME_ACTIVO === 'stockFabrica' ? 'Stock de fábrica' : 'Consumo de insumos';
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <div class="fab-toolbar">
      <header class="top" style="margin:0;"><h1>${titulo}</h1></header>
      <div class="field-row">
        <label>Fecha de consulta</label>
        <input type="date" id="fechaInforme" value="${hoyISO()}">
      </div>
      <button class="btn secondary no-print" id="btnImprimirInforme" style="margin-left:auto;" onclick="window.print()">🖶 Imprimir</button>
    </div>
    <div id="contenidoInforme" class="loading">Cargando…</div>
  `;
  document.getElementById('fechaInforme').onchange = pintarSectorInforme;
  pintarSectorInforme();
}

// locales (informe de Locales) o sectores de fábrica (informe de Fábrica)
function lugaresInformeStock(){
  if(SECTOR_INFORME_ACTIVO === 'stockFabrica') return LOCALES.filter(l => l.startsWith('Fábrica'));
  if(SECTOR_INFORME_ACTIVO === 'stock') return LOCALES_VENTA;
  return [];
}
function esInformeStock(){ return SECTOR_INFORME_ACTIVO === 'stock' || SECTOR_INFORME_ACTIVO === 'stockFabrica'; }

function pintarSectorInforme(){
  if(SECTOR_INFORME_ACTIVO === 'consumo'){
    cargarInformeInsumos();
    return;
  }
  const cont = document.getElementById('contenidoInforme');
  cont.className = '';
  cont.innerHTML = `
    <div class="field-row no-print" style="max-width:280px;">
      <label>${SECTOR_INFORME_ACTIVO === 'stockFabrica' ? 'Sector' : 'Local'}</label>
      <select id="selLocalInforme">
        ${lugaresInformeStock().map(l => `<option value="${l}" ${l === LOCAL_INFORME_ACTIVO ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
    </div>
    <div id="contenidoStockLocal" class="loading">Cargando…</div>
  `;
  document.getElementById('selLocalInforme').onchange = (e) => {
    LOCAL_INFORME_ACTIVO = e.target.value;
    cargarInformeStockLocal();
  };
  cargarInformeStockLocal();
}

async function cargarInformeInsumos(){
  const fecha = document.getElementById('fechaInforme').value;
  const cont = document.getElementById('contenidoInforme');
  cont.className = 'loading'; cont.textContent = 'Cargando…';
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=calcularInsumosRealesDia&fecha=${encodeURIComponent(fecha)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    // Guard: si mientras esperaba la respuesta el usuario ya cambió a la
    // otra solapa (o cambió la fecha), esta respuesta llegó tarde y no debe
    // pisar lo que se esté mostrando ahora.
    if(SECTOR_INFORME_ACTIVO !== 'consumo' || document.getElementById('fechaInforme').value !== fecha) return;
    cont.className = '';
    const recetasFinal = data.recetasFinalizadas || [];
    const totales = data.totalesPorIngrediente || [];
    if(recetasFinal.length === 0){
      cont.innerHTML = `
        <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(fecha)}</p>
        <div class="empty">Todavía no se envió ninguna receta como final este día en "Registrar producción → Cocina" — este informe solo suma insumos de recetas ya finalizadas.</div>
      `;
      return;
    }
    cont.innerHTML = `
      <h2 style="font-size:18px;margin:0 0 6px;">Total real de insumos usados — Cocina</h2>
      <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(fecha)} — recetas ya finalizadas (${recetasFinal.length}): ${recetasFinal.join(', ')}</p>
      <table class="prod">
        <thead><tr><th>Insumo</th><th class="num">Total usado</th></tr></thead>
        <tbody>
          ${totales.map(t => `<tr><td>${t.ingrediente}</td><td class="num"><strong>${ent(t.cantidad)}</strong> ${t.unidad}</td></tr>`).join('')}
        </tbody>
      </table>
    `;
  }catch(err){
    if(SECTOR_INFORME_ACTIVO !== 'consumo') return;
    cont.className = '';
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
  }
}

// Informe "Stock por local": todos los productos por categoría, con la
// última carga de stock de ESE local (cantidad + vencimiento por lote),
// resaltando según la fecha de consulta — rojo ya venció, rosa vence justo
// ese día, verde vence al día siguiente. Confirmado con Carolina (27/09/2026).
async function cargarInformeStockLocal(){
  const fecha = document.getElementById('fechaInforme').value;
  const local = LOCAL_INFORME_ACTIVO;
  const cont = document.getElementById('contenidoStockLocal');
  if(!cont) return; // la solapa ya cambió antes de arrancar el pedido
  cont.className = 'loading'; cont.textContent = 'Cargando…';
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerStockAnalisisLocal&local=${encodeURIComponent(local)}&fecha=${encodeURIComponent(fecha)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    // Guard: si mientras esperaba la respuesta el usuario cambió de solapa,
    // de local o de fecha, esta respuesta llegó tarde y no debe pisar lo
    // que se esté mostrando ahora.
    const contActual = document.getElementById('contenidoStockLocal');
    if(!contActual || !esInformeStock() || LOCAL_INFORME_ACTIVO !== local || document.getElementById('fechaInforme').value !== fecha) return;
    cont.className = '';
    const categorias = data.categorias || {};
    const nombresCategorias = Object.keys(categorias);
    const claseFila = { vencido: 'fila-vencido', vence_hoy: 'fila-vence-hoy', vence_manana: 'fila-vence-manana' };

    const leyenda = `
      <div class="leyenda-vencimiento">
        <span><i style="background:var(--alert-bg);"></i> Ya venció</span>
        <span><i style="background:var(--pink-bg);"></i> Vence hoy (${fmtFecha(fecha)})</span>
        <span><i style="background:var(--herb-bg);"></i> Vence mañana (${fmtFecha(sumarDiasISO(fecha, 1))})</span>
      </div>`;

    const uc = data.ultimaCarga;
    // "Cargado el": si el dato de un producto es de una carga ANTERIOR a la
    // última del local (no se cargó en la última), se marca en ámbar.
    const celdaCargado = (it) => {
      if(!it.fechaCarga) return '<td style="color:var(--ink-soft);">—</td>';
      if(it.desactualizado) return `<td class="dato-viejo">${fmtFecha(it.fechaCarga)} — no se cargó el ${fmtFecha(uc.fecha)}</td>`;
      return `<td style="color:var(--ink-soft);">${fmtFecha(it.fechaCarga)}</td>`;
    };
    let viejos = 0;
    const bloques = nombresCategorias.map(cat => {
      const items = categorias[cat];
      const filas = items.map(it => {
        if(it.desactualizado) viejos++;
        if(it.lotes.length === 0){
          return `<tr><td>${it.sabor}</td><td colspan="2" style="color:var(--ink-soft);font-style:italic;">${it.ceroEnCargaEnviada ? '0 — no figura en la carga enviada' : 'sin stock cargado'}</td>${celdaCargado(it)}</tr>`;
        }
        return it.lotes.map((l, i) => `
          <tr class="${claseFila[l.estado] || ''}">
            <td>${i === 0 ? it.sabor : `<span class="item-extra">↳ otro lote</span>`}</td>
            <td class="num">${ent(l.cantidad)}</td>
            <td>${fmtFecha(l.vencimiento)}</td>
            ${i === 0 ? celdaCargado(it) : '<td></td>'}
          </tr>`).join('');
      }).join('');
      return `
        <h4 class="cat-heading">${cat}</h4>
        <table class="prod">
          <thead><tr><th>Producto</th><th class="num">Cantidad (${data.unidad || 'unidades'})</th><th>Vencimiento</th><th>Cargado el</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>`;
    }).join('');

    const resumenCarga = uc
      ? `<div class="resumen-carga">
          <strong>Última carga de ${LOCAL_INFORME_ACTIVO}: ${fmtFecha(uc.fecha)}</strong>${uc.responsable ? ` · por ${uc.responsable}` : ''} · ${uc.productos} producto(s) cargado(s)
          · ${uc.enviada ? `✓ enviada${uc.hora ? ' a las ' + uc.hora : ''}` : 'sin "Guardar y enviar" (puede estar incompleta)'}
          ${viejos ? `<div class="dato-viejo" style="margin-top:6px;padding:6px 8px;border-radius:3px;">⚠ ${viejos} producto(s) no se cargaron el ${fmtFecha(uc.fecha)}: se muestra su último dato, de una carga anterior (marcados en ámbar).</div>` : ''}
        </div>`
      : `<div class="resumen-carga">${LOCAL_INFORME_ACTIVO} todavía no tiene ninguna carga de stock hasta el ${fmtFecha(fecha)}.</div>`;

    cont.innerHTML = `
      <h2 style="font-size:18px;margin:0 0 6px;">Análisis de stock — ${LOCAL_INFORME_ACTIVO}</h2>
      <p style="color:var(--ink-soft);font-size:13px;">${data.dia || ''} ${fmtFecha(fecha)}</p>
      ${resumenCarga}
      ${leyenda}
      ${bloques}
    `;
  }catch(err){
    const contActual = document.getElementById('contenidoStockLocal');
    if(!contActual || !esInformeStock() || LOCAL_INFORME_ACTIVO !== local) return;
    cont.className = '';
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
  }
}

// arma una fila de la tabla de Producción, reutilizada por las 3 secciones
// (Producción por sabor / Canastas completas / Extras de producción).
// - etiqueta: texto visible en la celda "Sabor".
// - saborKey: la clave que se guarda como Sabor en TrazabilidadProduccion —
//   para las filas de "Molde de canasta" es distinta del nombre real del
//   sabor (para no pisar la fila de la Canasta completa de ese mismo sabor,
//   ver registrarTrazabilidadItem en Code.gs, que upsertea por Fecha+Sabor).
// - usaResponsable: true = desplegable de Responsable (Canastas, Rollos de
//   Jamón y Queso); false = desplegable de Máquina Nº (sabores normales).
// - guardado: item ya guardado para este saborKey (o undefined).
// - bloqueadoGlobal: turno ya cerrado -> toda la fila queda de solo lectura,
//   sin botones de Guardar/Editar.
function filaRegistroProduccion(etiqueta, saborKey, aHacerMostrar, etiquetaExtra, usaResponsable, empleados, guardado, bloqueadoGlobal){
  const g = guardado || {};
  const yaGuardado = !!guardado;
  const bloqueado = bloqueadoGlobal || yaGuardado;
  const dis = bloqueado ? 'disabled' : '';
  const celdaMaquina = usaResponsable
    ? `<select class="inp-responsable-canasta" style="min-width:130px;" ${dis}>${opcionesEmpleadosSeleccion(empleados, g.responsable)}</select>`
    : `<select class="inp-maq-num" style="width:56px;" ${dis}>
        <option value=""></option>
        <option value="1" ${g.maquinaNumero === '1' ? 'selected' : ''}>1</option>
        <option value="2" ${g.maquinaNumero === '2' ? 'selected' : ''}>2</option>
      </select>`;

  const tr = document.createElement('tr');
  tr.dataset.sabor = saborKey;
  if(bloqueado) tr.classList.add('fila-guardada');
  tr.innerHTML = `
    <td>${etiqueta}${etiquetaExtra || ''}</td>
    <td class="num" style="color:var(--ink-soft);">${aHacerMostrar != null ? ent(aHacerMostrar) : '—'}</td>
    <td>${celdaMaquina}</td>
    <td><input type="text" class="inp-maq-vel" style="width:64px;" value="${g.maquinaVelocidad || ''}" ${dis}></td>
    <td><input type="text" class="inp-disco-lote" style="width:90px;" value="${g.discosLote || ''}" ${dis}></td>
    <td><input type="number" min="0" step="0.01" class="inp-peso-prom" style="width:80px;" value="${g.pesoPromTandaDiscos || ''}" ${dis}></td>
    <td><input type="date" class="inp-relleno-fecha" value="${g.rellenoFecha || ''}" ${dis}></td>
    <td><input type="number" min="0" step="0.01" class="inp-peso-inicial" style="width:80px;" value="${g.pesoInicialRelleno || ''}" ${dis}></td>
    <td><input type="number" min="0" step="0.01" class="inp-peso-final" style="width:80px;" value="${g.pesoFinalRelleno || ''}" ${dis}></td>
    <td><input type="time" class="inp-hora-inicio" value="${g.horaInicio || ''}" ${dis}></td>
    <td><input type="time" class="inp-hora-fin" value="${g.horaFin || ''}" ${dis}></td>
    <td><input type="number" min="0" step="1" class="inp-total-prod" style="width:80px;" value="${g.totalProduccion || ''}" ${dis}></td>
    <td><input type="number" min="0" step="1" class="inp-discos-danados" style="width:64px;" value="${g.discosDanados || ''}" ${dis}></td>
    <td class="no-print" style="white-space:nowrap;">${bloqueadoGlobal ? '' : `
      <button type="button" class="btn secondary btn-guardar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? 'display:none;' : ''}">Guardar</button>
      <button type="button" class="btn secondary btn-editar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? '' : 'display:none;'}">Editar</button>
    `}</td>
  `;
  if(!bloqueadoGlobal){
    tr.querySelector('.btn-guardar-item').onclick = () => guardarItemTrazabilidad(tr);
    tr.querySelector('.btn-editar-item').onclick = () => habilitarEdicionFila(tr);
    if(yaGuardado) ponerSello(tr, null);
  }
  return tr;
}

async function pintarRegistroProduccionSector(){
  const cont = document.getElementById('contenidoRegistro');
  const fecha = document.getElementById('fechaRegistro').value;
  cont.innerHTML = '<div class="loading">Cargando…</div>';

  const data = CALCULO_REGISTRO;
  const prep = PREP_REGISTRO || {};
  const categorias = CATEGORIAS_REGISTRO || {};
  const categoriaPorSabor = CATEGORIA_POR_SABOR_REGISTRO || {};

  let estado;
  try{
    if(PREPEDIDO_REGISTRO && PREPEDIDO_REGISTRO.fecha === fecha){
      const pre = PREPEDIDO_REGISTRO; PREPEDIDO_REGISTRO = null;
      estado = await pre.promesa;
    } else {
      const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerRegistroProduccionDia&fecha=${fecha}`);
      estado = await r.json();
    }
    if(estado.error) throw new Error(estado.error);
  }catch(err){
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar el registro guardado: ${err.message}</div>`;
    return;
  }
  if(SECTOR_REGISTRO_ACTIVO !== 'produccion') return; // cambió de pestaña mientras cargaba

  const guardadoPorSabor = {};
  (estado.items || []).forEach(it => { guardadoPorSabor[it.sabor] = it; });
  const bloqueadoGlobal = !!estado.finalizado;

  // sabores normales (Empanadas Horno + Frito) sin las Canastas, que van
  // aparte en su propia sección más abajo.
  const todasEmpanadas = [...(categorias['Empanadas Horno'] || []), ...(categorias['Empanadas Frito'] || [])];
  const sabores = todasEmpanadas.filter(n => categoriaPorSabor[n] !== 'Canasta');
  const saboresCanasta = todasEmpanadas.filter(n => categoriaPorSabor[n] === 'Canasta');

  const porSabor = {};
  (data.produccion || []).forEach(f => { if(f.tipoCalculo === 'Calendario') porSabor[f.sabor] = f; });
  const canastaPorSabor = {};
  (prep.canastas || []).forEach(c => { canastaPorSabor[c.sabor] = c; });

  cont.innerHTML = '';

  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = `${data.dia}, ${fmtFecha(data.fecha)} — completá solo los sabores que se armaron este turno. "A producir (calc.)" es de referencia (en Extras de producción es lo que hace falta dejar armado HOY para mañana). Guardá cada sabor con su botón apenas lo termines (no hace falta esperar al final del turno); tocá "Editar" si necesitás corregir algo ya guardado. Los puestos y las observaciones se guardan con los botones de abajo ("Guardado provisorio" o "Guardar y enviar").`;
  cont.appendChild(intro);

  if(bloqueadoGlobal){
    const aviso = document.createElement('div');
    aviso.className = 'msg ok no-print';
    aviso.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;';
    const horaCierre = estado.cierre && estado.cierre.hora ? ` a las ${estado.cierre.hora}` : '';
    const itemsCierre = estado.cierre && estado.cierre.items ? ` — ${estado.cierre.items} ítem(s) guardado(s)` : '';
    aviso.innerHTML = `<span>✓ Turno enviado${horaCierre}${itemsCierre} — todo el registro de Producción de este día quedó bloqueado.</span><button type="button" class="btn secondary" id="btnReabrirTurno" style="font-size:12px;padding:5px 9px;">Reabrir</button>`;
    cont.appendChild(aviso);
    cont.querySelector('#btnReabrirTurno').onclick = () => reabrirTurnoProduccion(fecha);
  }

  cont.appendChild(bloquePuestosMaquina('Máquina 1', 'm1', EMPLEADOS_REGISTRO, estado.maquina1, bloqueadoGlobal));
  cont.appendChild(bloquePuestosMaquina('Máquina 2', 'm2', EMPLEADOS_REGISTRO, estado.maquina2, bloqueadoGlobal));

  // --- Producción por sabor (sabores normales, Máquina Nº) ---
  const h1 = document.createElement('h4');
  h1.className = 'cat-heading';
  h1.textContent = 'Producción por sabor';
  cont.appendChild(h1);
  const { wrap: wrap1, tbody: tbody1 } = crearTablaRegistroProduccion();
  sabores.forEach(nombre => {
    const ref = porSabor[nombre];
    const aHacerMostrar = ref ? ref.aHacerUnidades : null;
    tbody1.appendChild(filaRegistroProduccion(nombre, nombre, aHacerMostrar, '', false, EMPLEADOS_REGISTRO, guardadoPorSabor[nombre], bloqueadoGlobal));
  });
  cont.appendChild(wrap1);

  // --- Canastas completas: hoy arman la canasta entera (disco + relleno +
  // el molde que dejaron listo el día anterior) — cantidad = lo que sale HOY
  // de ese sabor, igual que un sabor normal. Responsable en vez de Máquina.
  if(saboresCanasta.length){
    const h2 = document.createElement('h4');
    h2.className = 'cat-heading';
    h2.textContent = 'Canastas completas';
    cont.appendChild(h2);
    const { wrap: wrap2, tbody: tbody2 } = crearTablaRegistroProduccion();
    saboresCanasta.forEach(nombre => {
      const ref = porSabor[nombre];
      const aHacerMostrar = ref ? ref.aHacerUnidades : null;
      tbody2.appendChild(filaRegistroProduccion(nombre, nombre, aHacerMostrar, '', true, EMPLEADOS_REGISTRO, guardadoPorSabor[nombre], bloqueadoGlobal));
    });
    cont.appendChild(wrap2);
  }

  // --- Extras de producción (para mañana): Rollos de Jamón y Queso y el

  tbody3.appendChild(filaRegistroProduccion(NOMBRE_ROLLOS_JYQ, NOMBRE_ROLLOS_JYQ, prep.rollosJyQ, etiquetaManana, true, EMPLEADOS_REGISTRO, guardadoPorSabor[NOMBRE_ROLLOS_JYQ], bloqueadoGlobal));
  saboresCanasta.forEach(nombre => {
    const c = canastaPorSabor[nombre];

    const saborKeyMolde = 'Molde — ' + nombre;
    tbody3.appendChild(filaRegistroProduccion('Molde de canasta — ' + nombre, saborKeyMolde, aHacerMostrar, etiquetaManana, true, EMPLEADOS_REGISTRO, guardadoPorSabor[saborKeyMolde], bloqueadoGlobal));
  });
  cont.appendChild(wrap3);

  const obsWrap = document.createElement('div');
  obsWrap.className = 'field-row';
  obsWrap.style.cssText = 'max-width:640px;margin-top:18px;';
  obsWrap.innerHTML = `
    <label>Observaciones generales del turno</label>
    <textarea id="inpObservacionesRegistro" rows="3" style="width:100%;font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;" ${bloqueadoGlobal ? 'disabled' : ''}>${estado.observaciones || ''}</textarea>
  `;
  cont.appendChild(obsWrap);

  if(!bloqueadoGlobal){
    const actions = document.createElement('div');
    actions.innerHTML = htmlBarraFinal('btnProvisorioRegistro', 'btnGuardarRegistro', 'Guardar y enviar registro del turno',
      '<strong>Guardado provisorio</strong>: guarda puestos, observaciones y todos los sabores cargados, y se puede seguir cargando durante el turno. <strong>Guardar y enviar</strong>: guarda todo y cierra el turno (queda bloqueado; se destraba con "Reabrir").');
    cont.appendChild(actions);
    document.getElementById('btnProvisorioRegistro').onclick = () => guardarRegistroProduccion(false);
    document.getElementById('btnGuardarRegistro').onclick = () => guardarRegistroProduccion(true);
  }
}

// arma el objeto "item" de un sabor a partir de su fila en la tabla. La
// celda de "máquina" puede ser el desplegable de Máquina Nº (sabores
// normales) o el de Responsable (Canastas) — nunca los dos a la vez.
function leerFilaSabor(tr){
  const maq = tr.querySelector('.inp-maq-num');
  const resp = tr.querySelector('.inp-responsable-canasta');
  return {
    sabor: tr.dataset.sabor,
    maquinaNumero: maq ? maq.value : '',
    responsable: resp ? resp.value : '',
    maquinaVelocidad: tr.querySelector('.inp-maq-vel').value,
    discosLote: tr.querySelector('.inp-disco-lote').value,
    pesoPromTandaDiscos: tr.querySelector('.inp-peso-prom').value,
    rellenoFecha: tr.querySelector('.inp-relleno-fecha').value,
    pesoInicialRelleno: tr.querySelector('.inp-peso-inicial').value,
    pesoFinalRelleno: tr.querySelector('.inp-peso-final').value,
    horaInicio: tr.querySelector('.inp-hora-inicio').value,
    horaFin: tr.querySelector('.inp-hora-fin').value,
    totalProduccion: tr.querySelector('.inp-total-prod').value,
    discosDanados: tr.querySelector('.inp-discos-danados').value
  };
}

// re-habilita una fila ya guardada (Producción o Cocina) para corregirla —
// al volver a tocar "Guardar" se pisa la misma fila en la planilla, no se
// duplica (ver upsertFila en Code.gs).
function habilitarEdicionFila(tr){
  const sello = tr.querySelector('.sello-guardado');
  if(sello) sello.remove();
  tr.classList.remove('fila-guardada');
  [...tr.querySelectorAll('input,select')].forEach(el => el.disabled = false);
  const btnGuardar = tr.querySelector('.btn-guardar-item');
  if(btnGuardar){ btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar'; btnGuardar.style.display = ''; }
  const btnEditar = tr.querySelector('.btn-editar-item');
  if(btnEditar) btnEditar.style.display = 'none';
}

// "preguardar" un sabor apenas se termina, sin esperar al cierre del turno.
async function guardarItemTrazabilidad(tr){
  const fecha = document.getElementById('fechaRegistro').value;
  const item = leerFilaSabor(tr);
  if(!item.totalProduccion || Number(item.totalProduccion) <= 0){
    alert('Cargá el total producido de este sabor antes de guardarlo.');
    return;
  }
  const btn = tr.querySelector('.btn-guardar-item');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await postJSON({ action: 'registrarTrazabilidadItem', fecha, item });
    marcarFilaGuardada(tr);
    avisar(`✓ Guardado: ${tr.cells[0].textContent.trim()} — ${item.totalProduccion} producidas · ${horaCorta()}`);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar este sabor: ' + err.message);
  }
}

// cierre del turno: guarda los puestos + observaciones (una vez), cualquier
// sabor que haya quedado sin guardar con su botón individual, y bloquea todo
// el registro de Producción de ese día (ver "Bloqueo total al guardar el
// registro final del turno" — Tanda 3). Se destraba puntualmente con
// "Reabrir" (reabrirTurnoProduccion). Confirmado con Carolina (26/09/2026).
async function guardarRegistroProduccion(enviar){
  const fecha = document.getElementById('fechaRegistro').value;
  const msg = document.getElementById('msgRegistro');
  msg.className = 'msg'; msg.textContent = '';

  const leerMaquina = (idBase) => {
    const table = document.querySelector(`table.lotes[data-maquina="${idBase}"]`);
    const get = (p) => table.querySelector(`.inp-puesto[data-puesto="${p}"]`).value.trim();
    return { entrada: get('entrada'), relleno: get('relleno'), salida: get('salida') };
  };
  const maquina1 = leerMaquina('m1');
  const maquina2 = leerMaquina('m2');
  const observaciones = document.getElementById('inpObservacionesRegistro').value.trim();

  // sabores que NO se guardaron con su botón (o que se reabrieron con Editar).
  // Si una fila tiene datos pero no el total producido, se avisa cuál.
  const filas = [...document.querySelectorAll('table.traza tbody tr[data-sabor]:not(.fila-guardada)')];
  const conTotal = [], sinTotal = [];
  filas.forEach(tr => {
    const it = leerFilaSabor(tr);
    if(it.totalProduccion && Number(it.totalProduccion) > 0){ conTotal.push(tr); return; }
    const algo = [...tr.querySelectorAll('input,select')].some(el => el.value && el.value.trim() !== '');
    if(algo) sinTotal.push(tr.cells[0].textContent.trim());
  });
  if(enviar && sinTotal.length){
    msg.className = 'msg err';
    msg.textContent = 'No se envió: hay sabores con datos pero sin "Total producción" — ' + sinTotal.join(', ') + '. Completalos o borrales los datos.';
    avisar('✗ No se envió: hay sabores sin total producido (ver abajo).', 'err');
    return;
  }
  if(enviar && !confirm('¿Guardar y enviar el registro del turno? Se va a bloquear todo el registro de Producción de este día — vas a poder destrabarlo con "Reabrir" si hace falta corregir algo.')) return;
  const items = conTotal.map(leerFilaSabor);

  const btn = document.getElementById(enviar ? 'btnGuardarRegistro' : 'btnProvisorioRegistro');
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const data = await postJSON({ action: 'registrarTrazabilidadProduccion', fecha, maquina1, maquina2, observaciones, items, provisorio: !enviar });
    const hora = horaCorta();
    if(enviar){
      avisar(`✓ Turno enviado · ${hora} — ${data.total_dia} ítem(s) de producción guardados.`);
      msg.className = 'msg ok';
      msg.textContent = `✓ Turno enviado a las ${hora}: quedaron guardados puestos, observaciones y ${data.total_dia} ítem(s) de producción.`;
      pintarRegistroProduccionSector(); // vuelve a leer de la planilla y muestra el turno cerrado
    } else {
      conTotal.forEach(marcarFilaGuardada);
      avisar(`✓ Guardado provisorio · ${hora} — puestos, observaciones y ${data.total_dia} ítem(s) guardados.`);
      msg.className = sinTotal.length ? 'msg err' : 'msg ok';
      msg.textContent = `✓ Guardado provisorio a las ${hora}: puestos, observaciones y ${items.length} sabor(es) nuevos. En total hay ${data.total_dia} ítem(s) de producción guardados hoy. Podés seguir cargando.`
        + (sinTotal.length ? ' OJO — no se guardaron porque les falta el total producido: ' + sinTotal.join(', ') + '.' : '');
    }
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

async function reabrirTurnoProduccion(fecha){
  if(!confirm('¿Reabrir el registro de Producción de este día? Se va a destrabar toda la tabla.')) return;
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'reabrirTurnoProduccion', fecha })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    avisar('Turno reabierto — ya se puede editar.');
    pintarRegistroProduccionSector();
  }catch(err){
    alert('No se pudo reabrir: ' + err.message);
  }
}

/* ---------------------------------------------------------------------
   Registrar producción — sector DISCOS: registro simple por tipo de disco
   (Horno / Frito / Recorte), con Responsable y cantidad. Sin puestos de
   máquina ni finalización de turno — es independiente de Producción.
   --------------------------------------------------------------------- */
async function pintarRegistroDiscosSector(){
  const cont = document.getElementById('contenidoRegistro');
  const fecha = document.getElementById('fechaRegistro').value;
  cont.innerHTML = '<div class="loading">Cargando…</div>';

  let estado;
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerRegistroDiscosDia&fecha=${fecha}`);
    estado = await r.json();
    if(estado.error) throw new Error(estado.error);
  }catch(err){
    cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar: ${err.message}</div>`;
    return;
  }
  if(SECTOR_REGISTRO_ACTIVO !== 'discos') return; // cambió de pestaña mientras cargaba

  const guardadoPorTipo = {};
  (estado.items || []).forEach(it => { guardadoPorTipo[it.tipo] = it; });

  cont.innerHTML = '';
  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = 'Registro simple de discos por tipo — responsable y cantidad usada hoy. Guardá cada tipo con su botón (o todo junto con los botones de abajo); tocá "Editar" si necesitás corregir algo ya guardado.';
  cont.appendChild(intro);

  const wrap = document.createElement('div');
  wrap.style.overflowX = 'auto';
  const table = document.createElement('table');
  table.className = 'lotes traza';
  table.innerHTML = `
    <thead><tr><th>Tipo</th><th>Responsable</th><th class="num">Cantidad</th><th class="no-print"></th></tr></thead>
    <tbody></tbody>`;
  const tbody = table.querySelector('tbody');
  TIPOS_DISCO.forEach(tipo => {
    const g = guardadoPorTipo[tipo];
    const yaGuardado = !!g;
    const dis = yaGuardado ? 'disabled' : '';
    const tr = document.createElement('tr');
    tr.dataset.tipo = tipo;
    if(yaGuardado) tr.classList.add('fila-guardada');
    tr.innerHTML = `
      <td>${tipo}</td>
      <td><select class="inp-responsable-disco" ${dis}>${opcionesEmpleadosSeleccion(EMPLEADOS_REGISTRO, g ? g.responsable : '')}</select></td>
      <td><input type="number" min="0" step="1" class="inp-cantidad-disco" style="width:90px;" value="${g ? g.cantidad : ''}" ${dis}></td>
      <td class="no-print" style="white-space:nowrap;">
        <button type="button" class="btn secondary btn-guardar-disco" style="font-size:12px;padding:5px 9px;${yaGuardado ? 'display:none;' : ''}">Guardar</button>
        <button type="button" class="btn secondary btn-editar-disco" style="font-size:12px;padding:5px 9px;${yaGuardado ? '' : 'display:none;'}">Editar</button>
      </td>
    `;
    tr.querySelector('.btn-guardar-disco').onclick = () => guardarItemDiscos(tr, fecha);
    tr.querySelector('.btn-editar-disco').onclick = () => habilitarEdicionFilaDiscos(tr);
    if(yaGuardado) ponerSello(tr, null);
    tbody.appendChild(tr);
  });
  wrap.appendChild(table);
  cont.appendChild(wrap);

  // ya enviado: todo bloqueado + Reabrir; si no, los 2 botones finales
  if(estado.cierre){
    bloquearFilasEnviadas(table);
    cont.insertBefore(cartelEnviado(estado.cierre, 'Registro de discos', async () => {
      if(!confirm('¿Reabrir el registro de discos de este día? Se va a destrabar para corregir.')) return;
      try{
        await postJSON({ action: 'reabrirCarga', pantalla: 'Discos', fecha, clave: 'Discos' });
        avisar('Registro de discos reabierto — ya se puede editar.');
        pintarRegistroDiscosSector();
      }catch(err){ avisar('✗ No se pudo reabrir: ' + err.message, 'err'); }
    }), wrap);
  } else {
    const barra = document.createElement('div');
    barra.innerHTML = htmlBarraFinal('btnProvisorioDiscos', 'btnEnviarDiscos', 'Guardar y enviar discos');
    cont.appendChild(barra);
    document.getElementById('btnProvisorioDiscos').onclick = () => guardarTodoDiscos(fecha, false);
    document.getElementById('btnEnviarDiscos').onclick = () => guardarTodoDiscos(fecha, true);
  }
}

async function guardarTodoDiscos(fecha, enviar){
  const msg = document.getElementById('msgRegistro');
  msg.className = 'msg'; msg.textContent = '';
  const filas = [...document.querySelectorAll('#contenidoRegistro tr[data-tipo]:not(.fila-guardada)')];
  const conCantidad = filas.filter(tr => Number(tr.querySelector('.inp-cantidad-disco').value) > 0);
  if(enviar && !confirm('¿Guardar y enviar el registro de discos de este día? Queda bloqueado (se puede reabrir si hace falta corregir).')) return;
  const items = conCantidad.map(tr => ({
    tipo: tr.dataset.tipo,
    responsable: tr.querySelector('.inp-responsable-disco').value,
    cantidad: tr.querySelector('.inp-cantidad-disco').value
  }));
  const btn = document.getElementById(enviar ? 'btnEnviarDiscos' : 'btnProvisorioDiscos');
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const data = await postJSON({ action: 'registrarTrazabilidadDiscosLote', fecha, items, enviar: !!enviar });
    conCantidad.forEach(marcarFilaGuardada);
    const hora = horaCorta();
    if(enviar){
      avisar(`✓ Discos enviados · ${hora} — ${data.total_dia} tipo(s) guardados.`);
      msg.className = 'msg ok';
      msg.textContent = `✓ Enviado a las ${hora}: quedaron guardados ${data.total_dia} tipo(s) de disco para el ${fmtFecha(fecha)}.`;
      pintarRegistroDiscosSector();
    } else {
      const aviso = items.length ? `${items.length} tipo(s) nuevos guardados` : 'no había nada nuevo para guardar';
      avisar(`✓ Guardado provisorio · ${hora} — ${aviso}.`);
      msg.className = 'msg ok';
      msg.textContent = `✓ Guardado provisorio a las ${hora}: ${aviso}. En total hay ${data.total_dia} tipo(s) de disco guardados hoy. Podés seguir cargando.`;
    }
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

function habilitarEdicionFilaDiscos(tr){
  const sello = tr.querySelector('.sello-guardado');
  if(sello) sello.remove();
  tr.classList.remove('fila-guardada');
  [...tr.querySelectorAll('input,select')].forEach(el => el.disabled = false);
  const btnGuardar = tr.querySelector('.btn-guardar-disco');
  if(btnGuardar){ btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar'; btnGuardar.style.display = ''; }
  const btnEditar = tr.querySelector('.btn-editar-disco');
  if(btnEditar) btnEditar.style.display = 'none';
}

async function guardarItemDiscos(tr, fecha){
  const btn = tr.querySelector('.btn-guardar-disco');
  const responsable = tr.querySelector('.inp-responsable-disco').value;
  const cantidad = tr.querySelector('.inp-cantidad-disco').value;
  if(!cantidad || Number(cantidad) <= 0){
    alert('Cargá la cantidad antes de guardar.');
    return;
  }
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registrarTrazabilidadDiscosItem', fecha, tipo: tr.dataset.tipo, responsable, cantidad })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    marcarFilaGuardada(tr);
    avisar(`✓ Guardado: discos ${tr.dataset.tipo} — ${cantidad} · ${horaCorta()}`);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar: ' + err.message);
  }
}

async function cargarEnvios(){
  const fecha = document.getElementById('fechaEnvios').value;
  const cont = document.getElementById('contenidoEnvios');
  cont.className = 'loading'; cont.textContent = 'Calculando…';
  document.getElementById('tabsEnvios').style.display = 'none';
  const msg = document.getElementById('msgEnvios');
  msg.className = 'msg'; msg.textContent = '';

  try{
    const [r, categorias, empleados, rGuardado] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularEnvios&fecha=${fecha}`),
      obtenerCategorias(),
      obtenerEmpleados(),
      fetch(`${APPS_SCRIPT_URL}?action=obtenerEnviosDia&fecha=${fecha}`).then(x => x.json()).catch(() => ({}))
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    // lo ya guardado hoy (para no arrancar en blanco al recargar)
    const guardadoPorLocal = (rGuardado && !rGuardado.error && rGuardado.porLocal) || {};
    if(document.getElementById('fechaEnvios').value !== fecha) return; // cambió la fecha mientras cargaba
    const conDatos = LOCALES_VENTA.map(l => guardadoPorLocal[l]).find(g => g && g.responsable) || {};

    document.getElementById('inpResponsableEnvio').innerHTML = opcionesEmpleadosSeleccion(empleados, conDatos.responsable);
    document.getElementById('inpRepartidorEnvio').innerHTML = opcionesEmpleadosSeleccion(empleados, conDatos.repartidor);
    document.getElementById('inpAcompananteEnvio').innerHTML = opcionesEmpleadosSeleccion(empleados, conDatos.acompanante);

    const tabs = document.getElementById('tabsEnvios');
    tabs.style.display = 'flex';
    tabs.innerHTML = LOCALES_VENTA.map(l => `<button class="tab-btn ${l===TAB_ENVIO_ACTIVO?'active':''}" data-local="${l}">${l}${guardadoPorLocal[l] && guardadoPorLocal[l].cierre ? ' ✓' : ''}</button>`).join('');
    [...tabs.querySelectorAll('.tab-btn')].forEach(b => {
      b.onclick = () => {
        TAB_ENVIO_ACTIVO = b.dataset.local;
        [...tabs.querySelectorAll('.tab-btn')].forEach(x => x.classList.toggle('active', x.dataset.local === TAB_ENVIO_ACTIVO));
        [...document.querySelectorAll('.panel-envio-local')].forEach(p => p.style.display = (p.dataset.local === TAB_ENVIO_ACTIVO ? '' : 'none'));
      };
    });

    cont.className = '';
    cont.innerHTML = '';
    LOCALES_VENTA.forEach(local => {
      cont.appendChild(pintarEnvioLocal(local, data.envios[local] || [], data, categorias, guardadoPorLocal[local] || {}));
    });
    [...document.querySelectorAll('.panel-envio-local')].forEach(p => p.style.display = (p.dataset.local === TAB_ENVIO_ACTIVO ? '' : 'none'));

    LOCALES_VENTA.forEach(local => {
      const btn = document.getElementById(`btnGuardarEnvio-${cssId(local)}`);
      if(btn) btn.onclick = () => guardarEnvio(local, fecha, true);
      const btnProv = document.getElementById(`btnProvisorioEnvio-${cssId(local)}`);
      if(btnProv) btnProv.onclick = () => guardarEnvio(local, fecha, false);
      const btnImprimir = document.getElementById(`btnImprimirEnvio-${cssId(local)}`);
      if(btnImprimir) btnImprimir.onclick = () => imprimirOrdenEnvio(local, fecha);
    });
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo calcular: ${err.message}</div>`;
  }
}

// una fila por producto (todos, siempre visibles); el botón "+" agrega otra
// fila del MISMO producto para cargar un segundo lote con otro vencimiento —
// mismo patrón que "Cargar stock". Cada fila tiene su propio Guardar/Editar,
// igual que en Registrar producción.
function filaEnvio(nombre, ordenCalculada, esExtra, local, fecha, guardado){
  const g = guardado || {};
  const yaGuardado = !!guardado;
  const dis = yaGuardado ? 'disabled' : '';
  const tr = document.createElement('tr');
  tr.dataset.item = nombre;
  if(yaGuardado) tr.classList.add('fila-guardada');
  // la orden calculada se guarda en la fila base (no en los "otro lote") para
  // poder imprimir con este valor cuando todavía no se cargó nada a mano.
  tr.dataset.orden = esExtra ? 0 : (ordenCalculada || 0);
  tr.innerHTML = `
    <td>${esExtra ? `<span class="item-extra">↳ otro lote</span>` : nombre}</td>
    <td class="num" style="color:var(--ink-soft);">${esExtra ? '' : ent(ordenCalculada)}</td>
    <td><input type="number" min="0" step="1" class="inp-cant" placeholder="0" value="${g.cantidad || ''}" ${dis}></td>
    <td><input type="date" class="inp-venc" value="${g.vencimiento || ''}" ${dis}></td>
    <td class="col-add">${esExtra ? '' : '<button type="button" class="add-lote-btn" title="Agregar otro vencimiento para este producto">+</button>'}</td>
    <td class="col-del">${esExtra ? '<button type="button" class="del-btn" title="Quitar">✕</button>' : ''}</td>
    <td style="white-space:nowrap;">
      <button type="button" class="btn secondary btn-guardar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? 'display:none;' : ''}">Guardar</button>
      <button type="button" class="btn secondary btn-editar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? '' : 'display:none;'}">Editar</button>
    </td>
  `;
  if(esExtra){
    tr.querySelector('.del-btn').onclick = () => tr.remove();
  } else {
    tr.querySelector('.add-lote-btn').onclick = () => {
      tr.insertAdjacentElement('afterend', filaEnvio(nombre, ordenCalculada, true, local, fecha));
    };
  }
  tr.querySelector('.btn-guardar-item').onclick = () => guardarItemEnvio(tr, local, fecha);
  tr.querySelector('.btn-editar-item').onclick = () => habilitarEdicionFila(tr);
  if(yaGuardado){ tr.dataset.vencGuardado = g.vencimiento || ''; ponerSello(tr, null); }
  return tr;
}

function tablaEnvioDe(items, porSabor, local, fecha, guardadosPorItem){
  const table = document.createElement('table');
  table.className = 'lotes';
  table.innerHTML = `
    <thead><tr>
      <th>Sabor / ítem</th>
      <th class="col-cant">Orden calculada</th>
      <th class="col-cant">Enviado (real)</th>
      <th class="col-venc">Vencimiento</th>
      <th class="col-add"></th>
      <th class="col-del"></th>
      <th></th>
    </tr></thead>
    <tbody></tbody>`;
  const tbody = table.querySelector('tbody');
  items.forEach(nombre => {
    const orden = (porSabor[nombre] && porSabor[nombre].aHacerUnidades) || 0;
    const guardados = (guardadosPorItem && guardadosPorItem[nombre]) || [];
    if(guardados.length === 0){
      tbody.appendChild(filaEnvio(nombre, orden, false, local, fecha, null));
    } else {
      guardados.forEach((g, i) => tbody.appendChild(filaEnvio(nombre, orden, i > 0, local, fecha, g)));
    }
  });
  return table;
}

function pintarEnvioLocal(local, itemsCalculados, data, categorias, guardado){
  const id = cssId(local);
  const guardadosPorItem = {};
  ((guardado && guardado.items) || []).forEach(it => {
    guardadosPorItem[it.sabor] = guardadosPorItem[it.sabor] || [];
    guardadosPorItem[it.sabor].push(it);
  });
  const cierre = guardado && guardado.cierre;
  const porSabor = {};
  itemsCalculados.forEach(it => { porSabor[it.sabor] = it; });
  const nombresCategorias = Object.keys(categorias);

  const div = document.createElement('div');
  div.className = 'panel-envio-local';
  div.dataset.local = local;
  div.style.display = 'none';

  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = `${data.dia}, ${fmtFecha(data.fecha)} — orden calculada para ${local}`;
  div.appendChild(intro);

  const nav = document.createElement('div');
  nav.className = 'cat-nav';
  div.appendChild(nav);

  nombresCategorias.forEach((cat, i) => {
    const catId = `cat-envio-${id}-${i}`;
    const h = document.createElement('h4');
    h.className = 'cat-heading';
    h.id = catId;
    h.textContent = cat;
    div.appendChild(h);
    div.appendChild(tablaEnvioDe(categorias[cat], porSabor, local, data.fecha, guardadosPorItem));

    const a = document.createElement('a');
    a.href = `#${catId}`;
    a.textContent = cat;
    nav.appendChild(a);
  });

  const actions = document.createElement('div');
  if(cierre){
    // despacho ya enviado: bloqueado, con Reabrir (solo queda Imprimir)
    bloquearFilasEnviadas(div);
    div.insertBefore(cartelEnviado(cierre, `Despacho a ${local}`, async () => {
      if(!confirm(`¿Reabrir el despacho a ${local}? Lo que el local todavía no confirmó deja de aparecerle hasta que se vuelva a enviar.`)) return;
      try{
        await postJSON({ action: 'reabrirCarga', pantalla: 'Envios', fecha: data.fecha, clave: local });
        avisar(`Despacho a ${local} reabierto — ya se puede editar.`);
        cargarEnvios();
      }catch(err){ avisar('✗ No se pudo reabrir: ' + err.message, 'err'); }
    }), intro.nextSibling);
    actions.className = 'actions no-print';
    actions.innerHTML = `<button class="btn secondary" id="btnImprimirEnvio-${id}">🖶 Imprimir orden de envío</button>`;
  } else {
    actions.innerHTML = htmlBarraFinal(`btnProvisorioEnvio-${id}`, `btnGuardarEnvio-${id}`, `Guardar y enviar despacho a ${local}`,
      `<strong>Guardado provisorio</strong>: guarda lo cargado y se puede seguir armando el despacho — ${local} todavía NO lo ve. <strong>Guardar y enviar</strong>: guarda todo, cierra el despacho y recién ahí le aparece a ${local} en "Confirmar recepción".`)
      + `<div class="actions no-print" style="margin-top:10px;"><button class="btn secondary" id="btnImprimirEnvio-${id}">🖶 Imprimir orden de envío</button></div>`;
  }
  div.appendChild(actions);

  return div;
}

// lee los 3 campos compartidos del despacho (responsable, repartidor,
// acompañante) — los pide tanto el guardado por fila como el final.
function datosComunesEnvio(){
  return {
    responsable: document.getElementById('inpResponsableEnvio').value.trim(),
    repartidor: document.getElementById('inpRepartidorEnvio').value.trim(),
    acompanante: document.getElementById('inpAcompananteEnvio').value.trim()
  };
}

// "preguardar" un producto/lote apenas se carga, sin esperar a terminar
// todo el despacho de ese local.
async function guardarItemEnvio(tr, local, fecha){
  const { responsable, repartidor, acompanante } = datosComunesEnvio();
  if(!responsable){
    alert('Indicá quién está despachando este envío antes de guardar (arriba de la lista de productos).');
    return;
  }
  const cantidad = tr.querySelector('.inp-cant').value;
  const vencimiento = tr.querySelector('.inp-venc').value;
  if(!cantidad || Number(cantidad) <= 0 || !vencimiento){
    alert('Cargá cantidad y vencimiento de este producto antes de guardarlo.');
    return;
  }
  const item = { sabor: tr.dataset.item, cantidad, vencimiento };
  if(tr.dataset.vencGuardado && tr.dataset.vencGuardado !== vencimiento) item.vencimientoAnterior = tr.dataset.vencGuardado;
  if(!confirmarVencimientos([item], fecha)) return;
  const btn = tr.querySelector('.btn-guardar-item');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await postJSON({ action: 'registrarEnvio', local, fecha, responsable, repartidor, acompanante, items: [item] });
    marcarFilaGuardada(tr);
    avisar(`✓ Guardado para ${local}: ${item.sabor} — ${cantidad} (vence ${fmtFecha(vencimiento)}) · ${horaCorta()}`);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar este producto: ' + err.message);
  }
}

// "Guardado provisorio" / "Guardar y enviar despacho a [local]": guardan de
// una sola vez todo lo que haya quedado sin guardar con su propio botón. Solo
// "Guardar y enviar" hace que el local vea el despacho en Confirmar recepción.
async function guardarEnvio(local, fecha, enviar){
  const { responsable, repartidor, acompanante } = datosComunesEnvio();
  const msg = document.getElementById('msgEnvios');
  msg.className = 'msg'; msg.textContent = '';
  if(!responsable){
    msg.className = 'msg err'; msg.textContent = 'Indicá quién está despachando este envío (arriba de todo).';
    avisar('✗ Falta indicar quién despacha.', 'err');
    return;
  }
  const panel = document.querySelector(`.panel-envio-local[data-local="${local}"]`);
  const filas = [...panel.querySelectorAll('tr[data-item]:not(.fila-guardada)')];
  const completas = [], incompletas = [];
  filas.forEach(tr => {
    const cantidad = tr.querySelector('.inp-cant').value;
    const vencimiento = tr.querySelector('.inp-venc').value;
    const tieneCant = cantidad && Number(cantidad) > 0;
    if(tieneCant && vencimiento) completas.push(tr);
    else if(tieneCant || vencimiento) incompletas.push(tr.dataset.item + (tieneCant ? ' (falta vencimiento)' : ' (falta cantidad)'));
  });
  if(enviar && incompletas.length){
    msg.className = 'msg err';
    msg.textContent = 'No se envió: hay productos a medio completar — ' + incompletas.join(', ') + '. Completalos o borrales el dato.';
    avisar('✗ No se envió: hay productos a medio completar (ver abajo).', 'err');
    return;
  }
  const yaGuardados = panel.querySelectorAll('tr[data-item].fila-guardada').length;
  if(enviar && completas.length === 0 && yaGuardados === 0){
    msg.className = 'msg err'; msg.textContent = `No hay nada cargado para enviar a ${local}.`;
    avisar(`✗ No hay nada cargado para enviar a ${local}.`, 'err');
    return;
  }
  if(enviar && !confirm(`¿Guardar y enviar el despacho a ${local}? Recién ahí le aparece al local para confirmar la recepción.`)) return;

  const items = completas.map(tr => {
    const it = { sabor: tr.dataset.item, cantidad: tr.querySelector('.inp-cant').value, vencimiento: tr.querySelector('.inp-venc').value };
    if(tr.dataset.vencGuardado && tr.dataset.vencGuardado !== it.vencimiento) it.vencimientoAnterior = tr.dataset.vencGuardado;
    return it;
  });
  if(!confirmarVencimientos(items, fecha)) return;
  const btn = document.getElementById(enviar ? `btnGuardarEnvio-${cssId(local)}` : `btnProvisorioEnvio-${cssId(local)}`);
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const data = await postJSON({ action: 'registrarEnvio', local, fecha, responsable, repartidor, acompanante, items, enviar: !!enviar });
    completas.forEach(marcarFilaGuardada);
    const hora = horaCorta();
    if(enviar){
      avisar(`✓ Despacho a ${local} enviado · ${hora} — ${data.total_dia} producto(s).`);
      msg.className = 'msg ok';
      msg.textContent = `✓ Despacho a ${local} enviado a las ${hora}: ${data.total_dia} producto(s) guardados. El local ya lo ve en "Confirmar recepción".`;
      cargarEnvios(); // vuelve a leer de la planilla y muestra el despacho cerrado
    } else {
      const aviso = items.length ? `${items.length} producto(s) nuevos guardados` : 'no había nada nuevo para guardar';
      avisar(`✓ Guardado provisorio (${local}) · ${hora} — ${aviso}. Total: ${data.total_dia}.`);
      msg.className = incompletas.length ? 'msg err' : 'msg ok';
      msg.textContent = `✓ Guardado provisorio a las ${hora}: ${aviso}. En total hay ${data.total_dia} producto(s) guardados para ${local}. Todavía NO se envió — el local no lo ve hasta "Guardar y enviar".`
        + (incompletas.length ? ' OJO — no se guardaron porque están a medio completar: ' + incompletas.join(', ') + '.' : '');
    }
  }catch(err){
    msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
    avisar('✗ NO se guardó — ' + err.message, 'err');
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

// Arma una hoja de "Orden de envío" imprimible para UN local. Si ya cargaron
// cantidad a mano, imprime eso; si no (todavía no tiene tablet a mano quien
// prepara el pedido), imprime la orden CALCULADA, así sirve de planilla en
// papel para armar el envío y cargarlo después. Se salta cualquier producto
// sin nada (ni cargado ni calculado) y la categoría entera si ninguno de sus
// productos tiene algo para enviar.
function imprimirOrdenEnvio(local, fecha){
  const panel = document.querySelector(`.panel-envio-local[data-local="${local}"]`);
  const filas = [...panel.querySelectorAll('tr[data-item]')];
  const porSabor = {};
  filas.forEach(tr => {
    const nombre = tr.dataset.item;
    const cantidadReal = Number(tr.querySelector('.inp-cant').value) || 0;
    const venc = tr.querySelector('.inp-venc').value;
    if(!porSabor[nombre]){
      porSabor[nombre] = { ordenCalculada: Number(tr.dataset.orden) || 0, cantidadReal: 0, vencimiento: '' };
    }
    porSabor[nombre].cantidadReal += cantidadReal;
    if(!porSabor[nombre].vencimiento && venc) porSabor[nombre].vencimiento = venc;
  });
  Object.keys(porSabor).forEach(n => {
    const it = porSabor[n];
    it.cantidadImprimir = it.cantidadReal > 0 ? it.cantidadReal : it.ordenCalculada;
  });

  const hayAlgo = Object.keys(porSabor).some(n => porSabor[n].cantidadImprimir > 0);
  if(!hayAlgo){
    alert(`No hay nada para enviar a ${local} hoy (ni cargado ni calculado).`);
    return;
  }

  const categorias = SABORES_CACHE || {};
  let filasHtml = '';
  Object.keys(categorias).forEach(cat => {
    const nombres = categorias[cat].filter(n => porSabor[n] && porSabor[n].cantidadImprimir > 0);
    if(nombres.length === 0) return; // sin nada que enviar en esta categoría: no se imprime
    filasHtml += `
      <h3>${cat}</h3>
      <table class="print-tabla">
        <thead><tr><th>Sabor / ítem</th><th class="num">Cantidad</th><th>Vencimiento</th></tr></thead>
        <tbody>
          ${nombres.map(n => `
            <tr>
              <td>${n}</td>
              <td class="num">${ent(porSabor[n].cantidadImprimir)}</td>
              <td>${porSabor[n].vencimiento ? fmtFecha(porSabor[n].vencimiento) : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  });

  let area = document.getElementById('printAreaEnvio');
  if(!area){
    area = document.createElement('div');
    area.id = 'printAreaEnvio';
    document.body.appendChild(area);
  }
  area.innerHTML = `
    <h1>Orden de envío</h1>
    <p class="print-sub">${local} — ${fmtFecha(fecha)}</p>
    ${filasHtml}
  `;

  document.body.classList.add('print-envio');
  window.print();
  document.body.classList.remove('print-envio');
}
