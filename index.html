async function cargarEnvios(){
  const fecha = document.getElementById('fechaEnvios').value;
  const cont = document.getElementById('contenidoEnvios');
  cont.className = 'loading'; cont.textContent = 'Calculando…';
  document.getElementById('tabsEnvios').style.display = 'none';
  const msg = document.getElementById('msgEnvios');
  msg.className = 'msg'; msg.textContent = '';

  try{
    const [r, categorias, empleados] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularEnvios&fecha=${fecha}`),
      obtenerCategorias(),
      obtenerEmpleados()
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);

    document.getElementById('inpResponsableEnvio').innerHTML = opcionesEmpleados(empleados);
    document.getElementById('inpRepartidorEnvio').innerHTML = opcionesEmpleados(empleados);
    document.getElementById('inpAcompananteEnvio').innerHTML = opcionesEmpleados(empleados);

    const tabs = document.getElementById('tabsEnvios');
    tabs.style.display = 'flex';
    tabs.innerHTML = LOCALES_VENTA.map(l => `<button class="tab-btn ${l===TAB_ENVIO_ACTIVO?'active':''}" data-local="${l}">${l}</button>`).join('');
    [...tabs.querySelectorAll('.tab-btn')].forEach(b => {
      b.onclick = () => {
        TAB_ENVIO_ACTIVO = b.dataset.local;
        [...tabs.querySelectorAll('.tab-btn')].forEach(x => x.classList.toggle('active', x.dataset.local === TAB_ENVIO_ACTIVO));
        [...document.querySelectorAll('.panel-envio-local')].forEach(p => p.style.display = (p.dataset.local === TAB_ENVIO_ACTIVO ? '' : 'none'));
      };
    });

    cont.className = '';
    cont.innerHTML = '';
    LOCALES_VENTA.forEach(local => {
      cont.appendChild(pintarEnvioLocal(local, data.envios[local] || [], data, categorias));
    });
    [...document.querySelectorAll('.panel-envio-local')].forEach(p => p.style.display = (p.dataset.local === TAB_ENVIO_ACTIVO ? '' : 'none'));

    LOCALES_VENTA.forEach(local => {
      const btn = document.getElementById(`btnGuardarEnvio-${cssId(local)}`);
      if(btn) btn.onclick = () => guardarEnvio(local, fecha);
      const btnImprimir = document.getElementById(`btnImprimirEnvio-${cssId(local)}`);
      if(btnImprimir) btnImprimir.onclick = () => imprimirOrdenEnvio(local, fecha);
    });
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo calcular: ${err.message}</div>`;
  }
}

// una fila por producto (todos, siempre visibles); el botón "+" agrega otra
// fila del MISMO producto para cargar un segundo lote con otro vencimiento —
// mismo patrón que "Cargar stock". Cada fila tiene su propio Guardar/Editar,
// igual que en Registrar producción.
function filaEnvio(nombre, ordenCalculada, esExtra, local, fecha){
  const tr = document.createElement('tr');
  tr.dataset.item = nombre;
  // la orden calculada se guarda en la fila base (no en los "otro lote") para
  // poder imprimir con este valor cuando todavía no se cargó nada a mano.
  tr.dataset.orden = esExtra ? 0 : (ordenCalculada || 0);
  tr.innerHTML = `
    <td>${esExtra ? `<span class="item-extra">↳ otro lote</span>` : nombre}</td>
    <td class="num" style="color:var(--ink-soft);">${esExtra ? '' : ent(ordenCalculada)}</td>
    <td><input type="number" min="0" step="1" class="inp-cant" placeholder="0"></td>
    <td><input type="date" class="inp-venc"></td>
    <td class="col-add">${esExtra ? '' : '<button type="button" class="add-lote-btn" title="Agregar otro vencimiento para este producto">+</button>'}</td>
    <td class="col-del">${esExtra ? '<button type="button" class="del-btn" title="Quitar">✕</button>' : ''}</td>
    <td style="white-space:nowrap;">
      <button type="button" class="btn secondary btn-guardar-item" style="font-size:12px;padding:5px 9px;">Guardar</button>
      <button type="button" class="btn secondary btn-editar-item" style="font-size:12px;padding:5px 9px;display:none;">Editar</button>
    </td>
  `;
  if(esExtra){
    tr.querySelector('.del-btn').onclick = () => tr.remove();
  } else {
    tr.querySelector('.add-lote-btn').onclick = () => {
      tr.insertAdjacentElement('afterend', filaEnvio(nombre, ordenCalculada, true, local, fecha));
    };
  }
  tr.querySelector('.btn-guardar-item').onclick = () => guardarItemEnvio(tr, local, fecha);
  tr.querySelector('.btn-editar-item').onclick = () => habilitarEdicionFila(tr);
  return tr;
}

function tablaEnvioDe(items, porSabor, local, fecha){
  const table = document.createElement('table');
  table.className = 'lotes';
  table.innerHTML = `
    <thead><tr>
      <th>Sabor / ítem</th>
      <th class="col-cant">Orden calculada</th>
      <th class="col-cant">Enviado (real)</th>
      <th class="col-venc">Vencimiento</th>
      <th class="col-add"></th>
      <th class="col-del"></th>
      <th></th>
    </tr></thead>
    <tbody></tbody>`;
  const tbody = table.querySelector('tbody');
  items.forEach(nombre => {
    const orden = (porSabor[nombre] && porSabor[nombre].aHacerUnidades) || 0;
    tbody.appendChild(filaEnvio(nombre, orden, false, local, fecha));
  });
  return table;
}

function pintarEnvioLocal(local, itemsCalculados, data, categorias){
  const id = cssId(local);
  const porSabor = {};
  itemsCalculados.forEach(it => { porSabor[it.sabor] = it; });
  const nombresCategorias = Object.keys(categorias);

  const div = document.createElement('div');
  div.className = 'panel-envio-local';
  div.dataset.local = local;
  div.style.display = 'none';

  const intro = document.createElement('p');
  intro.style.cssText = 'color:var(--ink-soft);font-size:13px;';
  intro.textContent = `${data.dia}, ${fmtFecha(data.fecha)} — orden calculada para ${local}`;
  div.appendChild(intro);

  const nav = document.createElement('div');
  nav.className = 'cat-nav';
  div.appendChild(nav);

  nombresCategorias.forEach((cat, i) => {
    const catId = `cat-envio-${id}-${i}`;
    const h = document.createElement('h4');
    h.className = 'cat-heading';
    h.id = catId;
    h.textContent = cat;
    div.appendChild(h);
    div.appendChild(tablaEnvioDe(categorias[cat], porSabor, local, data.fecha));

    a.href = `#${catId}`;
    a.textContent = cat;

  });

    <button class="btn secondary" id="btnImprimirEnvio-${id}">🖶 Imprimir orden de envío</button>
  `;
  div.appendChild(actions);

  return div;
}

// lee los 3 campos compartidos del despacho (responsable, repartidor,
// acompañante) — los pide tanto el guardado por fila como el final.
function datosComunesEnvio(){
  return {
    responsable: document.getElementById('inpResponsableEnvio').value.trim(),
    repartidor: document.getElementById('inpRepartidorEnvio').value.trim(),
    acompanante: document.getElementById('inpAcompananteEnvio').value.trim()
  };
}

// "preguardar" un producto/lote apenas se carga, sin esperar a terminar
// todo el despacho de ese local.
async function guardarItemEnvio(tr, local, fecha){
  const { responsable, repartidor, acompanante } = datosComunesEnvio();
  if(!responsable){
    alert('Indicá quién está despachando este envío antes de guardar (arriba de la lista de productos).');
    return;
  }
  const cantidad = tr.querySelector('.inp-cant').value;
  const vencimiento = tr.querySelector('.inp-venc').value;
  if(!cantidad || Number(cantidad) <= 0 || !vencimiento){
    alert('Cargá cantidad y vencimiento de este producto antes de guardarlo.');
    return;
  }
  const item = { sabor: tr.dataset.item, cantidad, vencimiento };
  const btn = tr.querySelector('.btn-guardar-item');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registrarEnvio', local, fecha, responsable, repartidor, acompanante, items: [item] })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    tr.classList.add('fila-guardada');
    [...tr.querySelectorAll('input')].forEach(el => el.disabled = true);
    btn.textContent = '✓ Guardado'; btn.style.display = 'none';
    const btnEditar = tr.querySelector('.btn-editar-item');
    if(btnEditar) btnEditar.style.display = '';
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar este producto: ' + err.message);
  }
}

// "Guardar despacho a [local]": guarda de una sola vez todo lo que haya
// quedado sin guardar individualmente con su propio botón.
async function guardarEnvio(local, fecha){
  const { responsable, repartidor, acompanante } = datosComunesEnvio();
  const msg = document.getElementById('msgEnvios');
  if(!responsable){
    msg.className = 'msg err'; msg.textContent = 'Indicá quién está despachando este envío.'; return;
  }
  const panel = document.querySelector(`.panel-envio-local[data-local="${local}"]`);
  const filas = [...panel.querySelectorAll('tr[data-item]:not(.fila-guardada)')];
  const items = filas.map(tr => ({
    sabor: tr.dataset.item,
    cantidad: tr.querySelector('.inp-cant').value,
    vencimiento: tr.querySelector('.inp-venc').value
  })).filter(it => it.cantidad && Number(it.cantidad) > 0 && it.vencimiento);

  if(items.length === 0){
    msg.className = 'msg err'; msg.textContent = 'Cargá cantidad y vencimiento de al menos un producto (los que ya guardaste con su propio botón no hace falta repetirlos).'; return;
  }
  const btn = document.getElementById(`btnGuardarEnvio-${cssId(local)}`);
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'registrarEnvio', local, fecha, responsable, repartidor, acompanante, items })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    filas.forEach(tr => {
      if(Number(tr.querySelector('.inp-cant').value) > 0 && tr.querySelector('.inp-venc').value){
        tr.classList.add('fila-guardada');
        [...tr.querySelectorAll('input')].forEach(el => el.disabled = true);
        const btnG = tr.querySelector('.btn-guardar-item');
        btnG.textContent = '✓ Guardado'; btnG.style.display = 'none';
        const btnE = tr.querySelector('.btn-editar-item');
        if(btnE) btnE.style.display = '';
      }
    });
    msg.className = 'msg ok';
    msg.textContent = `Despacho guardado: ${data.envios_guardados} producto(s) más enviados a ${local}.`;
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'No se pudo guardar: ' + err.message;
  }finally{
    btn.disabled = false; btn.textContent = `Guardar despacho a ${local}`;
  }
}

// Arma una hoja de "Orden de envío" imprimible para UN local. Si ya cargaron
// cantidad a mano, imprime eso; si no (todavía no tiene tablet a mano quien
// prepara el pedido), imprime la orden CALCULADA, así sirve de planilla en
// papel para armar el envío y cargarlo después. Se salta cualquier producto
// sin nada (ni cargado ni calculado) y la categoría entera si ninguno de sus
// productos tiene algo para enviar.
function imprimirOrdenEnvio(local, fecha){
  const panel = document.querySelector(`.panel-envio-local[data-local="${local}"]`);
  const filas = [...panel.querySelectorAll('tr[data-item]')];
  const porSabor = {};
  filas.forEach(tr => {
    const nombre = tr.dataset.item;
    const cantidadReal = Number(tr.querySelector('.inp-cant').value) || 0;
    const venc = tr.querySelector('.inp-venc').value;
    if(!porSabor[nombre]){
      porSabor[nombre] = { ordenCalculada: Number(tr.dataset.orden) || 0, cantidadReal: 0, vencimiento: '' };
    }
    porSabor[nombre].cantidadReal += cantidadReal;
    if(!porSabor[nombre].vencimiento && venc) porSabor[nombre].vencimiento = venc;
  });
  Object.keys(porSabor).forEach(n => {
    const it = porSabor[n];
    it.cantidadImprimir = it.cantidadReal > 0 ? it.cantidadReal : it.ordenCalculada;
  });

  const hayAlgo = Object.keys(porSabor).some(n => porSabor[n].cantidadImprimir > 0);
  if(!hayAlgo){
    alert(`No hay nada para enviar a ${local} hoy (ni cargado ni calculado).`);
    return;
  }

  const categorias = SABORES_CACHE || {};
  let filasHtml = '';
  Object.keys(categorias).forEach(cat => {
    const nombres = categorias[cat].filter(n => porSabor[n] && porSabor[n].cantidadImprimir > 0);
    if(nombres.length === 0) return; // sin nada que enviar en esta categoría: no se imprime
    filasHtml += `
      <h3>${cat}</h3>
      <table class="print-tabla">
        <thead><tr><th>Sabor / ítem</th><th class="num">Cantidad</th><th>Vencimiento</th></tr></thead>
        <tbody>
          ${nombres.map(n => `
            <tr>
              <td>${n}</td>
              <td class="num">${ent(porSabor[n].cantidadImprimir)}</td>
              <td>${porSabor[n].vencimiento ? fmtFecha(porSabor[n].vencimiento) : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  });

  let area = document.getElementById('printAreaEnvio');
  if(!area){
    area = document.createElement('div');
    area.id = 'printAreaEnvio';
    document.body.appendChild(area);
  }
  area.innerHTML = `
    <h1>Orden de envío</h1>
    <p class="print-sub">${local} — ${fmtFecha(fecha)}</p>
    ${filasHtml}
  `;

  document.body.classList.add('print-envio');
  window.print();
  document.body.classList.remove('print-envio');
}

        <tbody>
          ${envios.map(f => `
            <tr>
              <td>${fmtFecha(f.Fecha_envio)}</td>
              <td>${f.Local}</td>
              <td>${f.Sabor}</td>
              <td class="num">${ent(f.Cantidad_Enviada)}</td>
              <td style="color:var(--ink-soft);font-size:12.5px;">${fmtFecha(f.Vencimiento)}</td>
              <td style="color:var(--ink-soft);font-size:12.5px;">${f.Fecha_recepcion ? fmtFecha(f.Fecha_recepcion) : '— sin confirmar —'}</td>
              <td class="num">${f.Fecha_recepcion ? ent(f.Cantidad_Recibida) : '—'}</td>
              <td class="num" style="${f.Diferencia ? 'color:var(--alert);font-weight:600;' : ''}">${f.Diferencia === null ? '—' : (f.Diferencia > 0 ? '+' : '') + ent(f.Diferencia)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo buscar: ${err.message}</div>`;
  }
}

/* ---------------------------------------------------------------------
   Pantalla PLANIFICACIÓN: editar venta proyectada por local
   --------------------------------------------------------------------- */
async function renderPlanificacion(){
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <header class="top"><h1>Planificación de ventas</h1></header>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:-8px;">
      Cuánto se espera vender de cada sabor, cada día — esto es lo que usa el cálculo de "qué producir hoy".
    </p>

    <div style="border:1px dashed var(--line);border-radius:4px;padding:14px 16px;margin:16px 0;">
      <label style="margin-bottom:8px;">Importar desde Excel (reemplaza toda la planificación de los 3 locales)</label>
      <input type="file" id="inputExcelPlan" accept=".xlsx,.xls">
      <div id="msgImportPlan" class="msg" style="margin-top:10px;"></div>
    </div>
  `;
  document.getElementById('inputExcelPlan').onchange = importarExcelPlanificacion;
}

// nombres de sabor en la planilla que no calzan tal cual con el sistema
// (por ambigüedad con otro ítem de igual nombre en otro rubro)
const ALIAS_IMPORT = {
  'DIPS|ED. LIMITADA': 'ED. LIMITADA (dip)',
  'CAJITA CRIOLLA|JAMON Y QUESO': 'CAJITA JAMON Y QUESO',
  'CAJITA CRIOLLA|HAMBURGUESA': 'CAJITA HAMBURGUESA',
  'CAJITA CRIOLLA|CHOCLO': 'CAJITA CHOCLO',
  'CAJITA CRIOLLA|POLLO Y CHEDDAR': 'CAJITA POLLO Y CHEDDAR',
  'CAJITA CRIOLLA|COOKIES *2': 'BOLSA COOKIES X2',
};
const CATEGORIAS_EXCEL = ['EMPANADAS','TOPPINGS','DIPS','POSTRES','CAJITA CRIOLLA'];
const HOJA_A_LOCAL = { CENTRO: 'Centro', PATAGONIA: 'Patagonia', ZELARRAYAN: 'Zelarrayan' };

function normalizarNombre(s){
  return String(s).trim().toUpperCase().replace(/\s+/g, ' ');
}

async function importarExcelPlanificacion(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const msg = document.getElementById('msgImportPlan');
  msg.className = 'msg'; msg.style.display = 'block'; msg.textContent = 'Leyendo archivo…';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });

    // mapa Sabor (real, del sistema) -> normalizado, para matchear
    const sabores = await obtenerSaboresPlanos();
    const porNombreNormalizado = {};
    sabores.forEach(s => { porNombreNormalizado[normalizarNombre(s)] = s; });

    const sinMatch = [];
    let totalActualizados = 0;
    let totalCreados = 0;

    for(const hoja of Object.keys(HOJA_A_LOCAL)){
      if(!wb.SheetNames.includes(hoja)){ continue; }
      const local = HOJA_A_LOCAL[hoja];
      const filasHoja = XLSX.utils.sheet_to_json(wb.Sheets[hoja], { header: 1, raw: true, defval: 0 });

      let categoriaActual = null;
      const filasParaGuardar = [];
      filasHoja.forEach(fila => {
        const primera = fila[0];
        if(primera === undefined || primera === null || primera === '') return;
        const texto = String(primera).trim();
        if(CATEGORIAS_EXCEL.includes(texto.toUpperCase())){ categoriaActual = texto.toUpperCase(); return; }
        if(texto.toUpperCase() === 'LUNES') return; // fila de encabezado de días

        const alias = ALIAS_IMPORT[`${categoriaActual}|${normalizarNombre(texto)}`];
        const saborReal = alias || porNombreNormalizado[normalizarNombre(texto)];
        if(!saborReal){ sinMatch.push(texto); return; }

        // columnas 1..7 = Lunes..Domingo
        filasParaGuardar.push({
          sabor: saborReal,
          Lunes: fila[1]||0, Martes: fila[2]||0, Miércoles: fila[3]||0, Jueves: fila[4]||0,
          Viernes: fila[5]||0, Sábado: fila[6]||0, Domingo: fila[7]||0
        });
      });

      if(filasParaGuardar.length > 0){
        const r = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'actualizarPlanificacion', local, filas: filasParaGuardar })
        });
        const resp = await r.json();
        if(resp.error) throw new Error(`${local}: ${resp.error}`);
        totalActualizados += resp.filas_actualizadas;
        totalCreados += resp.filas_creadas || 0;
      }
    }

    const unicosSinMatch = [...new Set(sinMatch)];
    msg.className = unicosSinMatch.length ? 'msg err' : 'msg ok';
    msg.textContent = `Importado: ${totalActualizados} ítem(s) actualizados en los 3 locales.` +
      (totalCreados > 0 ? ` (${totalCreados} fila(s) nueva(s) creadas porque no existían todavía).` : '') +
      (unicosSinMatch.length ? ` Sin encontrar en el sistema (se ignoraron): ${unicosSinMatch.join(', ')}` : '');
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'No se pudo importar: ' + err.message;
  }
  ev.target.value = ''; // permite volver a subir el mismo archivo si hace falta
}

async function obtenerSaboresPlanos(){
  const categorias = await obtenerCategorias();
  return Object.values(categorias).flat();
}

/* ---------------------------------------------------------------------
   Pantalla FICHAS TÉCNICAS: importar/actualizar recetas (Rellenos,
   Preparados, Postres, Dips, Edición Limitada) desde el .xlsx de cada una.
   Se parsea directo acá en el navegador (con la misma librería XLSX que ya
   usa la importación de Planificación) — el backend solo guarda lo ya
   armado en Ref_Recetas / Ref_RecetaDetalle.
   --------------------------------------------------------------------- */
const TIPOS_FICHA = [
  { value: 'Relleno', label: 'Relleno' },
  { value: 'Preparado', label: 'Preparado' },
  { value: 'Postre', label: 'Postre' },
  { value: 'Dip', label: 'Dip' },
  { value: 'EdicionLimitada', label: 'Edición Limitada' }
];
const SECCIONES_FIN_FICHA = ['PROCEDIMIENTO', 'DATOS TECNIC', 'PUNTOS DE CONTROL'];

function normalizarFicha(s){
  return String(s == null ? '' : s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}

// única lógica de parseo — corre acá en el navegador (Code.gs solo recibe
// el JSON ya armado, ver importarFichaTecnica en Code.gs).
function parseFichaTecnica(filas){
  let filaHeader = -1;
  let colClasif = -1, colIngred = -1, colCant = -1, colMedida = -1, colRinde = -1;
  for(let r = 0; r < Math.min(filas.length, 10); r++){
    const fila = filas[r];
    let cIdxClasif = -1, cIdxIngred = -1;
    for(let c = 0; c < fila.length; c++){
      const v = normalizarFicha(fila[c]);
      if(v === 'CLASIFICACION') cIdxClasif = c;
      if(v === 'INGREDIENTE') cIdxIngred = c;
    }
    if(cIdxClasif !== -1 && cIdxIngred !== -1){
      filaHeader = r; colClasif = cIdxClasif; colIngred = cIdxIngred;
      for(let c = 0; c < fila.length; c++){
        const v = normalizarFicha(fila[c]);
        if(v === 'CANTIDAD') colCant = c;
        if(v === 'MEDIDA') colMedida = c;
        if(v === 'RINDE') colRinde = c;
      }
      break;
    }
  }
  if(filaHeader === -1) return null;

  // el "Rinde:" puede traer DOS pares cantidad+unidad, uno debajo del otro
  // (ej. Dips: "3 KG" y, en la fila de abajo, "75 UN") — se guardan los dos
  // para poder convertir entre kilos y unidades más adelante.
  let rindeCantidad = '', rindeUnidad = '', rindeCantidad2 = '', rindeUnidad2 = '';
  let filaRindeEncontrada = -1, colRindeLabel = -1;
  for(let r = 0; r < filaHeader; r++){
    const fila = filas[r];
    for(let c = 0; c < fila.length; c++){
      if(normalizarFicha(fila[c]).indexOf('RINDE') === 0){
        const resto = fila.slice(c + 1).filter(x => x !== '' && x != null);
        if(resto.length >= 1) rindeCantidad = resto[0];
        if(resto.length >= 2) rindeUnidad = resto[1];
        filaRindeEncontrada = r;
        colRindeLabel = c;
      }
    }
  }
  if(filaRindeEncontrada !== -1 && filaRindeEncontrada + 1 < filaHeader){
    const filaSig = filas[filaRindeEncontrada + 1];
    const restoSig = filaSig.slice(colRindeLabel + 1).filter(x => x !== '' && x != null);
    if(restoSig.length >= 2 && !isNaN(Number(restoSig[0]))){
      rindeCantidad2 = restoSig[0];
      rindeUnidad2 = restoSig[1];
    }
  }

  const ingredientes = [];
  for(let r = filaHeader + 1; r < filas.length; r++){
    const fila = filas[r];
    const clasif = fila[colClasif];
    const ingred = fila[colIngred];
    const clasifNorm = normalizarFicha(clasif);
    if(SECCIONES_FIN_FICHA.some(k => clasifNorm.indexOf(k) === 0)) break;
    if((clasif === '' || clasif == null) && (ingred === '' || ingred == null)) break;
    if(ingred === '' || ingred == null) continue;
    ingredientes.push({
      clasificacion: clasif || '',
      ingrediente: String(ingred).trim(),
      cantidad: colCant !== -1 && fila[colCant] !== '' && fila[colCant] != null ? Number(fila[colCant]) : '',
      medida: colMedida !== -1 ? (fila[colMedida] || '') : '',
      rinde: colRinde !== -1 && fila[colRinde] !== '' && fila[colRinde] != null ? Number(fila[colRinde]) : ''
    });
  }
  return { rindeCantidad, rindeUnidad, rindeCantidad2, rindeUnidad2, ingredientes };
}

async function renderFichasTecnicas(){
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <header class="top"><h1>Fichas técnicas</h1></header>
    <p style="color:var(--ink-soft);font-size:13px;">
      Importá acá el .xlsx de cada ficha (Rellenos, Preparados, Postres, Dips, Edición Limitada) — cada solapa del
      Excel es una receta. Volver a importar una ficha reemplaza sus recetas por la versión nueva. El nombre de
      cada solapa tiene que ser igual al Relleno/Sabor que ya usás en el resto del sistema, para que puedan cruzarse.
    </p>

    <div style="border:1px dashed var(--line);border-radius:4px;padding:14px 16px;margin:16px 0;max-width:480px;">
      <div class="field-row" style="margin-bottom:12px;">
        <label>Tipo de ficha</label>
        <select id="selTipoFicha">
          ${TIPOS_FICHA.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}
        </select>
      </div>
      <label style="margin-bottom:8px;">Archivo (.xlsx)</label>
      <input type="file" id="inputFichaTecnica" accept=".xlsx,.xls">
      <div id="msgImportFicha" class="msg" style="margin-top:10px;"></div>
    </div>

    <div id="revisionFichaContainer"></div>

    <div id="contenidoRecetasCargadas" class="loading">Buscando recetas cargadas…</div>
  `;
  document.getElementById('inputFichaTecnica').onchange = manejarArchivoFicha;
  cargarRecetasCargadas();
}

// tipo de ficha -> a qué lista de nombres ya existentes se compara cada
// solapa, para poder avisar ANTES de guardar si el nombre no coincide con
// nada (Relleno/Sabor con typo, o directamente inventado). Los Preparados
// no se validan porque no aparecen sueltos en ningún lado — solo se usan
// como ingrediente adentro de otras fichas.
async function referenciaParaTipo(tipoFicha){
  if(tipoFicha === 'Relleno' || tipoFicha === 'EdicionLimitada') return await obtenerRellenos();
  if(tipoFicha === 'Postre' || tipoFicha === 'Dip') return Object.values(await obtenerCategorias()).flat();
  return null;
}

async function manejarArchivoFicha(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const tipoFicha = document.getElementById('selTipoFicha').value;
  const msg = document.getElementById('msgImportFicha');
  document.getElementById('revisionFichaContainer').innerHTML = '';
  msg.className = 'msg'; msg.style.display = 'block'; msg.textContent = 'Leyendo archivo…';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });

    const recetas = [];
    const salteadas = [];
    wb.SheetNames.forEach(nombreHoja => {
      const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, raw: true, defval: '' });
      const parsed = parseFichaTecnica(filas);
      if(!parsed){ salteadas.push(nombreHoja); return; }
      recetas.push({
        nombreReceta: nombreHoja.trim(),
        rindeCantidad: parsed.rindeCantidad, rindeUnidad: parsed.rindeUnidad,
        rindeCantidad2: parsed.rindeCantidad2, rindeUnidad2: parsed.rindeUnidad2,
        ingredientes: parsed.ingredientes
      });
    });

    if(recetas.length === 0){
      msg.className = 'msg err'; msg.textContent = 'No encontré ninguna receta en ese archivo.';
      ev.target.value = ''; return;
    }

    msg.style.display = 'none';
    const referencia = await referenciaParaTipo(tipoFicha);
    mostrarRevisionFicha(tipoFicha, recetas, salteadas, referencia);
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'No se pudo leer el archivo: ' + err.message;
  }
  ev.target.value = '';
}

// pantalla de revisión ANTES de guardar: por cada solapa, dice si el nombre
// coincide con un Relleno/Sabor que ya existe en el sistema; si no coincide
// deja un campo para escribir a mano a qué corresponde en vez de cancelar
// todo e ir a corregir el Excel.
function mostrarRevisionFicha(tipoFicha, recetas, salteadas, referencia){
  const rev = document.getElementById('revisionFichaContainer');
  const referenciaNorm = referencia ? referencia.map(n => normalizarFicha(n)) : null;
  const etiquetaReferencia = (tipoFicha === 'Postre' || tipoFicha === 'Dip') ? 'Sabores' : 'Rellenos';

  const filasHtml = recetas.map((r, i) => {
    const coincide = referenciaNorm === null ? null : referenciaNorm.indexOf(normalizarFicha(r.nombreReceta)) !== -1;
    const estado = coincide === null
      ? `<span style="color:var(--ink-soft);">— no se valida (Preparado)</span>`
      : coincide
        ? `<span style="color:#3f7a4a;">✓ coincide</span>`
        : `<span style="color:#b23b2e;">⚠ no encontré ese nombre entre los ${etiquetaReferencia}</span>`;
    const rinde2 = r.rindeCantidad2 !== '' ? ` / ${r.rindeCantidad2} ${r.rindeUnidad2}` : '';
    return `
      <tr>
        <td>${r.nombreReceta}<br>${estado}</td>
        <td>${r.rindeCantidad} ${r.rindeUnidad}${rinde2}</td>
        <td>${r.ingredientes.length}</td>
        <td><input type="text" class="inp-nombre-correcto" data-idx="${i}" placeholder="dejar igual"></td>
      </tr>`;
  }).join('');

  const salteadasHtml = salteadas.length
    ? `<p style="color:var(--ink-soft);font-size:12.5px;margin-top:10px;">Se salteó (no parece una hoja de receta): ${salteadas.join(', ')}.</p>`
    : '';

  rev.innerHTML = `
    <div style="border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:16px 0;">
      <p style="font-size:13px;margin-bottom:10px;">
        Revisá antes de guardar. Si alguna receta dice "⚠ no encontré ese nombre", escribí en la última columna
        a qué ${etiquetaReferencia.slice(0, -1)} corresponde tal cual está en el sistema (o cancelá y corregí el
        nombre de la solapa en el Excel).
      </p>
      <table class="lotes" style="width:100%;">
        <thead><tr><th>Receta (solapa del Excel)</th><th>Rinde</th><th>Ingredientes</th><th>Corregir nombre a…</th></tr></thead>
        <tbody>${filasHtml}</tbody>
      </table>
      ${salteadasHtml}
      <div class="actions" style="margin-top:12px;">
        <button class="btn" id="btnConfirmarFicha">Confirmar y guardar</button>
        <button class="btn secondary" id="btnCancelarFicha">Cancelar</button>
      </div>
      <div class="msg" id="msgConfirmarFicha"></div>
    </div>`;

  document.getElementById('btnCancelarFicha').onclick = () => { rev.innerHTML = ''; };
  document.getElementById('btnConfirmarFicha').onclick = async () => {
    rev.querySelectorAll('.inp-nombre-correcto').forEach(inp => {
      const val = inp.value.trim();
      if(val) recetas[Number(inp.dataset.idx)].nombreReceta = val;
    });
    const msgC = document.getElementById('msgConfirmarFicha');
    msgC.className = 'msg'; msgC.style.display = 'block'; msgC.textContent = 'Guardando ' + recetas.length + ' receta(s)…';
    try{
      const r = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'importarFichaTecnica', tipoFicha, recetas })
      });
      const resp = await r.json();
      if(resp.error) throw new Error(resp.error);
      msgC.className = 'msg ok';
      msgC.textContent = `Importadas ${resp.recetasImportadas.length} receta(s): ${resp.recetasImportadas.join(', ')}.`;
      cargarRecetasCargadas();
    }catch(err){
      msgC.className = 'msg err'; msgC.textContent = 'No se pudo importar: ' + err.message;
    }
  };
}

async function cargarRecetasCargadas(){
  const cont = document.getElementById('contenidoRecetasCargadas');
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=listarRecetas`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    const recetas = data.recetas || [];
    cont.className = '';
    if(recetas.length === 0){
      cont.innerHTML = `<div class="empty">Todavía no importaste ninguna ficha.</div>`;
      return;
    }
    const porTipo = {};
    recetas.forEach(r => { (porTipo[r.TipoFicha] = porTipo[r.TipoFicha] || []).push(r); });
    cont.innerHTML = TIPOS_FICHA.filter(t => porTipo[t.value]).map(t => `
      <h4 class="cat-heading">${t.label} (${porTipo[t.value].length})</h4>
      <p style="color:var(--ink-soft);font-size:12.5px;">${porTipo[t.value].map(r => `${r.Receta} (${r.RindeCantidad} ${r.RindeUnidad})`).join(' · ')}</p>
    `).join('');
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo buscar: ${err.message}</div>`;
  }
}

/* ---------------------------------------------------------------------
   utilidades
   --------------------------------------------------------------------- */
// OJO: NO usar toISOString() acá — siempre da la fecha en UTC, así que entre
// las 21:00 y las 23:59 (hora Argentina) ya devuelve el día SIGUIENTE. Se
// calcula la fecha de hoy explícitamente en el huso horario de Argentina.
function hoyISO(){
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Argentina/Buenos_Aires', year: 'numeric', month: '2-digit', day: '2-digit'
  });
  return fmt.format(new Date()); // en-CA da directamente formato yyyy-MM-dd
}
