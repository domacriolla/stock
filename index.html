<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doma Criolla — Stock y Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Paleta e identidad tomadas del Manual de Marca Doma Criolla:
     Pullman Brown #65341A · Tiger's Eye #D88F31 · Zinnwaldite Brown #311B10.
     Tipografía: Trajan Pro Bold (títulos) -> Cinzel, la alternativa libre más
     cercana; Poppins para texto y para el acento de marca. */
  :root{
    --bg:#F7F1E4;
    --panel:#FFFFFF;
    --ink:#311B10;
    --ink-soft:#7C6753;
    --line:#E3D6C4;
    --crust:#65341A;
    --crust-dark:#46240F;
    --accent:#D88F31;
    --accent-bg:#FAEAD3;
    --herb:#4B6B3F;
    --herb-bg:#E3EAD9;
    --alert:#9A3B2E;
    --alert-bg:#F3DBD4;
    --pink:#A32B5C;
    --pink-bg:#F8D7E6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Cinzel',serif;font-weight:600;margin:0;letter-spacing:.01em;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 150px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:8px;}
  header.top h1{font-size:26px;color:var(--crust-dark);text-transform:uppercase;}
  header.top .sub{font-family:'Poppins',sans-serif;color:var(--accent);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;}

  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;}
  .home-seccion{font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:32px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .home-seccion:first-of-type{margin-top:8px;}
  @media (max-width:640px){.home-grid{grid-template-columns:1fr;}}
  .home-card{
    background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:26px 22px;cursor:pointer;text-align:left;
  }
  .home-card h2{font-size:20px;margin-bottom:6px;}
  .home-card p{color:var(--ink-soft);font-size:14px;margin:0;line-height:1.5;}
  .home-card .tag{display:inline-block;font-size:12px;color:var(--crust-dark);margin-bottom:10px;letter-spacing:.02em;}

  button{font-family:inherit;cursor:pointer;}
  .btn{
    background:var(--crust);color:#fff;border:none;border-radius:3px;
    padding:11px 18px;font-size:14px;font-weight:600;
  }
  .btn:hover{background:var(--crust-dark);}
  .btn.secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--ink-soft);}
  .btn:disabled{opacity:.5;cursor:default;}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13px;background:none;border:none;padding:0;margin-bottom:18px;}
  .back:hover{color:var(--ink);}

  select,input[type=text],input[type=number],input[type=date]{
    font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);
    border-radius:3px;background:#fff;color:var(--ink);
  }
  label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;}

  .field-row{margin-bottom:18px;max-width:320px;}

  table.lotes{width:100%;border-collapse:collapse;margin-top:10px;}
  table.lotes th{
    text-align:left;font-size:11px;text-transform:none;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding:6px 8px;font-weight:600;
  }
  table.lotes td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.lotes select{width:100%;}
  table.lotes input{width:100%;}
  table.traza tr.fila-guardada, table.lotes tr.fila-guardada{background:var(--herb-bg);}
  table.traza tr.fila-guardada td, table.lotes tr.fila-guardada td{color:var(--ink-soft);}
  /* sello "✓ Guardado 13:52" al lado de Editar, en cada fila guardada */
  .sello-guardado{display:inline-block;font-size:11.5px;font-weight:600;color:var(--herb);margin-right:6px;white-space:nowrap;}
  /* aviso flotante de confirmación (abajo de la pantalla) */
  #aviso-guardado{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;
    max-width:min(560px,calc(100vw - 32px));padding:14px 18px;border-radius:4px;font-size:14.5px;font-weight:600;
    box-shadow:0 6px 24px rgba(0,0,0,.18);transition:opacity .2s,transform .2s;z-index:1000;pointer-events:none;}
  #aviso-guardado.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  #aviso-guardado.ok{background:#2a7a4a;color:#fff;}
  #aviso-guardado.err{background:#b3261e;color:#fff;}
  #aviso-guardado .cerrar{background:none;border:none;color:#fff;font-size:13px;text-decoration:underline;margin-left:10px;padding:0;}
  /* barra final: Guardado provisorio + Guardar y enviar */
  .barra-final{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);}
  .barra-final .ayuda{font-size:12px;color:var(--ink-soft);margin:0;max-width:620px;line-height:1.5;}
  /* botones de guardado SIEMPRE a mano: barra fija abajo de la pantalla, así
     se puede guardar en cualquier momento del turno sin bajar hasta el final */
  .barra-fija{position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--panel);
    border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);}
  .barra-fija .interior{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .barra-fija .ultimo-guardado{font-size:12.5px;color:var(--ink-soft);flex:1 1 220px;min-width:0;}
  .barra-fija .ultimo-guardado.ok{color:var(--herb);font-weight:600;}
  .barra-fija .botones{display:flex;gap:10px;flex-wrap:wrap;}
  /* informe de stock: dato de una carga anterior a la última del local */
  .dato-viejo, table.prod td.dato-viejo{background:#fdf0d5 !important;color:#8a5a00;font-size:12.5px;font-weight:600;}
  .resumen-carga{font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin:6px 0 12px;}
  /* cartel de carga ya enviada (bloqueada) */
  .cartel-enviado{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--herb-bg);color:var(--herb);border-radius:3px;padding:12px 14px;margin:10px 0 14px;font-size:14px;font-weight:600;}
  .btn-guardar-item:disabled{opacity:.7;}
  .col-cant{width:90px;}
  .col-venc{width:150px;}
  .col-add{width:30px;text-align:center;}
  .col-del{width:34px;text-align:center;}
  .del-btn{background:none;border:none;color:var(--alert);font-size:16px;line-height:1;padding:4px;}

  .add-row{margin-top:10px;background:none;border:1px dashed var(--line);color:var(--ink-soft);
    padding:8px 14px;border-radius:3px;font-size:13px;}
  .add-row:hover{border-color:var(--crust);color:var(--crust-dark);}

  .add-lote-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);
    font-size:13px;line-height:1;padding:3px 8px;border-radius:3px;}
  .add-lote-btn:hover{border-color:var(--crust);color:var(--crust-dark);}
  .item-extra{color:var(--ink-soft);font-size:12px;font-style:italic;}
  h4.cat-heading{font-size:13px;margin:22px 0 4px;color:var(--crust-dark);
    text-transform:uppercase;letter-spacing:.03em;}
  /* nombre de la receta (Relleno/Preparado) en Registrar producción → Cocina:
     más grande que el listado de insumos de abajo, para que se distinga de
     un vistazo cuál es el título y cuál el detalle. */
  h4.receta-heading{font-size:17px;text-transform:none;letter-spacing:0;margin-top:28px;}
  table.lotes.traza td{font-size:13.5px;}
  .cat-nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;}
  .cat-nav a{font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);
    padding:4px 9px;border-radius:12px;text-decoration:none;}
  .cat-nav a:hover{border-color:var(--crust);color:var(--crust-dark);}

  .actions{margin-top:22px;display:flex;gap:10px;align-items:center;}
  .msg{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:3px;display:none;}
  .msg.ok{display:block;background:var(--herb-bg);color:var(--herb);}
  .msg.err{display:block;background:var(--alert-bg);color:var(--alert);}

  .fab-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .fab-toolbar .field-row{margin:0;max-width:180px;}

  table.prod{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.prod th{
    text-align:left;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink-soft);
    padding:7px 8px;font-weight:600;
  }
  table.prod td{padding:7px 8px;border-bottom:1px solid var(--line);}
  table.prod tr:hover td{background:rgba(0,0,0,.02);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .badge{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--herb-bg);color:var(--herb);}
  .badge.reposo{background:var(--accent-bg);color:var(--crust-dark);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab-btn{background:none;border:none;padding:9px 16px;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'Poppins',sans-serif;}
  .tab-btn.active{color:var(--crust-dark);border-bottom-color:var(--accent);font-weight:600;}
  .tab-btn:hover{color:var(--ink);}

  .alert-box{background:var(--alert-bg);border-radius:4px;padding:14px 16px;margin-bottom:18px;}
  .alert-box h3{color:var(--alert);font-size:15px;margin-bottom:8px;}
  .alert-box ul{margin:0;padding-left:18px;font-size:13.5px;color:#5c2b23;}

  /* Informes → Stock por local: semáforo de vencimiento por lote */
  .fila-vencido td{background:var(--alert-bg);}
  .fila-vence-hoy td{background:var(--pink-bg);}
  .fila-vence-manana td{background:var(--herb-bg);}
  .leyenda-vencimiento{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin:2px 0 16px;}
  .leyenda-vencimiento span{display:inline-flex;align-items:center;gap:6px;}
  .leyenda-vencimiento i{width:12px;height:12px;border-radius:3px;display:inline-block;}

  .empty{color:var(--ink-soft);font-size:14px;padding:30px 0;text-align:center;}
  .loading{color:var(--ink-soft);font-size:14px;}
  footer.note{margin-top:40px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;}

  /* Al imprimir "Ver qué producir hoy" solo se ve la tabla del sector activo
     (Producción / Cocina / Discos) — todo lo de navegación queda afuera. */
  @media print{
    .back, .fab-toolbar, .tabs, footer.note{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none;padding:0;}
    table.prod, table.lotes{font-size:12px;}
    table.prod tr, table.lotes tr{break-inside:avoid;}
    .alert-box{break-inside:avoid;}
    .no-print{display:none !important;}
    .fila-vencido td, .fila-vence-hoy td, .fila-vence-manana td, .leyenda-vencimiento i{
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
  }

  /* Orden de envío imprimible — arma una hoja aparte con solo lo cargado en
     pantalla para ese local, y se muestra únicamente al imprimir. */
  #printAreaEnvio{display:none;}
  #printAreaEnvio h1{font-size:20px;margin-bottom:2px;}
  #printAreaEnvio .print-sub{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}
  #printAreaEnvio h3{font-size:14px;margin:18px 0 6px;}
  table.print-tabla{width:100%;border-collapse:collapse;margin-bottom:6px;}
  table.print-tabla th{text-align:left;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--ink-soft);padding:6px 8px;}
  table.print-tabla td{padding:6px 8px;border-bottom:1px solid var(--line);}
  table.print-tabla .num{text-align:right;}
  @media print{
    body.print-envio .wrap{display:none !important;}
    body.print-envio #printAreaEnvio{display:block;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ======================================================================
   CONFIGURACIÓN — completar después de publicar el Apps Script
   ====================================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0MpQPLqVL_5QpuRAOmz_3uvA6Oz-72bzwABz3bN6ltR3kmH0-nnMwRnoDrfhanm0DWQ/exec';

const LOCALES = ['Centro', 'Patagonia', 'Zelarrayan', 'Fábrica - Producción', 'Fábrica - Cocina', 'Fábrica - Discos'];
const TIPOS_DISCO = ['Horno', 'Frito', 'Recorte'];
let SABORES_CACHE = null;
let RELLENOS_CACHE = null;
let RECETAS_CACHE = null;

/* ---------------------------------------------------------------------
   DATOS DE REFERENCIA CON MEMORIA EN LA TABLET (para que las pantallas abran
   rápido): sabores, rellenos, empleados y recetas cambian poco, así que se
   guardan en la tablet y se usan al instante al abrir cualquier pantalla —
   y en segundo plano se vuelven a pedir al servidor para la próxima vez.
   "Refrescar datos de la planilla" e importar una ficha borran esta memoria.
   Si la tablet no deja guardar (modo privado, etc.) funciona igual, solo
   que pidiendo siempre al servidor.
   --------------------------------------------------------------------- */
const MEMORIA_MAX_HORAS = 24;
function leerMemoria(clave){
  try{
    const raw = localStorage.getItem('doma:' + clave);
    if(!raw) return null;
    const m = JSON.parse(raw);
    if(!m || Date.now() - m.t > MEMORIA_MAX_HORAS * 3600 * 1000) return null;
    return m.d;
  }catch(e){ return null; }
}
function guardarMemoria(clave, datos){
  try{ localStorage.setItem('doma:' + clave, JSON.stringify({ t: Date.now(), d: datos })); }catch(e){}
}
function borrarMemoria(){
  try{ Object.keys(localStorage).filter(k => k.startsWith('doma:')).forEach(k => localStorage.removeItem(k)); }catch(e){}
}
const PEDIDOS_EN_CURSO = {};
async function pedirReferencia(action){
  if(!PEDIDOS_EN_CURSO[action]){
    PEDIDOS_EN_CURSO[action] = fetch(`${APPS_SCRIPT_URL}?action=${action}`)
      .then(r => r.json())
      .then(data => { if(data.error) throw new Error(data.error); guardarMemoria(action, data); return data; })
      .finally(() => { delete PEDIDOS_EN_CURSO[action]; });
  }
  return PEDIDOS_EN_CURSO[action];
}
// devuelve lo que haya en memoria al instante (y actualiza en segundo plano);
// si no hay nada guardado, espera la respuesta del servidor.
async function datoReferencia(action){
  const enMemoria = leerMemoria(action);
  if(enMemoria){
    pedirReferencia(action).catch(() => {});
    return enMemoria;
  }
  return pedirReferencia(action);
}

async function obtenerRecetas(){
  if(RECETAS_CACHE) return RECETAS_CACHE;
  const data = await datoReferencia('listarRecetas');
  RECETAS_CACHE = { cabecera: data.recetas || [], detalle: data.detalle || [] };
  return RECETAS_CACHE;
}

const app = document.getElementById('app');

/* ---------------------------------------------------------------------
   Router muy simple (sin librerías) — 3 pantallas
   --------------------------------------------------------------------- */
function irA(pantalla){
  if(pantalla === 'home') renderHome();
  // Cargar stock: se entra desde el bloque LOCALES o desde el bloque FÁBRICA,
  // y el selector "¿Dónde estás cargando?" muestra solo los de ese bloque.
  if(pantalla === 'stockLocales') renderLocal('locales');
  if(pantalla === 'stockFabrica') renderLocal('fabrica');
  if(pantalla === 'local') renderLocal('locales');
  if(pantalla === 'fabrica') renderFabrica();
  if(pantalla === 'planificacion') renderPlanificacion();
  if(pantalla === 'envios') renderEnvios();
  if(pantalla === 'recepcion') renderRecepcion();
  if(pantalla === 'historial') renderHistorialEnvios();
  if(pantalla === 'registro') renderRegistroProduccion();
  if(pantalla === 'fichas') renderFichasTecnicas();
  // Informes: cada bloque abre directo su propio informe (sin solapas).
  if(pantalla === 'informeStock') renderInformes('stock');
  if(pantalla === 'informeStockFabrica') renderInformes('stockFabrica');
  if(pantalla === 'informeInsumos') renderInformes('consumo');
}

function tarjetaHome(destino, titulo, texto){
  return `
      <button class="home-card" onclick="irA('${destino}')">
        <h2>${titulo}</h2>
        <p>${texto}</p>
      </button>`;
}

/* ---------------------------------------------------------------------
   CONFIRMACIÓN DE GUARDADO — para que quien carga esté SEGURO de que se
   guardó: cada guardado exitoso muestra (1) un aviso verde grande abajo de
   la pantalla con qué se guardó y a qué hora, y (2) un sello "✓ Guardado
   HH:MM" en la fila. Si algo falla, el aviso es rojo y queda fijo hasta que
   se lo cierra. Pedido por Carolina (29/09/2026).
   --------------------------------------------------------------------- */
function horaCorta(){
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
let TIMER_AVISO = null;
function avisar(texto, tipo){
  let el = document.getElementById('aviso-guardado');
  if(!el){
    el = document.createElement('div');
    el.id = 'aviso-guardado';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  clearTimeout(TIMER_AVISO);
  el.className = (tipo === 'err' ? 'err' : 'ok') + ' visible';
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = texto;
  el.appendChild(span);
  if(tipo === 'err'){
    const b = document.createElement('button');
    b.className = 'cerrar'; b.textContent = 'Cerrar';
    b.onclick = () => el.classList.remove('visible');
    el.appendChild(b);
  } else {
    TIMER_AVISO = setTimeout(() => el.classList.remove('visible'), 5000);
    // la barra fija de abajo recuerda el último guardado (no desaparece)
    if(texto.startsWith('✓')){
      document.querySelectorAll('.ultimo-guardado').forEach(u => {
        u.classList.add('ok');
        u.textContent = texto;
      });
    }
  }
}
// pone (o actualiza) el sello "✓ Guardado HH:MM" de una fila; hora = null
// para filas que ya venían guardadas al abrir la pantalla.
function ponerSello(tr, hora){
  const btnEditar = tr.querySelector('.btn-editar-item, .btn-editar-disco');
  const celda = btnEditar ? btnEditar.parentElement : tr.lastElementChild;
  if(!celda) return;
  let sello = tr.querySelector('.sello-guardado');
  if(!sello){
    sello = document.createElement('span');
    sello.className = 'sello-guardado';
    celda.insertBefore(sello, celda.firstChild);
  }
  sello.textContent = hora ? `✓ Guardado ${hora}` : '✓ Guardado';
}
// deja una fila como guardada: bloqueada, con "Editar" y el sello con hora.
function marcarFilaGuardada(tr){
  tr.classList.add('fila-guardada');
  [...tr.querySelectorAll('input,select')].forEach(el => el.disabled = true);
  const btnG = tr.querySelector('.btn-guardar-item, .btn-guardar-disco');
  if(btnG){ btnG.disabled = false; btnG.textContent = 'Guardar'; btnG.style.display = 'none'; }
  const btnE = tr.querySelector('.btn-editar-item, .btn-editar-disco');
  if(btnE) btnE.style.display = '';
  const venc = tr.querySelector('.inp-venc');
  if(venc) tr.dataset.vencGuardado = venc.value; // para "Editar" cambiando el vencimiento
  ponerSello(tr, horaCorta());
}
// bloquea TODA una carga ya enviada: sin Guardar/Editar/+/✕.
function bloquearFilasEnviadas(contenedor){
  [...contenedor.querySelectorAll('tr')].forEach(tr => {
    [...tr.querySelectorAll('input,select')].forEach(el => el.disabled = true);
    [...tr.querySelectorAll('.btn-guardar-item,.btn-editar-item,.btn-guardar-disco,.btn-editar-disco,.add-lote-btn,.del-btn')].forEach(b => b.style.display = 'none');
  });
}
// barra con los botones de guardado: la ayuda queda al final del contenido y
// los botones van en una barra FIJA abajo de la pantalla (siempre visibles,
// para ir guardando durante todo el turno). idEnviar = null -> solo
// "Guardado provisorio" (Cocina, donde cada receta se envía por separado).
function htmlBarraFinal(idProvisorio, idEnviar, textoEnviar, ayuda){
  return `
    <div class="barra-final no-print">
      <p class="ayuda">${ayuda || '<strong>Guardado provisorio</strong>: guarda todo lo que cargaste hasta ahora y podés seguir cargando o corrigiendo durante toda la jornada. <strong>Guardar y enviar</strong>: guarda todo y cierra la carga (queda bloqueada; se destraba con "Reabrir").'}</p>
      <div class="barra-fija">
        <div class="interior">
          <span class="ultimo-guardado">Guardá cuando quieras — los botones quedan siempre acá abajo.</span>
          <div class="botones">
            <button class="btn secondary" id="${idProvisorio}">Guardado provisorio</button>
            ${idEnviar ? `<button class="btn" id="${idEnviar}">${textoEnviar}</button>` : ''}
          </div>
        </div>
      </div>
    </div>`;
}
// cartel de carga enviada, con botón Reabrir.
function cartelEnviado(cierre, que, onReabrir){
  const div = document.createElement('div');
  div.className = 'cartel-enviado no-print';
  const quien = cierre && cierre.responsable ? ` por ${cierre.responsable}` : '';
  const hora = cierre && cierre.hora ? ` a las ${cierre.hora}` : '';
  const items = cierre && cierre.items ? ` — ${cierre.items} ítem(s) guardado(s)` : '';
  div.innerHTML = `<span>✓ ${que} enviado${hora}${quien}${items}. Quedó bloqueado.</span>`;
  if(onReabrir){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn secondary'; b.style.cssText = 'font-size:12px;padding:5px 9px;';
    b.textContent = 'Reabrir';
    b.onclick = onReabrir;
    div.appendChild(b);
  }
  return div;
}
// Control de vencimientos mal tipeados: si alguno es ANTERIOR a la fecha de
// carga, pide confirmar antes de guardar (ej. "01/09" en vez de "01/10" —
// ese lote cuenta como vencido y no se descuenta del stock). Devuelve true
// si se puede seguir. Pedido por Carolina (29/09/2026).
function confirmarVencimientos(items, fecha){
  const raros = items.filter(it => it.vencimiento && fecha && it.vencimiento < fecha);
  if(raros.length === 0) return true;
  const lista = raros.map(it => `• ${it.sabor}: vence ${fmtFecha(it.vencimiento)}`).join('\n');
  return confirm(`OJO — estos vencimientos son ANTERIORES a la fecha de carga (${fmtFecha(fecha)}):\n\n${lista}\n\n¿Está bien así? Si fue un error de tipeo, tocá "Cancelar" y corregilo (si no, ese lote cuenta como vencido).`);
}

async function postJSON(body){
  const r = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
  const data = await r.json();
  if(data.error) throw new Error(data.error);
  return data;
}

let CATEGORIA_POR_SABOR_CACHE = null;
async function obtenerCategorias(){
  if(SABORES_CACHE) return SABORES_CACHE;
  const data = await datoReferencia('listarSabores');
  SABORES_CACHE = data.categorias || {};
  CATEGORIA_POR_SABOR_CACHE = data.categoriaPorSabor || {};
  return SABORES_CACHE;
}
// Categoria (Canasta, Frito, Horno, etc.) de cada sabor — para saber, por
// ejemplo, cuáles son Canasta (armado manual del molde) sin adivinarlo por
// el nombre.
async function obtenerCategoriaPorSabor(){
  if(!CATEGORIA_POR_SABOR_CACHE) await obtenerCategorias();
  return CATEGORIA_POR_SABOR_CACHE || {};
}

async function obtenerRellenos(){
  if(RELLENOS_CACHE) return RELLENOS_CACHE;
  const data = await datoReferencia('listarRellenos');
  RELLENOS_CACHE = data.rellenos || [];
  return RELLENOS_CACHE;
}

// Lista de empleados (hoja "Empleados" del Sheet) para los desplegables de
// "quién hizo esto" — Responsable, Repartidor, Acompañante, puestos de máquina.
let EMPLEADOS_CACHE = null;
async function obtenerEmpleados(){
  if(EMPLEADOS_CACHE) return EMPLEADOS_CACHE;
  const data = await datoReferencia('listarEmpleados');
  EMPLEADOS_CACHE = data.empleados || [];
  return EMPLEADOS_CACHE;
}
function opcionesEmpleados(empleados){
  if(!empleados || empleados.length === 0){
    return '<option value="">(cargá empleados en la hoja "Empleados")</option>';
  }
  return '<option value="">— Seleccionar —</option>' + empleados.map(n => `<option value="${n}">${n}</option>`).join('');
}
// igual que opcionesEmpleados pero marcando "selected" el que ya estaba
// guardado — para prellenar desplegables de Responsable/puestos al recargar.
function opcionesEmpleadosSeleccion(empleados, seleccionado){
  if(!empleados || empleados.length === 0){
    return '<option value="">(cargá empleados en la hoja "Empleados")</option>';
  }
  return '<option value="">— Seleccionar —</option>' + empleados.map(n => `<option value="${n}" ${n === seleccionado ? 'selected' : ''}>${n}</option>`).join('');
}

// guarda (o actualiza) UN lote de "Cargar stock" apenas se termina de cargar,
// sin esperar a completar el resto de la lista — así, si hay un error de
// tipeo en la tablet, se corrige y reguarda solo ese lote, sin repetir toda
// la carga. Confirmado con Carolina (26/09/2026).
async function guardarItemStock(tr){
  const local = document.getElementById('selLocal').value;
  const fecha = document.getElementById('fechaCarga').value;
  const responsable = document.getElementById('inpResponsable').value.trim();
  if(!responsable){
    alert('Indicá quién está cargando este stock antes de guardar (arriba de la lista de productos).');
    return;
  }
  const cantidad = tr.querySelector('.inp-cant').value;
  const vencimiento = tr.querySelector('.inp-venc').value;
  if(!cantidad || Number(cantidad) <= 0 || !vencimiento){
    alert('Cargá cantidad y vencimiento de este lote antes de guardarlo.');
    return;
  }
  const item = { sabor: tr.dataset.item, cantidad, vencimiento };
  if(tr.dataset.vencGuardado && tr.dataset.vencGuardado !== vencimiento) item.vencimientoAnterior = tr.dataset.vencGuardado;
  if(!confirmarVencimientos([item], fecha)) return;
  const btn = tr.querySelector('.btn-guardar-item');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await postJSON({ action: 'registrarStockItem', local, fecha, responsable, item });
    marcarFilaGuardada(tr);
    avisar(`✓ Guardado: ${item.sabor} — ${cantidad} (vence ${fmtFecha(vencimiento)}) · ${horaCorta()}`);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar';
    alert('No se pudo guardar este lote: ' + err.message);
  }
}

async function renderLocal(bloque){
  // bloque = 'locales' (Centro/Patagonia/Zelarrayan) o 'fabrica' (sectores de Fábrica)
  const esBloqueFabrica = bloque === 'fabrica';
  const opcionesSector = LOCALES.filter(l => l.startsWith('Fábrica') === esBloqueFabrica);
  app.innerHTML = `
    <button class="back" onclick="irA('home')">← Volver</button>
    <header class="top"><h1>${esBloqueFabrica ? 'Cargar stock de fábrica' : 'Cargar stock del local'}</h1></header>

    <div class="field-row">
      <label>${esBloqueFabrica ? '¿De qué sector estás cargando este stock?' : '¿Dónde estás cargando este stock?'}</label>
      <select id="selLocal">
        ${opcionesSector.map(l => `<option value="${l}">${l}</option>`).join('')}
      </select>
    </div>
    <div class="field-row">
      <label>¿Quién está cargando este stock?</label>
      <div id="responsableWrap"><input type="text" id="inpResponsable" placeholder="Nombre y apellido"></div>
    </div>
    <div class="field-row">
      <label>Fecha (por si cargás con atraso)</label>
      <input type="date" id="fechaCarga" value="${hoyISO()}">
    </div>

    <p style="color:var(--ink-soft);font-size:12.5px;max-width:560px;">
      Están listados todos los productos — completá cantidad y vencimiento solo en los que tengas hoy,
      el resto se deja en blanco. Guardá cada lote con su propio botón apenas lo cargues (así, si hay
      un error de tipeo, se corrige y reguarda solo ese lote, sin tocar el resto). Si un mismo producto
      tiene más de un lote con vencimientos distintos, usá el botón <strong>+</strong> de esa fila para
      agregar otra línea.
    </p>

    <div id="catNav" class="cat-nav"></div>
    <div id="cartelStock"></div>
    <div id="tablaLotesContainer" class="loading">Cargando…</div>

    <div id="barraStock">${htmlBarraFinal('btnProvisorioStock', 'btnGuardar', 'Guardar y enviar stock')}</div>
    <div class="msg" id="msg"></div>
  `;

  // sabores, rellenos y empleados a la vez (antes era uno detrás del otro)
  let categorias, rellenos, empleados = [];
  try{
    [categorias, rellenos, empleados] = await Promise.all([
      obtenerCategorias(), obtenerRellenos(), esBloqueFabrica ? obtenerEmpleados() : Promise.resolve([])
    ]);
  }catch(err){
    const c = document.getElementById('tablaLotesContainer');
    c.className = '';
    c.innerHTML = `<div class="msg err" style="display:block;">No se pudo cargar la lista de productos: ${err.message}. <button class="btn secondary" style="font-size:12px;padding:5px 9px;margin-left:8px;" onclick="renderLocal('${bloque}')">Reintentar</button></div>`;
    return;
  }
  const nombresCategorias = Object.keys(categorias);

  // según el sector elegido, se carga por Sabor (locales y Fábrica -
  // Producción), por Relleno en kilos (Fábrica - Cocina), o por tipo de
  // disco en docenas (Fábrica - Discos).
  function modoDeLocal(local){
    if(local === 'Fábrica - Cocina') return 'relleno';
    if(local === 'Fábrica - Discos') return 'disco';
    return 'sabor';
  }

  // el listado de empleados es solo para Fábrica (Producción/Cocina/Discos);
  // en los locales el responsable se escribe a mano.
  function esFabrica(local){ return local.startsWith('Fábrica'); }

  async function pintarResponsable(){
    const local = document.getElementById('selLocal').value;
    const wrap = document.getElementById('responsableWrap');
    if(esFabrica(local)){
      if(empleados.length === 0) empleados = await obtenerEmpleados();
      wrap.innerHTML = `<select id="inpResponsable">${opcionesEmpleados(empleados)}</select>`;
    } else {
      wrap.innerHTML = `<input type="text" id="inpResponsable" placeholder="Nombre y apellido">`;
    }
  }

  // una fila por lote. "guardado" (si viene) prellena y bloquea la fila, con
  // su botón "Editar" para destrabarla puntualmente — igual que en Registrar
  // producción y Despachar envíos, para que un error de tipeo en la tablet
  // se corrija guardando de nuevo SOLO ese lote, sin repetir toda la carga.
  // El botón "+" agrega otra fila del MISMO producto para un segundo
  // vencimiento (queda vacía y editable, salvo que también venga guardada).
  function filaProducto(nombre, esExtra, guardado){
    const g = guardado || {};
    const yaGuardado = !!guardado;
    const dis = yaGuardado ? 'disabled' : '';
    const tr = document.createElement('tr');
    tr.dataset.item = nombre;
    if(yaGuardado) tr.classList.add('fila-guardada');
    tr.innerHTML = `
      <td>${esExtra ? `<span class="item-extra">↳ otro lote</span>` : nombre}</td>
      <td><input type="number" min="0" step="1" class="inp-cant" placeholder="0" value="${g.cantidad || ''}" ${dis}></td>
      <td><input type="date" class="inp-venc" value="${g.vencimiento || ''}" ${dis}></td>
      <td class="col-add">${esExtra ? '' : '<button type="button" class="add-lote-btn" title="Agregar otro vencimiento para este producto">+</button>'}</td>
      <td class="col-del">${esExtra ? '<button type="button" class="del-btn" title="Quitar">✕</button>' : ''}</td>
      <td class="no-print" style="white-space:nowrap;">
        <button type="button" class="btn secondary btn-guardar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? 'display:none;' : ''}">Guardar</button>
        <button type="button" class="btn secondary btn-editar-item" style="font-size:12px;padding:5px 9px;${yaGuardado ? '' : 'display:none;'}">Editar</button>
      </td>
    `;
    if(esExtra){
      tr.querySelector('.del-btn').onclick = () => tr.remove();
    } else {
      tr.querySelector('.add-lote-btn').onclick = () => {
        tr.insertAdjacentElement('afterend', filaProducto(nombre, true));
      };
    }
    tr.querySelector('.btn-guardar-item').onclick = () => guardarItemStock(tr);
    tr.querySelector('.btn-editar-item').onclick = () => habilitarEdicionFila(tr);
    if(yaGuardado){ tr.dataset.vencGuardado = g.vencimiento || ''; ponerSello(tr, null); }
    return tr;
  }

  // arma las filas de un producto: si ya tiene uno o más lotes guardados hoy
  // (guardadosPorItem), una fila prellenada/bloqueada por cada uno; si no,
  // una sola fila vacía y editable.
  function tablaDe(labelCantidad, colHeader, items, guardadosPorItem){
    const table = document.createElement('table');
    table.className = 'lotes';
    table.innerHTML = `
      <thead><tr>
        <th>${colHeader}</th>
        <th class="col-cant">${labelCantidad}</th>
        <th class="col-venc">Vencimiento</th>
        <th class="col-add"></th>
        <th class="col-del"></th>
        <th class="no-print"></th>
      </tr></thead>
      <tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    items.forEach(nombre => {
      const guardados = (guardadosPorItem && guardadosPorItem[nombre]) || [];
      if(guardados.length === 0){
        tbody.appendChild(filaProducto(nombre, false, null));
      } else {
        guardados.forEach((g, i) => tbody.appendChild(filaProducto(nombre, i > 0, g)));
      }
    });
    return table;
  }

  async function pintarTabla(){
    const local = document.getElementById('selLocal').value;
    const fecha = document.getElementById('fechaCarga').value;
    const modo = modoDeLocal(local);
    const labelCantidad = modo === 'relleno' ? 'Kilos' : modo === 'disco' ? 'Docenas' : 'Cantidad';
    const cont = document.getElementById('tablaLotesContainer');
    const nav = document.getElementById('catNav');
    cont.className = 'loading'; cont.textContent = 'Cargando…';
    nav.innerHTML = '';

    let guardadosPorItem = {};
    let cierre = null;
    document.getElementById('cartelStock').innerHTML = '';
    try{
      const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerStockCargadoDia&local=${encodeURIComponent(local)}&fecha=${fecha}`);
      const data = await r.json();
      if(!data.error){
        cierre = data.cierre || null;
        (data.items || []).forEach(it => {
          guardadosPorItem[it.sabor] = guardadosPorItem[it.sabor] || [];
          guardadosPorItem[it.sabor].push(it);
        });
      }
    }catch(err){ /* si falla la consulta, se sigue con la tabla vacía y editable */ }

    // se cambió de local o de fecha mientras cargaba esta consulta
    if(document.getElementById('selLocal').value !== local || document.getElementById('fechaCarga').value !== fecha) return;

    cont.className = ''; cont.innerHTML = '';

    if(modo === 'sabor'){
      nombresCategorias.forEach((cat, i) => {
        const id = `cat-${i}`;
        const h = document.createElement('h4');
        h.className = 'cat-heading';
        h.id = id;
        h.textContent = cat;
        cont.appendChild(h);
        cont.appendChild(tablaDe(labelCantidad, 'Sabor / ítem', categorias[cat], guardadosPorItem));

        const a = document.createElement('a');
        a.href = `#${id}`;
        a.textContent = cat;
        nav.appendChild(a);
      });
    } else if(modo === 'relleno'){
      cont.appendChild(tablaDe(labelCantidad, 'Relleno', rellenos, guardadosPorItem));
    } else {
      cont.appendChild(tablaDe(labelCantidad, 'Tipo de disco', TIPOS_DISCO, guardadosPorItem));
    }

    // carga ya enviada ("Guardar y enviar"): todo bloqueado, con Reabrir
    const cartel = document.getElementById('cartelStock');
    cartel.innerHTML = '';
    document.getElementById('barraStock').style.display = cierre ? 'none' : '';
    if(cierre){
      bloquearFilasEnviadas(cont);
      cartel.appendChild(cartelEnviado(cierre, `Stock de ${local}`, async () => {
        if(!confirm(`¿Reabrir la carga de stock de ${local}? Se va a destrabar para corregir.`)) return;
        try{
          await postJSON({ action: 'reabrirCarga', pantalla: 'Stock', fecha, clave: local });
          avisar(`Carga de ${local} reabierta — ya se puede editar.`);
          pintarTabla();
        }catch(err){ avisar('✗ No se pudo reabrir: ' + err.message, 'err'); }
      }));
    }
  }

  document.getElementById('selLocal').onchange = () => { pintarTabla(); pintarResponsable(); };
  document.getElementById('fechaCarga').onchange = pintarTabla;
  pintarTabla(); // arranca mostrando el listado completo del primer local
  pintarResponsable();

  // "Guardado provisorio" y "Guardar y enviar stock": guardan de una sola vez
  // todo lo que haya quedado sin guardar con su propio botón (incluidas las
  // filas reabiertas con "Editar"). Si una fila está a medio completar
  // (cantidad sin vencimiento o al revés) se avisa cuál — antes esas filas se
  // salteaban en silencio. "Guardar y enviar" además cierra la carga.
  async function guardarTodoStock(enviar){
    const local = document.getElementById('selLocal').value;
    const responsable = document.getElementById('inpResponsable').value.trim();
    const fecha = document.getElementById('fechaCarga').value;
    const msg = document.getElementById('msg');
    msg.className = 'msg'; msg.textContent = '';
    if(!responsable){
      msg.className = 'msg err'; msg.textContent = 'Indicá quién está cargando este stock (arriba de todo).';
      avisar('✗ Falta indicar quién carga el stock.', 'err');
      return;
    }
    const filas = [...document.querySelectorAll('#tablaLotesContainer tr[data-item]:not(.fila-guardada)')];
    const completas = [], incompletas = [];
    filas.forEach(tr => {
      const cantidad = tr.querySelector('.inp-cant').value;
      const vencimiento = tr.querySelector('.inp-venc').value;
      const tieneCant = cantidad && Number(cantidad) > 0;
      if(tieneCant && vencimiento) completas.push(tr);
      else if(tieneCant || vencimiento) incompletas.push(tr.dataset.item + (tieneCant ? ' (falta vencimiento)' : ' (falta cantidad)'));
    });
    if(enviar && incompletas.length){
      msg.className = 'msg err';
      msg.textContent = 'No se envió: hay filas a medio completar — ' + incompletas.join(', ') + '. Completalas o borrales el dato.';
      avisar('✗ No se envió: hay filas a medio completar (ver abajo).', 'err');
      return;
    }
    const items = completas.map(tr => {
      const it = { sabor: tr.dataset.item, cantidad: tr.querySelector('.inp-cant').value, vencimiento: tr.querySelector('.inp-venc').value };
      if(tr.dataset.vencGuardado && tr.dataset.vencGuardado !== it.vencimiento) it.vencimientoAnterior = tr.dataset.vencGuardado;
      return it;
    });
    if(!confirmarVencimientos(items, fecha)) return;
    if(enviar){
      // una carga enviada es el recuento COMPLETO: lo que queda en blanco se
      // toma como 0 (no hay) — se avisa cuáles para que no sea un olvido.
      const conDato = new Set([...document.querySelectorAll('#tablaLotesContainer tr[data-item]')]
        .filter(tr => tr.classList.contains('fila-guardada') || completas.includes(tr))
        .map(tr => tr.dataset.item));
      const enBlanco = [...new Set([...document.querySelectorAll('#tablaLotesContainer tr[data-item]')].map(tr => tr.dataset.item))]
        .filter(n => !conDato.has(n));
      const listaBlanco = enBlanco.length
        ? `\n\nQuedaron ${enBlanco.length} producto(s) SIN CARGAR — se van a tomar como 0 (no hay):\n${enBlanco.slice(0, 25).map(n => '• ' + n).join('\n')}${enBlanco.length > 25 ? `\n… y ${enBlanco.length - 25} más` : ''}\n\nSi alguno sí tiene stock, tocá "Cancelar" y cargalo.`
        : '';
      if(!confirm(`¿Guardar y enviar el stock de ${local}? La carga queda cerrada (se puede reabrir si hace falta corregir).${listaBlanco}`)) return;
    }
    const btn = document.getElementById(enviar ? 'btnGuardar' : 'btnProvisorioStock');
    const textoOriginal = btn.textContent;
    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      const data = await postJSON({ action: 'registrarStock', local, fecha, responsable, items, enviar: !!enviar });
      completas.forEach(marcarFilaGuardada);
      const hora = horaCorta();
      if(enviar){
        avisar(`✓ Stock de ${local} enviado · ${hora} — ${data.total_dia} lote(s) guardados.`);
        msg.className = 'msg ok';
        msg.textContent = `✓ Enviado a las ${hora}: quedaron guardados ${data.total_dia} lote(s) de ${local} para el ${fmtFecha(fecha)}.`;
        pintarTabla(); // vuelve a leer de la planilla y muestra la carga cerrada
      } else {
        const aviso = items.length ? `${items.length} lote(s) nuevos guardados` : 'no había nada nuevo para guardar';
        avisar(`✓ Guardado provisorio · ${hora} — ${aviso}. Total de ${local} hoy: ${data.total_dia}.`);
        msg.className = incompletas.length ? 'msg err' : 'msg ok';
        msg.textContent = `✓ Guardado provisorio a las ${hora}: ${aviso}. En total hay ${data.total_dia} lote(s) de ${local} guardados para el ${fmtFecha(fecha)}. Podés seguir cargando.`
          + (incompletas.length ? ' OJO — no se guardaron porque están a medio completar: ' + incompletas.join(', ') + '.' : '');
      }
    }catch(err){
      msg.className = 'msg err'; msg.textContent = '✗ NO se guardó: ' + err.message + ' — revisá la conexión y probá de nuevo.';
      avisar('✗ NO se guardó — ' + err.message, 'err');
    }finally{
      btn.disabled = false; btn.textContent = textoOriginal;
    }
  }
  document.getElementById('btnProvisorioStock').onclick = () => guardarTodoStock(false);
  document.getElementById('btnGuardar').onclick = () => guardarTodoStock(true);
}

let ULTIMO_CALCULO = null;
let PREP_ACTUAL = null;
let TAB_ACTIVA = 'produccion';

async function cargarCalculo(){
  const fecha = document.getElementById('fechaCalculo').value;
  const cont = document.getElementById('contenidoFabrica');
  cont.className = 'loading'; cont.textContent = 'Calculando…';
  document.getElementById('tabsFabrica').style.display = 'none';
  try{
    const [r, rPrep] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularTodo&fecha=${fecha}`),
      fetch(`${APPS_SCRIPT_URL}?action=calcularPrepDiaAnterior&fecha=${fecha}`)
    ]);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    const prep = await rPrep.json();
    ULTIMO_CALCULO = data;
    PREP_ACTUAL = prep.error ? null : prep;
    document.getElementById('tabsFabrica').style.display = 'flex';
    [...document.querySelectorAll('.tab-btn')].forEach(b => {
      b.onclick = () => { TAB_ACTIVA = b.dataset.tab; marcarTabActiva(); pintarTabActiva(); };
    });
    TAB_ACTIVA = 'produccion';
    marcarTabActiva();
    pintarTabActiva();
  }catch(err){
    cont.className = ''; cont.innerHTML = `<div class="msg err" style="display:block;">No se pudo calcular: ${err.message}</div>`;
  }
}

function marcarTabActiva(){
  [...document.querySelectorAll('.tab-btn')].forEach(b => b.classList.toggle('active', b.dataset.tab === TAB_ACTIVA));
}

function pintarTabActiva(){
  if(TAB_ACTIVA === 'produccion') pintarProduccion(ULTIMO_CALCULO);
  if(TAB_ACTIVA === 'cocina') pintarCocina(ULTIMO_CALCULO);
  if(TAB_ACTIVA === 'discos') pintarDiscos(ULTIMO_CALCULO);
}

// convierte 'yyyy-MM-dd' (lo que devuelve el Apps Script) a 'dd-mm-aaaa' para
// mostrar — la fecha se guarda y se calcula siempre en ISO, esto es solo visual.
function fmtFecha(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return iso;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

// redondeo a entero para mostrar en pantalla (el cálculo interno sigue con decimales)
function ent(n){ return Math.round(Number(n) || 0).toLocaleString('es-AR'); }

// bloque "para mañana": Rollos de Jamón y Queso + Canastas que hay que
// dejar armados HOY (se ve en la pestaña Producción, arriba de lo del día).
function bloquePrepDiaAnterior(){
  const prep = PREP_ACTUAL;
  if(!prep) return '';
  const rollos = Number(prep.rollosJyQ) || 0;
  const canastas = (prep.canastas || []).filter(c => c.aHacerUnidades > 0);
  if(rollos <= 0 && canastas.length === 0) return '';
  const filaRollos = rollos > 0 ? `<tr><td>Rollos de Jamón y Queso</td><td class="num"><strong>${ent(rollos)}</strong></td></tr>` : '';
  const filasCanastas = canastas.map(c => `<tr><td>Canasta — ${c.sabor}</td><td class="num"><strong>${ent(c.aHacerUnidades)}</strong></td></tr>`).join('');
  const notaPct = (prep.porcentajeCocina != null && Number(prep.porcentajeCocina) !== 100)
    ? `<p style="color:var(--ink-soft);font-size:12px;margin-top:6px;">Ya aplicado el ${ent(prep.porcentajeCocina)}% de venta a cubrir guardado hoy para Cocina.</p>`
    : '';
  return `
    <h3 style="font-size:15px;margin:20px 0 8px;">Para mañana (${prep.diaManana}, ${fmtFecha(prep.fechaManana)}) — armar/moldear HOY</h3>
    <table class="prod">
      <thead><tr><th>Ítem</th><th class="num">Cantidad</th></tr></thead>
      <tbody>${filaRollos}${filasCanastas}</tbody>
    </table>${notaPct}`;
}

/* ---- Pestaña PRODUCCIÓN: qué armar hoy, por sabor (todos los rubros) ---- */
function pintarProduccion(data){
  const cont = document.getElementById('contenidoFabrica');
  // Dips y Postres los elabora Cocina (no Producción) — se muestran en la
  // pestaña Cocina, junto con Preparados y Rellenos.
  const filas = data.produccion.filter(f => f.aHacerUnidades > 0 && f.rubro !== 'Dips' && f.rubro !== 'Postres');
  const prepHtml = bloquePrepDiaAnterior();

  const tituloSector = `<h2 style="font-size:18px;margin:0 0 6px;">Producción del día — Sector Producción</h2>`;

  if(filas.length === 0){
    cont.className = '';
    cont.innerHTML = tituloSector + prepHtml + `<div class="empty">Nada para armar/reponer el ${data.dia.toLowerCase()} — el stock cargado alcanza.</div>`;
    return;
  }

  const rubros = [...new Set(filas.map(f => f.rubro))];
  rubros.sort((a,b) => (a.startsWith('Empanadas') ? -1 : b.startsWith('Empanadas') ? 1 : a.localeCompare(b)));

  const bloques = rubros.map(rubro => {
    const items = filas.filter(f => f.rubro === rubro);
    const esEmpanada = rubro.startsWith('Empanadas');
    return `
      <h3 style="font-size:15px;margin:20px 0 8px;">${rubro}</h3>
      <table class="prod">
        <thead>
          <tr>
            <th>Sabor / ítem</th>
            ${esEmpanada ? '<th>Se cocinó</th>' : ''}
            <th class="num">Objetivo</th>
            ${esEmpanada ? '<th>Días que cubre</th>' : ''}
            <th class="num">Stock disponible</th>
            <th class="num">${esEmpanada ? 'Stock necesario' : 'A reponer'} (u.)</th>
            ${esEmpanada ? '<th class="num">Docenas</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${items.map(f => `
            <tr>
              <td>${f.sabor}</td>
              ${esEmpanada ? `<td>${f.diaCocina}${f.diaCocina !== f.diaArmado ? ` <span class="badge reposo">reposo</span>` : ''}</td>` : ''}
              <td class="num">${ent(f.objetivoUnidades)}</td>
              ${esEmpanada ? `<td style="color:var(--ink-soft);font-size:12.5px;">${f.diasQueCubre}</td>` : ''}
              <td class="num">${ent(f.stockValidoUnidades)}</td>
              <td class="num"><strong>${ent(f.aHacerUnidades)}</strong></td>
              ${esEmpanada ? `<td class="num">${ent(f.aHacerDocenas)}</td>` : ''}
            </tr>`).join('')}
        </tbody>
      </table>`;
  }).join('');

  cont.className = '';
  cont.innerHTML = tituloSector + prepHtml + `
    <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(data.fecha)} — ${filas.length} ítem(s) con faltante</p>
    ${bloques}
  `;
}

/* ---- Pestaña COCINA: todo lo que elabora Cocina hoy — Preparados, Rellenos,
   Dips y Postres (Dips/Postres los arma Cocina, no Producción) ---- */
function pintarCocina(data){
  const cont = document.getElementById('contenidoFabrica');
  const filasRelleno = data.cocina.filter(f => f.kilosDeRelleno > 0);
  const tituloSector = `<h2 style="font-size:18px;margin:0 0 6px;">Producción del día — Sector Cocina</h2>`;

  const tablaSimple = (rubro, titulo) => {
    const items = (data.produccion || []).filter(f => f.rubro === rubro && f.aHacerUnidades > 0);
    if(items.length === 0) return '';
    return `
      <h3 style="font-size:15px;margin:20px 0 8px;">${titulo}</h3>
      <table class="prod">
        <thead><tr><th>Sabor / ítem</th><th class="num">Objetivo</th><th class="num">Stock disponible</th><th class="num">A reponer (u.)</th></tr></thead>
        <tbody>
          ${items.map(f => `
            <tr>
              <td>${f.sabor}</td>
              <td class="num">${ent(f.objetivoUnidades)}</td>
              <td class="num">${ent(f.stockValidoUnidades)}</td>
              <td class="num"><strong>${ent(f.aHacerUnidades)}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  };
  const bloqueDips = tablaSimple('Dips', 'Dips');
  const bloquePostres = tablaSimple('Postres', 'Postres');

  if(filasRelleno.length === 0 && !bloqueDips && !bloquePostres){
    cont.className = '';
    cont.innerHTML = tituloSector + `<div class="empty">Cocina no elabora nada el ${data.dia.toLowerCase()}.</div>`;
    return;
  }

  const tablaRellenos = filasRelleno.length === 0 ? '' : `
    <h3 style="font-size:15px;margin:20px 0 8px;">Rellenos</h3>
    <div class="field-row no-print" style="max-width:420px;">
      <label>% de venta a cubrir <span style="color:var(--ink-soft);font-weight:400;">(los locales siempre tienen algo de stock — bajalo si no hace falta cubrir el 100%). Se guarda por día: una vez guardado queda fijo para hoy (también para Registrar producción) — tocá "Reabrir" si necesitás cambiarlo.</span></label>
      <div id="pctCocinaControl"></div>
    </div>
    <p style="color:var(--ink-soft);font-size:13px;"><span id="totalKilosCocina"></span> kg de relleno en total</p>
    <table class="prod">
      <thead><tr><th>Relleno</th><th>Sabores que arma</th><th>Días que cubre</th><th class="num">Kg de relleno</th><th class="num">Ollas</th></tr></thead>
      <tbody>
        ${filasRelleno.map(f => `
          <tr data-kilos-base="${f.kilosDeRelleno}" data-relleno="${f.relleno}">
            <td><strong>${f.relleno}</strong></td>
            <td style="color:var(--ink-soft);font-size:12.5px;">${f.sabores.map(s => s.sabor).join(', ')}</td>
            <td style="color:var(--ink-soft);font-size:12.5px;">${f.diasQueCubre}</td>
            <td class="num kg-relleno"><strong></strong></td>
            <td class="num ollas-relleno">—</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div id="gramajeOllasRellenos"></div>`;

  cont.className = '';
  // el % con el que el SERVIDOR ya escaló data.cocina[].kilosDeRelleno (null
  // = todavía no se guardó nada hoy, se usó 100% de referencia) — lo guardo
  // en el propio contenedor para que recalcularCocinaPct() sepa contra qué
  // proporción está previsualizando mientras Carolina todavía no guardó.
  cont.dataset.pctBase = data.porcentajeCocina || 100;
  cont.innerHTML = tituloSector + `
    <p style="color:var(--ink-soft);font-size:13px;">${data.dia}, ${fmtFecha(data.fecha)}</p>
    <div id="preparadosCocina"></div>
    ${tablaRellenos}
    ${bloqueDips}
    ${bloquePostres}
  `;

  if(filasRelleno.length > 0){
    pintarControlPctCocina(data.fecha, data.porcentajeCocina);
    recalcularCocinaPct();
  }
  cargarPreparadosCocina(data.fecha);
}

// Control del % de venta a cubrir: si ya se guardó HOY, se muestra bloqueado
// con un botón "Reabrir"; si no, editable con un botón "Guardar %". El valor
// que de verdad usa el cálculo (Preparados, Ollas, y Registrar producción →
// Cocina) es el guardado en el servidor — tocar el número acá solo
// previsualiza los kg de Rellenos de esta tabla, no cambia nada hasta
// apretar "Guardar %".
function pintarControlPctCocina(fecha, porcentajeGuardado){
  const cont = document.getElementById('pctCocinaControl');
  if(!cont) return;
  if(porcentajeGuardado != null){
    cont.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <input type="number" value="${porcentajeGuardado}" disabled style="width:90px;">
        <button type="button" class="btn secondary" id="btnReabrirPct">Reabrir</button>
        <span style="color:var(--ink-soft);font-size:12px;">guardado para hoy</span>
      </div>`;
    document.getElementById('btnReabrirPct').onclick = () => pintarControlPctCocina(fecha, null);
  } else {
    cont.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <input type="number" id="inpPctRelleno" min="1" max="200" step="5" value="${porcentajeGuardado == null ? 100 : porcentajeGuardado}" style="width:90px;">
        <button type="button" class="btn" id="btnGuardarPct">Guardar %</button>
      </div>`;
    document.getElementById('inpPctRelleno').oninput = recalcularCocinaPct;
    document.getElementById('btnGuardarPct').onclick = () => guardarPctCocina(fecha);
  }
}

async function guardarPctCocina(fecha){
  const inp = document.getElementById('inpPctRelleno');
  const pct = Number(inp.value);
  if(!pct || pct <= 0){ alert('Ingresá un % válido.'); return; }
  const btn = document.getElementById('btnGuardarPct');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'guardarPorcentajeCocina', fecha, pct })
    });
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    cargarCalculo(); // recarga todo (Producción/Cocina/Discos) ya con el % guardado
  }catch(err){
    btn.disabled = false; btn.textContent = 'Guardar %';
    alert('No se pudo guardar el %: ' + err.message);
  }
}

// pequeño detalle plegable con el gramaje de ingredientes escalado a una
// olla (8 kg) — se usa tanto para Preparados como para Rellenos directos.
function bloqueGramajeOllas(items){
  if(!items || items.length === 0) return '';
  return items.map(o => `
    <details style="margin-top:8px;font-size:12.5px;">
      <summary style="cursor:pointer;color:var(--ink-soft);">Gramaje por olla (8 kg) — ${o.nombre}</summary>
      <ul style="margin:8px 0 0 18px;">
        ${(o.gramajePorOlla || []).map(g => `<li>${g.ingrediente}: ${ent(g.cantidad)} ${g.medida || ''}</li>`).join('')}
      </ul>
    </details>`).join('');
}

// "explota" las fichas técnicas contra lo que ya se calculó, para saber
// cuántos kilos de cada Preparado (ej. Puré, Sofrito, Relleno Carne, Pollo
// Grille) hace falta cocinar hoy, y de paso trae las Ollas (calcularOllas):
// cuántos lotes de 8 kg de carne cruda arma Cocina, tanto de los Preparados
// que se comparten entre varios rellenos como de los rellenos que usan un
// ingrediente crudo directo (ver el comentario de calcularOllas en Code.gs).
async function cargarPreparadosCocina(fecha){
  const cont = document.getElementById('preparadosCocina');
  if(!cont) return;
  cont.innerHTML = `<h3 style="font-size:15px;margin:0 0 8px;">Preparados</h3><p class="loading">Buscando preparados…</p>`;
  try{
    const [rDem, rOllas] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=calcularDemandaPreparados&fecha=${encodeURIComponent(fecha)}`),
      fetch(`${APPS_SCRIPT_URL}?action=calcularOllas&fecha=${encodeURIComponent(fecha)}`)
    ]);
    const data = await rDem.json();
    if(data.error) throw new Error(data.error);
    const ollasData = await rOllas.json();
    const ollasPrep = ollasData.error ? [] : (ollasData.preparados || []);
    const ollasRelleno = ollasData.error ? [] : (ollasData.rellenos || []);

    // completa la columna "Ollas" de la tabla de Rellenos, ya renderizada
    const gramajeRellenosCont = document.getElementById('gramajeOllasRellenos');
    ollasRelleno.forEach(o => {
      const fila = [...document.querySelectorAll('tr[data-relleno]')].find(tr => tr.dataset.relleno === o.nombre);
      const celda = fila ? fila.querySelector('.ollas-relleno') : null;
      if(celda) celda.innerHTML = `<strong>${o.ollas}</strong> <span style="color:var(--ink-soft);font-size:11px;">(${ent(o.kilosNecesarios)} kg de ${o.ingredienteClave})</span>`;
    });
    if(gramajeRellenosCont) gramajeRellenosCont.innerHTML = bloqueGramajeOllas(ollasRelleno);

    const demanda = data.demandaPreparados || [];
    if(demanda.length === 0){
      cont.innerHTML = `<h3 style="font-size:15px;margin:0 0 8px;">Preparados</h3><div class="empty">Nada para preparar hoy.</div>`;
      return;
    }
    const ollasPorNombre = {};
    ollasPrep.forEach(o => { ollasPorNombre[normalizarFicha(o.nombre)] = o; });

    // ojo: acá NO se muestra "Gramaje por olla" de los Preparados en olla —
    // los 8 kg de la olla son de la MATERIA PRIMA cruda (ej. recortes de
    // pollo), no del Preparado ya terminado, así que escalar la ficha del
    // Preparado a 8 kg da un gramaje que no corresponde a lo que realmente
    // entra en la olla. Confirmado con Carolina (26/09/2026). El detalle de
    // gramaje SÍ es correcto para los Rellenos directos (arriba,
    // gramajeRellenosCont) porque ahí los 8 kg son del mismo ingrediente
    // crudo que se está escalando.
    cont.innerHTML = `
      <h3 style="font-size:15px;margin:0 0 8px;">Preparados</h3>
      <table class="prod">
        <thead><tr><th>Preparado</th><th class="num">Cantidad</th><th class="num">Ollas</th></tr></thead>
        <tbody>
          ${demanda.map(d => {
            const o = ollasPorNombre[normalizarFicha(d.preparado)];
            return `<tr><td><strong>${d.preparado}</strong></td><td class="num">${ent(d.cantidad)} ${d.unidad}</td><td class="num">${o ? `<strong>${o.ollas}</strong>` : '—'}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
      ${(data.avisos || []).length ? `<p style="color:var(--alert);font-size:12px;margin-top:8px;">${data.avisos.join(' ')}</p>` : ''}
    `;
  }catch(err){
    cont.innerHTML = `<p style="color:var(--ink-soft);font-size:12px;">No se pudieron calcular los preparados: ${err.message}</p>`;
  }
}

// el % de venta a cubrir es un ajuste manual de Cocina (no toca la fórmula de
// Producción/Envíos, que sigue siendo venta − stock). Los kg de relleno que
// vienen del servidor (data-kilos-base) ya están escalados al % GUARDADO
// para hoy (cont.dataset.pctBase, 100 si todavía no se guardó nada) — acá
// solo se previsualiza qué pasaría con el % que se está tipeando ahora,
// mientras no se guarde, con el factor entre ambos.
function recalcularCocinaPct(){
  const cont = document.getElementById('contenidoFabrica');
  const pctBase = Number(cont.dataset.pctBase) || 100;
  const inp = document.getElementById('inpPctRelleno');
  const pctVista = inp ? (Number(inp.value) || pctBase) : pctBase;
  const factorVista = pctVista / pctBase;
  let total = 0;
  document.querySelectorAll('#contenidoFabrica table.prod tbody tr[data-kilos-base]').forEach(tr => {
    const base = Number(tr.dataset.kilosBase) || 0;
    const ajustado = base * factorVista;
    total += ajustado;
    tr.querySelector('.kg-relleno strong').textContent = ent(ajustado);
  });
  const totalEl = document.getElementById('totalKilosCocina');
  if(totalEl) totalEl.textContent = ent(total);
}
